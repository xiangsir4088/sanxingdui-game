<svg viewBox="0 0 680 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AI 素材管线：从文生图到内联 base64</title>
  <desc>Pipeline from SenseNova text-to-image to inlined base64 in single HTML file</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">素材管线：8 张 AI 精灵 → 单文件 HTML</text>

  <!-- Step 1: SenseNova -->
  <rect x="40" y="55" width="140" height="64" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="110" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#534AB7">SenseNova</text>
  <text x="110" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">U1.5 Lite 文生图</text>
  <text x="110" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">PNG 2048x2048</text>

  <!-- Step 2: Prep -->
  <rect x="210" y="55" width="140" height="64" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="280" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#185FA5">prep_sprites.py</text>
  <text x="280" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">PIL floodfill 抠黑底</text>
  <text x="280" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">0.65px 高斯抗锯齿</text>

  <!-- Step 3: Fix holes -->
  <rect x="380" y="55" width="140" height="64" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="450" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3B6D11">fix_holes.py</text>
  <text x="450" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">连通域分析修补</text>
  <text x="450" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">清除封闭黑块</text>

  <!-- Step 4: WebP -->
  <rect x="550" y="55" width="100" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="600" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#854F0B">WebP q90</text>
  <text x="600" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">压 78%</text>
  <text x="600" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">10~90 KB</text>

  <!-- Arrows between steps -->
  <line x1="180" y1="87" x2="210" y2="87" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
  <line x1="350" y1="87" x2="380" y2="87" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
  <line x1="520" y1="87" x2="550" y2="87" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>

  <!-- Size comparison -->
  <text x="110" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">4~5 MB</text>
  <text x="280" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">RGBA PNG</text>
  <text x="450" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">RGBA PNG</text>
  <text x="600" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">10~90 KB</text>

  <!-- Final injection -->
  <rect x="120" y="170" width="440" height="56" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="340" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#993556">inject_sprites.py → base64 内联进 HTML</text>
  <text x="340" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">8 张精灵全部内联 · 单文件 853 KB · 断网双击可玩</text>

  <!-- Arrow from WebP to injection -->
  <line x1="600" y1="119" x2="600" y2="145" stroke="#888780" stroke-width="0.5"/>
  <line x1="600" y1="145" x2="340" y2="145" stroke="#888780" stroke-width="0.5"/>
  <line x1="340" y1="145" x2="340" y2="170" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>

  <!-- Key design decisions -->
  <rect x="40" y="250" width="600" height="90" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="60" y="272" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">关键设计</text>

  <circle cx="70" cy="292" r="3" fill="#D85A30"/>
  <text x="82" y="296" font-family="sans-serif" font-size="11" fill="#444441">floodfill 从边界灌，不用亮度阈值——否则器物暗部被挖空</text>

  <circle cx="70" cy="310" r="3" fill="#D85A30"/>
  <text x="82" y="314" font-family="sans-serif" font-size="11" fill="#444441">禁止 MinFilter(3) 腐蚀——神树枝条断裂、袍角缺块</text>

  <circle cx="70" cy="328" r="3" fill="#D85A30"/>
  <text x="82" y="332" font-family="sans-serif" font-size="11" fill="#444441">图片优先 + 几何兜底——sprite 未加载时自动回退，不出空白</text>
</svg>
