<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>锈池迭代：四版液柱全部推翻</title>
  <desc>Four rejected liquid column versions and the final mineral shard solution</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">锈池迭代：四版液柱全部推翻 → 矿刺方案</text>

  <!-- V1: Translucent -->
  <rect x="30" y="50" width="120" height="100" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="90" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#993C1D">V1 半透明液柱</text>
  <rect x="70" y="85" width="40" height="50" rx="4" fill="#9FE1CB" opacity="0.5" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="90" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">果冻</text>

  <!-- V2: Opaque -->
  <rect x="170" y="50" width="120" height="100" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="230" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#993C1D">V2 不透明泥柱</text>
  <rect x="210" y="85" width="40" height="50" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="230" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">塑料</text>

  <!-- V3: Asymmetric -->
  <rect x="310" y="50" width="120" height="100" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="370" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#993C1D">V3 不对称液柱</text>
  <path d="M350 135 Q345 95 355 85 Q365 90 370 100 Q375 110 380 135 Z" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="370" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">玻璃管</text>

  <!-- V4: Bubbles -->
  <rect x="450" y="50" width="120" height="100" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="510" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#993C1D">V4 液柱+气泡</text>
  <rect x="490" y="85" width="40" height="50" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="500" cy="100" r="3" fill="#9FE1CB"/>
  <circle cx="515" cy="115" r="2.5" fill="#9FE1CB"/>
  <circle cx="505" cy="125" r="2" fill="#9FE1CB"/>
  <text x="510" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">汽水</text>

  <!-- Conclusion box -->
  <rect x="590" y="50" width="70" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="625" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">结论</text>
  <text x="625" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">液柱在 2D</text>
  <text x="625" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">横版画风里</text>
  <text x="625" y="124" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">做不出来</text>

  <!-- Final: Mineral shards -->
  <rect x="180" y="180" width="320" height="90" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3B6D11">最终方案：锈疤底座 + 青铜矿刺</text>

  <!-- Mineral shard illustration -->
  <path d="M260 260 L255 230 L250 245 L248 225 L252 240 L258 220 L262 238 L268 222 L272 240 L278 225 L280 242 L286 228 L290 245 L295 260" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse cx="270" cy="262" rx="35" ry="6" fill="#854F0B" opacity="0.6"/>

  <text x="360" y="235" font-family="sans-serif" font-size="11" fill="#444441">底座：三段贝塞尔土丘 + 15 圆瘤 + 白霜 + 裂口</text>
  <text x="360" y="252" font-family="sans-serif" font-size="11" fill="#444441">矿刺：棱面 + 竖向渐变 + 刃口高光 + 根部矿壳</text>
  <text x="360" y="269" font-family="sans-serif" font-size="11" fill="#444441">贴图：SenseNova 矿簇图替换 225 行程序化代码</text>

  <!-- Arrow from conclusion to final -->
  <line x1="625" y1="150" x2="625" y2="165" stroke="#888780" stroke-width="0.5"/>
  <line x1="625" y1="165" x2="340" y2="165" stroke="#888780" stroke-width="0.5"/>
  <line x1="340" y1="165" x2="340" y2="180" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow3)"/>
</svg>
