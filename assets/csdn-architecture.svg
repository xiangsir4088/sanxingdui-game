<svg viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>一眼三千年架构图</title>
  <desc>Game architecture: engine core with 5 levels, physics, rendering, input, audio, and asset pipeline</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="20" y="20" width="640" height="380" rx="16" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">单文件 HTML5 Canvas 2D · 无外部依赖</text>

  <!-- Engine core -->
  <rect x="240" y="60" width="200" height="64" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#185FA5">游戏引擎</text>
  <text x="340" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">固定步长 1/120s · guard 防死循环</text>
  <text x="340" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">coyote 0.12s · jump buffer 0.14s</text>

  <!-- LEVELS config -->
  <rect x="40" y="150" width="160" height="80" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="120" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#854F0B">LEVELS 配置</text>
  <text x="120" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">5 关 · 机制递进</text>
  <text x="120" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">hazard / goal / motes</text>
  <text x="120" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">validateLevels() 启动校验</text>

  <!-- Physics -->
  <rect x="260" y="150" width="160" height="80" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3B6D11">物理系统</text>
  <text x="340" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">碰撞检测 AABB</text>
  <text x="340" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">障碍物状态机</text>
  <text x="340" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">预警 → 激活 → 安全窗</text>

  <!-- Rendering -->
  <rect x="480" y="150" width="160" height="80" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="560" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#993556">渲染系统</text>
  <text x="560" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Canvas 2D · 离屏烘焙</text>
  <text x="560" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">createPattern 平铺</text>
  <text x="560" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">径向光 / 体积光锥</text>

  <!-- Input -->
  <rect x="40" y="260" width="160" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="120" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#0F6E56">输入系统</text>
  <text x="120" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">键盘 + 触屏 + Gamepad</text>
  <text x="120" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">iframe 兼容</text>

  <!-- Audio -->
  <rect x="260" y="260" width="160" height="60" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#534AB7">音频系统</text>
  <text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Web Audio API 全合成</text>
  <text x="340" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">零音频文件</text>

  <!-- Save -->
  <rect x="480" y="260" width="160" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="560" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">存档系统</text>
  <text x="560" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">localStorage 持久化</text>
  <text x="560" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">死亡回出生点保留光尘</text>

  <!-- Arrows from engine to systems -->
  <line x1="290" y1="124" x2="140" y2="150" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="124" x2="340" y2="150" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="124" x2="540" y2="150" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Asset pipeline box -->
  <rect x="60" y="345" width="560" height="40" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="340" y="363" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#993C1D">素材管线：SenseNova 文生图 → PIL floodfill 抠图 → fix_holes 修补 → WebP q90 → base64 内联</text>
  <text x="340" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">图片优先 + 几何兜底 · 首帧/异常环境不出空白</text>
</svg>
