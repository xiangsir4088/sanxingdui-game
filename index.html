    // 展柜里，绿锈清晰、光泽稳定；记忆里的金光偶尔一闪
    goldA: '#96a88a', goldB: '#5a6c4a', goldC: '#2a3a2a', goldD: '#080f0c',
    faceHi: '#86987a', faceLo: '#2a3a28',
    crownA: '#7a8c6c', crownB: '#3a4a30', crownC: '#1a2a18', crownD: '#020604', crownTop: '#96a88c',
    patina: '#4a6848',
    patinaColor: '#08140c',
    bronze: '#1f2e1a',
    label: '展柜残光'
  }
};
const ERA_ORDER = ['forge', 'ritual', 'burial', 'dig', 'museum'];
function getEra() { return ERA[ERA_ORDER[levelIdx]] || ERA.museum; }
function eraTheme2Era(t) {
  return { forge: 'forge', ritual: 'ritual', burial: 'burial', dig: 'dig', museum: 'museum' }[t] || 'museum';
}

/* ================= 青铜祭司头像（主角） ================= */
function drawHead(x, y, r, opt) {
  opt = opt || {};
  const ang = opt.angle || 0;
  const sxx = opt.sx === undefined ? 1 : opt.sx;
  const syy = opt.sy === undefined ? 1 : opt.sy;
  const blink = opt.blink || 0;
  const flat = !!opt.flat;
  const eraName = opt.era || (typeof levelIdx !== 'undefined' && typeof ERA_ORDER !== 'undefined'
    ? ERA_ORDER[levelIdx] : 'museum');
  const E = ERA[eraName] || ERA.museum;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(sxx, syy);

  const patina = [E.goldD, E.goldB, E.goldC];
  const bronze = E.bronze;

  /* --- 尖锥颈 --- */
  const ng = ctx.createLinearGradient(-r * 0.6, 0, r * 0.6, 0);
  ng.addColorStop(0, patina[2]);
  ng.addColorStop(0.45, patina[1]);
  ng.addColorStop(1, patina[0]);
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.moveTo(-r * 0.42, r * 0.72);
  ctx.lineTo(r * 0.42, r * 0.72);
  ctx.lineTo(r * 0.18, r * 1.62);
  ctx.lineTo(-r * 0.18, r * 1.62);
  ctx.closePath();
  ctx.fill();

  /* --- 外张双耳（内缘深入面部，由后绘的面庞覆盖，保证连体；侧向上扬） --- */
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * r * 0.44, -r * 0.08);
    // 旋转加大：0.30 → 0.50，让整只耳朵外侧（外尖）明显上翘
    ctx.rotate(side * 0.50);
    const eg = ctx.createLinearGradient(0, -r * 0.4, side * r * 0.6, r * 0.3);
    eg.addColorStop(0, patina[1]);
    eg.addColorStop(0.6, patina[0]);
    eg.addColorStop(1, patina[2]);
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.moveTo(side * r * 0.10, -r * 0.50);
    ctx.lineTo(side * r * 0.60, -r * 0.62);
    ctx.lineTo(side * r * 0.74, r * 0.10);
    ctx.lineTo(side * r * 0.12, r * 0.30);
    ctx.closePath();
    ctx.fill();
    // 耳廓内线
    ctx.strokeStyle = 'rgba(12,32,26,0.5)';
    ctx.lineWidth = Math.max(1, r * 0.055);
    ctx.beginPath();
    ctx.moveTo(side * r * 0.24, -r * 0.32);
    ctx.lineTo(side * r * 0.54, -r * 0.40);
    ctx.lineTo(side * r * 0.60, r * 0.04);
    ctx.stroke();
    ctx.restore();
  }

  /* --- 面庞 --- */
  const fg = ctx.createRadialGradient(-r * 0.25, -r * 0.35, r * 0.15, 0, 0, r * 1.15);
  fg.addColorStop(0, E.faceHi);
  fg.addColorStop(0.45, E.goldB);
  fg.addColorStop(0.8, E.goldC);
  fg.addColorStop(1, E.goldD);
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-r * 0.62, -r * 0.74);
  ctx.lineTo(r * 0.62, -r * 0.74);
  ctx.quadraticCurveTo(r * 0.82, r * 0.05, r * 0.44, r * 0.72);
  ctx.lineTo(-r * 0.44, r * 0.72);
  ctx.quadraticCurveTo(-r * 0.82, r * 0.05, -r * 0.62, -r * 0.74);
  ctx.closePath();
  ctx.fill();

  /* --- 圆筒头冠 --- */
  const cw = r * 0.72;
  const cTop = -r * 1.72, cBot = -r * 0.70;
  const cg = ctx.createLinearGradient(-cw, 0, cw, 0);
  cg.addColorStop(0, E.crownC);
  cg.addColorStop(0.32, E.crownA);
  cg.addColorStop(0.62, E.crownB);
  cg.addColorStop(1, E.crownD);
  ctx.fillStyle = cg;
  ctx.fillRect(-cw, cTop, cw * 2, cBot - cTop);
  // 顶面
  ctx.beginPath();
  ctx.ellipse(0, cTop, cw, r * 0.19, 0, 0, Math.PI * 2);
  ctx.fillStyle = E.crownTop;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, cTop, cw * 0.42, r * 0.08, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0a06';
  ctx.fill();
  // 冠下沿
  ctx.fillStyle = 'rgba(8,20,16,0.45)';
  ctx.fillRect(-cw, cBot - r * 0.06, cw * 2, r * 0.06);

  if (!flat) {
    /* --- 表面层：按 era 变化（金剥落 / 氧化 / 尘灰 / 展柜） --- */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-r * 0.62, -r * 0.74);
    ctx.lineTo(r * 0.62, -r * 0.74);
    ctx.quadraticCurveTo(r * 0.82, r * 0.05, r * 0.44, r * 0.72);
    ctx.lineTo(-r * 0.44, r * 0.72);
    ctx.quadraticCurveTo(-r * 0.82, r * 0.05, -r * 0.62, -r * 0.74);
    ctx.closePath();
    ctx.clip();

    if (eraName === 'forge') {
      // 熔金：炽热光斑 + 流动的熔纹
      ctx.globalCompositeOperation = 'lighter';
      const moltenGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.05, 0, 0, r * 1.0);
      moltenGrad.addColorStop(0, 'rgba(255,255,220,0.65)');
      moltenGrad.addColorStop(0.4, 'rgba(255,200,80,0.35)');
      moltenGrad.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.fillStyle = moltenGrad;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      // 熔流条纹
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(255,180,60,0.5)';
      ctx.lineWidth = r * 0.05;
      for (let i = 0; i < 5; i++) {
        const y = -r * 0.6 + i * r * 0.22 + Math.sin(tGlobal * 3 + i) * r * 0.05;
        ctx.beginPath();
        ctx.moveTo(-r * 0.6, y);
        ctx.quadraticCurveTo(0, y + Math.sin(tGlobal * 2 + i * 0.7) * r * 0.08, r * 0.6, y);
        ctx.stroke();
      }
    } else if (eraName === 'ritual') {
      // 金光余温：光斑脉动，铜身开始露出
      ctx.globalCompositeOperation = 'lighter';
      const glowA = ctx.createRadialGradient(r * 0.1, -r * 0.2, r * 0.05, 0, 0, r * 1.0);
      glowA.addColorStop(0, 'rgba(255,220,140,0.45)');
      glowA.addColorStop(0.5, 'rgba(255,170,60,0.15)');
      glowA.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.fillStyle = glowA;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.globalCompositeOperation = 'source-over';
      // 铜色底层斑
      ctx.fillStyle = E.bronze;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.ellipse(r * 0.3, -r * 0.15, r * 0.28, r * 0.32, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-r * 0.35, r * 0.3, r * 0.2, r * 0.18, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (eraName === 'burial') {
      // 金剥绿锈：大面积孔雀绿锈斑 + 零星金箔残片（核心视觉）
      // 底层铜色
      ctx.fillStyle = E.bronze;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.05, r * 0.7, r * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      // 绿锈斑：从眼角和边缘向外蔓延
      const rustSpots = [
        { x: -r * 0.42, y: -r * 0.35, rx: r * 0.30, ry: r * 0.28, a: 0.78 },
        { x: r * 0.42, y: -r * 0.30, rx: r * 0.26, ry: r * 0.32, a: 0.72 },
        { x: -r * 0.30, y: r * 0.35, rx: r * 0.28, ry: r * 0.24, a: 0.70 },
        { x: r * 0.28, y: r * 0.38, rx: r * 0.24, ry: r * 0.22, a: 0.65 },
        { x: r * 0.05, y: -r * 0.55, rx: r * 0.28, ry: r * 0.14, a: 0.55 }
      ];
      ctx.globalAlpha = 1;
      for (const s of rustSpots) {
        const rg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, Math.max(s.rx, s.ry));
        rg.addColorStop(0, 'rgba(80,180,120,' + s.a + ')');
        rg.addColorStop(0.5, 'rgba(40,110,80,' + (s.a * 0.8) + ')');
        rg.addColorStop(1, 'rgba(20,60,40,0)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.rx * 1.2, s.ry * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // 残存金箔：亮金色小块 + 边缘光
      ctx.globalCompositeOperation = 'lighter';
      const flakes = [
        { x: -r * 0.05, y: -r * 0.55, w: r * 0.14, h: r * 0.09, a: 0.85 },
        { x: r * 0.14, y: -r * 0.10, w: r * 0.11, h: r * 0.08, a: 0.70 },
        { x: -r * 0.10, y: r * 0.12, w: r * 0.12, h: r * 0.07, a: 0.65 }
      ];
      for (const f of flakes) {
        const grd = ctx.createLinearGradient(f.x - f.w, f.y, f.x + f.w, f.y);
        grd.addColorStop(0, 'rgba(255,220,120,0)');
        grd.addColorStop(0.5, 'rgba(255,230,150,' + f.a + ')');
        grd.addColorStop(1, 'rgba(255,200,90,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y, f.w, f.h, 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    } else if (eraName === 'dig') {
      // 出土：黄泥覆尘 + 极少量金屑微光
      ctx.fillStyle = '#3a3220';
      ctx.globalAlpha = 0.55;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      // 泥块颗粒
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = '#2a2418';
      const pebbles = [
        { x: -r * 0.3, y: -r * 0.4, s: r * 0.18 },
        { x: r * 0.35, y: -r * 0.15, s: r * 0.22 },
        { x: -r * 0.2, y: r * 0.35, s: r * 0.20 },
        { x: r * 0.15, y: r * 0.4, s: r * 0.15 }
      ];
      for (const p of pebbles) {
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.s, p.s * 0.7, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      // 极微金光（记忆里仅剩的一丝）
      ctx.globalCompositeOperation = 'lighter';
      const faintGold = ctx.createRadialGradient(r * 0.15, -r * 0.35, 0, r * 0.15, -r * 0.35, r * 0.4);
      faintGold.addColorStop(0, 'rgba(255,220,140,0.20)');
      faintGold.addColorStop(1, 'rgba(255,180,80,0)');
      ctx.fillStyle = faintGold;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    } else {
      // museum：展柜绿锈稳定，偶有金光记忆闪过
      ctx.fillStyle = E.bronze;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.ellipse(r * 0.32, -r * 0.12, r * 0.24, r * 0.3, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-r * 0.38, r * 0.32, r * 0.18, r * 0.16, -0.3, 0, Math.PI * 2);
      ctx.fill();
      // 稳定绿锈斑
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = '#5a8c68';
      ctx.beginPath();
      ctx.ellipse(-r * 0.2, -r * 0.45, r * 0.26, r * 0.14, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // 记忆金光：极缓慢的呼吸式微光（每 ~6 秒闪一次）
      const memPhase = (Math.sin(tGlobal * 0.6) + 1) * 0.5; // 0..1
      const memGlow = Math.pow(memPhase, 4) * 0.35; // 只在峰值附近亮起
      if (memGlow > 0.02) {
        ctx.globalCompositeOperation = 'lighter';
        const mem = ctx.createRadialGradient(-r * 0.15, -r * 0.25, 0, -r * 0.15, -r * 0.25, r * 0.5);
        mem.addColorStop(0, 'rgba(255,225,150,' + memGlow + ')');
        mem.addColorStop(1, 'rgba(255,180,80,0)');
        ctx.fillStyle = mem;
        ctx.fillRect(-r, -r, r * 2, r * 2);
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    /* --- 粗重眉骨（宽扁眉翼，贴宽脸边缘） --- */
    ctx.fillStyle = E.patinaColor;
    ctx.beginPath();
    ctx.moveTo(-r * 0.56, -r * 0.22);
    ctx.quadraticCurveTo(-r * 0.30, -r * 0.36, -r * 0.06, -r * 0.22);
    ctx.lineTo(-r * 0.06, -r * 0.08);
    ctx.quadraticCurveTo(-r * 0.30, -r * 0.22, -r * 0.56, -r * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.56, -r * 0.22);
    ctx.quadraticCurveTo(r * 0.30, -r * 0.36, r * 0.06, -r * 0.22);
    ctx.lineTo(r * 0.06, -r * 0.08);
    ctx.quadraticCurveTo(r * 0.30, -r * 0.22, r * 0.56, -r * 0.12);
    ctx.closePath();
    ctx.fill();

    /* --- 纵目（圆柱凸出眼球——三星堆面具的标志性特征） --- */
    const eyeOpen = 1 - blink;
    // 眼睑刻线颜色：金时代是暖金光，绿锈时代是翠光，出土时代灰调
    const eyeLineColors = {
      forge:  'rgba(255,220,140,0.75)',
      ritual: 'rgba(230,180,100,0.65)',
      burial: 'rgba(150,215,180,0.55)',
      dig:    'rgba(180,170,130,0.45)',
      museum: 'rgba(150,215,185,0.55)'
    };
    for (const side of [-1, 1]) {
      // 眼窝深凹（画眼柱之前，在脸部刻一个椭圆暗窝）
      ctx.fillStyle = 'rgba(10,26,22,0.78)';
      ctx.beginPath();
      ctx.ellipse(side * r * 0.34, -r * 0.02, r * 0.26, r * 0.13 * eyeOpen + 0.001, 0, 0, Math.PI * 2);
      ctx.fill();

      if (eyeOpen > 0.28) {
        // 纵目：从眼窝向外伸出的圆柱（三星堆面具最独特的造型）
        const eyeY = -r * 0.02;
        const eyeRad = r * 0.11 * (0.55 + 0.45 * eyeOpen);
        const eyeBaseX = side * r * 0.18;   // 内端贴鼻梁
        const eyeTipX = side * r * 0.52;    // 外端突出到脸边缘
        // 关键：外端抬高 0.05r——三星堆"内低外高"的神秘感（斜度约 8.4°）
        const tipLift = r * 0.05;
        const eyeTipY = eyeY - tipLift;
        const eg = ctx.createLinearGradient(0, eyeY - eyeRad, 0, eyeY + eyeRad);
        eg.addColorStop(0, '#e8dcc0');
        eg.addColorStop(0.45, '#b8a878');
        eg.addColorStop(0.7, '#8a7a52');
        eg.addColorStop(1, '#483a24');
        ctx.fillStyle = eg;
        // 圆柱身体：内端保持 eyeY，外端上抬至 eyeTipY（轻微斜线）
        ctx.beginPath();
        ctx.moveTo(eyeBaseX, eyeY - eyeRad);
        ctx.lineTo(eyeTipX, eyeTipY - eyeRad);
        ctx.lineTo(eyeTipX, eyeTipY + eyeRad);
        ctx.lineTo(eyeBaseX, eyeY + eyeRad);
        ctx.closePath();
        ctx.fill();
        // 内端盖（连接面部侧）
        ctx.beginPath();
        ctx.ellipse(eyeBaseX, eyeY, eyeRad * 0.55, eyeRad, 0, 0, Math.PI * 2);
        ctx.fill();
        // 外端盖（凸出的眼球面，画瞳孔）
        ctx.beginPath();
        ctx.ellipse(eyeTipX, eyeTipY, eyeRad * 0.72, eyeRad, 0, 0, Math.PI * 2);
        ctx.fill();
        // 瞳孔（凸眼末端的高光瞳孔）
        ctx.fillStyle = '#0a1a14';
        ctx.beginPath();
        ctx.ellipse(eyeTipX, eyeTipY, eyeRad * 0.36, eyeRad * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();
        // 瞳孔高光
        ctx.fillStyle = 'rgba(255,240,210,0.75)';
        ctx.beginPath();
        ctx.ellipse(eyeTipX + side * r * 0.02, eyeTipY - eyeRad * 0.15, eyeRad * 0.12, eyeRad * 0.14, 0, 0, Math.PI * 2);
        ctx.fill();
        // 眼柱上缘刻线（内低外高）
        ctx.strokeStyle = eyeLineColors[eraName] || 'rgba(150,215,185,0.55)';
        ctx.lineWidth = Math.max(1, r * 0.032);
        ctx.beginPath();
        ctx.moveTo(eyeBaseX, eyeY - eyeRad);
        ctx.lineTo(eyeTipX, eyeTipY - eyeRad);
        ctx.stroke();
      } else {
        // 闭眼：一条微微斜向上的刻线（与睁眼斜度一致）
        ctx.strokeStyle = eyeLineColors[eraName] || 'rgba(150,215,185,0.55)';
        ctx.lineWidth = Math.max(1, r * 0.04);
        ctx.beginPath();
        ctx.moveTo(side * r * 0.18, -r * 0.02);
        ctx.lineTo(side * r * 0.52, -r * 0.07);
        ctx.stroke();
      }
    }

    /* --- 宽鼻（鼻梁高挺，鼻翼宽方） --- */
    ctx.fillStyle = E.bronze;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.02);
    ctx.lineTo(-r * 0.20, r * 0.40);
    ctx.lineTo(r * 0.20, r * 0.40);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    // 鼻梁高光
    ctx.fillStyle = 'rgba(220,200,150,0.28)';
    ctx.fillRect(-r * 0.03, r * 0.00, r * 0.06, r * 0.28);
    // 鼻翼两侧暗色
    ctx.fillStyle = 'rgba(10,26,22,0.35)';
    ctx.beginPath();
    ctx.moveTo(-r * 0.20, r * 0.40);
    ctx.quadraticCurveTo(-r * 0.10, r * 0.44, 0, r * 0.42);
    ctx.quadraticCurveTo(r * 0.10, r * 0.44, r * 0.20, r * 0.40);
    ctx.lineTo(r * 0.20, r * 0.36);
    ctx.quadraticCurveTo(0, r * 0.38, -r * 0.20, r * 0.36);
    ctx.closePath();
    ctx.fill();

    /* --- 方唇（宽直，三星堆面具典型特征） --- */
    ctx.fillStyle = 'rgba(10,26,22,0.55)';
    ctx.beginPath();
    ctx.moveTo(-r * 0.30, r * 0.58);
    ctx.quadraticCurveTo(0, r * 0.66, r * 0.30, r * 0.58);
    ctx.quadraticCurveTo(0, r * 0.74, -r * 0.30, r * 0.58);
    ctx.closePath();
    ctx.fill();
    // 唇线刻槽
    ctx.strokeStyle = 'rgba(8,20,16,0.7)';
    ctx.lineWidth = Math.max(1, r * 0.04);
    ctx.beginPath();
    ctx.moveTo(-r * 0.30, r * 0.58);
    ctx.quadraticCurveTo(0, r * 0.64, r * 0.30, r * 0.58);
    ctx.stroke();
  }

  ctx.restore();
}

/* ================= 主角绘制 ================= */
function drawPlayer() {
  const px = player.x - cam.x;
  const py = player.y;

  // 落地阴影
  let floorY = py + 240;
  for (const pl of level.plats) {
    if (player.x > pl[0] - 10 && player.x < pl[0] + pl[2] + 10 && pl[1] >= py + player.r - 6) {
      if (pl[1] < floorY) floorY = pl[1];
    }
  }
  const dist = floorY - (py + player.r);
  const k = clamp(1 - dist / 300, 0.16, 0.5);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(px, floorY + 2, player.r * 1.05 * k, player.r * 0.26 * k, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 青铜头像本体
  const tilt = clamp(player.vx / SPEED, -1, 1) * 0.11;
  const bob = player.grounded && Math.abs(player.vx) > 40
    ? Math.sin(tGlobal * 12) * 0.02 : 0;
  const blink = Math.sin(tGlobal * 1.1) > 0.972 ? 1 : 0;

  ctx.save();
  ctx.globalAlpha = player.inv > 0 ? 0.55 : 1;
  drawHead(px, py, player.r, {
    angle: tilt,
    sx: player.sx,
    sy: player.sy + bob,
    blink: blink,
    gaze: player.face,
    flat: false
  });
  ctx.restore();

  // 微弱轮廓光：按关卡演化（熔金强、出土弱、展柜冷）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const glowColors = {
    forge: 'rgba(255,210,120,0.20)',
    ritual: 'rgba(255,190,100,0.14)',
    burial: 'rgba(160,220,140,0.08)',
    dig: 'rgba(180,170,130,0.06)',
    museum: 'rgba(140,210,180,0.10)'
  };
  radialGlow(px, py - player.r * 0.2, player.r * 2.4,
    glowColors[ERA_ORDER[levelIdx]] || 'rgba(120,220,180,0.05)');
  ctx.restore();

  // 收集迷你金面具后：面具闪金光（3 层同心脉冲光晕）
  if (player.goldFlash > 0) {
    const gf = player.goldFlash;
    const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 18);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const layers = [
      { r: 2.6, a: 0.32, c: 'rgba(255,235,140,' },
      { r: 1.8, a: 0.42, c: 'rgba(255,215,90,' },
      { r: 1.15, a: 0.55, c: 'rgba(255,245,190,' }
    ];
    for (const L of layers) {
      radialGlow(px, py - player.r * 0.15, player.r * L.r * pulse,
        L.c + (L.a * Math.min(1, gf * 1.4)) + ')');
    }
    ctx.restore();
  }
}

/* ================= HUD ================= */
function drawHUD() {
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(235,225,195,0.92)';
  ctx.font = '600 22px "Microsoft YaHei", sans-serif';
  ctx.fillText(level.name, 40, 52);

  // 时代徽章：显示面具当前在"金→三千年→青铜锈迹"时间轴上的位置
  const eraName = ERA_ORDER[levelIdx];
  const era = ERA[eraName];
  const eraColors = {
    forge:  { fill: 'rgba(255,200,90,0.22)',  border: 'rgba(255,220,140,0.75)', text: '#ffe0a0' },
    ritual: { fill: 'rgba(230,160,70,0.20)',  border: 'rgba(230,180,100,0.7)',  text: '#f0c684' },
    burial: { fill: 'rgba(120,180,90,0.18)',  border: 'rgba(160,215,150,0.65)', text: '#c8d8a0' },
    dig:    { fill: 'rgba(150,130,90,0.20)',  border: 'rgba(180,170,130,0.6)',  text: '#b0a088' },
    museum: { fill: 'rgba(90,150,120,0.22)',  border: 'rgba(140,200,170,0.7)',  text: '#a0c8b0' }
  };
  const eraShort = { forge: '熔金', ritual: '祭祀', burial: '埋藏', dig: '出土', museum: '展陈' };
  const eraYears = { forge: '前1600', ritual: '前1300', burial: '—', dig: '1986', museum: '今日' };
  const ec = eraColors[eraName] || eraColors.museum;
  const bx = 55, by = 66, bw = 445, bh = 40;
  ctx.save();
  ctx.fillStyle = 'rgba(6,12,10,0.55)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = ec.border;
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  // 顶部标题
  ctx.fillStyle = 'rgba(210,190,140,0.72)';
  ctx.font = '600 10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('三千年演化', bx + 10, by + 12);
  // 当前 era 名称 + 年份（右侧醒目）
  ctx.textAlign = 'right';
  ctx.fillStyle = ec.text;
  ctx.font = '700 12px "Microsoft YaHei", sans-serif';
  ctx.fillText(era.label + ' · ' + eraYears[eraName], bx + bw - 10, by + 12);
  // 时间轴线
  const axY = by + 24;
  const axX = bx + 30, axW = bw - 60;
  ctx.strokeStyle = 'rgba(200,180,130,0.32)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(axX, axY);
  ctx.lineTo(axX + axW, axY);
  ctx.stroke();
  // 5 段时代刻度
  for (let i = 0; i < 5; i++) {
    const dotX = axX + i * (axW / 4);
    const cur = i === levelIdx;
    const past = i < levelIdx;
    // 连线（到下一段）
    if (i < 4) {
      ctx.strokeStyle = i < levelIdx ? ec.text : 'rgba(200,180,130,0.22)';
      ctx.lineWidth = i < levelIdx ? 1.8 : 1;
      ctx.beginPath();
      ctx.moveTo(dotX + 5, axY);
      ctx.lineTo(dotX + axW / 4 - 5, axY);
      ctx.stroke();
    }
    // 圆点
    ctx.beginPath();
    ctx.arc(dotX, axY, cur ? 6 : (past ? 4.2 : 3), 0, Math.PI * 2);
    ctx.fillStyle = cur ? ec.text : (past ? 'rgba(200,180,130,0.7)' : 'rgba(200,200,200,0.22)');
    ctx.fill();
    // 当前时代外圈
    if (cur) {
      ctx.beginPath();
      ctx.arc(dotX, axY, 10, 0, Math.PI * 2);
      ctx.strokeStyle = ec.text;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // era 短名（下方）
    ctx.textAlign = 'center';
    ctx.fillStyle = cur ? ec.text : (past ? 'rgba(220,210,180,0.55)' : 'rgba(200,200,180,0.35)');
    ctx.font = cur ? '700 10px "Microsoft YaHei", sans-serif'
                   : '10px "Microsoft YaHei", sans-serif';
    ctx.fillText(eraShort[ERA_ORDER[i]], dotX, by + bh - 1);
  }
  ctx.restore();
  ctx.textAlign = 'left';

  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(180,215,200,0.55)';
  ctx.fillText('键盘：← → / A D 移动 · 空格 跳跃 · R 重来 · Esc 退出 · M 静音', 40, 124);
  ctx.fillStyle = pad.connected ? 'rgba(150,235,190,0.75)' : 'rgba(255,190,120,0.80)';
  ctx.fillText(pad.connected
    ? '手柄：已连接 · 左摇杆/十字键 移动 · 任意键 跳跃 · Back/Select 退出'
    : (!pageActivated && HAS_GAMEPAD_API && !IN_IFRAME
        ? '手柄：待激活 — 先点一下画面或按一下键盘，再按手柄任意键'
        : '手柄：未检测到（按一下手柄任意键唤醒；USB 需先在系统里识别）'), 40, 142);
  // 手柄实时诊断（便于确认按键编号）
  if (pad.connected) {
    ctx.font = '11px Consolas, monospace';
    ctx.fillStyle = 'rgba(140,225,185,0.45)';
    ctx.fillText('pad: ' + String(pad.name).slice(0, 44), 40, H - 30);
    ctx.fillText('axes[' + pad.axes + ']  按下键[' + (pad.dbg || '无') + ']  ' +
                 '左' + (pad.left ? 1 : 0) + ' 右' + (pad.right ? 1 : 0) + ' 跳' + (pad.jump ? 1 : 0),
                 40, H - 14);
  } else if (IN_IFRAME || !HAS_GAMEPAD_API) {
    ctx.font = '600 12px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,170,90,0.85)';
    ctx.fillText(IN_IFRAME
      ? '⚠ 预览窗中运行：浏览器屏蔽了手柄。请双击本 HTML 用独立窗口打开。'
      : '⚠ 浏览器不支持 Gamepad API，手柄不可用。', 40, H - 14);
  }
  ctx.font = '13px "Microsoft YaHei", sans-serif';

  // 光尘计数
  ctx.fillStyle = 'rgba(255,230,160,0.9)';
  ctx.font = '600 15px "Microsoft YaHei", sans-serif';
  ctx.fillText('光尘 ' + collected + ' / ' + level.motes.length, 40, 162);
  for (let i = 0; i < level.motes.length; i++) {
    ctx.beginPath();
    ctx.arc(146 + i * 18, 157, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = i < collected ? '#ffe9a8' : 'rgba(255,255,255,0.16)';
    ctx.fill();
  }

  // 生命
  ctx.font = '600 15px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(235,205,150,0.9)';
  ctx.fillText('生命', 268, 162);
  for (let i = 0; i < MAXHP; i++) {
    const hx = 318 + i * 24, hy = 157;
    ctx.beginPath();
    ctx.arc(hx, hy, 8, 0, Math.PI * 2);
    if (i < player.hp) {
      ctx.fillStyle = '#4f9a7c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,215,0.85)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(230,255,240,0.9)';
      ctx.beginPath();
      ctx.arc(hx - 2.4, hy - 2.4, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // 进度
  const pct = clamp(player.x / level.goal.x, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(40, 150, 380, 3);
  ctx.fillStyle = 'rgba(255,225,150,0.75)';
  ctx.fillRect(40, 150, 380 * pct, 3);
}

/* ================= 文字换行 ================= */
function wrapText(text, x, y, maxW, lineH, color, font) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  let line = '', yy = y;
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy);
      line = ch;
      yy += lineH;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, yy);
}

/* ================= 关卡过场 ================= */
function drawIntro() {
  ctx.fillStyle = 'rgba(4,9,8,0.94)';
  ctx.fillRect(0, 0, W, H);

  // 背景氛围光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(300, 360, 340, level.theme === 'forge' ? 'rgba(255,140,60,0.20)'
    : level.theme === 'ritual' ? 'rgba(255,180,90,0.18)'
    : level.theme === 'burial' ? 'rgba(140,190,120,0.14)'
    : level.theme === 'dig' ? 'rgba(255,225,160,0.16)'
    : 'rgba(200,220,255,0.14)');
  ctx.restore();

  /* ============ 左侧：面具"金→三千年→青铜锈迹"演变过场动画 ============ */
  // 循环播放：演变 9s（每个时代约 1.8s，看得清金→绿的渐进）→ 停在"展柜之上" 3s → 回到熔金再演一遍
  // 停顿是为了让观众看清终态，也不会觉得"上一轮刚结束下一轮就开"很生硬
  const EVOLVE_DUR = 9.0;
  const EVOLVE_HOLD = 3.0;
  const EVOLVE_CYCLE = EVOLVE_DUR + EVOLVE_HOLD;
  const evolvePhase = stateT % EVOLVE_CYCLE;
  const evolveProgress = Math.min(1, evolvePhase / EVOLVE_DUR);

  let evolveEra;
  if (evolveProgress < 0.20)      evolveEra = 'forge';
  else if (evolveProgress < 0.42) evolveEra = 'ritual';
  else if (evolveProgress < 0.64) evolveEra = 'burial';
  else if (evolveProgress < 0.86) evolveEra = 'dig';
  else                            evolveEra = 'museum';

  const evolveLabelMap = {
    forge:  { name: '熔金为器',    t0: '约 前 1600', color: '#ffe0a0' },
    ritual: { name: '祭天通神',    t0: '前 1300—1046', color: '#f0c684' },
    burial: { name: '沉入地底',    t0: '封埋三千年',   color: '#c8d8a0' },
    dig:    { name: '破土重光',    t0: '1986 年',     color: '#c4a884' },
    museum: { name: '展柜之上',    t0: '今日',       color: '#a0c8b0' }
  };

  // 演变时间轴（顶部）
  const tlY = 210, tlX = 90, tlW = 420;
  ctx.strokeStyle = 'rgba(200,180,130,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tlX, tlY);
  ctx.lineTo(tlX + tlW, tlY);
  ctx.stroke();

  for (let i = 0; i < 5; i++) {
    const dx = tlX + i * (tlW / 4);
    const cur = evolveEra === ERA_ORDER[i];
    const past = i < ERA_ORDER.indexOf(evolveEra);
    ctx.beginPath();
    ctx.arc(dx, tlY, cur ? 6 : (past ? 4 : 3), 0, Math.PI * 2);
    ctx.fillStyle = cur ? evolveLabelMap[ERA_ORDER[i]].color
      : (past ? 'rgba(200,180,130,0.7)' : 'rgba(200,200,200,0.22)');
    ctx.fill();
    if (cur) {
      ctx.beginPath();
      ctx.arc(dx, tlY, 10, 0, Math.PI * 2);
      ctx.strokeStyle = evolveLabelMap[ERA_ORDER[i]].color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // 当前演变标签
  const curLbl = evolveLabelMap[evolveEra];
  ctx.textAlign = 'left';
  ctx.fillStyle = curLbl.color;
  ctx.font = '700 18px "Microsoft YaHei", sans-serif';
  ctx.fillText(curLbl.name, tlX, tlY - 18);
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(200,200,180,0.6)';
  ctx.fillText(curLbl.t0, tlX + 100, tlY - 18);

  // 面具本体（居中展示演变）
  const hdX = 300, hdY = 360;
  const hdR = 82;

  // 底部辉光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const evolveGlowColors = {
    forge:  'rgba(255,180,80,0.35)',
    ritual: 'rgba(255,160,70,0.25)',
    burial: 'rgba(140,180,120,0.18)',
    dig:    'rgba(220,200,150,0.22)',
    museum: 'rgba(160,210,180,0.20)'
  };
  radialGlow(hdX, hdY, hdR * 2.6, evolveGlowColors[evolveEra]);
  ctx.restore();

  drawHead(hdX, hdY, hdR, {
    angle: 0, sx: 1, sy: 1, blink: 0, flat: false, era: evolveEra
  });

  // 底部时间轴标签（当前 era 高亮）
  const tlY2 = 500;
  ctx.textAlign = 'center';
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  const eraTicks = [
    { x: tlX,             era: 'forge',  yr: '约前1600' },
    { x: tlX + tlW * 0.25, era: 'ritual', yr: '前1300—1046' },
    { x: tlX + tlW * 0.5,  era: 'burial', yr: '三千年' },
    { x: tlX + tlW * 0.75, era: 'dig',    yr: '1986' },
    { x: tlX + tlW,        era: 'museum', yr: '今日' }
  ];
  for (const tk of eraTicks) {
    const cur = tk.era === evolveEra;
    ctx.fillStyle = cur ? evolveLabelMap[tk.era].color : 'rgba(200,200,180,0.35)';
    ctx.font = cur ? '700 12px "Microsoft YaHei", sans-serif'
                   : '11px "Microsoft YaHei", sans-serif';
    ctx.fillText(tk.era, tk.x, tlY2);
    ctx.fillStyle = cur ? 'rgba(230,220,180,0.85)' : 'rgba(180,180,160,0.35)';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillText(tk.yr, tk.x, tlY2 + 14);
  }

  // 竖线分隔
  ctx.strokeStyle = 'rgba(210,190,140,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(600, 130);
  ctx.lineTo(600, 540);
  ctx.stroke();

  // ============ 右侧：文物图 + 关卡信息 ============
  if (!drawArtifact(900, 340, 360, 0.92)) {
    ctx.fillStyle = 'rgba(200,225,210,0.3)';
    ctx.textAlign = 'center';
    ctx.font = '15px "Microsoft YaHei", sans-serif';
    ctx.fillText('文物配图', 900, 340);
  }

  // 关卡序号
  ctx.textAlign = 'left';
  ctx.fillStyle = '#d8bd7d';
  ctx.font = '15px "Microsoft YaHei", sans-serif';
  ctx.fillText('第 ' + (levelIdx + 1) + ' / ' + LEVELS.length + ' 关', 640, 232);

  ctx.fillStyle = '#f0e2bb';
  ctx.font = '700 44px "Microsoft YaHei", serif';
  ctx.fillText(level.name, 636, 288);

  wrapText(level.line, 640, 340, 540, 32, 'rgba(215,230,220,0.82)', '17px "Microsoft YaHei", sans-serif');

  // 目标
  ctx.fillStyle = 'rgba(255,225,150,0.85)';
  ctx.font = '15px "Microsoft YaHei", sans-serif';
  ctx.fillText('目标：拾起 ' + level.motes.length + ' 缕光尘，走到终点', 640, 468);

  ctx.fillStyle = `rgba(255,240,190,${0.5 + 0.5 * Math.sin(tGlobal * 3)})`;
  ctx.font = '600 17px "Microsoft YaHei", sans-serif';
  ctx.fillText('按 空格 / 手柄任意键 继续', 640, 522);

  // 底部文化依据
  ctx.fillStyle = 'rgba(130,160,150,0.40)';
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillText('商代（前1600—前1046）· 1986 年广汉三星堆二号祭祀坑出土 · 三星堆博物馆藏', 640, 620);
}

/* ================= 通关 ================= */
function drawClear() {
  ctx.fillStyle = 'rgba(4,9,8,0.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f4e4b8';
  ctx.font = '700 46px "Microsoft YaHei", serif';
  ctx.fillText('第 ' + (levelIdx + 1) + ' 关 · 通过', W / 2, 300);
  ctx.fillStyle = 'rgba(200,230,215,0.8)';
  ctx.font = '18px "Microsoft YaHei", sans-serif';
  ctx.fillText(level.line, W / 2, 356);
  ctx.fillStyle = `rgba(255,240,190,${0.5 + 0.5 * Math.sin(tGlobal * 3)})`;
  ctx.font = '600 19px "Microsoft YaHei", sans-serif';
  ctx.fillText(levelIdx < LEVELS.length - 1 ? '按 空格 进入下一关' : '按 空格 走向结局', W / 2, 430);
}

/* ================= 结局 ================= */
function drawEnding() {
  const bg = ctx.createRadialGradient(W / 2, 340, 60, W / 2, 340, 700);
  bg.addColorStop(0, '#0d211b');
  bg.addColorStop(1, '#040807');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(W / 2, 300, 240, 'rgba(255,215,130,0.13)');
  ctx.restore();
  drawArtifact(W / 2, 290, 340, 0.95);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#efdba6';
  ctx.font = '700 44px "Microsoft YaHei", serif';
  ctx.fillText('三千年前，它是一张金面具', W / 2, 490);

  ctx.fillStyle = 'rgba(225,205,160,0.90)';
  ctx.font = '19px "Microsoft YaHei", serif';
  ctx.fillText('三千年后，铜身绿锈里，藏着那一瞬的金光。', W / 2, 524);

  // 五行时间徽章：熔金 → 金光余温 → 金剥绿锈 → 出土尘灰 → 展柜残光
  if (typeof ERA_ORDER !== 'undefined' && typeof ERA !== 'undefined') {
    const y5 = 568;
    const total = ERA_ORDER.length;
    const pad = 90;
    const cx0 = W / 2 - pad * (total - 1) / 2;
    const eraDotColors = {
      forge:  '#ffd060',
      ritual: '#e0a050',
      burial: '#9ac884',
      dig:    '#a89878',
      museum: '#98c8b0'
    };
    for (let i = 0; i < total; i++) {
      const x = cx0 + i * pad;
      // 连线
      if (i > 0) {
        ctx.strokeStyle = 'rgba(200,180,140,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx0 + (i - 1) * pad + 6, y5);
        ctx.lineTo(x - 6, y5);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(x, y5, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = eraDotColors[ERA_ORDER[i]] || '#ffffff';
      ctx.fill();
      ctx.fillStyle = 'rgba(220,200,150,0.75)';
      ctx.font = '11px "Microsoft YaHei", sans-serif';
      ctx.fillText(ERA[ERA_ORDER[i]].label, x, y5 + 22);
    }
  }

  ctx.fillStyle = 'rgba(150,180,170,0.55)';
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillText('文化依据：商代（前1600—前1046）；1986 年四川广汉三星堆二号祭祀坑出土；三星堆博物馆藏。', W / 2, 640);
  ctx.fillText('艺术想象声明：铸造、祭祀、掩埋等情节为艺术演绎，非考古复原；造型依据馆方展签与展览海报二次创作。', W / 2, 660);

  ctx.fillStyle = `rgba(255,240,190,${0.5 + 0.5 * Math.sin(tGlobal * 3)})`;
  ctx.font = '600 17px "Microsoft YaHei", sans-serif';
  ctx.fillText('按 空格 重新开始', W / 2, 700);
}

/* ================= 渲染 ================= */
function render() {
  if (state === 'title') { drawTitle(); drawPatina(); drawVignette(); drawFrame(); drawSoundBtn(); return; }
  if (state === 'ending') { drawEnding(); drawPatina(); drawVignette(); drawFrame(); drawSoundBtn(); return; }

  ctx.save();
  if (shakeT > 0) {
    const m = shakeT * 26;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawBackground(level.theme);
  drawArtifactGhost(0.075, H * 1.55, level.width * 0.16);
  drawArtifactGhost(0.055, H * 1.15, level.width * 0.60);
  drawPlatforms();
  drawHazards();
  drawGoal();
  drawMotes();
  drawPlayer();
  ctx.restore();

  drawPatina();
  drawVignette();
  drawFrame();

  if (hurtFlash > 0) {
    ctx.fillStyle = `rgba(190,40,30,${Math.min(0.5, hurtFlash * 0.55)})`;
    ctx.fillRect(0, 0, W, H);
  }

  drawHUD();
  drawSubtitle();

  if (state === 'intro') drawIntro();
  if (state === 'clear') drawClear();
  drawExit();
  drawSoundBtn();
}

/* ================= 主循环 ================= */
let last = performance.now();
let acc = 0;

function frame(now) {
  const raw = (now - last) / 1000;
  last = now;
  const dt = Math.min(raw, 0.05);
  tGlobal += dt;
  stateT += dt;
  if (player.goldFlash > 0) player.goldFlash = Math.max(0, player.goldFlash - dt);

  gatherInput();

  // 音频可能被浏览器挂起（切标签页后也会挂起），一旦有过交互就自动恢复
  if (audioStarted && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  // 每帧根据当前状态推送紧张度给氛围音系统
  updateAmbience(dt);

  if (state !== 'title' && (pressed.has('Escape') || pad.backEdge)) toTitle();

  // 静音开关（M 键，任意状态）
  if (pressed.has('KeyM')) toggleMute();

  if (state === 'title') {
    if (input.startEdge) { loadLevel(0); state = 'intro'; stateT = 0; sfxStart(); }
  } else if (state === 'intro') {
    // 不再要求 stateT 阈值：过场刚出现的瞬间按键也会被接受，避免"按了没反应"
    if (input.startEdge) { state = 'play'; stateT = 0; acc = 0; }
  } else if (state === 'play') {
    if (pressed.has('KeyR')) respawn();
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 10 && state === 'play') { step(STEP); acc -= STEP; }
    if (state !== 'play') acc = 0;
    // 粒子更新
    for (const b of burst) {
      b.life -= dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vy += 420 * dt;
    }
  } else if (state === 'clear') {
    if (input.startEdge) {
      if (levelIdx < LEVELS.length - 1) {
        loadLevel(levelIdx + 1); state = 'intro'; stateT = 0; sfxStart();
      } else {
        state = 'ending'; stateT = 0; sfxClear();
      }
    }
  } else if (state === 'ending') {
    if (input.startEdge && stateT > 0.3) { state = 'title'; stateT = 0; }
  }

  pressed.clear();
  render();
  requestAnimationFrame(frame);
}

loadLevel(0);
state = 'title';
requestAnimationFrame(frame);
</script>
