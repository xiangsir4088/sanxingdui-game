/* ================= 文字换行 ================= */
function wrapText(text, x, y, maxW, lineH, color, font) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  let line = '', yy = y;
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy);
      line = ch;
      yy += lineH;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, yy);
}

/* ================= 标题 ================= */
function drawTitle() {
  const bg = ctx.createRadialGradient(W / 2, 360, 80, W / 2, 360, 720);
  bg.addColorStop(0, '#10261f');
  bg.addColorStop(1, '#050a08');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 铜锈纹理点缀（柔和底光，静态）
  for (let i = 0; i < 18; i++) {
    const x = (i * 317) % W, y = (i * 197) % H;
    ctx.fillStyle = `rgba(90,180,140,${0.018 + (i % 3) * 0.010})`;
    ctx.beginPath();
    ctx.arc(x, y, 34 + (i % 4) * 24, 0, Math.PI * 2);
    ctx.fill();
  }

  // 动态飘尘：标题页用"金+绿"双色粒子，营造"金面具被时光剥落"的氛围
  // 确定性种子生成，无状态、无需 update
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const dustCount = 55;
  for (let i = 0; i < dustCount; i++) {
    const seed = i * 73.31 + 12.7;
    const isGold = i % 3 !== 0; // 2/3 金色、1/3 铜锈绿
    const phaseX = tGlobal * (0.4 + (i % 5) * 0.10) * (isGold ? 0.7 : 1.0);
    const driftX = Math.sin(tGlobal * 0.30 + seed * 0.4) * 30;
    const driftY = Math.cos(tGlobal * 0.22 + seed * 0.7) * 22;
    const baseX = ((i * 97) + (phaseX * 40));
    const wrapX = ((baseX % W) + W) % W;
    const fall = ((tGlobal * 6 + seed * 3.7) % (H + 60));
    const px = wrapX + driftX;
    const py = (fall % H) + driftY - 30;
    if (py < -20 || py > H + 20) continue;
    const sz = 1.0 + ((i * 17) % 100) / 100 * 1.8;
    const twinkle = 0.5 + 0.5 * Math.sin(tGlobal * 1.8 + seed);
    const alpha = 0.10 + 0.24 * twinkle;
    const col = isGold
      ? `rgba(255,220,140,${alpha})`
      : `rgba(150,210,160,${alpha * 0.7})`;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(px, py, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8d4a0';
  ctx.font = '700 62px "Microsoft YaHei", serif';
  ctx.fillText('一眼三千年', W / 2, 96);
  ctx.fillStyle = 'rgba(200,225,210,0.78)';
  ctx.font = '17px "Microsoft YaHei", sans-serif';
  ctx.fillText('三星堆祭司青铜头像 · 铸造 → 受祭 → 掩埋 → 发掘 → 展出', W / 2, 134);
  ctx.fillStyle = 'rgba(255,210,130,0.72)';
  ctx.font = '14px "Microsoft YaHei", sans-serif';
  ctx.fillText('三千年前，它是一张金面具；三千年后，我们才第一次看见它', W / 2, 158);

  // 文物本体
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(W / 2, 400, 260, 'rgba(255,210,120,0.10)');
  ctx.restore();
  if (!drawArtifact(W / 2, 400, 420, 0.96)) {
    ctx.fillStyle = 'rgba(200,225,210,0.4)';
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.fillText('（文物配图未加载）', W / 2, 400);
  }

  // 题眼
  ctx.fillStyle = 'rgba(235,220,175,0.85)';
  ctx.font = '18px "Microsoft YaHei", serif';
  ctx.fillText('“三千年前的一张脸，只为看你一眼。”', W / 2, 580);

  // 浏览器要求"用户交互"后才放行音频：只用手柄开始会全程静音，这里明确提示
  if (!audioStarted) {
    ctx.fillStyle = `rgba(255,205,130,${0.6 + 0.4 * Math.sin(tGlobal * 4)})`;
    ctx.font = '14px "Microsoft YaHei", sans-serif';
    ctx.fillText('· 点一下画面或按一下键盘，开启声音 ·', W / 2, 612);
  }

  // 开始
  ctx.fillStyle = `rgba(255,240,190,${0.55 + 0.45 * Math.sin(tGlobal * 3)})`;
  ctx.font = '600 21px "Microsoft YaHei", sans-serif';
  ctx.fillText('按 空格 / Enter / 手柄任意键 开始', W / 2, 648);

  ctx.fillStyle = 'rgba(150,180,170,0.45)';
  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.fillText('键盘：← → / A D 移动 · 空格 跳跃 · R 重来 · Esc 退出 · M 静音', W / 2, 678);
  ctx.fillText('手柄：左摇杆 / 十字键 移动 · 任意键 跳跃 / 确认 · Back / Select 退出', W / 2, 698);

  // 手柄状态与实时诊断（放左上角，避开底部居中的按键说明；玩家可能进不了游戏看不到 HUD）
  // x 从 168 开始：让位于左上角的"选关"按钮（BTN_SEL 宽度 154 = x:22 + w:132）
  ctx.textAlign = 'left';
  if (pad.connected) {
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(150,235,190,0.85)';
    ctx.fillText('手柄：已连接 · ' + String(pad.name).slice(0, 30), 168, 46);
    ctx.font = '11px Consolas, monospace';
    ctx.fillStyle = 'rgba(140,225,185,0.5)';
    ctx.fillText('axes[' + pad.axes + ']  按下键[' + (pad.dbg || '无') + ']  左' +
                 (pad.left ? 1 : 0) + ' 右' + (pad.right ? 1 : 0) +
                 ' 跳' + (pad.jump ? 1 : 0), 168, 64);
  } else {
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,180,100,0.9)';
    ctx.fillText(IN_IFRAME
      ? '⚠ 手柄未检测到：正在预览窗（iframe）内运行，浏览器屏蔽了手柄，请双击 HTML 用独立窗口打开'
      : (!HAS_GAMEPAD_API
          ? '⚠ 手柄未检测到：当前浏览器不支持 Gamepad API'
          : '⚠ 手柄未检测到：先点一下画面，再按手柄任意键（USB 需系统已识别）'), 168, 54);
  }

  // 预览窗 / iframe 环境：Gamepad API 会被浏览器屏蔽，给出明确指引
  if (IN_IFRAME || !HAS_GAMEPAD_API) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(30,14,8,0.92)';
    ctx.fillRect(BTN_OPEN.x - 24, BTN_OPEN.y - 58, BTN_OPEN.w + 48, 118);
    ctx.strokeStyle = 'rgba(255,170,90,0.75)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(BTN_OPEN.x - 24, BTN_OPEN.y - 58, BTN_OPEN.w + 48, 118);

    ctx.font = '600 15px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,180,100,0.95)';
    ctx.textAlign = 'center';
    ctx.fillText(IN_IFRAME ? '当前在预览窗中运行，手柄会被浏览器屏蔽' : '当前浏览器不支持 Gamepad API',
                 W / 2, BTN_OPEN.y - 32);
    ctx.font = '13px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,215,175,0.75)';
    ctx.fillText('请用独立浏览器窗口打开本 HTML 文件（双击即可）', W / 2, BTN_OPEN.y - 10);

    const hov = inOpen(mouse);
    ctx.fillStyle = hov ? 'rgba(255,225,150,0.90)' : 'rgba(255,200,120,0.72)';
    ctx.fillRect(BTN_OPEN.x, BTN_OPEN.y, BTN_OPEN.w, BTN_OPEN.h);
    ctx.fillStyle = '#20140a';
    ctx.font = '600 16px "Microsoft YaHei", sans-serif';
    ctx.fillText('点击在独立窗口打开', W / 2, BTN_OPEN.y + 29);
  }
  ctx.textAlign = 'center';

  // 标题页左下角"选关"入口按钮（在标题最上层）

}

/* ---------- 左侧：第一关专属「炉火初开」开场演出 ---------- */
// 叙事起点：金面从炉膛里跃出来。此后三千年，它一路变成铜绿。
function drawIntroForge() {
  const T = stateT;
  const LOOP = 7.4;
  const ph = T % LOOP;
  const flick = 0.84 + 0.16 * Math.sin(T * 7.1) + 0.07 * Math.sin(T * 12.3);

  const charge = clamp(ph / 1.2, 0, 1);        // 炉火蓄势 0 → 1
  const leap = clamp((ph - 1.2) / 1.7, 0, 1);  // 跃出炉膛 0 → 1
  const eOut = 1 - Math.pow(1 - leap, 3);
  const fade = clamp(1 - (ph - 5.9) / 1.5, 0, 1);  // 循环收尾淡出

  const mcx = 250, mouthTop = 400, mouthBot = 500, mouthW = 52;
  const emergeX = mcx, emergeY = mouthBot - 30;
  const apexX = 316, apexY = 214;

  /* --- 炉前地面 --- */
  const gg = ctx.createLinearGradient(0, 532, 0, 570);
  gg.addColorStop(0, 'rgba(26,18,12,0)');
  gg.addColorStop(0.42, 'rgba(20,14,9,0.90)');
  gg.addColorStop(1, 'rgba(8,5,3,0.97)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, 532, 600, 38);

  /* --- 炉体：夯土砖身 --- */
  const fbTop = 300, fbBot = 556;
  const fPath = new Path2D();
  fPath.moveTo(mcx - 112, fbBot);
  fPath.lineTo(mcx - 82, 344);
  fPath.quadraticCurveTo(mcx - 80, fbTop, mcx - 58, fbTop);
  fPath.lineTo(mcx + 58, fbTop);
  fPath.quadraticCurveTo(mcx + 80, fbTop, mcx + 82, 344);
  fPath.lineTo(mcx + 112, fbBot);
  fPath.closePath();

  const bodyG = ctx.createLinearGradient(mcx - 112, 0, mcx + 112, 0);
  bodyG.addColorStop(0, 'rgba(9,6,4,0.97)');
  bodyG.addColorStop(0.36, 'rgba(24,16,10,0.97)');
  bodyG.addColorStop(0.74, 'rgba(15,10,7,0.97)');
  bodyG.addColorStop(1, 'rgba(7,4,3,0.98)');
  ctx.fillStyle = bodyG;
  ctx.fill(fPath);

  // 夯土砖缝
  ctx.save();
  ctx.clip(fPath);
  ctx.strokeStyle = 'rgba(128,84,46,0.13)';
  ctx.lineWidth = 1;
  for (let ry = fbTop + 16; ry < fbBot; ry += 24) {
    ctx.beginPath();
    ctx.moveTo(mcx - 120, ry);
    ctx.lineTo(mcx + 120, ry);
    ctx.stroke();
    const off = ((ry / 24) | 0) % 2 ? 0 : 16;
    for (let rx = mcx - 120 + off; rx < mcx + 120; rx += 32) {
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx, ry + 24);
      ctx.stroke();
    }
  }
  // 膛口透出的内壁暖光
  const innerG = ctx.createRadialGradient(mcx, mouthBot - 40, 10, mcx, mouthBot - 40, 150);
  innerG.addColorStop(0, 'rgba(255,124,42,' + (0.20 * flick * (0.5 + 0.5 * charge)).toFixed(3) + ')');
  innerG.addColorStop(1, 'rgba(255,110,35,0)');
  ctx.fillStyle = innerG;
  ctx.fillRect(mcx - 120, fbTop, 240, fbBot - fbTop);
  ctx.restore();

  // 受火亮边
  ctx.strokeStyle = 'rgba(255,150,70,' + (0.15 * flick).toFixed(3) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mcx - 112, fbBot);
  ctx.lineTo(mcx - 82, 344);
  ctx.quadraticCurveTo(mcx - 80, fbTop, mcx - 58, fbTop);
  ctx.stroke();

  /* --- 拱形炉膛 --- */
  const mouthPath = new Path2D();
  mouthPath.moveTo(mcx - mouthW, mouthBot);
  mouthPath.lineTo(mcx - mouthW, mouthTop + 30);
  mouthPath.quadraticCurveTo(mcx - mouthW, mouthTop, mcx, mouthTop);
  mouthPath.quadraticCurveTo(mcx + mouthW, mouthTop, mcx + mouthW, mouthTop + 30);
  mouthPath.lineTo(mcx + mouthW, mouthBot);
  mouthPath.closePath();

  ctx.strokeStyle = 'rgba(150,98,54,0.32)';
  ctx.lineWidth = 7;
  ctx.stroke(mouthPath);

  ctx.save();
  ctx.clip(mouthPath);
  ctx.fillStyle = 'rgba(5,3,2,0.98)';
  ctx.fillRect(mcx - mouthW, mouthTop - 4, mouthW * 2, mouthBot - mouthTop + 8);
  ctx.globalCompositeOperation = 'lighter';
  const fireK = flick * (0.45 + 0.55 * charge);
  radialGlow(mcx, mouthBot - 26, 104 * fireK, 'rgba(255,120,40,0.36)');
  radialGlow(mcx, mouthBot - 34, 60 * fireK, 'rgba(255,186,86,0.46)');
  for (let i = 0; i < 3; i++) {
    const fh = (40 + i * 18) * (0.78 + 0.22 * Math.sin(T * 6.4 + i * 1.9)) * (0.7 + 0.5 * charge);
    const fw = 28 - i * 6;
    const bx = mcx + Math.sin(T * 2.3 + i * 2.1) * 7;
    const fg = ctx.createLinearGradient(0, mouthBot - 4, 0, mouthBot - 4 - fh);
    fg.addColorStop(0, i === 0 ? 'rgba(255,232,164,0.94)' : 'rgba(255,152,58,0.86)');
    fg.addColorStop(0.55, 'rgba(255,120,36,0.55)');
    fg.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(bx - fw, mouthBot - 2);
    ctx.quadraticCurveTo(bx - fw * 0.6, mouthBot - 4 - fh * 0.6, bx, mouthBot - 4 - fh);
    ctx.quadraticCurveTo(bx + fw * 0.6, mouthBot - 4 - fh * 0.6, bx + fw, mouthBot - 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* --- 金面：从炉膛里跃出来 --- */
  if (leap > 0) {
    const settle = clamp((ph - 3.1) / 1.0, 0, 1);
    const mX = emergeX + (apexX - emergeX) * eOut;
    const mY = emergeY + (apexY - emergeY) * Math.sin(leap * Math.PI * 0.5) + Math.sin(T * 1.6) * 5 * settle;
    const mR = 20 + 16 * eOut;
    const rot = -0.62 * (1 - eOut) + Math.sin(T * 1.1) * 0.05;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    radialGlow(mX, mY + mR * 0.3, mR * 4.2, 'rgba(255,206,110,' + (0.16 * (0.4 + 0.6 * settle)).toFixed(3) + ')');
    radialGlow(mX, mY + mR * 0.3, mR * 2.0, 'rgba(255,236,176,' + (0.13 + 0.07 * settle).toFixed(3) + ')');
    // 出膛瞬间的光环
    if (leap < 0.5) {
      const rk = leap / 0.5;
      ctx.strokeStyle = 'rgba(255,224,150,' + ((1 - rk) * 0.42).toFixed(3) + ')';
      ctx.lineWidth = 3 * (1 - rk) + 0.6;
      ctx.beginPath();
      ctx.arc(emergeX, emergeY, 18 + rk * 92, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    // 拖尾火星
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i <= 12; i++) {
      const u = clamp(leap - i * 0.045, 0, 1);
      const eu = 1 - Math.pow(1 - u, 3);
      const ux = emergeX + (apexX - emergeX) * eu;
      const uy = emergeY + (apexY - emergeY) * Math.sin(u * Math.PI * 0.5);
      const a = (1 - i / 13) * 0.5 * (1 - settle * 0.6);
      ctx.fillStyle = 'rgba(255,' + (168 + (i % 4) * 20) + ',86,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(ux + Math.sin(T * 3 + i) * 6, uy + Math.cos(T * 2.4 + i) * 6, Math.max(0.4, 1.8 - i * 0.08), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 炉口到金面之间飘散的余烬：说明它是从这口炉里出来的
    if (leap > 0.15) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 16; i++) {
        const k = ((T * 0.45 + i * 0.113) % 1);
        const ey = mouthTop + 10 - k * (mouthTop + 10 - mY - mR * 1.2);
        const ex = mcx + (mX - mcx) * k + Math.sin(T * 2.2 + i * 1.9) * 16;
        const ea = (1 - k) * 0.34 * eOut * fade;
        ctx.fillStyle = 'rgba(255,' + (170 + (i % 4) * 18) + ',86,' + ea.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(ex, ey, 1 + (i % 3) * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = fade;
    drawHead(mX, mY, mR, {
      angle: rot, sx: 1, sy: 1, blink: 0, flat: false,
      era: 'forge', progressK: 0
    });
    ctx.restore();
  }

  /* --- 火星上升 --- */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 30; i++) {
    const sp = 0.05 + ((i * 37) % 11) / 110;
    const k = (T * sp + i * 0.137) % 1;
    const x = mcx + Math.sin(k * 6.0 + i * 1.7) * (26 + k * 96);
    const y = 512 - k * 392;
    const a = (1 - k) * 0.5 * (0.5 + 0.5 * charge);
    ctx.fillStyle = 'rgba(255,' + (158 + (i % 3) * 28) + ',92,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x, y, 1.2 + (i % 3) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  /* --- 标题 --- */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe0a0';
  ctx.font = '700 20px "Microsoft YaHei", sans-serif';
  ctx.fillText('炉火初开', 90, 178);
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(200,200,180,0.62)';
  ctx.fillText('商代早期 · 约前 1600 · 广汉原野', 90, 198);

  /* --- 底部「炉火 → 金面」进度带 --- */
  const bx0 = 92, bx1 = 508, by = 590;
  const barG = ctx.createLinearGradient(bx0, 0, bx1, 0);
  barG.addColorStop(0, 'rgba(255,150,60,0.20)');
  barG.addColorStop(1, 'rgba(255,214,130,0.22)');
  ctx.fillStyle = barG;
  ctx.fillRect(bx0, by - 1.5, bx1 - bx0, 3);

  const litW = (bx1 - bx0) * eOut;
  if (litW > 0.5) {
    const litG = ctx.createLinearGradient(bx0, 0, bx0 + litW, 0);
    litG.addColorStop(0, 'rgba(255,146,58,0.95)');
    litG.addColorStop(1, 'rgba(255,228,158,0.95)');
    ctx.fillStyle = litG;
    ctx.fillRect(bx0, by - 2.5, litW, 5);
  }
  ctx.beginPath();
  ctx.arc(bx0 + (bx1 - bx0) * eOut, by, 4.6, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe2a0';
  ctx.fill();

  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,164,86,0.85)';
  ctx.fillText('炉火', bx0, by - 12);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,224,160,0.85)';
  ctx.fillText('金面', bx1, by - 12);
  ctx.textAlign = 'left';

  const beat = leap <= 0
    ? '风箱鼓起，炉膛烧到发白。'
    : (leap < 1
      ? '铜汁落进陶范——一张脸在火里慢慢成形。'
      : '它从炉膛里跃出来的时候，还是金的。');
  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(214,226,214,' + (0.55 + 0.30 * charge).toFixed(3) + ')';
  ctx.fillText(beat, 92, 616);
}

/* ---------- 左侧：第二关专属「燎祭之夜」开场演出 ---------- */
// 叙事链：夯土台上的燎祭大火 → 铜面被火一层层镀成琥珀 → 铜绿从火的边缘爬上来
// 底部「金 → 铜锈」进度带把"一眼三千年"的主线直接画成一条可读的线
function drawIntroRitual() {
  const T = stateT;
  const LOOP = 11.0;
  const ph = T % LOOP;
  const burn = clamp(ph / 2.0, 0, 1);           // 点火：0 → 1
  const rustK = clamp((ph - 2.6) / 6.0, 0, 1);  // 金 → 锈：0 → 1
  const flick = 0.86 + 0.14 * Math.sin(T * 6.1) + 0.06 * Math.sin(T * 11.7);

  /* --- 燎祭大火的底光：这一夜，整片原野都是祭坛 --- */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const hg = ctx.createLinearGradient(0, 300, 0, 562);
  hg.addColorStop(0, 'rgba(255,110,36,0)');
  hg.addColorStop(0.62, 'rgba(255,116,40,' + (0.045 * burn).toFixed(3) + ')');
  hg.addColorStop(1, 'rgba(255,146,62,' + (0.115 * burn).toFixed(3) + ')');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 300, 600, 262);
  radialGlow(292, 468, 310, 'rgba(255,132,48,' + (0.105 * burn * flick).toFixed(3) + ')');
  radialGlow(140, 520, 210, 'rgba(255,120,40,' + (0.070 * burn).toFixed(3) + ')');
  radialGlow(474, 514, 210, 'rgba(255,120,40,' + (0.070 * burn).toFixed(3) + ')');
  ctx.restore();

  /* --- 祭烟：三道烟柱直上，把"燎祭"写在天上 --- */
  for (let c = 0; c < 3; c++) {
    const bx = 150 + c * 146;
    for (let i = 0; i < 9; i++) {
      const k = (T * 0.10 + i / 9 + c * 0.13) % 1;
      const y = 522 - k * 402;
      const a = Math.max(0, (1 - k) * 0.085 * burn * (0.62 + 0.38 * Math.sin(T * 1.3 + i * 1.1)));
      const r = 16 + k * 46;
      const x = bx + Math.sin(k * 5.2 + c * 2.1 + T * 0.5) * (10 + k * 28);
      ctx.fillStyle = 'rgba(122,134,150,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* --- 台前地面 --- */
  const gg = ctx.createLinearGradient(0, 532, 0, 566);
  gg.addColorStop(0, 'rgba(26,18,12,0)');
  gg.addColorStop(0.4, 'rgba(20,14,9,0.88)');
  gg.addColorStop(1, 'rgba(9,6,4,0.96)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, 532, 600, 34);

  /* --- 夯土三级台 + 台顶神树 / 主祭 / 火盆（复用关卡内素材） --- */
  drawRitualAltar(292, 552, 0.92, rustK);

  /* --- 台前：玉璋插地（左）、象牙列阶（右） --- */
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.translate(106 + i * 27, 552);
    ctx.rotate(-0.15 + i * 0.12);
    const vg = ctx.createLinearGradient(-7, 0, 7, 0);
    vg.addColorStop(0, 'rgba(48,82,76,0.92)');
    vg.addColorStop(0.45, 'rgba(150,198,178,0.94)');
    vg.addColorStop(1, 'rgba(40,70,64,0.92)');
    ctx.fillStyle = vg;
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(-8, -72); ctx.lineTo(0, -92); ctx.lineTo(8, -72); ctx.lineTo(6, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,192,122,' + (0.20 + 0.22 * burn).toFixed(3) + ')';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(-8, -72); ctx.lineTo(0, -92);
    ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    const ix = 434 + i * 42;
    ctx.strokeStyle = 'rgba(212,194,158,' + (0.30 + 0.20 * burn).toFixed(3) + ')';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(ix - 38, 552);
    ctx.quadraticCurveTo(ix, 526, ix + 42, 550);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,224,172,0.20)';
    ctx.beginPath();
    ctx.moveTo(ix - 34, 549);
    ctx.quadraticCurveTo(ix, 523, ix + 38, 547);
    ctx.stroke();
  }
  ctx.restore();

  /* --- 主角：悬在神树之上的铜面，随「金→锈」渐次变色 --- */
  const hdX = 300;
  const hdY = 212 + Math.sin(T * 0.62) * 6 - rustK * 8;
  const hdR = 46;
  const gR = Math.round(255 + (86 - 255) * rustK);
  const gG = Math.round(190 + (170 - 190) * rustK);
  const gB = Math.round(96 + (130 - 96) * rustK);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(hdX, hdY + 12, hdR * 3.6, 'rgba(' + gR + ',' + gG + ',' + gB + ',' + (0.15 * burn).toFixed(3) + ')');
  radialGlow(hdX, hdY + 12, hdR * 1.9, 'rgba(' + gR + ',' + gG + ',' + gB + ',' + (0.10 * burn).toFixed(3) + ')');
  ctx.restore();

  drawHead(hdX, hdY, hdR, {
    angle: Math.sin(T * 0.5) * 0.05,
    sx: 1, sy: 1, blink: 0, flat: false,
    era: 'ritual', progressK: rustK
  });

  /* --- 火星上升 --- */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const sp = 0.05 + ((i * 37) % 11) / 120;
    const k = (T * sp + i * 0.137) % 1;
    const x = 292 + Math.sin(k * 6.0 + i * 1.7) * (38 + k * 92);
    const y = 520 - k * 382;
    const a = (1 - k) * 0.5 * burn;
    ctx.fillStyle = 'rgba(255,' + (158 + (i % 3) * 28) + ',92,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x, y, 1.2 + (i % 3) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  /* --- 标题 --- */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#f0c684';
  ctx.font = '700 20px "Microsoft YaHei", sans-serif';
  ctx.fillText('燎祭之夜', 90, 178);
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(200,200,180,0.62)';
  ctx.fillText('商代晚期 · 前 1300—1046 · 广汉原野', 90, 198);

  /* --- 底部「金 → 铜锈」进度带：把一眼三千年画成一条线 --- */
  const bx0 = 92, bx1 = 508, by = 590;
  const barG = ctx.createLinearGradient(bx0, 0, bx1, 0);
  barG.addColorStop(0, 'rgba(255,214,130,0.22)');
  barG.addColorStop(0.5, 'rgba(226,178,104,0.20)');
  barG.addColorStop(1, 'rgba(74,154,120,0.22)');
  ctx.fillStyle = barG;
  ctx.fillRect(bx0, by - 1.5, bx1 - bx0, 3);

  const litW = (bx1 - bx0) * rustK;
  if (litW > 0.5) {
    const litG = ctx.createLinearGradient(bx0, 0, bx0 + litW, 0);
    litG.addColorStop(0, 'rgba(255,224,150,0.95)');
    litG.addColorStop(1, 'rgba(120,206,168,0.95)');
    ctx.fillStyle = litG;
    ctx.fillRect(bx0, by - 2.5, litW, 5);
  }

  ctx.beginPath();
  ctx.arc(bx0 + (bx1 - bx0) * rustK, by, 4.6, 0, Math.PI * 2);
  ctx.fillStyle = rustK < 0.5 ? '#ffe2a0' : '#8fd6b4';
  ctx.fill();

  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,220,150,0.85)';
  ctx.fillText('金', bx0, by - 12);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(140,214,180,0.85)';
  ctx.fillText('铜锈', bx1, by - 12);
  ctx.textAlign = 'left';

  // 旁白：三段递进，随 rustK 换句
  const beat = rustK < 0.25
    ? '玉璋插地，象牙列阶；神树在下，火在上。'
    : (rustK < 0.65
      ? '铜脸被祭火一层层镀成琥珀——这一刻，它离神最近。'
      : '而铜绿，正从火的边缘悄悄爬上来。');
  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(214,226,214,' + (0.55 + 0.30 * burn).toFixed(3) + ')';
  ctx.fillText(beat, 92, 616);
}

/* ---------- 左侧：五时代演变过场（熔金 → 祭祀 → 埋藏 → 出土 → 展柜） ---------- */
function drawIntroEvolve() {
  // 背景氛围光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(300, 360, 340, level.theme === 'forge' ? 'rgba(255,140,60,0.20)'
    : level.theme === 'burial' ? 'rgba(140,190,120,0.14)'
    : level.theme === 'dig' ? 'rgba(255,225,160,0.16)'
    : 'rgba(200,220,255,0.14)');
  ctx.restore();

  /* ============ 左侧：面具"金→三千年→青铜锈迹"演变过场动画 ============ */
  // 循环播放：演变 9s（每个时代约 1.8s，看得清金→绿的渐进）→ 停在"展柜之上" 3s → 回到熔金再演一遍
  // 停顿是为了让观众看清终态，也不会觉得"上一轮刚结束下一轮就开"很生硬
  const EVOLVE_DUR = 9.0;
  const EVOLVE_HOLD = 3.0;
  const EVOLVE_CYCLE = EVOLVE_DUR + EVOLVE_HOLD;
  const evolvePhase = stateT % EVOLVE_CYCLE;
  const evolveProgress = Math.min(1, evolvePhase / EVOLVE_DUR);

  let evolveEra;
  if (evolveProgress < 0.20)      evolveEra = 'forge';
  else if (evolveProgress < 0.42) evolveEra = 'ritual';
  else if (evolveProgress < 0.64) evolveEra = 'burial';
  else if (evolveProgress < 0.86) evolveEra = 'dig';
  else                            evolveEra = 'museum';

  // era 边界值：距离最近边界的"过渡强度"——跨越瞬间 halo 最强，随即衰减
  const ERA_BOUNDS = [0.20, 0.42, 0.64, 0.86];
  let nearestBoundaryDist = 1;
  for (const b of ERA_BOUNDS) {
    const d = Math.abs(evolveProgress - b);
    if (d < nearestBoundaryDist) nearestBoundaryDist = d;
  }
  // 过渡带宽度 0.06，超出即视为"稳态"；过渡中 halo 从 1→0 衰减
  const transitionBand = 0.06;
  const transitionK = Math.max(0, 1 - nearestBoundaryDist / transitionBand);

  const evolveLabelMap = {
    forge:  { name: '熔金为器',    t0: '约 前 1600', color: '#ffe0a0' },
    ritual: { name: '祭天通神',    t0: '前 1300—1046', color: '#f0c684' },
    burial: { name: '沉入地底',    t0: '封埋三千年',   color: '#c8d8a0' },
    dig:    { name: '破土重光',    t0: '1986 年',     color: '#c4a884' },
    museum: { name: '展柜之上',    t0: '今日',       color: '#a0c8b0' }
  };

  // 演变时间轴（顶部）
  const tlY = 210, tlX = 90, tlW = 420;
  ctx.strokeStyle = 'rgba(200,180,130,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tlX, tlY);
  ctx.lineTo(tlX + tlW, tlY);
  ctx.stroke();

  for (let i = 0; i < 5; i++) {
    const dx = tlX + i * (tlW / 4);
    const cur = evolveEra === ERA_ORDER[i];
    const past = i < ERA_ORDER.indexOf(evolveEra);
    ctx.beginPath();
    ctx.arc(dx, tlY, cur ? 6 : (past ? 4 : 3), 0, Math.PI * 2);
    ctx.fillStyle = cur ? evolveLabelMap[ERA_ORDER[i]].color
      : (past ? 'rgba(200,180,130,0.7)' : 'rgba(200,200,200,0.22)');
    ctx.fill();
    if (cur) {
      ctx.beginPath();
      ctx.arc(dx, tlY, 10, 0, Math.PI * 2);
      ctx.strokeStyle = evolveLabelMap[ERA_ORDER[i]].color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // 当前演变标签
  const curLbl = evolveLabelMap[evolveEra];
  ctx.textAlign = 'left';
  ctx.fillStyle = curLbl.color;
  ctx.font = '700 18px "Microsoft YaHei", sans-serif';
  ctx.fillText(curLbl.name, tlX, tlY - 18);
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(200,200,180,0.6)';
  ctx.fillText(curLbl.t0, tlX + 100, tlY - 18);

  // 面具本体（居中展示演变）
  const hdX = 300, hdY = 360;
  const hdR = 82;

  // 各 era 底部辉光颜色（RGB 元组），便于在时代边界做线性插值
  const evolveGlowRGB = {
    forge:  [255, 180, 80],
    ritual: [255, 160, 70],
    burial: [140, 180, 120],
    dig:    [220, 200, 150],
    museum: [160, 210, 180]
  };
  const eraOrderIdx = { forge: 0, ritual: 1, burial: 2, dig: 3, museum: 4 };
  // 若正处于两次时代之间的过渡带内，把当前 era 颜色与"下一个 era"颜色按比例插值，避免硬切换
  let curRGB = evolveGlowRGB[evolveEra];
  if (transitionK > 0) {
    // 找到当前 era 在演进序中的下一个（若已是最后则插回"当前"，即无插值）
    const curIdx = eraOrderIdx[evolveEra];
    const nextIdx = Math.min(4, curIdx + 1);
    if (nextIdx !== curIdx) {
      const nextRGB = evolveGlowRGB[ERA_ORDER[nextIdx]];
      const t = transitionK; // 0..1
      curRGB = [
        curRGB[0] + (nextRGB[0] - curRGB[0]) * t,
        curRGB[1] + (nextRGB[1] - curRGB[1]) * t,
        curRGB[2] + (nextRGB[2] - curRGB[2]) * t
      ];
    }
  }
  const glowAlpha = 0.20 + 0.15 * transitionK; // 过渡时略亮
  const glowColor = `rgba(${curRGB[0] | 0},${curRGB[1] | 0},${curRGB[2] | 0},${glowAlpha.toFixed(3)})`;

  // 底部辉光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(hdX, hdY, hdR * 2.6, glowColor);

  // 过渡爆发 halo：跨越时代瞬间，在面具外圈扩散一圈柔和的模糊光晕
  if (transitionK > 0.02) {
    // halo 半径随 transitionK 从 1→0 时向外扩张并淡出
    const haloR = hdR * (1.4 + (1 - transitionK) * 2.2);
    const haloAlpha = transitionK * 0.42;
    // 用径向渐变绘制柔化边缘的模糊光晕
    const haloG = ctx.createRadialGradient(hdX, hdY, hdR * 0.9, hdX, hdY, haloR);
    haloG.addColorStop(0, `rgba(${curRGB[0] | 0},${curRGB[1] | 0},${curRGB[2] | 0},${(haloAlpha * 0.5).toFixed(3)})`);
    haloG.addColorStop(0.6, `rgba(${curRGB[0] | 0},${curRGB[1] | 0},${curRGB[2] | 0},${(haloAlpha * 0.22).toFixed(3)})`);
    haloG.addColorStop(1, `rgba(${curRGB[0] | 0},${curRGB[1] | 0},${curRGB[2] | 0},0)`);
    ctx.fillStyle = haloG;
    ctx.fillRect(hdX - haloR, hdY - haloR, haloR * 2, haloR * 2);

    // 过渡瞬间的"金光飞尘"—— 沿 halo 圆周散布的小粒子，增强"时代翻篇"的仪式感
    const sparkCount = 10;
    for (let i = 0; i < sparkCount; i++) {
      const seed = i * 73.31 + 91.2;
      const ang = (i / sparkCount) * Math.PI * 2 + stateT * 0.3;
      const sR = haloR * (0.75 + (i % 3) * 0.08);
      const px = hdX + Math.cos(ang) * sR;
      const py = hdY + Math.sin(ang) * sR * 0.85;
      const twinkle = 0.5 + 0.5 * Math.sin(stateT * 3 + seed);
      const sAlpha = transitionK * (0.20 + 0.35 * twinkle);
      ctx.fillStyle = `rgba(${curRGB[0] | 0},${curRGB[1] | 0},${curRGB[2] | 0},${sAlpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(px, py, 1.4 + twinkle * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  drawHead(hdX, hdY, hdR, {
    angle: 0, sx: 1, sy: 1, blink: 0, flat: false, era: evolveEra
  });

  // 底部时间轴标签（当前 era 高亮）
  const tlY2 = 500;
  ctx.textAlign = 'center';
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  const eraTicks = [
    { x: tlX,             era: 'forge',  yr: '约前1600' },
    { x: tlX + tlW * 0.25, era: 'ritual', yr: '前1300—1046' },
    { x: tlX + tlW * 0.5,  era: 'burial', yr: '三千年' },
    { x: tlX + tlW * 0.75, era: 'dig',    yr: '1986' },
    { x: tlX + tlW,        era: 'museum', yr: '今日' }
  ];
  for (const tk of eraTicks) {
    const cur = tk.era === evolveEra;
    ctx.fillStyle = cur ? evolveLabelMap[tk.era].color : 'rgba(200,200,180,0.35)';
    ctx.font = cur ? '700 12px "Microsoft YaHei", sans-serif'
                   : '11px "Microsoft YaHei", sans-serif';
    ctx.fillText(tk.era, tk.x, tlY2);
    ctx.fillStyle = cur ? 'rgba(230,220,180,0.85)' : 'rgba(180,180,160,0.35)';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillText(tk.yr, tk.x, tlY2 + 14);
  }
}

/* ================= 通关 ================= */
function drawClear() {
  ctx.fillStyle = 'rgba(4,9,8,0.86)';
  ctx.fillRect(0, 0, W, H);

  // 金色粒子上升：通关时的"金尘归位"意象
  // 确定性种子 + 按 stateT 推进，进入本页即开始上升；无状态
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const PART = 60;
  const localT = stateT; // 通关页内从 0 开始计时
  for (let i = 0; i < PART; i++) {
    const seed = i * 73.31 + 42.1;
    const laneX = (i * 97.13) % W;
    // 竖向速度略有差异，形成错落上升的层次感
    const speed = 22 + ((i * 13) % 30); // 22..52 px/s
    const riseT = (localT * speed + seed * 5.0) % (H + 80);
    const x = laneX + Math.sin(localT * 0.6 + seed * 0.35) * 18;
    const y = H + 30 - riseT; // 从底往上走
    if (y < -20) continue;
    // 顶部渐隐、底部渐隐：只在中间段亮起来
    const lifeT = Math.min(1, riseT / 200) * Math.min(1, (H + 40 - riseT) / 200);
    const twinkle = 0.5 + 0.5 * Math.sin(localT * 2.2 + seed);
    const alpha = lifeT * (0.18 + 0.30 * twinkle);
    const sz = 1.0 + ((i * 17) % 100) / 100 * 1.8;
    ctx.fillStyle = `rgba(255,220,140,${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 中心金色呼吸光：呼应"金面具归位"
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const pulseR = 260 + Math.sin(localT * 1.6) * 20;
  const g = ctx.createRadialGradient(W / 2, 320, 20, W / 2, 320, pulseR);
  g.addColorStop(0, 'rgba(255,220,140,0.14)');
  g.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#f4e4b8';
  ctx.font = '700 46px "Microsoft YaHei", serif';
  ctx.shadowColor = 'rgba(255,210,120,0.55)';
  ctx.shadowBlur = 12;
  ctx.fillText('第 ' + (levelIdx + 1) + ' 关 · 通过', W / 2, 300);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(200,230,215,0.8)';
  ctx.font = '18px "Microsoft YaHei", sans-serif';
  ctx.fillText(level.line, W / 2, 356);

  // 本关 / 最佳用时（右侧一行，克制风格）
  const bestNow = saveData.bestTime[levelIdx] || 0;
  const isBest = bestNow > 0 && Math.abs(bestNow - lastLevelTime) < 0.05;
  ctx.font = '600 17px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText('本关用时  ' + fmtTime(lastLevelTime), W / 2 - 130, 392);
  ctx.fillStyle = isBest ? '#ffd060' : 'rgba(220,220,190,0.7)';
  ctx.fillText('最佳用时  ' + fmtTime(bestNow), W / 2 + 130, 392);
  if (isBest) {
    ctx.font = '600 14px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,220,140,0.9)';
    ctx.fillText('★ 新纪录', W / 2 + 240, 392);
  }

  // 时代徽章进度条：本关在链条中的位置（5 段）
  if (typeof ERA_ORDER !== 'undefined' && typeof ERA !== 'undefined') {
    const y5 = 400;
    const total = ERA_ORDER.length;
    const pad = 110;
    const cx0 = W / 2 - pad * (total - 1) / 2;
    const eraDotColors = {
      forge:  '#ffd060',
      ritual: '#e0a050',
      burial: '#9ac884',
      dig:    '#a89878',
      museum: '#98c8b0'
    };
    // 进度连线
    ctx.strokeStyle = 'rgba(200,180,140,0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx0, y5);
    ctx.lineTo(cx0 + pad * (total - 1), y5);
    ctx.stroke();
    for (let i = 0; i < total; i++) {
      const x = cx0 + i * pad;
      const done = i < levelIdx;
      const cur  = i === levelIdx;
      const col  = eraDotColors[ERA_ORDER[i]] || '#ffffff';
      // 高亮填充：已通过的段
      if (i < levelIdx) {
        ctx.strokeStyle = 'rgba(255,220,140,0.55)';
        ctx.beginPath();
        ctx.moveTo(cx0 + (i - 1) * pad + 6, y5);
        ctx.lineTo(x - 6, y5);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(x, y5, cur ? 7 : 5, 0, Math.PI * 2);
      ctx.fillStyle = cur ? col : (done ? 'rgba(255,220,140,0.55)' : 'rgba(200,180,140,0.30)');
      ctx.fill();
      if (cur) {
        ctx.strokeStyle = 'rgba(255,240,190,0.9)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y5, 11 + Math.sin(tGlobal * 4) * 1.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = cur ? '#f4e4b8' : 'rgba(220,200,150,0.65)';
      ctx.font = (cur ? '600 12px' : '11px') + ' "Microsoft YaHei", sans-serif';
      ctx.fillText(ERA[ERA_ORDER[i]].label, x, y5 + 24);
    }
  }

  ctx.fillStyle = `rgba(255,240,190,${0.5 + 0.5 * Math.sin(tGlobal * 3)})`;
  ctx.font = '600 19px "Microsoft YaHei", sans-serif';
  ctx.fillText(levelIdx < LEVELS.length - 1 ? '按 空格 进入下一关' : '按 空格 走向结局', W / 2, 470);
}

/* ================= 结局 ================= */
function drawEnding() {
  const bg = ctx.createRadialGradient(W / 2, 340, 60, W / 2, 340, 700);
  bg.addColorStop(0, '#0d211b');
  bg.addColorStop(1, '#040807');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(W / 2, 300, 240, 'rgba(255,215,130,0.13)');
  ctx.restore();
  // 标题说"三千年前它是一张金面具"，主图就用熔金皮相，且只取器物本体（不带海报底板）
  drawArtifactEra(W / 2, 292, 330, 'forge', 0.98);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#efdba6';
  ctx.font = '700 44px "Microsoft YaHei", serif';
  ctx.fillText('三千年前，它是一张金面具', W / 2, 490);

  ctx.fillStyle = 'rgba(225,205,160,0.90)';
  ctx.font = '19px "Microsoft YaHei", serif';
  ctx.fillText('三千年后，铜身绿锈里，藏着那一瞬的金光。', W / 2, 524);

  // 5 皮肤剪影：面具在三个千年里穿过的 5 种"皮"
  // 熔铸=金水滴, 祭祀=铜身金光, 掩埋=绿锈剥金, 出土=黄土蒙尘, 展柜=残光完整
  // 每张都走 drawArtifactEra：同一件器物，五种 filter + 材质层，颜色必须真的不一样
  ctx.textAlign = 'center';
  const SIL_Y = 570;
  const SIL_PAD = 150;
  const silH = [58, 62, 64, 60, 58];
  const silGlow = [
    'rgba(255,206,88,0.34)',
    'rgba(226,160,70,0.24)',
    'rgba(90,150,110,0.20)',
    'rgba(150,132,96,0.15)',
    'rgba(110,182,158,0.22)'
  ];
  const silLabels = ['熔金·金水滴', '铜身·金光', '绿锈剥金', '黄土蒙尘', '展柜残光'];
  for (let i = 0; i < 5; i++) {
    const cx = W / 2 + (i - 2) * SIL_PAD;
    const eraName = ERA_ORDER[i];
    const dh = silH[i];
    // 时代底色光晕：熔金最烫，往后转冷、转暗，最后在展柜里再亮一点
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    radialGlow(cx, SIL_Y, dh * 1.35, silGlow[i]);
    ctx.restore();
    drawArtifactEra(cx, SIL_Y, dh, eraName, 0.97);
    // 阶段色小圆点
    ctx.beginPath();
    ctx.arc(cx, SIL_Y - dh / 2 - 8, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = ART_ERA[eraName].dot;
    ctx.fill();
    ctx.fillStyle = 'rgba(220,200,150,0.72)';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillText(silLabels[i], cx, SIL_Y + dh / 2 + 16);
  }

  // 五行时间徽章已由上方"5 皮肤剪影"表达，不再重复渲染。

  ctx.fillStyle = 'rgba(150,180,170,0.55)';
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillText('文化依据：商代（前1600—前1046）；1986 年四川广汉三星堆二号祭祀坑出土；三星堆博物馆藏。', W / 2, 640);
  ctx.fillText('艺术想象声明：铸造、祭祀、掩埋等情节为艺术演绎，非考古复原；造型依据馆方展签与展览海报二次创作。', W / 2, 660);

  ctx.fillStyle = `rgba(255,240,190,${0.5 + 0.5 * Math.sin(tGlobal * 3)})`;
  ctx.font = '600 17px "Microsoft YaHei", sans-serif';
  ctx.fillText('按 空格 重新开始', W / 2, 700);
}

/* ================= 渲染 ================= */
function render() {
  if (state === 'title') { drawTitle(); drawPatina(); drawVignette(); drawFrame(); drawSoundBtn(); return; }
  if (state === 'levelSelect') { drawLevelSelect(); drawPatina(); drawVignette(); drawFrame(); drawSoundBtn(); return; }
  if (state === 'ending') { drawEnding(); drawPatina(); drawVignette(); drawFrame(); drawSoundBtn(); return; }

  ctx.save();
  if (shakeT > 0) {
    const m = shakeT * 26;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  // P2.1 终点穿越镜头：以门心为缩放中心，scale 从 1 → 2.4 推近，
  // 让"推门进入"由整个场景一起缩放完成，而不是仅绘制一个高亮矩形。
  // easeInOutQuad 使推进既非线性突刺、也不线性匀速（后者视觉偏"匀速拉焦"）。
  if (state === 'entering') {
    const gx = level.goal.x - cam.x, gy = level.goal.y - 86;
    const zoomT = clamp((stateT - 0.20) / 1.10, 0, 1);
    const _e = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    const sc = 1 + _e(zoomT) * 1.4;
    ctx.translate(gx, gy);
    ctx.scale(sc, sc);
    ctx.translate(-gx, -gy);
  }

  drawBackground(level.theme);
  drawCultureLayer(level.theme);
  drawAmbientDust();
  drawArtifactGhost(0.045, H * 1.05, level.width * 0.16);
  drawArtifactGhost(0.032, H * 0.80, level.width * 0.60);
  drawPlatforms();
  drawHazards();
  drawGoal();
  drawMotes();
  drawPlayer();
  ctx.restore();

  drawPatina();
  drawVignette();
  drawFrame();

  if (hurtFlash > 0) {
    ctx.fillStyle = `rgba(190,40,30,${Math.min(0.5, hurtFlash * 0.55)})`;
    ctx.fillRect(0, 0, W, H);
  }

  drawHUD();
  drawSubtitle();
  drawTutHint();   // P0.4：仅第 1 关播放时可能可见
  drawTouch();     // P0.5：触屏虚拟键（仅在启用触屏后显示）

  if (state === 'intro') drawIntro();
  if (state === 'clear') drawClear();
  if (state === 'entering') drawEnterCrossing();

  // 暂停覆盖层：遮罩在最上层，暂停按钮在遮罩之上（点击仍能命中）
  drawPause();
  drawPauseBtn();
  drawExit();
  drawSoundBtn();
}

/* ================= 主循环 ================= */
let last = performance.now();
let acc = 0;

function frame(now) {
  const raw = (now - last) / 1000;
  last = now;
  const dt = Math.min(raw, 0.05);
  tGlobal += dt;
  stateT += dt;
  if (player.goldFlash > 0) player.goldFlash = Math.max(0, player.goldFlash - dt);

  gatherInput();

  // 音频可能被浏览器挂起（切标签页后也会挂起），一旦有过交互就自动恢复
  if (audioStarted && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  // 每帧根据当前状态推送紧张度给氛围音系统
  updateAmbience(dt);

  // 非 play 状态自动清暂停标志（切到 clear/ending/intro 时不该带 paused 过去）
  if (state !== 'play') paused = false;

  // Esc / 手柄背键：play 状态下切换暂停；其他状态回标题
  if (state === 'play' && (pressed.has('Escape') || pressed.has('KeyP') || pad.backEdge)) {
    togglePause();
  } else if (state !== 'title' && (pressed.has('Escape') || pad.backEdge)) {
    toTitle();
  }

  // 静音开关（M 键，任意状态）
  if (pressed.has('KeyM')) toggleMute();

  if (state === 'title') {
    // Tab 键：进入选关；空格 / Enter / 手柄：直接开始第 1 关
    if (pressed.has('Tab')) {
      state = 'levelSelect'; stateT = 0; sfxBack();
    } else if (input.startEdge) {
      levelStart(0);
    }
  } else if (state === 'levelSelect') {
    // Esc 由上方通用分支处理回 title；这里只处理选关内部按键
    for (let i = 0; i < 5; i++) {
      if (pressed.has('Digit' + (i + 1))) { levelStart(i); break; }
    }
    if (pressed.has('Tab')) {
      // 循环切换焦点：以鼠标最接近的卡片为起点，向右移动
      let idx = 0, minD = Infinity;
      for (let i = 0; i < 5; i++) {
        const b = LEVEL_BTNS[i];
        const d = Math.abs(b.x + b.w / 2 - mouse.x) + Math.abs(b.y + b.h / 2 - mouse.y);
        if (d < minD) { minD = d; idx = i; }
      }
      idx = (idx + 1) % 5;
      const nb = LEVEL_BTNS[idx];
      mouse.x = nb.x + nb.w / 2; mouse.y = nb.y + nb.h / 2;
    }
    if (input.startEdge) {
      // 空格 / Enter / 手柄确认：若鼠标悬停在某卡片则进该关，否则默认第 1 关
      let chosen = -1;
      for (let i = 0; i < 5; i++) if (inLevelBtn(mouse, i)) { chosen = i; break; }
      if (chosen >= 0) levelStart(chosen); else levelStart(0);
    }
  } else if (state === 'intro') {
    // 不再要求 stateT 阈值：过场刚出现的瞬间按键也会被接受，避免"按了没反应"
    if (input.startEdge) { state = 'play'; stateT = 0; acc = 0; levelStartT = tGlobal; }
  } else if (state === 'play') {
    if (pressed.has('KeyR') && !paused) respawn();
    if (!paused) {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 10 && state === 'play') { step(STEP); acc -= STEP; }
      if (state !== 'play') acc = 0;
      // 粒子更新
      for (const b of burst) {
        b.life -= dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.vy += 420 * dt;
      }
      updateTutHints(dt);   // P0.4：教学提示跟随玩家 x 触发
    }
  } else if (state === 'entering') {
    // P2.1 穿越动画播完自动切 clear（无需按键）；sfxClear 在此刻响起
    if (stateT >= ENTERING_DUR) {
      state = 'clear'; stateT = 0; sfxClear();
    }
  } else if (state === 'clear') {
    if (input.startEdge) {
      if (levelIdx < LEVELS.length - 1) {
        levelStart(levelIdx + 1);
      } else {
        state = 'ending'; stateT = 0; sfxClear();
      }
    }
  } else if (state === 'ending') {
    if (input.startEdge && stateT > 0.3) { state = 'title'; stateT = 0; }
  }

  pressed.clear();
  render();
  requestAnimationFrame(frame);
}

loadLevel(0);
state = 'title';
requestAnimationFrame(frame);
</script>
