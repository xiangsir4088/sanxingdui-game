        ctx.moveTo(-5, 0); ctx.lineTo(-7, -78); ctx.lineTo(0, -96);
        ctx.lineTo(7, -78); ctx.lineTo(5, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(190,230,214,0.16)';
        ctx.lineWidth = 1; ctx.stroke();
        ctx.restore();
        // 土堆（插孔处被翻起）
        ctx.fillStyle = 'rgba(52,38,25,0.55)';
        ctx.beginPath();
        ctx.ellipse(x, 616, 17, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === 1) {
        // 象牙：平放于阶前，弯成弧
        ctx.save();
        ctx.strokeStyle = 'rgba(214,196,160,0.30)';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - 46, 610);
        ctx.quadraticCurveTo(x, 586, x + 50, 606);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,238,204,0.14)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 44, 606);
        ctx.quadraticCurveTo(x, 583, x + 48, 602);
        ctx.stroke();
        ctx.restore();
      } else {
        // 陶尊：敞口高圈足，肩上两道弦纹
        ctx.fillStyle = 'rgba(96,66,42,0.42)';
        ctx.beginPath();
        ctx.moveTo(x - 15, 578); ctx.lineTo(x + 15, 578);
        ctx.quadraticCurveTo(x + 13, 600, x + 8, 606);
        ctx.lineTo(x + 12, 614); ctx.lineTo(x - 12, 614);
        ctx.lineTo(x - 8, 606);
        ctx.quadraticCurveTo(x - 13, 600, x - 15, 578);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(190,148,96,0.22)';
        ctx.lineWidth = 1.2;
        for (const yy of [586, 592]) {
          ctx.beginPath(); ctx.moveTo(x - 13, yy); ctx.lineTo(x + 13, yy); ctx.stroke();
        }
      }
    }
  })();

  // ---------- ② 祭祀祭坛：三级夯土台，台顶神树 + 主祭（视差 0.46） ----------
  // 不再是"每隔 860px 重复一棵树"，而是两座真实的坛——把散落的剪影收成场所。
  (function altars() {
    const par = 0.46;
    const p = levelProgress();
    for (const ax of [520, 1780]) {
      const x = ax - cam.x * par;
      if (x < -460 || x > W + 460) continue;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      radialGlow(x, 380, 360, 'rgba(255,146,58,0.11)');
      ctx.restore();
      drawRitualAltar(x, 626, 1.32, p);
    }
  })();

  // ---------- ③ 三足铜火盆：沿祭祀甬道排开，光把人引向祭坛（视差 0.60） ----------
  (function fireBasins() {
    const par = 0.60, step = 300;
    const off = (cam.x * par) % step;
    for (let i = -1; i <= Math.ceil(W / step) + 1; i++) {
      const x = i * step - off + 120;
      if (x < -130 || x > W + 130) continue;
      const by = 604;
      const fl = 0.72 + 0.28 * Math.sin(tGlobal * 5.6 + i * 2.1);
      // 盆体（敞口三足铜盆）
      ctx.fillStyle = 'rgba(24,19,14,0.96)';
      ctx.beginPath();
      ctx.moveTo(x - 30, by - 24);
      ctx.quadraticCurveTo(x, by - 5, x + 30, by - 24);
      ctx.lineTo(x + 24, by - 29);
      ctx.lineTo(x - 24, by - 29);
      ctx.closePath();
      ctx.fill();
      // 三足
      for (const dx of [-17, 0, 17]) ctx.fillRect(x + dx - 2, by - 8, 4, 9);
      // 盆沿（铜质被火映红）
      ctx.fillStyle = 'rgba(168,112,54,0.40)';
      ctx.fillRect(x - 30, by - 30, 60, 3);
      // 盆火
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      radialGlow(x, by - 42, 80 * fl, 'rgba(255,132,44,0.18)');
      radialGlow(x, by - 46, 40 * fl, 'rgba(255,196,110,0.24)');
      for (let k = 0; k < 3; k++) {
        const fh = (17 + k * 8) * fl;
        const fx2 = x + (k - 1) * 9 + Math.sin(tGlobal * 3.4 + i + k) * 3;
        const fg = ctx.createLinearGradient(0, by - 30 - fh, 0, by - 28);
        fg.addColorStop(0, 'rgba(255,246,200,0)');
        fg.addColorStop(0.45, 'rgba(255,196,96,0.52)');
        fg.addColorStop(1, 'rgba(255,120,40,0.62)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(fx2, by - 30 - fh);
        ctx.quadraticCurveTo(fx2 + 7, by - 34, fx2 + 5, by - 28);
        ctx.lineTo(fx2 - 5, by - 28);
        ctx.quadraticCurveTo(fx2 - 7, by - 34, fx2, by - 30 - fh);
        ctx.fill();
      }
      ctx.restore();
    }
  })();

  // ---------- ④ 跪拜队列：主祭已在坛上，这里只留台下的信众（视差 0.74） ----------
  (function ritualQueue() {
    const par = 0.74, step = 520;
    const off = (cam.x * par) % step;
    for (let i = -1; i <= Math.ceil(W / step) + 1; i++) {
      const x = i * step - off + 210;
      if (x < -150 || x > W + 150) continue;
      {
        // 跪拜者三名成列：俯身、双手高举捧着祭器，被火从背后勾出轮廓
        for (let k = 0; k < 3; k++) {
          const kx = x + k * 58;
          const lean = 0.10 + 0.07 * Math.sin(tGlobal * 0.9 + i + k);
          ctx.save();
          ctx.translate(kx, 604);
          ctx.rotate(lean);
          ctx.shadowColor = 'rgba(255,150,70,0.50)';
          ctx.shadowBlur = 18;
          ctx.fillStyle = 'rgba(4,6,10,0.96)';
          // 头（俯下去，压得很低）
          ctx.beginPath();
          ctx.ellipse(0, -40, 13, 15, 0, 0, Math.PI * 2);
          ctx.fill();
          // 俯身的长袍背脊
          ctx.beginPath();
          ctx.moveTo(-13, -34);
          ctx.quadraticCurveTo(-24, -8, -30, 0);
          ctx.lineTo(26, 0);
          ctx.quadraticCurveTo(22, -14, 14, -34);
          ctx.closePath();
          ctx.fill();
          // 高举的双手（捧祭器）
          ctx.strokeStyle = 'rgba(4,6,10,0.96)';
          ctx.lineWidth = 4.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-11, -34); ctx.lineTo(-20, -50); ctx.lineTo(-14, -58);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(11, -34); ctx.lineTo(20, -50); ctx.lineTo(14, -58);
          ctx.stroke();
          // 手中捧着的玉璧（一圈被火照亮的细环）
          ctx.shadowBlur = 12;
          ctx.shadowColor = 'rgba(190,235,220,0.55)';
          ctx.strokeStyle = 'rgba(150,200,184,0.42)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, -64, 7, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  })();

  // ---------- ⑤ 燎祭大火（世界坐标，位于关卡末段） ----------
  const fireX = 2300 - cam.x;
  if (fireX > -420 && fireX < W + 420) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    radialGlow(fireX, 560, 360, 'rgba(255,140,50,0.17)');
    for (let i = 0; i < 4; i++) {
      const f = 0.7 + 0.3 * Math.sin(tGlobal * 4 + i * 1.7);
      radialGlow(fireX + Math.sin(tGlobal * 2 + i) * 24, 598 - i * 20, 96 * f,
        `rgba(255,${150 - i * 26},64,0.30)`);
    }
    ctx.restore();
    // 柴堆（燎祭的柴薪，斜插成交叉状）
    ctx.strokeStyle = 'rgba(14,10,8,0.95)';
    ctx.lineWidth = 7;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(fireX + i * 22, 620);
      ctx.lineTo(fireX + i * 10 + Math.sin(i) * 8, 578);
      ctx.stroke();
    }
    // 烟柱
    ctx.save();
    for (let i = 0; i < 7; i++) {
      const sy = 520 - i * 62 - (tGlobal * 15 % 62);
      const sx = fireX + Math.sin(tGlobal * 0.7 + i) * (30 + i * 14);
      ctx.fillStyle = `rgba(120,110,110,${0.05 + i * 0.011})`;
      ctx.beginPath();
      ctx.ellipse(sx, sy, 84 + i * 20, 44 + i * 13, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- ⑥ 上升火星（从整片火盆上方飘起） ----------
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 54; i++) {
    const lane = (i * 173.7) % (W + 200) - 100;
    const sp = 26 + (i % 7) * 13;
    const rise = (tGlobal * sp + i * 97.3) % 560;
    const px = lane + Math.sin(tGlobal * 1.1 + i) * 26;
    const py = 596 - rise;
    const a = Math.max(0, 0.55 * (1 - rise / 540)) * (0.5 + 0.5 * Math.abs(Math.sin(tGlobal * 3.6 + i)));
    ctx.fillStyle = `rgba(255,${150 + (i % 6) * 15},72,${a})`;
    ctx.fillRect(px, py, 2, 2);
  }
  ctx.restore();

  // ---------- ⑦ 时间开始侵蚀：越靠近终点，铜绿越浓 ----------
  // 这是"金 → 锈"的转折点：火镀出的琥珀色，正被时间悄悄换成孔雀绿。
  const p = levelProgress();
  if (p > 0.42) {
    const k = (p - 0.42) / 0.58;
    ctx.save();
    const vg = ctx.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0, `rgba(70,140,110,${0.04 * k})`);
    vg.addColorStop(0.6, `rgba(60,150,110,${0.12 * k})`);
    vg.addColorStop(1, `rgba(38,118,88,${0.20 * k})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// 掩埋：土层、落尘、锈色藤蔓
function bgBurial() {
  drawSky('burial');
  // 土层分层
  for (let i = 0; i < 7; i++) {
    const y0 = 120 + i * 78;
    const a = 0.06 + i * 0.02;
    ctx.fillStyle = `rgba(${90 + i * 8},${68 + i * 6},${40 + i * 4},${a})`;
    ctx.beginPath();
    ctx.moveTo(0, y0);
    for (let x = 0; x <= W; x += 60) {
      ctx.lineTo(x, y0 + Math.sin((x + cam.x * 0.35) * 0.006 + i) * 14);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();
  }
  // 锈色藤蔓
  ctx.save();
  ctx.strokeStyle = 'rgba(90,170,120,0.16)';
  ctx.lineWidth = 3;
  for (let k = 0; k < 5; k++) {
    ctx.beginPath();
    const baseX = 120 + k * 260 - (cam.x * 0.4 % 260);
    ctx.moveTo(baseX, H);
    for (let i = 1; i <= 6; i++) {
      ctx.lineTo(baseX + Math.sin(i * 1.4 + tGlobal * 0.3 + k) * 26, H - i * 70);
    }
    ctx.stroke();
  }
  ctx.restore();
  // 落尘
  for (let i = 0; i < 50; i++) {
    const seed = i * 91.7;
    const px = ((seed * 5 + tGlobal * 8) % (W + 100)) - 50;
    const py = (tGlobal * (18 + (i % 4) * 9) + seed * 11) % H;
    ctx.fillStyle = `rgba(210,180,130,${0.10 + (i % 3) * 0.05})`;
    ctx.fillRect(px, py, 2, 2);
  }
}

// 发掘：探方剖面——地表层 + 考古人员 + 坑壁（夯土/生土/石铺）+ 探方口光
function bgDig() {
  // 天空/地表层（顶部 0~95px 是地表，能看到考古人员在坑外）
  const surfG = ctx.createLinearGradient(0, 0, 0, 100);
  surfG.addColorStop(0, '#c4a878');   // 阳光下的黄土
  surfG.addColorStop(1, '#7a5c36');   // 地表向下过渡
  ctx.fillStyle = surfG;
  ctx.fillRect(0, 0, W, 100);

  // 地表细节：草斑、土疙瘩、探方边缘绳线
  ctx.fillStyle = 'rgba(90,120,60,0.35)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 71 - cam.x * 0.4) % (W + 40);
    ctx.fillRect(((x % (W + 40)) + W + 40) % (W + 40) - 20, 40 + (i % 3) * 8, 8, 3);
  }

  // 探方框（考古现场用红绳/木桩围起来的方坑）
  ctx.strokeStyle = 'rgba(160,60,50,0.55)';   // 红绳警戒线
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 6]);
  ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(W, 96); ctx.stroke();
  ctx.setLineDash([]);
  // 木桩
  for (let i = -1; i < 14; i++) {
    const x = i * 130 - (cam.x * 0.9 % 130);
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(x, 88, 6, 16);
    ctx.fillStyle = 'rgba(255,220,180,0.5)';
    ctx.fillRect(x, 88, 6, 3);
  }

  // ---- 背景层不做考古员，实际考古员由 drawDigGroundMarkers 画在平台层 ----

  // ---- 坑内壁（95 ~ 175 的过渡：从地表进入坑内，土色渐变到深色）----
  const wallG = ctx.createLinearGradient(0, 95, 0, 200);
  wallG.addColorStop(0, '#7a5c36');
  wallG.addColorStop(0.4, '#4a3420');
  wallG.addColorStop(1, '#2a1e12');
  ctx.fillStyle = wallG;
  ctx.fillRect(0, 95, W, 105);

  // ---- 主坑体（200~720）：分层黄土，从上到下逐渐更深 ----
  // 第 1 层：耕土（松散、有草根）
  const l1 = ctx.createLinearGradient(0, 175, 0, 380);
  l1.addColorStop(0, '#3a2818'); l1.addColorStop(1, '#2a1e12');
  ctx.fillStyle = l1; ctx.fillRect(0, 175, W, 205);

  // 第 2 层：夯土（更紧、颜色偏红褐）
  const l2 = ctx.createLinearGradient(0, 380, 0, 560);
  l2.addColorStop(0, '#3a2416'); l2.addColorStop(1, '#241812');
  ctx.fillStyle = l2; ctx.fillRect(0, 380, W, 180);

  // 第 3 层：生土（最深、暗褐）
  const l3 = ctx.createLinearGradient(0, 560, 0, H);
  l3.addColorStop(0, '#2a1a10'); l3.addColorStop(1, '#160e08');
  ctx.fillStyle = l3; ctx.fillRect(0, 560, W, H - 560);

  // ---- 探方坑壁的层位编号牌（第1层/第2层/第3层，沿坑壁左侧贴）----
  const stratLabels = [
    { y: 175, txt: '第①层 耕土' },
    { y: 380, txt: '第②层 夯土' },
    { y: 560, txt: '第③层 生土' }
  ];
  for (const sl of stratLabels) {
    // 沿坑壁每隔 700px 出现一次（跟随摄像机轻微视差）
    const spacing = 700;
    const startOff = -((cam.x * 0.85) % spacing);
    for (let ox = startOff; ox < W + spacing; ox += spacing) {
      const bx = ox + 30;
      const by = sl.y + 8;
      // 木牌（浅木色 + 黑框）
      ctx.fillStyle = '#d8c088';
      ctx.fillRect(bx, by, 72, 18);
      ctx.strokeStyle = '#3a2818';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, 71, 17);
      // 编号文字
      ctx.fillStyle = '#1a0a00';
      ctx.font = 'bold 10px Consolas, monospace';
      ctx.textBaseline = 'middle';
      ctx.fillText(sl.txt, bx + 4, by + 10);
      // 挂绳（从坑壁顶端一根细绳垂下来）
      ctx.strokeStyle = 'rgba(30,20,10,0.6)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(bx + 36, sl.y);
      ctx.lineTo(bx + 36, by);
      ctx.stroke();
    }
  }

  // ---- 坑壁的完整测绘绳网：白绳横贯整个坑壁 + 竹桩阵列 ----
  // 竹桩沿坑壁左侧（画面边缘）立一排，形成"探方四角桩"的延伸感
  const poleSpacing = 180;
  const poleStart = -((cam.x * 0.85) % poleSpacing);
  // 坑壁顶部沿（y=175 位置）立竹桩
  for (let px = poleStart - 20; px < W + 20; px += poleSpacing) {
    // 竹桩本体（黄色 + 竹节）
    const gPole = ctx.createLinearGradient(px, 0, px + 5, 0);
    gPole.addColorStop(0, '#a88850');
    gPole.addColorStop(0.5, '#c8a868');
    gPole.addColorStop(1, '#7a5c30');
    ctx.fillStyle = gPole;
    ctx.fillRect(px, 172, 5, 40);
    // 竹节
    ctx.fillStyle = '#5c4020';
    for (let ny = 178; ny < 208; ny += 8) {
      ctx.fillRect(px, ny, 5, 1);
    }
  }
  // 右侧同间距也立一排（形成探方两端桩阵）
  const poleSpacingR = 220;
  const poleStartR = -((cam.x * 0.85) % poleSpacingR);
  for (let px = poleStartR; px < W + 20; px += poleSpacingR) {
    const gPole = ctx.createLinearGradient(px, 0, px + 5, 0);
    gPole.addColorStop(0, '#8a6a38');
    gPole.addColorStop(0.5, '#b0905a');
    gPole.addColorStop(1, '#6a4c20');
    ctx.fillStyle = gPole;
    ctx.fillRect(px, 174, 4, 36);
    ctx.fillStyle = '#5c4020';
    for (let ny = 180; ny < 206; ny += 8) {
      ctx.fillRect(px, ny, 4, 1);
    }
  }

  // 横向白绳：从坑壁左侧一路延伸到右侧（探方测绘横线）
  ctx.strokeStyle = 'rgba(255,248,220,0.32)';
  ctx.lineWidth = 1.2;
  // 主横线：坑壁顶沿（探方边界）
  ctx.beginPath();
  ctx.moveTo(0, 172);
  ctx.lineTo(W, 172);
  ctx.stroke();
  // 副横线：往坑内每 60px 一根（探方分层横线）
  ctx.strokeStyle = 'rgba(255,240,200,0.14)';
  ctx.lineWidth = 0.8;
  for (let yy = 232; yy < 560; yy += 60) {
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(W, yy);
    ctx.stroke();
  }
  // 竖直白绳：从坑壁顶到底（探方纵线，间距 200px）
  ctx.strokeStyle = 'rgba(255,240,200,0.16)';
  ctx.lineWidth = 1;
  const vSpacing = 200;
  const vStart = -((cam.x * 0.85) % vSpacing);
  for (let vx = vStart; vx < W + vSpacing; vx += vSpacing) {
    ctx.beginPath();
    ctx.moveTo(vx, 172);
    ctx.lineTo(vx, 560);
    ctx.stroke();
  }

  // ---- 土层交界线（考古学上明显的"层位"分界）----
  for (const y of [175, 380, 560]) {
    ctx.strokeStyle = 'rgba(90,70,40,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    // 微起伏让分界更自然
    ctx.strokeStyle = 'rgba(120,90,50,0.25)';
    ctx.beginPath();
    for (let x = 0; x < W; x += 20) {
      const yy = y + Math.sin(x * 0.02 + y) * 2;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  // ---- 坑壁上的洛阳铲手铲：几把工具散在坑壁上 ----
  for (let i = 0; i < 3; i++) {
    const sx = ((i * 640 - cam.x * 0.85) % (W + 400) + W + 400) % (W + 400) - 200;
    if (sx < -40 || sx > W + 40) continue;
    const sy = 500 + i * 30;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-0.5);
    // 木柄
    const hG = ctx.createLinearGradient(0, 0, 0, 22);
    hG.addColorStop(0, '#7a5830');
    hG.addColorStop(1, '#4a3018');
    ctx.fillStyle = hG;
    ctx.fillRect(-2, 0, 4, 22);
    // 铲头
    const bG = ctx.createLinearGradient(-9, 0, 9, 0);
    bG.addColorStop(0, '#4a4a52');
    bG.addColorStop(0.5, '#7a7a82');
    bG.addColorStop(1, '#2a2a32');
    ctx.fillStyle = bG;
    ctx.beginPath();
    ctx.moveTo(-9, 22);
    ctx.lineTo(9, 22);
    ctx.lineTo(6, 32);
    ctx.lineTo(-6, 32);
    ctx.closePath();
    ctx.fill();
    // 锈痕
    ctx.fillStyle = 'rgba(120,60,20,0.5)';
    ctx.fillRect(-7, 24, 14, 2);
    ctx.restore();
  }

  // ---- 土层里的碎片点缀（陶片、骨头、石子）----
  for (let i = 0; i < 55; i++) {
    const seed = i * 41.7;
    const yBand = seed % 3;
    const yMin = yBand === 0 ? 200 : yBand === 1 ? 400 : 580;
    const yMax = yBand === 0 ? 370 : yBand === 1 ? 550 : 700;
    const px = ((seed * 37 + Math.sin(i) * 20 - cam.x * (0.85 - yBand * 0.05)) % (W + 60) + W + 60) % (W + 60) - 30;
    const py = yMin + ((seed * 13) % (yMax - yMin));
    if (yBand === 0) {
      // 陶片（浅褐小三角形）
      ctx.fillStyle = 'rgba(140,100,60,0.55)';
      ctx.beginPath();
      ctx.moveTo(px, py - 2); ctx.lineTo(px + 4, py + 2); ctx.lineTo(px - 4, py + 2);
      ctx.closePath(); ctx.fill();
    } else if (yBand === 1) {
      // 骨头碎片（长条米色）
      ctx.fillStyle = 'rgba(200,180,140,0.5)';
      ctx.fillRect(px, py, 6, 2);
    } else {
      // 小石子（暗色圆点）
      ctx.fillStyle = 'rgba(80,60,40,0.6)';
      ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- 探方口顶部光：从地表透下来的天光 ----
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const topLight = ctx.createLinearGradient(0, 0, 0, 220);
  topLight.addColorStop(0, 'rgba(255,240,190,0.35)');
  topLight.addColorStop(0.4, 'rgba(255,230,170,0.14)');
  topLight.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = topLight;
  ctx.fillRect(0, 0, W, 220);

  // 探方口光柱（几束从地表透下来的阳光）
  for (let i = 0; i < 4; i++) {
    const x = 200 + i * 340 - (cam.x * 0.5 % 340);
    const g = ctx.createLinearGradient(x, 90, x + 60, 500);
    g.addColorStop(0, 'rgba(255,240,190,0.22)');
    g.addColorStop(0.5, 'rgba(255,220,150,0.08)');
    g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - 20, 90); ctx.lineTo(x + 60, 90);
    ctx.lineTo(x + 180, 500); ctx.lineTo(x + 60, 500);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // ---- 坑内的浮尘 ----
  for (let i = 0; i < 60; i++) {
    const seed = i * 61.3;
    const px = ((seed * 9 + Math.sin(tGlobal * 0.5 + i) * 40 + tGlobal * 5) % (W + 40) + W + 40) % (W + 40) - 20;
    const py = 175 + ((seed * 13 + tGlobal * (10 + (i % 5) * 4)) % 500);
    ctx.fillStyle = `rgba(255,245,210,${0.14 + (i % 4) * 0.06})`;
    ctx.fillRect(px, py, 2, 2);
  }
}

// 展柜：暗展厅、吊顶灯带、墙面装饰、射灯光锥、玻璃反光、远处观众剪影
// ---- 展品剪影（在博物馆玻璃展柜中，使用全局 ctx）----
function drawStandingFig(cx, baseY) {
  // 大立人像：高约 100，细长身体 + 高冠 + 环臂 + 长袍
  const top = baseY - 100;
  // 长袍（下宽上窄）
  ctx.fillStyle = '#5a7048';
  ctx.beginPath();
  ctx.moveTo(cx - 14, baseY);
  ctx.lineTo(cx - 10, top + 40);
  ctx.lineTo(cx + 10, top + 40);
  ctx.lineTo(cx + 14, baseY);
  ctx.closePath();
  ctx.fill();
  // 长袍纹路（横向几道）
  ctx.strokeStyle = 'rgba(30,50,25,0.7)';
  ctx.lineWidth = 1;
  for (let k = 1; k < 4; k++) {
    const ly = top + 45 + k * 13;
    ctx.beginPath(); ctx.moveTo(cx - 12, ly); ctx.lineTo(cx + 12, ly); ctx.stroke();
  }
  // 环臂（两肘向外弯曲）
  ctx.strokeStyle = '#5a7048';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx - 10, top + 46);
  ctx.quadraticCurveTo(cx - 22, top + 55, cx - 18, top + 68);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 10, top + 46);
  ctx.quadraticCurveTo(cx + 22, top + 55, cx + 18, top + 68);
  ctx.stroke();
  // 空握的手（大立人特有的环握空）
  ctx.strokeStyle = '#3a4a28';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx - 18, top + 70, 4, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 18, top + 70, 4, 0, Math.PI * 2); ctx.stroke();
  // 头
  ctx.fillStyle = '#5a7048';
  ctx.beginPath();
  ctx.ellipse(cx, top + 30, 8, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // 高冠（立人像的筒形高冠）
  ctx.fillStyle = '#6a8058';
  ctx.fillRect(cx - 5, top + 14, 10, 18);
  ctx.fillStyle = '#3a4a28';
  ctx.fillRect(cx - 5, top + 14, 10, 2);
}

function drawBronzeMask(cx, baseY) {
  // 青铜纵目面具：宽脸 + 突出的双眼柱 + 大耳
  const top = baseY - 60;
  // 面部底色
  ctx.fillStyle = '#4a6848';
  ctx.beginPath();
  ctx.ellipse(cx, baseY - 20, 28, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  // 大耳（向两侧平伸）
  ctx.beginPath();
  ctx.moveTo(cx - 28, baseY - 22);
  ctx.lineTo(cx - 40, baseY - 28);
  ctx.lineTo(cx - 38, baseY - 14);
  ctx.lineTo(cx - 28, baseY - 12);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 28, baseY - 22);
  ctx.lineTo(cx + 40, baseY - 28);
  ctx.lineTo(cx + 38, baseY - 14);
  ctx.lineTo(cx + 28, baseY - 12);
  ctx.closePath();
  ctx.fill();
  // 突出的眼睛柱（纵目特征）
  ctx.fillStyle = '#6a8858';
  ctx.fillRect(cx - 18, baseY - 26, 10, 6);
  ctx.beginPath();
  ctx.ellipse(cx - 22, baseY - 23, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(cx + 8, baseY - 26, 10, 6);
  ctx.beginPath();
  ctx.ellipse(cx + 22, baseY - 23, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // 瞳孔（金色高亮）
  ctx.fillStyle = '#d8b050';
  ctx.beginPath(); ctx.arc(cx - 22, baseY - 23, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 22, baseY - 23, 2, 0, Math.PI * 2); ctx.fill();
  // 大嘴
  ctx.strokeStyle = '#2a3a18';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 14, baseY - 10);
  ctx.quadraticCurveTo(cx, baseY - 4, cx + 14, baseY - 10);
  ctx.stroke();
  // 底座
  ctx.fillStyle = '#3a2416';
  ctx.fillRect(cx - 15, baseY - 4, 30, 4);
}

function drawSacredTree(cx, baseY) {
  // 青铜神树：树干 + 三层枝叶 + 神鸟
  // 底座
  ctx.fillStyle = '#3a2416';
  ctx.fillRect(cx - 12, baseY - 4, 24, 4);
  // 树干
  ctx.fillStyle = '#4a6848';
  ctx.fillRect(cx - 2, baseY - 78, 4, 74);
  // 三层枝叶（每层三支向外翘）
  for (let lvl = 0; lvl < 3; lvl++) {
    const ly = baseY - 30 - lvl * 16;
    for (let d = -1; d <= 1; d += 2) {
      ctx.strokeStyle = '#4a6848';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, ly);
      ctx.quadraticCurveTo(cx + d * 12, ly - 6, cx + d * 20, ly - 10);
      ctx.stroke();
      // 花蕾（小球）
      ctx.fillStyle = '#5a7858';
      ctx.beginPath();
      ctx.arc(cx + d * 20, ly - 10, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // 树顶神鸟
  ctx.fillStyle = '#d8b050';
  ctx.beginPath();
  ctx.ellipse(cx, baseY - 82, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  // 鸟喙
  ctx.beginPath();
  ctx.moveTo(cx + 4, baseY - 82);
  ctx.lineTo(cx + 8, baseY - 81);
  ctx.lineTo(cx + 4, baseY - 80);
  ctx.closePath();
  ctx.fill();
  // 神鸟尾羽
  ctx.beginPath();
  ctx.moveTo(cx - 4, baseY - 82);
  ctx.lineTo(cx - 9, baseY - 84);
  ctx.lineTo(cx - 4, baseY - 80);
  ctx.closePath();
  ctx.fill();
}

function bgMuseum() {
  drawSky('museum');

  // ---------- ① 吊顶层（0–30）：深色吊顶 + 暖色灯带 ----------
  ctx.fillStyle = '#03050a';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillStyle = 'rgba(20,16,10,0.85)';
  ctx.fillRect(0, 24, W, 6);
  // 暖色灯带（横向贯穿，暗示天花板有一整圈环境照明）
  const bandG = ctx.createLinearGradient(0, 20, 0, 30);
  bandG.addColorStop(0, 'rgba(255,220,150,0.0)');
  bandG.addColorStop(0.5, 'rgba(255,220,150,0.55)');
  bandG.addColorStop(1, 'rgba(255,220,150,0.0)');
  ctx.fillStyle = bandG;
  ctx.fillRect(0, 20, W, 10);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,220,150,0.06)';
  ctx.fillRect(0, 22, W, 8);
  ctx.restore();

  // ---------- ② 展厅后墙（30–260）：深色墙面 + 装饰线 ----------
  const wallG = ctx.createLinearGradient(0, 30, 0, 260);
  wallG.addColorStop(0, '#0a0e16');
  wallG.addColorStop(1, '#050810');
  ctx.fillStyle = wallG;
  ctx.fillRect(0, 30, W, 230);
  // 墙面装饰条（暗色横条）
  ctx.strokeStyle = 'rgba(60,70,90,0.10)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = 30 + i * 55;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  // 墙上淡淡的射灯反射光晕
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const x = 300 + i * 320 - (cam.x * 0.25 % 320);
    const g = ctx.createRadialGradient(x, 200, 4, x, 200, 200);
    g.addColorStop(0, 'rgba(255,220,150,0.08)');
    g.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, 200, 200, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ---------- ③ 墙面与射灯之间的过渡（260–290） ----------
  const transG = ctx.createLinearGradient(0, 260, 0, 290);
  transG.addColorStop(0, 'rgba(10,14,22,1)');
  transG.addColorStop(1, 'rgba(8,10,16,1)');
  ctx.fillStyle = transG;
  ctx.fillRect(0, 260, W, 30);

  // ---------- ④ 吊灯射灯装置（在吊顶下方悬挂）----------
  // 5 个轨道射灯沿 x 均匀分布，随摄像机轻微视差
  const spotSpacing = 320;
  const spotStart = -((cam.x * 0.25) % spotSpacing);
  for (let i = -1; i < 6; i++) {
    const sx = spotStart + i * spotSpacing + 120;
    // 吊杆
    ctx.strokeStyle = 'rgba(20,24,32,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx, 22);
    ctx.stroke();
    // 射灯主体（圆柱形）
    ctx.fillStyle = '#1a1e26';
    ctx.fillRect(sx - 12, 18, 24, 22);
    ctx.fillStyle = '#2a3040';
    ctx.fillRect(sx - 12, 20, 24, 4);
    // 灯泡（暖白发光）
    ctx.fillStyle = '#fff2c8';
    ctx.beginPath();
    ctx.arc(sx, 40, 5, 0, Math.PI * 2);
    ctx.fill();
    // 灯泡光晕
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const hl = ctx.createRadialGradient(sx, 40, 2, sx, 40, 30);
    hl.addColorStop(0, 'rgba(255,240,180,0.6)');
    hl.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.arc(sx, 40, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---------- ⑤ 射灯光锥（从每个射灯口照到地面）----------
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = -1; i < 6; i++) {
    const sx = spotStart + i * spotSpacing + 120;
    const g = ctx.createLinearGradient(sx, 40, sx, 620);
    g.addColorStop(0, 'rgba(255,235,180,0.22)');
    g.addColorStop(0.5, 'rgba(255,235,180,0.10)');
    g.addColorStop(1, 'rgba(255,235,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sx - 10, 40);
    ctx.lineTo(sx + 10, 40);
    ctx.lineTo(sx + 90, 620);
    ctx.lineTo(sx - 90, 620);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // ---------- ⑥ 玻璃展柜 + 展品（沿地面一字排开，随视差滚动）----------
  const caseSpacing = 420;
  const caseStart = -((cam.x * 0.9) % caseSpacing);
  // 展品剪影（三种：大立人 / 青铜面具 / 神树）
  const exhibits = [
    { name: '大立人', draw: drawStandingFig },
    { name: '青铜面具', draw: drawBronzeMask },
    { name: '神树', draw: drawSacredTree }
  ];
  for (let i = -1; i < 7; i++) {
    const cx = caseStart + i * caseSpacing + 60;
    if (cx + 180 < -20 || cx > W + 20) continue;
    const ex = exhibits[((i % 3) + 3) % 3];

    // 展台底座
    ctx.fillStyle = '#1a1410';
    ctx.fillRect(cx, 555, 180, 65);
    ctx.fillStyle = '#2a2018';
    ctx.fillRect(cx, 555, 180, 6);

    // 玻璃柜（透明 + 高光边缘）
    ctx.strokeStyle = 'rgba(180,220,255,0.35)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(cx + 15.5, 380.5, 150, 174);
    // 玻璃柜淡填充
    ctx.fillStyle = 'rgba(150,200,240,0.06)';
    ctx.fillRect(cx + 15, 380, 150, 174);
    // 玻璃高光斜线
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + 30, 385);
    ctx.lineTo(cx + 100, 550);
    ctx.stroke();

    // 柜内射灯（顶部小射灯）
    ctx.fillStyle = '#2a2018';
    ctx.fillRect(cx + 15, 378, 150, 4);
    ctx.fillStyle = 'rgba(255,240,200,0.9)';
    ctx.fillRect(cx + 30, 380, 120, 1);

    // 柜内射灯光斑
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const ig = ctx.createLinearGradient(cx + 90, 380, cx + 90, 555);
    ig.addColorStop(0, 'rgba(255,240,200,0.28)');
    ig.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.moveTo(cx + 40, 382);
    ctx.lineTo(cx + 140, 382);
    ctx.lineTo(cx + 160, 555);
    ctx.lineTo(cx + 20, 555);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 展品（在柜内中央绘制）
    ex.draw.call(ctx, cx + 90, 545);

    // 说明牌（展台正面小铭牌）
    ctx.fillStyle = '#d8c088';
    ctx.fillRect(cx + 62, 588, 56, 16);
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(cx + 62.5, 588.5, 55, 15);
    ctx.fillStyle = '#1a0a00';
    ctx.font = 'bold 8px "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(ex.name, cx + 66, 596);
  }

  // ---------- ⑦ 远处观众剪影（站在展柜旁驻足观看）----------
  const viewerSpacing = 480;
  const viewerStart = -((cam.x * 0.9) % viewerSpacing);
  for (let i = 0; i < 4; i++) {
    const vx = viewerStart + i * viewerSpacing + 260;
    if (vx < -30 || vx > W + 30) continue;
    const bob = Math.sin(tGlobal * 0.7 + i * 1.3) * 1.5;
    // 头
    ctx.fillStyle = 'rgba(8,10,16,0.85)';
    ctx.beginPath();
    ctx.ellipse(vx, 522 + bob, 10, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // 身体（略前倾的姿态——抬头看展柜）
    ctx.beginPath();
    ctx.moveTo(vx - 12, 533 + bob);
    ctx.lineTo(vx - 16, 620);
    ctx.lineTo(vx + 16, 620);
    ctx.lineTo(vx + 12, 533 + bob);
    ctx.closePath();
    ctx.fill();
    // 举起的相机手臂（部分观众举相机拍照）
    if (i % 2 === 0) {
      ctx.fillRect(vx - 20, 545 + bob, 8, 3);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(vx - 22, 542 + bob, 4, 4);
    }
  }

  // ---------- ⑧ 墙面馆名（超大字体，暗示"三星堆博物馆"字样）----------
  ctx.save();
  ctx.globalAlpha = 0.09;
  ctx.fillStyle = '#c8a060';
  ctx.font = 'bold 76px "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'middle';
  const hallStart = -((cam.x * 0.25) % 1600);
  ctx.fillText('三 星 堆 博 物 馆', hallStart + 200, 130);
  ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
  ctx.globalAlpha = 0.08;
  ctx.fillText('SANXINGDUI MUSEUM', hallStart + 300, 185);
  ctx.restore();

  // ---------- ⑨ 地面警戒线（黄黑相间，博物馆常见隔离）----------
  for (let i = -1; i < 20; i++) {
    const stripeX = i * 40 - ((cam.x * 0.9) % 40);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(220,180,50,0.15)' : 'rgba(0,0,0,0.3)';
    ctx.fillRect(stripeX, 616, 40, 4);
  }

  // ---------- ⑦ 展厅地面（620 以下）：抛光大理石 + 反射光斑 ----------
  const floorG = ctx.createLinearGradient(0, 620, 0, H);
  floorG.addColorStop(0, '#0a0c12');
  floorG.addColorStop(0.35, '#141821');
  floorG.addColorStop(1, '#05070b');
  ctx.fillStyle = floorG;
  ctx.fillRect(0, 620, W, H - 620);
  // 地面光泽高光（一条横向的高光带，暗示抛光地面反光）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const shineG = ctx.createLinearGradient(0, 620, 0, 660);
  shineG.addColorStop(0, 'rgba(255,240,200,0.12)');
  shineG.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = shineG;
  ctx.fillRect(0, 620, W, 40);
  ctx.restore();
}

function drawBackground(theme) {
  if (theme === 'forge') bgForge();
  else if (theme === 'ritual') bgRitual();
  else if (theme === 'burial') bgBurial();
  else if (theme === 'dig') bgDig();
  else bgMuseum();
}

/* ================= 文化符号层（各 era 中景商代/三星堆文物剪影） ================= */
/* 通用：视差 0.5，横向循环，低透明度，作为时代氛围背景，不与前景抢戏 */

/* ---- 商代青铜礼器 · 鼎（三足双耳大鼎剪影） ---- */
function drawDingSilhouette(cx, baseY, s, alpha) {
  withAlpha(alpha, () => {
    ctx.fillStyle = SILHUE_DARK;
    // 鼎口（矩形主体）
    ctx.fillRect(cx - 32 * s, baseY - 46 * s, 64 * s, 22 * s);
    // 口沿加厚
    ctx.fillRect(cx - 36 * s, baseY - 50 * s, 72 * s, 6 * s);
    // 双耳（口沿上方两片竖耳）
    ctx.fillRect(cx - 26 * s, baseY - 62 * s, 8 * s, 14 * s);
    ctx.fillRect(cx + 18 * s, baseY - 62 * s, 8 * s, 14 * s);
    // 鼎腹（主体下延）
    ctx.fillRect(cx - 30 * s, baseY - 24 * s, 60 * s, 20 * s);
    // 三足（前两足可见）
    for (const dx of [-22, 0, 22]) {
      ctx.fillRect(cx + (dx - 4) * s, baseY - 4 * s, 8 * s, 20 * s);
    }
  });
}

/* ---- 商代青铜礼器 · 爵（三足、流口、杯身） ---- */
function drawJueSilhouette(cx, baseY, s, alpha) {
  withAlpha(alpha, () => {
    ctx.fillStyle = SILHUE_DARK;
    // 三足（尖足）
    ctx.beginPath();
    ctx.moveTo(cx - 16 * s, baseY - 22 * s);
    ctx.lineTo(cx - 12 * s, baseY);
    ctx.lineTo(cx - 8 * s, baseY - 22 * s);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 8 * s, baseY - 22 * s);
    ctx.lineTo(cx + 12 * s, baseY);
    ctx.lineTo(cx + 16 * s, baseY - 22 * s);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 3 * s, baseY - 22 * s);
    ctx.lineTo(cx, baseY - 2 * s);
    ctx.lineTo(cx + 3 * s, baseY - 22 * s);
    ctx.closePath();
    ctx.fill();
    // 杯身
    ctx.fillRect(cx - 14 * s, baseY - 34 * s, 28 * s, 14 * s);
    // 流口（前端尖嘴）
    ctx.beginPath();
    ctx.moveTo(cx - 20 * s, baseY - 40 * s);
    ctx.lineTo(cx - 6 * s, baseY - 34 * s);
    ctx.lineTo(cx - 6 * s, baseY - 30 * s);
    ctx.lineTo(cx - 22 * s, baseY - 34 * s);
    ctx.closePath();
    ctx.fill();
    // 尾（后端尖）
    ctx.beginPath();
    ctx.moveTo(cx + 20 * s, baseY - 40 * s);
    ctx.lineTo(cx + 6 * s, baseY - 34 * s);
    ctx.lineTo(cx + 6 * s, baseY - 30 * s);
    ctx.lineTo(cx + 22 * s, baseY - 34 * s);
    ctx.closePath();
    ctx.fill();
    // 两柱（爵顶两个立柱）
    ctx.fillRect(cx - 8 * s, baseY - 52 * s, 3 * s, 12 * s);
    ctx.fillRect(cx + 5 * s, baseY - 52 * s, 3 * s, 12 * s);
  });
}

/* ---- 商代青铜礼器 · 觚（喇叭口、束腰） ---- */
function drawGuSilhouette(cx, baseY, s, alpha) {
  withAlpha(alpha, () => {
    ctx.fillStyle = SILHUE_DARK;
    // 喇叭口（上端展开）
    ctx.beginPath();
    ctx.moveTo(cx - 20 * s, baseY - 60 * s);
    ctx.lineTo(cx + 20 * s, baseY - 60 * s);
    ctx.lineTo(cx + 10 * s, baseY - 40 * s);
    ctx.lineTo(cx - 10 * s, baseY - 40 * s);
    ctx.closePath();
    ctx.fill();
    // 束腰
    ctx.fillRect(cx - 8 * s, baseY - 40 * s, 16 * s, 14 * s);
    // 下腹展开
    ctx.beginPath();
    ctx.moveTo(cx - 8 * s, baseY - 26 * s);
    ctx.lineTo(cx + 8 * s, baseY - 26 * s);
    ctx.lineTo(cx + 16 * s, baseY - 4 * s);
    ctx.lineTo(cx - 16 * s, baseY - 4 * s);
    ctx.closePath();
    ctx.fill();
    // 圈足
    ctx.fillRect(cx - 18 * s, baseY - 4 * s, 36 * s, 4 * s);
  });
}

/* ---- 三星堆青铜神树（远景高杆 + 三层枝叶 + 神鸟，比展柜中更大、更暗） ---- */
function drawSacredTreeSilhouette(cx, baseY, s, alpha, rim) {
  withAlpha(alpha, () => {
    // rim：祭火逆光——在剪影外缘镀一层暖边，否则纯黑剪影在夜空里不可见
    if (rim) { ctx.shadowColor = rim; ctx.shadowBlur = 26 * Math.max(1, s * 0.6); }
    ctx.fillStyle = SILHUE_DARK;
    // 底座
    ctx.fillRect(cx - 12 * s, baseY - 4 * s, 24 * s, 4 * s);
    // 主树干
    ctx.fillRect(cx - 2 * s, baseY - 130 * s, 4 * s, 126 * s);
    // 三层九枝（每层三支向外翘，三星堆神树特征）
    for (let lvl = 0; lvl < 3; lvl++) {
      const ly = baseY - 30 * s - lvl * 30 * s;
      // 侧枝（左右对称）
      eachSide(d => {
        ctx.strokeStyle = SILHUE_DARK;
        ctx.lineWidth = 2.5 * s;
        ctx.beginPath();
        ctx.moveTo(cx, ly);
        ctx.quadraticCurveTo(cx + d * 22 * s, ly - 10 * s, cx + d * 40 * s, ly - 20 * s);
        ctx.stroke();
        // 花蕾
        ctx.beginPath();
        ctx.arc(cx + d * 40 * s, ly - 20 * s, 4 * s, 0, Math.PI * 2);
        ctx.fill();
      });
      // 中枝
      ctx.beginPath();
      ctx.moveTo(cx, ly);
      ctx.lineTo(cx, ly - 14 * s);
      ctx.strokeStyle = SILHUE_DARK;
      ctx.lineWidth = 2 * s;
      ctx.stroke();
    }
    // 树顶神鸟
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 134 * s, 8 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 鸟喙
    ctx.beginPath();
    ctx.moveTo(cx + 8 * s, baseY - 134 * s);
    ctx.lineTo(cx + 14 * s, baseY - 132 * s);
    ctx.lineTo(cx + 8 * s, baseY - 130 * s);
    ctx.closePath();
    ctx.fill();
  });
}

/* ---- 三星堆青铜大立人（远景高大剪影，长袍高冠环握） ----
   pose：0 = 胸前环握（立人像本相），1 = 双臂高举向天（主祭正在主持祭仪）。 */
function drawStandingFigSilhouette(cx, baseY, s, alpha, rim, pose) {
  const pz = clamp(pose || 0, 0, 1);
  withAlpha(alpha, () => {
    if (rim) { ctx.shadowColor = rim; ctx.shadowBlur = 24 * Math.max(1, s * 0.6); }
    ctx.fillStyle = SILHUE_DARK;
    // 长袍：下摆外张、腰身收紧、肩部再展开（立人像的"三段式"体量）
    ctx.beginPath();
    ctx.moveTo(cx - 21 * s, baseY);
    ctx.quadraticCurveTo(cx - 16 * s, baseY - 30 * s, cx - 12 * s, baseY - 56 * s);
    ctx.quadraticCurveTo(cx - 11 * s, baseY - 68 * s, cx - 14 * s, baseY - 74 * s);
    ctx.lineTo(cx + 14 * s, baseY - 74 * s);
    ctx.quadraticCurveTo(cx + 11 * s, baseY - 68 * s, cx + 12 * s, baseY - 56 * s);
    ctx.quadraticCurveTo(cx + 16 * s, baseY - 30 * s, cx + 21 * s, baseY);
    ctx.closePath();
    ctx.fill();
    // 衣襟中线（长袍对襟的一道浅缝，靠"挖空"读出来）
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(cx - 0.7 * s, baseY - 62 * s, 1.4 * s, 62 * s);
    ctx.restore();
    // 双臂：pz=0 时前抬内收、双手在胸前合成空心环；pz=1 时高举过冠，向天托举
    ctx.strokeStyle = SILHUE_DARK;
    ctx.lineCap = 'round';
    ctx.lineWidth = 7 * s;
    const lp = (a, b) => a + (b - a) * pz;
    eachSide(d => {
      const ex = d * lp(30, 34) * s, ey = baseY + lp(-74, -104) * s;
      const hx = d * lp(24, 14) * s, hy = baseY + lp(-88, -140) * s;
      const fx = d * lp(10, 11) * s, fy = baseY + lp(-86, -144) * s;
      ctx.beginPath();
      ctx.moveTo(cx + d * 13 * s, baseY - 70 * s);
      ctx.quadraticCurveTo(cx + ex, ey, cx + hx, hy);
      ctx.stroke();
      // 前臂折向胸前 / 折向头顶
      ctx.beginPath();
      ctx.moveTo(cx + hx, hy);
      ctx.lineTo(cx + fx, fy);
      ctx.stroke();
      // 空心环握的手（三星堆立人最标志性的一处）
      ctx.beginPath();
      ctx.arc(cx + d * lp(8.5, 11) * s, baseY + lp(-86, -144) * s, 4.6 * s, 0, Math.PI * 2);
      ctx.stroke();
    });
    // 颈
    ctx.fillRect(cx - 4 * s, baseY - 80 * s, 8 * s, 7 * s);
    // 头（长脸、窄）
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 90 * s, 8.5 * s, 11 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 筒形高冠（下窄上宽，冠口外翻）
    ctx.beginPath();
    ctx.moveTo(cx - 6.5 * s, baseY - 100 * s);
    ctx.lineTo(cx + 6.5 * s, baseY - 100 * s);
    ctx.lineTo(cx + 8.5 * s, baseY - 128 * s);
    ctx.lineTo(cx - 8.5 * s, baseY - 128 * s);
    ctx.closePath();
    ctx.fill();
    // 冠口外翻的宽沿
    ctx.fillRect(cx - 10.5 * s, baseY - 131 * s, 21 * s, 3.4 * s);
    // 冠身横带（冠上的三道箍，让高冠不是一根柱子）
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for (const yy of [-108, -116, -124]) ctx.fillRect(cx - 8 * s, baseY + yy * s, 16 * s, 1.2 * s);
    ctx.restore();
  });
}

/* ---- 祭祀祭坛：三级夯土台 + 台顶神树 + 台顶主祭 ----
   把散落的"贴纸"收成一个真正的场所：人站在台下，树与祭者立在台上，火从台上压下来。
   p 为关卡进度，驱动台体从"被火镀成琥珀"到"被时间爬满铜绿"。 */
function drawRitualAltar(cx, baseY, s, p) {
  const k = clamp((p - 0.30) / 0.70, 0, 1);
  const goldA = 0.62 * (1 - 0.50 * k);
  const rustA = 0.52 * k;
  const tiers = [{ w: 268, h: 24 }, { w: 214, h: 24 }, { w: 158, h: 28 }];
  let y = baseY;
  for (let i = 0; i < tiers.length; i++) {
    const t = tiers[i];
    y -= t.h * s;
    const tw = t.w * s, th = t.h * s;
    // 每级之间拉开明度差，三级收分才看得出来
    const topL = 62 - i * 14;
    const g = ctx.createLinearGradient(0, y, 0, y + th);
    g.addColorStop(0, `rgba(${topL + 14},${Math.round(topL * 0.72)},${Math.round(topL * 0.46)},0.99)`);
    g.addColorStop(0.45, `rgba(${Math.round(topL * 0.58)},${Math.round(topL * 0.42)},${Math.round(topL * 0.27)},1)`);
    g.addColorStop(1, 'rgba(12,9,7,1)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - tw * 0.5, y, tw, th);
    // 台沿下缘被祭火照亮（金），上缘被时间爬满（锈）
    ctx.fillStyle = 'rgba(255,188,104,' + goldA.toFixed(3) + ')';
    ctx.fillRect(cx - tw * 0.5, y + th - 3 * s, tw, 3 * s);
    ctx.fillStyle = 'rgba(255,214,150,' + (goldA * 0.5).toFixed(3) + ')';
    ctx.fillRect(cx - tw * 0.5, y + th - 3 * s, tw, 1.1 * s);
    if (rustA > 0.012) {
      ctx.fillStyle = 'rgba(74,156,120,' + rustA.toFixed(3) + ')';
      ctx.fillRect(cx - tw * 0.5, y, tw, 3.6 * s);
      ctx.fillStyle = 'rgba(150,214,180,' + (rustA * 0.45).toFixed(3) + ')';
      ctx.fillRect(cx - tw * 0.5, y, tw, 1.2 * s);
    }
    // 夯窝层理
    ctx.strokeStyle = 'rgba(152,112,64,0.16)';
    ctx.lineWidth = 1;
    for (let yy = y + 7 * s; yy < y + th - 4 * s; yy += 7 * s) {
      ctx.beginPath(); ctx.moveTo(cx - tw * 0.5, yy); ctx.lineTo(cx + tw * 0.5, yy); ctx.stroke();
    }
  }
  const topY = y;
  // 侧面五级台阶：暗示"人是一级一级走上祭坛的"
  for (let i = 0; i < 5; i++) {
    const sw = 18 * s;
    const sx = cx + 132 * s - i * sw;
    const sy = baseY - (i + 1) * 15 * s;
    const sg = ctx.createLinearGradient(0, sy, 0, baseY);
    sg.addColorStop(0, 'rgba(58,42,28,1)');
    sg.addColorStop(1, 'rgba(16,12,9,1)');
    ctx.fillStyle = sg;
    ctx.fillRect(sx, sy, sw, (i + 1) * 15 * s);
    ctx.fillStyle = 'rgba(255,182,100,' + (goldA * 0.85).toFixed(3) + ')';
    ctx.fillRect(sx, sy, sw, 2.2 * s);
  }
  // 台顶：神树居中，主祭立于树侧，主祭在"举手—俯身"之间呼吸式往复（祭祀正在进行）
  drawSacredTreeSilhouette(cx - 10 * s, topY, s * 1.28, 0.95, 'rgba(255,158,78,0.66)');
  const bow = 0.5 + 0.5 * Math.sin(tGlobal * 0.62);   // 0 俯身 → 1 举手
  drawStandingFigSilhouette(cx + 62 * s, topY, s * 0.86, 0.96, 'rgba(255,182,102,0.78)', bow);

  // 台顶火盆：让祭坛自身成为光源，光从台上往下压
  const brazX = cx + 108 * s, brazY = topY - 4 * s;
  ctx.fillStyle = 'rgba(18,13,9,1)';
  ctx.beginPath();
  ctx.moveTo(brazX - 17 * s, brazY - 14 * s);
  ctx.quadraticCurveTo(brazX, brazY - 2 * s, brazX + 17 * s, brazY - 14 * s);
  ctx.lineTo(brazX + 13 * s, brazY - 17 * s);
  ctx.lineTo(brazX - 13 * s, brazY - 17 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(176,120,58,0.42)';
  ctx.fillRect(brazX - 17 * s, brazY - 18 * s, 34 * s, 2 * s);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(brazX, brazY - 30 * s, 108 * s, 'rgba(255,142,52,0.26)');
  radialGlow(brazX, brazY - 26 * s, 46 * s, 'rgba(255,206,124,0.30)');
  radialGlow(cx - 10 * s, topY - 60 * s, 130 * s, 'rgba(255,130,48,0.10)');
  // 盆中三束火
  for (let k = 0; k < 3; k++) {
    const fh = (26 + k * 11) * s * (0.78 + 0.22 * Math.sin(tGlobal * 5.2 + k * 2.1));
    const fx2 = brazX + (k - 1) * 8 * s + Math.sin(tGlobal * 3.6 + k) * 3 * s;
    const fg = ctx.createLinearGradient(0, brazY - 18 * s - fh, 0, brazY - 16 * s);
    fg.addColorStop(0, 'rgba(255,246,206,0)');
    fg.addColorStop(0.42, 'rgba(255,204,104,0.55)');
    fg.addColorStop(1, 'rgba(255,124,42,0.68)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx2, brazY - 18 * s - fh);
    ctx.quadraticCurveTo(fx2 + 8 * s, brazY - 24 * s, fx2 + 6 * s, brazY - 16 * s);
    ctx.lineTo(fx2 - 6 * s, brazY - 16 * s);
    ctx.quadraticCurveTo(fx2 - 8 * s, brazY - 24 * s, fx2, brazY - 18 * s - fh);
    ctx.fill();
  }
  ctx.restore();

  // 祭烟：从台顶袅袅升起，把"通神"这条线拉向天上那张脸
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const ph = ((tGlobal * 0.20 + i * 0.11) % 1);
    const sy = brazY - 26 * s - ph * 250 * s;
    const sx = brazX + Math.sin(tGlobal * 0.9 + i * 1.7) * (10 + ph * 46) * s;
    const sa = (1 - ph) * 0.16 * (0.55 + 0.45 * Math.sin(tGlobal * 1.4 + i));
    if (sa <= 0.004) continue;
    ctx.fillStyle = `rgba(196,182,170,${sa.toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(sx, sy, (16 + ph * 52) * s, (9 + ph * 26) * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ---- 商代青铜礼器 · 编钟（悬吊的编钟组） ---- */
function drawBellSilhouette(cx, topY, s, alpha) {
  withAlpha(alpha, () => {
    ctx.fillStyle = SILHUE_DARK;
    // 横梁（悬钟架）
    ctx.fillRect(cx - 40 * s, topY, 80 * s, 4 * s);
    // 三个钟（大小不一）
    const bells = [
      { dx: -22, size: 14 },
      { dx: 0,   size: 18 },
      { dx: 22,  size: 14 }
    ];
    for (const b of bells) {
      const bx = cx + b.dx * s;
      const bs = b.size * s;
      // 悬绳
      ctx.strokeStyle = SILHUE_DARK;
      ctx.lineWidth = 1.2 * s;
      ctx.beginPath();
      ctx.moveTo(bx, topY + 4 * s);
      ctx.lineTo(bx, topY + 8 * s);
      ctx.stroke();
      // 钟体（上宽下窄梯形，钟顶有钮）
      ctx.beginPath();
      ctx.moveTo(bx - 2 * s, topY + 4 * s);
      ctx.lineTo(bx + 2 * s, topY + 4 * s);
      ctx.lineTo(bx + 3 * s, topY + 6 * s);
      ctx.lineTo(bx - 3 * s, topY + 6 * s);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx - 6 * s, topY + 8 * s);
      ctx.lineTo(bx + 6 * s, topY + 8 * s);
      ctx.lineTo(bx + bs * 0.5, topY + 8 * s + bs);
      ctx.lineTo(bx - bs * 0.5, topY + 8 * s + bs);
      ctx.closePath();
      ctx.fill();
    }
  });
}

/* ---- 商代祭祀 · 陶鬲（三袋足大釜） ---- */
function drawLiSilhouette(cx, baseY, s, alpha) {
  withAlpha(alpha, () => {
    ctx.fillStyle = SILHUE_DARK;
    // 口沿
    ctx.fillRect(cx - 18 * s, baseY - 30 * s, 36 * s, 4 * s);
    // 束颈
    ctx.fillRect(cx - 12 * s, baseY - 26 * s, 24 * s, 8 * s);
    // 三袋足（三个圆鼓）
    for (const dx of [-12, 0, 12]) {
      ctx.beginPath();
      ctx.arc(cx + dx * s, baseY - 8 * s, 10 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

/* ---- 三星堆 · 玉琮（方外圆内，祭祀神器） ---- */
function drawJadeCongSilhouette(cx, baseY, s, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  // 方形外壁（分层）
  ctx.fillStyle = SILHUE_DARK;
  ctx.fillRect(cx - 14 * s, baseY - 40 * s, 28 * s, 40 * s);
  // 顶端和底端圆环（俯视时呈方框，正视看有分隔线）
  ctx.strokeStyle = 'rgba(60,80,60,0.4)';
  ctx.lineWidth = 1 * s;
  ctx.strokeRect(cx - 14 * s, baseY - 40 * s, 28 * s, 40 * s);
  // 中间圆孔（用暗色表现）
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.ellipse(cx, baseY - 20 * s, 8 * s, 20 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  // 面部纹饰（简化）
  ctx.strokeStyle = 'rgba(60,80,60,0.5)';
  ctx.lineWidth = 0.8 * s;
  ctx.beginPath();
  ctx.moveTo(cx - 14 * s, baseY - 30 * s);
  ctx.lineTo(cx + 14 * s, baseY - 30 * s);
  ctx.moveTo(cx - 14 * s, baseY - 10 * s);
  ctx.lineTo(cx + 14 * s, baseY - 10 * s);
  ctx.stroke();
  ctx.restore();
}

/* ---- 三星堆 · 金面具背景符号（远景中的金面具剪影，只在 ritual/burial/museum 出现） ---- */
function drawGoldMaskSilhouette(cx, cy, s, alpha) {
  withAlpha(alpha, () => {
    // 面具主体（椭圆脸）
    ctx.fillStyle = SILHUE_MASK;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 22 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 大耳（左右对称）
    eachSide(d => {
      ctx.beginPath();
      ctx.moveTo(cx + d * 22 * s, cy - 2 * s);
      ctx.lineTo(cx + d * 34 * s, cy - 10 * s);
      ctx.lineTo(cx + d * 34 * s, cy + 6 * s);
      ctx.lineTo(cx + d * 22 * s, cy + 4 * s);
      ctx.closePath();
      ctx.fill();
    });
  });
}

/* ---- 各 era 符号层调度 ---- */
function drawCultureLayer(theme) {
  const par = 0.5; // 中景视差
  const stepX = 480; // 循环间距
  const start = -((cam.x * par) % stepX);

  if (theme === 'forge') {
    // 熔铸：商代礼器（鼎、爵、觚）作为远景装饰，暗示"这是铸造作坊"
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -80 || x > W + 80) continue;
      const kind = ((i % 3) + 3) % 3;
      if (kind === 0) drawDingSilhouette(x, 605, 0.9, 0.32);
      else if (kind === 1) drawJueSilhouette(x, 605, 0.9, 0.32);
      else drawGuSilhouette(x, 605, 0.9, 0.32);
    }
  } else if (theme === 'ritual') {
    // 祭祀：远景只留"悬在夜空里的金面具"与编钟——神树与主祭已由 bgRitual 承担，
    // 此处再画会与主景叠成三层，画面过密。
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -100 || x > W + 100) continue;
      const kind = ((i % 2) + 2) % 2;
      if (kind === 0) {
        drawGoldMaskSilhouette(x, 300, 0.62, 0.20);
        drawBellSilhouette(x, 178, 0.6, 0.18);
      } else {
        drawBellSilhouette(x, 232, 0.72, 0.20);
      }
    }
  } else if (theme === 'burial') {
    // 深埋：所有符号都在泥土下面（暗化，位置下移，代表"沉睡的文物"）
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -100 || x > W + 100) continue;
      const kind = ((i % 3) + 3) % 3;
      // 埋在土里：alpha 更低，颜色偏锈绿
      if (kind === 0) drawSacredTreeSilhouette(x, 700, 0.65, 0.14);
      else if (kind === 1) drawStandingFigSilhouette(x, 700, 0.6, 0.14);
      else drawJadeCongSilhouette(x, 700, 0.6, 0.12);
    }
    // 地底深处隐约的陶鬲剪影
    drawLiSilhouette(W * 0.7, 720, 0.5, 0.10);
  } else if (theme === 'dig') {
    // 考古：远处坑边立着的陶鬲、玉琮、洛阳铲架，暗示"待发掘"
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -80 || x > W + 80) continue;
      const kind = ((i % 3) + 3) % 3;
      if (kind === 0) drawLiSilhouette(x, 605, 0.7, 0.28);
      else if (kind === 1) drawJadeCongSilhouette(x, 605, 0.7, 0.28);
      else drawDingSilhouette(x, 605, 0.7, 0.28);
    }
  } else {
    // 展柜：背景墙上的编钟 + 玉琮展陈（暗色装饰）
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -80 || x > W + 80) continue;
      drawBellSilhouette(x, 220, 0.6, 0.20);
      drawJadeCongSilhouette(x - 60, 340, 0.5, 0.14);
    }
  }
}

/* ================= 环境飘尘层（各 era 主题色粒子，营造祭祀氛围） ================= */
/* 用确定性种子生成 N 个粒子，每帧根据 tGlobal 计算位置；无状态，无需 update */
function drawAmbientDust() {
  const theme = level.theme;
  const cfg = {
    forge:  { count: 42, hue: '255,180,90', speed: 0.9, drift: 26, size: [1.2, 2.6], alpha: [0.12, 0.35] },
    ritual: { count: 48, hue: '255,220,150', speed: 0.5, drift: 34, size: [1.0, 2.4], alpha: [0.10, 0.32] },
    burial: { count: 40, hue: '160,200,140', speed: 0.35, drift: 40, size: [1.2, 2.8], alpha: [0.14, 0.38] },
    dig:    { count: 54, hue: '220,190,130', speed: 0.55, drift: 22, size: [1.0, 2.2], alpha: [0.12, 0.36] },
    museum: { count: 36, hue: '180,220,200', speed: 0.28, drift: 48, size: [1.4, 3.0], alpha: [0.10, 0.30] }
  }[theme] || { count: 36, hue: '200,200,200', speed: 0.4, drift: 30, size: [1.2, 2.4], alpha: [0.12, 0.30] };

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < cfg.count; i++) {
    // 确定性种子：每颗粒子有独立相位/大小/速度系数
    const seed = i * 73.31 + 12.7;
    const phaseX = tGlobal * cfg.speed * (0.6 + (i % 5) * 0.15);
    const driftX = Math.sin(tGlobal * 0.35 + seed * 0.4) * cfg.drift;
    const driftY = Math.cos(tGlobal * 0.28 + seed * 0.7) * cfg.drift * 0.6;
    // 粒子在画面上的循环位置（水平视差 + 缓慢下落）
    const baseX = ((i * 97) + (phaseX * 40) - cam.x * 0.15);
    const wrapX = ((baseX % W) + W) % W;
    const fall = ((tGlobal * 8 + seed * 3.7) % (H + 40));
    const px = wrapX + driftX;
    const py = (fall % H) + driftY;
    if (py < -20 || py > H + 20) continue;
    const sz = cfg.size[0] + ((i * 17) % 100) / 100 * (cfg.size[1] - cfg.size[0]);
    // 呼吸亮度
    const twinkle = 0.5 + 0.5 * Math.sin(tGlobal * 1.6 + seed);
    const alpha = cfg.alpha[0] + (cfg.alpha[1] - cfg.alpha[0]) * twinkle;
    ctx.fillStyle = `rgba(${cfg.hue},${alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ================= 平台 ================= */
function drawPlatforms() {
  const th = THEME[level.theme];
  for (let idx = 0; idx < level.plats.length; idx++) {
    const pl = level.plats[idx];
    const px = pl[0] - cam.x, py = pl[1], pw = pl[2], ph = pl[3];
    if (px + pw < -40 || px > W + 40) continue;

    const g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, th.plat[0]);
    g.addColorStop(0.18, th.plat[1]);
    g.addColorStop(1, '#08090b');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, pw, ph);

    // 顶面高光
    ctx.fillStyle = 'rgba(255,235,190,0.30)';
    ctx.fillRect(px, py, pw, 2);
    ctx.fillStyle = `rgba(${level.theme === 'dig' ? '255,240,200' : '150,220,190'},0.14)`;
    ctx.fillRect(px, py + 2, pw, 7);

    // 侧面纹理
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    for (let x = 14; x < pw; x += 46) {
      ctx.beginPath();
      ctx.moveTo(px + x, py + 10);
      ctx.lineTo(px + x + 6, py + Math.min(ph, 60));
      ctx.stroke();
    }
    // 土沁分层
    ctx.strokeStyle = 'rgba(0,0,0,0.20)';
    for (let y = py + 34; y < py + ph; y += 24) {
      ctx.beginPath();
      ctx.moveTo(px, y);
      ctx.lineTo(px + pw, y);
      ctx.stroke();
    }
    // 云雷纹饰带（其他主题主平台装饰）
    if (ph > 60 && level.theme !== 'dig') {
      ctx.strokeStyle = 'rgba(208,178,114,0.20)';
      ctx.lineWidth = 1.4;
      for (let x = 10; x < pw - 26; x += 30) {
        ctx.beginPath();
        ctx.moveTo(px + x, py + 24);
        ctx.lineTo(px + x, py + 12);
        ctx.lineTo(px + x + 13, py + 12);
        ctx.lineTo(px + x + 13, py + 19);
        ctx.stroke();
      }
    }

    // 第 4 关：给"踏面"小石板（非地面主平台）加上考古踏面标记
    if (level.theme === 'dig' && ph <= 40) {
      drawDigStepMarkers(px, py, pw, ph, pl[0], idx);
    }
    // 第 4 关：主平台（探方坑底/地表）加上现场考古符号
    if (level.theme === 'dig' && ph > 60) {
      drawDigGroundMarkers(px, py, pw, ph, pl[0], idx);
    }
  }
}

/* ================= 第 4 关 · 考古探方踏面标记 =================
   叙事：第 4 关的高空小石板 = 探方坑壁上被考古队削出来的"发掘踏面"。
   真实现场的核心符号：
     - 探方编号：T02 / T03 之类（考古探方编号 = T + 两位数字）
     - 白色测绘绳网：探方四角立竹桩，四角拉白绳，形成网格
     - 竹桩：不是粗木柱，而是细竹竿（黄色）
     - 洛阳铲 / 手铲：斜插在土面上的发掘工具
     - 地层分色：黄土层→褐土层→红土层→黑土层（每层颜色不同）
     - 陶片 / 青铜碎片：从土里露出小一角
   玩家站在踏面上跳，就是在探方前沿踏面上按层跳跃。 */
function drawDigStepMarkers(px, py, pw, ph, worldX, plIdx) {
  // ---------- ① 分层土剖面：黄土→褐土→红土→黑土（考古地层标准色） ----------
  const soilTop = py - 30;
  const layers = [
    { c: '#8a6a3a', h: 6 },   // 黄土层
    { c: '#5a3f24', h: 7 },   // 褐土层
    { c: '#7a4a28', h: 7 },   // 红土层
    { c: '#3a2818', h: 10 }   // 黑土层
  ];
  let ly = soilTop;
  for (const L of layers) {
    ctx.fillStyle = L.c;
    ctx.fillRect(px - 6, ly, pw + 12, L.h);
    // 层间暗缝
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px - 6, ly + L.h - 1, pw + 12, 1);
    ly += L.h;
  }
  // 土面锯齿边（最顶层的未铲平自然土面）
  ctx.fillStyle = '#8a6a3a';
  ctx.beginPath();
  ctx.moveTo(px - 6, soilTop);
  for (let x = px - 6; x <= px + pw + 6; x += 10) {
    const jag = ((x * 7919) % 5) - 2;
    ctx.lineTo(x, soilTop + jag);
  }
  ctx.lineTo(px + pw + 6, soilTop + 4);
  ctx.lineTo(px - 6, soilTop + 4);
  ctx.closePath();
  ctx.fill();
  // 土里的碎屑/石子
  for (let i = 0; i < 14; i++) {
    const sx = px + ((i * 37 + plIdx * 13) % (pw - 8));
    const sy = soilTop + 3 + ((i * 11) % (soilTop - py + 26));
    const col = (i + plIdx) % 3 === 0 ? 'rgba(220,180,120,0.6)'
              : (i + plIdx) % 3 === 1 ? 'rgba(60,40,20,0.7)'
              : 'rgba(140,100,60,0.5)';
    ctx.fillStyle = col;
    ctx.fillRect(sx, sy, 2, 2);
  }

  // ---------- ② 探方编号木牌 + 竹竿（挂在探方左端） ----------
  const poleX = px - 8;
  const poleTopY = soilTop - 26;
  const poleBotY = soilTop + 2;
  // 竹竿（黄色 + 竹节）
  const poleG = ctx.createLinearGradient(poleX, 0, poleX + 4, 0);
  poleG.addColorStop(0, '#a88850');
  poleG.addColorStop(0.5, '#d0ac70');
  poleG.addColorStop(1, '#8a6a38');
  ctx.fillStyle = poleG;
  ctx.fillRect(poleX, poleTopY, 4, poleBotY - poleTopY);
  // 竹节
  ctx.fillStyle = '#6b4e20';
  for (let ny = poleTopY + 6; ny < poleBotY - 2; ny += 6) {
    ctx.fillRect(poleX, ny, 4, 1);
  }
  // 探方编号木牌（黄色底 + 黑色编号 = 考古标准做法）
  const codes = ['T02', 'T03', 'T04', 'T05'];
  const code = codes[plIdx % codes.length];
  const lbW = 26, lbH = 16;
  const lbX = poleX - 3, lbY = poleTopY + 1;
  ctx.fillStyle = '#f0d896';
  ctx.fillRect(lbX, lbY, lbW, lbH);
  ctx.strokeStyle = '#3a2818';
  ctx.lineWidth = 1;
  ctx.strokeRect(lbX + 0.5, lbY + 0.5, lbW - 1, lbH - 1);
  ctx.fillStyle = '#1a0a00';
  ctx.font = 'bold 11px Consolas, monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText(code, lbX + 3, lbY + lbH / 2 + 1);

  // ---------- ③ 白色测绘绳网：探方四角拉白绳（横+竖） ----------
  // 横绳：沿踏面上沿延伸，形成"探方边界线"
  ctx.strokeStyle = 'rgba(255,250,220,0.85)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(px - 22, soilTop - 4);
  ctx.lineTo(px + pw + 22, soilTop - 4);
  ctx.stroke();
  // 竖绳：在踏面两端垂下一小段（暗示继续向下延伸进坑）
  ctx.strokeStyle = 'rgba(255,250,220,0.7)';
  ctx.beginPath();
  ctx.moveTo(px - 22, soilTop - 4);
  ctx.lineTo(px - 22, soilTop + 30);
  ctx.moveTo(px + pw + 22, soilTop - 4);
  ctx.lineTo(px + pw + 22, soilTop + 30);
  ctx.stroke();
  // 中间还有一根竖绳（把探方再分一格）
  ctx.beginPath();
  ctx.moveTo(px + pw / 2, soilTop - 4);
  ctx.lineTo(px + pw / 2, soilTop + 30);
  ctx.stroke();

  // ---------- ④ 右端竹桩（另一根，形成"探方四角立桩"的感觉） ----------
  const pole2X = px + pw + 4;
  ctx.fillStyle = '#d0ac70';
  ctx.fillRect(pole2X, poleTopY + 4, 4, poleBotY - poleTopY);
  ctx.fillStyle = '#6b4e20';
  for (let ny = poleTopY + 10; ny < poleBotY - 2; ny += 6) {
    ctx.fillRect(pole2X, ny, 4, 1);
  }

  // ---------- ⑤ 手铲（洛阳铲）：斜插在踏面右端土上 ----------
  const shX = px + pw - 12;
  const shY = soilTop + 2;
  ctx.save();
  ctx.translate(shX, shY);
  ctx.rotate(-0.35);
  // 木柄
  const hG = ctx.createLinearGradient(0, 0, 0, 18);
  hG.addColorStop(0, '#7a5830');
  hG.addColorStop(1, '#4a3018');
  ctx.fillStyle = hG;
  ctx.fillRect(-2, 0, 4, 18);
  // 铲头（梯形金属头）
  const bG = ctx.createLinearGradient(-8, 0, 8, 0);
  bG.addColorStop(0, '#4a4a52');
  bG.addColorStop(0.5, '#888890');
  bG.addColorStop(1, '#3a3a42');
  ctx.fillStyle = bG;
  ctx.beginPath();
  ctx.moveTo(-8, 18);
  ctx.lineTo(8, 18);
  ctx.lineTo(5, 26);
  ctx.lineTo(-5, 26);
  ctx.closePath();
  ctx.fill();
  // 铲头锈痕
  ctx.fillStyle = 'rgba(120,60,20,0.5)';
  ctx.fillRect(-6, 19, 12, 2);
  ctx.restore();

  // ---------- ⑥ 探方坑壁下的陶片 & 青铜碎片（露出小一角） ----------
  // 陶片（褐红色破片）
  ctx.fillStyle = '#a05a30';
  ctx.beginPath();
  ctx.moveTo(px + 12, py + 4);
  ctx.lineTo(px + 20, py + 2);
  ctx.lineTo(px + 22, py + 8);
  ctx.lineTo(px + 14, py + 9);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  // 青铜碎片（绿锈色）
  ctx.fillStyle = '#4a8a6a';
  ctx.beginPath();
    ctx.moveTo(px + pw - 24, py + 6);
    ctx.lineTo(px + pw - 16, py + 3);
    ctx.lineTo(px + pw - 14, py + 10);
    ctx.lineTo(px + pw - 22, py + 11);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.stroke();
}

/* ================= 第 4 关 · 探方坑底/地表现场符号 =================
   真实现场的关键细节：
   - 探方四角立竹桩 + 探方编号木牌（T01/T02/…）
   - 白色测绘绳网（1米/格的网格拉在白绳上）
   - 探方边缘堆积的翻出土（松散碎土）
   - 蹲着铲土的考古员剪影（拿手铲+草帽）
   - 竹编土筐（挖出土的临时容器）
   - 麻袋 + 记录本 + 皮尺
   - 探方坑底的网格线（1米×1米） */
function drawDigGroundMarkers(px, py, pw, ph, worldX, plIdx) {
  // 用世界坐标生成稳定的伪随机
  const seed = plIdx * 1013 + 7;
  const rr = (i, m) => ((Math.sin(seed * 17 + i * 31.7) * 10000) % m + m) % m;

  // ---------- ① 探方边缘：堆积的翻出土（松散碎土堆） ----------
  // 在探方上沿（py 位置）堆一堆翻出来的松土，模拟"探方边土堆"
  // 分两段，中间挖出缺口给考古员站位
  ctx.fillStyle = '#7a5836';
  ctx.beginPath();
  ctx.moveTo(px, py + 6);
  const bumps = 24;
  for (let i = 0; i <= bumps; i++) {
    const t = i / bumps;
    const bx = px + t * pw;
    // 土堆高度：中间略高，但在人物站位处压低
    let centerDip = Math.sin(t * Math.PI);
    // 为每个考古员站位位置压低土堆
    const workerCountPre = (pw > 400) ? 2 : 1;
    for (let wi = 0; wi < workerCountPre; wi++) {
      const wt = (160 + wi * (pw / (workerCountPre + 1))) / pw;
      const distToWorker = Math.abs(t - wt);
      if (distToWorker < 0.06) {
        centerDip *= (distToWorker / 0.06) * 0.4;
      }
    }
    const jag = Math.sin(t * 22 + plIdx) * 1.5 + Math.sin(t * 7 + plIdx * 2) * 2;
    const h = 6 + centerDip * 10 + jag;
    ctx.lineTo(bx, py - h);
  }
  ctx.lineTo(px + pw, py + 6);
  ctx.closePath();
  ctx.fill();
  // 土堆表面的颗粒
  for (let i = 0; i < 40; i++) {
    const t = i / 40;
    const bx = px + t * pw;
    let centerDip = Math.sin(t * Math.PI);
    const workerCountPre = (pw > 400) ? 2 : 1;
    for (let wi = 0; wi < workerCountPre; wi++) {
      const wt = (160 + wi * (pw / (workerCountPre + 1))) / pw;
      const distToWorker = Math.abs(t - wt);
      if (distToWorker < 0.06) centerDip *= (distToWorker / 0.06) * 0.4;
    }
    const h = 6 + centerDip * 10 + Math.sin(t * 22 + plIdx) * 1.5;
    ctx.fillStyle = (i % 3 === 0) ? 'rgba(200,150,90,0.55)'
                  : (i % 3 === 1) ? 'rgba(60,40,20,0.7)'
                  : 'rgba(140,100,60,0.6)';
    ctx.fillRect(bx, py - h + rr(i, 4), 2, 2);
  }

  // ---------- ② 探方坑底网格（1米×1米白绳网格） ----------
  // 横向白绳：3 根
  ctx.strokeStyle = 'rgba(255,250,220,0.42)';
  ctx.lineWidth = 1.2;
  for (let i = 1; i <= 3; i++) {
    const yy = py + 40 + i * 22;
    ctx.beginPath();
    ctx.moveTo(px + 8, yy);
    ctx.lineTo(px + pw - 8, yy);
    ctx.stroke();
  }
  // 纵向白绳：把探方分成 4 段
  ctx.strokeStyle = 'rgba(255,250,220,0.35)';
  ctx.lineWidth = 1.1;
  for (let i = 1; i < 4; i++) {
    const xx = px + i * (pw / 4);
    ctx.beginPath();
    ctx.moveTo(xx, py + 20);
    ctx.lineTo(xx, py + ph - 10);
    ctx.stroke();
  }
  // 网格交叉点：小小的绳结
  ctx.fillStyle = 'rgba(255,250,220,0.7)';
  for (let i = 1; i <= 3; i++) {
    for (let j = 1; j < 4; j++) {
      const gx = px + j * (pw / 4);
      const gy = py + 40 + i * 22;
      ctx.fillRect(gx - 1, gy - 1, 2, 2);
    }
  }

  // ---------- ③ 探方编号（沿探方边界挂的编号木牌） ----------
  // 每个主平台都编号，T01 T02 T03 T04
  const gridCode = ['T01', 'T02', 'T03', 'T04'][plIdx % 4];
  // 左端探方编号牌
  const lbX1 = px + 10, lbY1 = py + 30;
  ctx.fillStyle = '#f0d896';
  ctx.fillRect(lbX1, lbY1, 32, 16);
  ctx.strokeStyle = '#3a2818';
  ctx.lineWidth = 1;
  ctx.strokeRect(lbX1 + 0.5, lbY1 + 0.5, 31, 15);
  ctx.fillStyle = '#1a0a00';
  ctx.font = 'bold 11px Consolas, monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText(gridCode, lbX1 + 4, lbY1 + 9);
  // 挂绳
  ctx.strokeStyle = 'rgba(30,20,10,0.6)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(lbX1 + 16, py - 8);
  ctx.lineTo(lbX1 + 16, lbY1);
  ctx.stroke();

  // ---------- ④ 探方四角立竹桩 ----------
  const poleG = ctx.createLinearGradient(0, 0, 6, 0);
  poleG.addColorStop(0, '#a88850');
  poleG.addColorStop(0.5, '#d0ac70');
  poleG.addColorStop(1, '#7a5c30');
  // 左端 + 右端竹桩（探方边界标记）
  for (const poleOff of [4, pw - 10]) {
    const poleX = px + poleOff;
    const poleTopY = py - 32;
    ctx.fillStyle = poleG;
    ctx.fillRect(poleX, poleTopY, 6, 40);
    // 竹节
    ctx.fillStyle = '#5c4020';
    for (let ny = poleTopY + 6; ny < poleTopY + 40; ny += 8) {
      ctx.fillRect(poleX, ny, 6, 1);
    }
  }

  // ---------- ⑤ 蹲着的考古员剪影（放大 + 描边 + 高光，一眼能看清） ----------
  // 每段平台最多放 2 个
  const workerCount = (pw > 400) ? 2 : 1;
  for (let i = 0; i < workerCount; i++) {
    const wx = px + 160 + i * (pw / (workerCount + 1));
    const wy = py + 14;
    const hasTool = (plIdx + i) % 2 === 0; // 交替拿手铲/刷子
    const facingLeft = (plIdx + i) % 2 === 1; // 交替朝向

    ctx.save();
    // 人物光晕（暖色阳光打在背上，让人物从土色背景中跳出来）
    const halo = ctx.createRadialGradient(wx, wy - 22, 4, wx, wy - 22, 34);
    halo.addColorStop(0, 'rgba(255,230,170,0.35)');
    halo.addColorStop(1, 'rgba(255,230,170,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(wx, wy - 22, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 阴影（地面投影）
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(wx, wy + 8, 22, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    if (facingLeft) {
      ctx.translate(wx, 0);
      ctx.scale(-1, 1);
      ctx.translate(-wx, 0);
    }

    const bodyFill = '#1a1008';
    const bodyEdge = 'rgba(255,235,200,0.75)';
    const bodyEdgeW = 1.4;

    // 双腿（蹲姿，画在上身之前避免遮挡）
    ctx.fillStyle = '#0e0804';
    ctx.beginPath();
    // 左腿（大腿+膝盖+小腿，蹲姿）
    ctx.moveTo(wx - 10, wy - 8);
    ctx.lineTo(wx - 4, wy - 14);
    ctx.lineTo(wx + 4, wy - 12);
    ctx.lineTo(wx + 8, wy - 4);
    ctx.lineTo(wx + 12, wy);
    ctx.lineTo(wx - 14, wy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = bodyEdge;
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // 脚（靴子）
    ctx.fillStyle = '#0a0604';
    ctx.fillRect(wx - 14, wy - 2, 8, 4);
    ctx.fillRect(wx + 4, wy - 2, 8, 4);

    // 上身（蹲姿俯身，梯形）
    ctx.fillStyle = bodyFill;
    ctx.beginPath();
    ctx.moveTo(wx - 10, wy - 22);
    ctx.lineTo(wx + 12, wy - 24);   // 肩膀（前倾）
    ctx.lineTo(wx + 18, wy - 12);  // 手肘
    ctx.lineTo(wx + 14, wy - 6);   // 前伸的手
    ctx.lineTo(wx + 4, wy - 8);    // 腹前
    ctx.lineTo(wx - 4, wy - 8);
    ctx.lineTo(wx - 12, wy - 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = bodyEdge;
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // 后脑勺
    ctx.fillStyle = bodyFill;
    ctx.beginPath();
    ctx.arc(wx + 8, wy - 28, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = bodyEdge;
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // 草帽（大圆帽檐 + 高帽顶）
    ctx.fillStyle = '#d4b070';
    ctx.beginPath();
    ctx.ellipse(wx + 8, wy - 32, 16, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 帽顶（圆锥）
    ctx.fillStyle = '#e0c088';
    ctx.beginPath();
    ctx.moveTo(wx + 2, wy - 32);
    ctx.lineTo(wx + 14, wy - 32);
    ctx.lineTo(wx + 12, wy - 40);
    ctx.lineTo(wx + 4, wy - 40);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 帽顶高光
    ctx.fillStyle = 'rgba(255,240,200,0.6)';
    ctx.fillRect(wx + 6, wy - 40, 4, 1.5);
    // 帽带（红色醒目）
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(wx + 4, wy - 34, 8, 2);

    // 前伸的手臂 + 工具
    if (hasTool) {
      // 手铲：木柄 + 金属头（斜插在土里）
      ctx.save();
      ctx.translate(wx + 20, wy - 8);
      ctx.rotate(-0.55);
      // 手臂（从手肘伸出）
      ctx.fillStyle = bodyFill;
      ctx.fillRect(-1, -8, 3, 10);
      // 手铲柄
      ctx.fillStyle = '#6a4a24';
      ctx.fillRect(-1.5, 0, 3, 14);
      // 手铲头（梯形金属）
      ctx.fillStyle = '#8a8a92';
      ctx.beginPath();
      ctx.moveTo(-5, 14); ctx.lineTo(5, 14);
      ctx.lineTo(3.5, 20); ctx.lineTo(-3.5, 20);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#2a2a32';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      // 金属反光
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(-3, 15, 6, 1);
      ctx.restore();
    } else {
      // 毛刷：短柄 + 白色毛束
      ctx.save();
      ctx.translate(wx + 20, wy - 8);
      ctx.rotate(0.4);
      // 手臂
      ctx.fillStyle = bodyFill;
      ctx.fillRect(-1, -8, 3, 10);
      // 刷柄
      ctx.fillStyle = '#6a4a24';
      ctx.fillRect(-1.5, 0, 3, 10);
      // 毛束（浅色）
      ctx.fillStyle = '#f0e8d0';
      ctx.fillRect(-4, 10, 8, 4);
      // 毛束细丝
      ctx.fillStyle = '#c8b888';
      for (let b = -4; b <= 4; b += 2) {
        ctx.fillRect(b, 14, 0.8, 3);
      }
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- ⑥ 竹编土筐 ----------
  // 探方边土堆旁放竹筐（挖出土的临时容器）
  const basketX = px + pw - 90;
  const basketY = py + 24;
  // 筐体（梯形，竹条纹理）
  ctx.fillStyle = '#7a5830';
  ctx.beginPath();
  ctx.moveTo(basketX, basketY - 14);
  ctx.lineTo(basketX + 40, basketY - 14);
  ctx.lineTo(basketX + 34, basketY + 8);
  ctx.lineTo(basketX + 6, basketY + 8);
  ctx.closePath();
  ctx.fill();
  // 竹条竖纹
  ctx.strokeStyle = 'rgba(30,20,10,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const bx = basketX + 4 + i * 6.5;
    ctx.beginPath();
    ctx.moveTo(bx, basketY - 14);
    ctx.lineTo(bx + 1, basketY + 8);
    ctx.stroke();
  }
  // 竹条横纹
  for (let i = 0; i < 3; i++) {
    const by = basketY - 10 + i * 6;
    ctx.beginPath();
    ctx.moveTo(basketX + 2 + i, by);
    ctx.lineTo(basketX + 38 - i, by);
    ctx.stroke();
  }
  // 筐沿（竹条压边）
  ctx.fillStyle = '#5c3e1a';
  ctx.fillRect(basketX - 2, basketY - 16, 44, 3);
  // 筐里的土（松散黄土）
  ctx.fillStyle = '#9a7040';
  ctx.beginPath();
  ctx.moveTo(basketX + 2, basketY - 14);
  ctx.lineTo(basketX + 12, basketY - 18);
  ctx.lineTo(basketX + 20, basketY - 14);
  ctx.lineTo(basketX + 30, basketY - 20);
  ctx.lineTo(basketX + 38, basketY - 14);
  ctx.lineTo(basketX + 40, basketY - 14);
  ctx.lineTo(basketX, basketY - 14);
  ctx.closePath();
  ctx.fill();
  // 筐里的土颗粒
  ctx.fillStyle = 'rgba(60,40,20,0.6)';
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(basketX + 4 + i * 6, basketY - 15 - (i % 2) * 3, 1, 1);
  }

  // ---------- ⑦ 麻袋 ----------
  const sackX = px + 60;
  const sackY = py + 20;
  ctx.fillStyle = '#6a5030';
  ctx.beginPath();
  ctx.moveTo(sackX, sackY);
  ctx.lineTo(sackX + 26, sackY);
  ctx.lineTo(sackX + 22, sackY - 24);
  ctx.lineTo(sackX + 4, sackY - 24);
  ctx.closePath();
  ctx.fill();
  // 袋口
  ctx.fillStyle = '#4a3018';
  ctx.fillRect(sackX + 4, sackY - 26, 18, 4);
  // 麻袋纹理
  ctx.strokeStyle = 'rgba(30,20,10,0.4)';
  ctx.lineWidth = 0.8;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(sackX + 2, sackY - 4 - i * 5);
    ctx.lineTo(sackX + 24, sackY - 4 - i * 5);
    ctx.stroke();
  }

  // ---------- ⑧ 记录本 + 皮尺（散落在踏面/主平台边缘） ----------
  // 记录本（白色本 + 黑线）
  ctx.fillStyle = '#e8e0c8';
  ctx.fillRect(px + pw * 0.55, py + 12, 18, 12);
  ctx.strokeStyle = '#3a2818';
  ctx.lineWidth = 0.6;
  ctx.strokeRect(px + pw * 0.55, py + 12, 18, 12);
  ctx.strokeStyle = 'rgba(30,20,10,0.5)';
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(px + pw * 0.55 + 2, py + 14 + i * 2.5);
    ctx.lineTo(px + pw * 0.55 + 16, py + 14 + i * 2.5);
    ctx.stroke();
  }
  // 笔
  ctx.fillStyle = '#c8a030';
  ctx.fillRect(px + pw * 0.55 + 20, py + 15, 10, 2);
  ctx.fillStyle = '#2a1810';
  ctx.fillRect(px + pw * 0.55 + 28, py + 15, 2, 2);

  // ---------- ⑨ 探方边缘散落的小陶片 & 青铜碎片 ----------
  // 每段平台 2-3 个
  const fragCount = 3;
  for (let i = 0; i < fragCount; i++) {
    const fx = px + 40 + ((plIdx * 53 + i * 137) % (pw - 60));
    const fy = py + 40 + ((plIdx * 31 + i * 61) % (ph - 60));
    const type = (plIdx + i) % 3;
    if (type === 0) {
      // 陶片（褐红）
      ctx.fillStyle = '#a05a30';
      ctx.beginPath();
      ctx.moveTo(fx, fy); ctx.lineTo(fx + 8, fy - 2);
      ctx.lineTo(fx + 10, fy + 3); ctx.lineTo(fx + 3, fy + 5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    } else if (type === 1) {
      // 青铜碎片（绿锈）
      ctx.fillStyle = '#4a8a6a';
      ctx.beginPath();
      ctx.moveTo(fx, fy); ctx.lineTo(fx + 10, fy - 3);
      ctx.lineTo(fx + 12, fy + 2); ctx.lineTo(fx + 4, fy + 4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    } else {
      // 石子
      ctx.fillStyle = 'rgba(80,60,40,0.6)';
      ctx.beginPath();
      ctx.arc(fx, fy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- ⑩ 探方口边缘红绳警戒线 ----------
  // 探方边界沿坑壁顶沿拉一条红绳（警戒线）
  ctx.strokeStyle = 'rgba(180,60,50,0.55)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([8, 5]);
  ctx.beginPath();
  ctx.moveTo(px, py - 4);
  ctx.lineTo(px + pw, py - 4);
  ctx.stroke();
  ctx.setLineDash([]);
  // 木桩（沿探方边界，每 40px 一根）
  for (let i = 0; i < pw; i += 40) {
    const pX = px + i;
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(pX, py - 10, 4, 10);
    ctx.fillStyle = 'rgba(255,220,180,0.4)';
    ctx.fillRect(pX, py - 10, 4, 2);
  }
}

/* ================= 青铜锈 / 土沁 质感层 ================= */
const patinaCv = document.createElement('canvas');
patinaCv.width = 512; patinaCv.height = 288;
(function buildPatina() {
  const c = patinaCv.getContext('2d');
  let s = 20261024;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  // 斑驳锈块
  for (let i = 0; i < 2200; i++) {
    const x = rnd() * 512, y = rnd() * 288, r = 2 + rnd() * 12;
    const t = rnd();
    c.fillStyle = t < 0.42 ? `rgba(120,190,150,${0.03 + rnd() * 0.06})`
      : t < 0.72 ? `rgba(200,155,90,${0.02 + rnd() * 0.05})`
      : t < 0.9 ? `rgba(210,235,215,${0.015 + rnd() * 0.03})`
      : `rgba(12,22,18,${0.04 + rnd() * 0.07})`;
    c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
  }
  // 细坑蚀点
  for (let i = 0; i < 2600; i++) {
    c.fillStyle = `rgba(8,16,12,${0.05 + rnd() * 0.12})`;
    c.fillRect(rnd() * 512, rnd() * 288, 1.4, 1.4);
  }
})();

function drawPatina() {
  ctx.save();
  ctx.globalAlpha = 0.62;
  ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(patinaCv, 0, 0, W, H);
  ctx.restore();
}

/* 器物边框：把画面当作一件出土器物来装裱 */
function drawFrame() {
  ctx.save();
  ctx.strokeStyle = 'rgba(198,168,106,0.40)';
  ctx.lineWidth = 2;
  ctx.strokeRect(14, 14, W - 28, H - 28);
  ctx.strokeStyle = 'rgba(198,168,106,0.15)';
  ctx.lineWidth = 1;
  ctx.strokeRect(24, 24, W - 48, H - 48);
  // 四角云雷纹
  ctx.strokeStyle = 'rgba(214,184,118,0.52)';
  ctx.lineWidth = 2.5;
  const L = 30, o = 22;
  const corners = [[o, o, 1, 1], [W - o, o, -1, 1], [o, H - o, 1, -1], [W - o, H - o, -1, -1]];
  for (const c of corners) {
    const x = c[0], y = c[1], sx = c[2], sy = c[3];
    ctx.beginPath();
    ctx.moveTo(x + sx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * L);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + sx * L * 0.55, y + sy * 8);
    ctx.lineTo(x + sx * 8, y + sy * 8);
    ctx.lineTo(x + sx * 8, y + sy * L * 0.55);
    ctx.stroke();
  }
  ctx.restore();
}

/* 文物影像淡层：以叠加光的形式融入场景，而非贴图水印 */
function drawArtifactGhost(alpha, dh, wx) {
  if (!posterReady) return;
  const dw = dh * (CROP.sw / CROP.sh);
  const x = wx - cam.x * 0.22;
  if (x + dw < -80 || x - dw > W + 80) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.drawImage(poster, CROP.sx, CROP.sy, CROP.sw, CROP.sh, x - dw / 2, H * 0.54 - dh / 2, dw, dh);
  ctx.restore();
}

/* ================= 火焰 / 锈刺 造型 ================= */
// 把点列连成平滑闭合轮廓（避免锯齿）
function smoothClosed(pts) {
  const n = pts.length;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]);
  ctx.beginPath();
  ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) {
    const cur = pts[i], nxt = pts[(i + 1) % n];
    const m = mid(cur, nxt);
    ctx.quadraticCurveTo(cur[0], cur[1], m[0], m[1]);
  }
  ctx.closePath();
  ctx.fill();
}

// 生成火焰轮廓：左右两条带湍流的曲线 + 顶端参差火舌
function buildFlame(cx, gy, h, w, tips, ph, spd, turb) {
  const pts = [];
  const N = 6, CAP = 0.86;
  for (let i = 0; i <= N; i++) {           // 左缘自下而上
    const p = i / N * CAP;
    const halfW = w * 0.5 * Math.pow(1 - p, 0.72);
    const t = Math.sin(tGlobal * spd + ph + p * 5.0) * turb * w * 0.26 * (0.3 + p);
    pts.push([cx + t - halfW, gy - h * p]);
  }
  const topY = gy - h * CAP;
  for (let k = 0; k < tips; k++) {          // 顶端独立火舌
    const q = (k + 0.5) / tips;
    const x = cx + (q - 0.5) * w * 0.66;
    const tipH = h * (0.10 + 0.30 * (0.5 + 0.5 * Math.sin(tGlobal * spd * 1.45 + ph + k * 2.3)));
    const lean = Math.sin(tGlobal * spd * 1.15 + ph + k * 1.9) * w * 0.18;
    pts.push([x + lean, topY - tipH]);
    if (k < tips - 1) {
      const nx = cx + ((k + 1) / tips - 0.5) * w * 0.66;
      pts.push([(x + nx) / 2, topY + h * 0.09]);
    }
  }
  for (let i = N; i >= 0; i--) {            // 右缘自上而下
    const p = i / N * CAP;
    const halfW = w * 0.5 * Math.pow(1 - p, 0.72);
    const t = Math.sin(tGlobal * spd * 1.23 + ph + 2.1 + p * 4.6) * turb * w * 0.26 * (0.3 + p);
    pts.push([cx + t + halfW, gy - h * p]);
  }
  return pts;
}

// 四层叠加的焰体：暗红轮廓 → 橙 → 金黄 → 白核
function drawFlame(cx, gy, hgt, w) {
  const layers = [
    { sw: 1.00, ww: 1.00, ph: 0.0, spd: 5.2, tips: 3, turb: 1.0, f: 'rgba(148,30,10,0.42)' },
    { sw: 0.78, ww: 0.80, ph: 1.9, spd: 7.1, tips: 4, turb: 0.85, f: 'rgba(255,110,30,0.55)' },
    { sw: 0.53, ww: 0.56, ph: 3.6, spd: 9.4, tips: 4, turb: 0.65, f: 'rgba(255,182,72,0.60)' },
    { sw: 0.29, ww: 0.32, ph: 5.2, spd: 12.3, tips: 3, turb: 0.45, f: 'rgba(255,246,206,0.72)' }
  ];
  for (let i = 0; i < layers.length; i++) {
    const L = layers[i];
    ctx.globalCompositeOperation = i === 0 ? 'source-over' : 'lighter';
    ctx.fillStyle = L.f;
    smoothClosed(buildFlame(cx, gy, hgt * L.sw, w * L.ww, L.tips, L.ph, L.spd, L.turb));
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ================= 危险物绘制 ================= */
function drawHazards() {
  for (const h of haz) {
    if (h.t === 'laser') {
      const cx = (h.cur === undefined ? h.x0 : h.cur) - cam.x;
      const ceilY = h.y - 60;   // 灯头所在天花板面
      const lensY = ceilY + 18; // 灯头底部（光束从这里射出）
      const groundY = h.y + h.hgt;
      const beamH = groundY - lensY;
      const halfTop = 10, halfBot = 32; // 灯口窄 → 地面宽

      // ---------- 天花板轨道 ----------
      ctx.fillStyle = 'rgba(8,6,4,0.6)';
      ctx.fillRect(cx - 74, ceilY - 6, 148, 6);
      ctx.fillStyle = 'rgba(30,22,14,0.9)';
      ctx.fillRect(cx - 70, ceilY - 2, 140, 2);

      // ---------- 灯体：导轨卡扣 → 灯筒 → 灯头 ----------
      // 卡扣
      ctx.fillStyle = '#2a2418';
      ctx.fillRect(cx - 3, ceilY - 4, 6, 6);
      // 短颈
      ctx.fillStyle = '#3a3226';
      ctx.fillRect(cx - 2, ceilY + 2, 4, 6);
      // 灯筒（深色金属圆柱，从侧视角是矩形）
      const bodyG = ctx.createLinearGradient(cx - 16, 0, cx + 16, 0);
      bodyG.addColorStop(0, '#0f0b08');
      bodyG.addColorStop(0.35, '#4a3d2c');
      bodyG.addColorStop(0.55, '#6a5942');
      bodyG.addColorStop(1, '#140f0a');
      ctx.fillStyle = bodyG;
      ctx.fillRect(cx - 16, ceilY + 8, 32, 18);
      // 灯筒下缘
      ctx.fillStyle = '#1a140d';
      ctx.fillRect(cx - 18, ceilY + 25, 36, 3);
      // 灯头（发光的玻璃透镜）
      const lensG = ctx.createRadialGradient(cx, ceilY + 27, 1, cx, ceilY + 27, 14);
      lensG.addColorStop(0, 'rgba(255,252,220,1)');
      lensG.addColorStop(0.45, 'rgba(255,232,160,0.9)');
      lensG.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = lensG;
      ctx.beginPath();
      ctx.ellipse(cx, ceilY + 27, 13, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,240,0.95)';
      ctx.beginPath();
      ctx.ellipse(cx, ceilY + 26.5, 5, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ---------- 体积光锥（灯口 → 地面，上窄下宽） ----------
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // 外层柔光
      const coneG1 = ctx.createLinearGradient(0, lensY, 0, groundY);
      coneG1.addColorStop(0, 'rgba(255,240,180,0.65)');
      coneG1.addColorStop(0.5, 'rgba(255,220,140,0.28)');
      coneG1.addColorStop(1, 'rgba(255,200,100,0.08)');
      ctx.fillStyle = coneG1;
      ctx.beginPath();
      ctx.moveTo(cx - halfTop, lensY);
      ctx.lineTo(cx + halfTop, lensY);
      ctx.lineTo(cx + halfBot, groundY);
      ctx.lineTo(cx - halfBot, groundY);
      ctx.closePath();
      ctx.fill();
      // 中间层核心亮
      const coneG2 = ctx.createLinearGradient(0, lensY, 0, groundY);
      coneG2.addColorStop(0, 'rgba(255,252,220,0.9)');
      coneG2.addColorStop(0.5, 'rgba(255,236,170,0.5)');
      coneG2.addColorStop(1, 'rgba(255,220,140,0.18)');
      ctx.fillStyle = coneG2;
      ctx.beginPath();
      ctx.moveTo(cx - 4, lensY);
      ctx.lineTo(cx + 4, lensY);
      ctx.lineTo(cx + 10, groundY);
      ctx.lineTo(cx - 10, groundY);
      ctx.closePath();
      ctx.fill();
      // 光束内空气尘埃（3 层视差漂浮）
      for (let k = 0; k < 14; k++) {
        const tt = ((tGlobal * 0.35 + k * 0.19) % 1 + 1) % 1;
        const y = lensY + tt * beamH;
        const halfHere = halfTop + (halfBot - halfTop) * tt;
        const dx = Math.sin(k * 2.31 + tGlobal * 0.9) * halfHere * 0.75;
        const alpha = (1 - Math.abs(tt - 0.5) * 2) * 0.6;
        ctx.fillStyle = `rgba(255,240,190,${alpha})`;
        ctx.beginPath();
        ctx.arc(cx + dx, y, 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // ---------- 地面光池 ----------
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const poolG = ctx.createRadialGradient(cx, groundY, 4, cx, groundY, 68);
      poolG.addColorStop(0, 'rgba(255,244,200,0.6)');
      poolG.addColorStop(0.5, 'rgba(255,210,130,0.22)');
      poolG.addColorStop(1, 'rgba(255,180,80,0)');
      ctx.fillStyle = poolG;
      ctx.beginPath();
      ctx.ellipse(cx, groundY, 70, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      continue;
    }
