function resetTutHints(idx) {
  const src = TUT_HINTS_BY_LEVEL[idx] || [];
  // 用浅拷贝生成"本次游玩"的实例，避免复发时复用 done/t 状态
  TUT_HINTS = src.map(h => ({ x: h.x, text: h.text, done: false, t: -1 }));
}
function updateTutHints(dt) {
  if (state !== 'play') return;
  for (const h of TUT_HINTS) {
    if (!h.done && player.x > h.x) { h.done = true; h.t = 3.6; }
    if (h.t > 0) h.t -= dt;
  }
}

function levelStart(i) {
  if (i < 0 || i >= LEVELS.length) i = 0;
  loadLevel(i);
  state = 'intro';
  stateT = 0;
  acc = 0;
  resetTutHints(i);  // P0.4 / P1.4：按关卡载入对应教学提示并重置进度
  touchReset();      // P0.5：切换关卡时清空按键残留
  sfxStart();
}

function loadLevel(i) {
  levelIdx = i;
  level = LEVELS[i];
  player.x = level.spawn.x;
  player.y = level.spawn.y;
  player.vx = player.vy = 0;
  player.grounded = false;
  player.coyote = 0;
  player.buffer = 0;
  player.face = 1;
  player.sx = player.sy = 1;
  player.inv = 0;
  player.hp = MAXHP;
  cam.x = 0;
  collected = 0;
  motes.length = 0;
  level.motes.forEach((m, mi) => motes.push({ x: m.x, y: m.y, taken: false, shardIdx: mi % 18 }));
  burst = [];
  haz = (level.hazards || []).map((h, hi) => {
    const c = Object.assign({}, h, { rect: null, cur: 0, firing: false });
    // rock 专属：每块土块形态都不同（真夯土块从坑壁脱落，形状不规则）
    if (h.t === 'rock') {
      // 6 个环状不规则顶点（归一化 [-1,1]，绘制时按 size 缩放）
      const n = 8;   // 6 边形太规整，一眼就是"几何图形"；8 点更接近碎土块
      const pts = [];
      const jitSeed = (h.x + hi * 7) * 13;
      const rnd = () => {
        const s = Math.sin(jitSeed + pts.length * 13.37) * 43758.5453;
        return s - Math.floor(s);
      };
      for (let k = 0; k < n; k++) {
        const ang = (k / n) * Math.PI * 2 + rnd() * 0.45;
        const r = 0.72 + rnd() * 0.33;  // 半径 0.72–1.05 的随机扰动
        pts.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r * (0.85 + rnd() * 0.25) });
      }
      c.shape = pts;
      // 2 条主裂纹（从内部一点出发，两个方向）
      c.cracks = [];
      for (let k = 0; k < 2; k++) {
        c.cracks.push({
          x0: (rnd() - 0.5) * 0.5, y0: (rnd() - 0.5) * 0.5,
          x1: (rnd() - 0.5) * 1.4, y1: (rnd() - 0.5) * 1.2
        });
      }
      c.crackLen = 2;
      // 表面碎屑点（3 个）
      c.chips = [];
      for (let k = 0; k < 3; k++) {
        c.chips.push({
          x: (rnd() - 0.5) * 0.9, y: (rnd() - 0.5) * 0.7,
          s: 0.6 + rnd() * 0.6
        });
      }
      // 状态机（覆盖旧字段）
      c.phase = 'idle';
      c.tInPhase = 0;
      c.warnTotal = h.warn;
      c.onTotal = h.on;
      c.offTotal = h.off;
      c.cx = h.yTop;
      c.vy = 0;
      c.vr = (rnd() - 0.5) * 6;
      c.rot = 0;
      c.phaseP = 0;
      c.impactT = 0;
      c.shakePhase = rnd() * Math.PI * 2;
      c.dropped = 0;
      c.shards = null;
      c.dust = null;
      c.pit = null;
      c._warnPlayed = false;
      c._impactPlayed = false;
      c.rect = null;
    }
    return c;
  });
  lineIdx = 0;
  // 新关开场：优先播放本关的 storyHook 历史锚点字幕（6.5 秒）
  sub = level.storyHook ? { text: level.storyHook, life: 6.5, max: 6.5 } : null;
  hurtFlash = 0;
  deathTimer = 0;
  shakeT = 0;
}

function respawn() {
  player.x = level.spawn.x;
  player.y = level.spawn.y;
  player.vx = player.vy = 0;
  player.inv = 0.8;
  player.hp = MAXHP;
  deathTimer = 0;
  if (player._trail) player._trail.length = 0;
}

/* 受伤：扣血 + 无敌 + 击退；血量归零后整关重来 */
function hurt(fromX) {
  if (player.inv > 0 || deathTimer > 0) return;
  player.hp--;
  player.inv = 0.95;
  hurtFlash = 0.4;
  shakeT = 0.28;
  player.vx = (player.x < fromX ? -1 : 1) * 320;
  player.vy = -440;
  player.grounded = false;
  sfxHit();
  if (player.hp <= 0) { deathTimer = 0.95; deathFlashOn(); sfxDeath(); }
}
function deathFlashOn() { hurtFlash = 1.0; }

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* 关卡进度 0→1（用于"越接近终点，时代侵蚀越深"的叙事渐变） */
function levelProgress() {
  const a = level.spawn.x, b = level.goal.x;
  return clamp((player.x - a) / (b - a), 0, 1);
}

/* ================= 危险物 ================= */
function updateHazards(dt) {
  const hw = player.r * HAZ_HW_K;
  for (const h of haz) {
    h.rect = null;
    h.firing = false;

    if (h.t === 'laser') {
      const span = h.x1 - h.x0;
      const tp = (tGlobal * h.spd / span + (h.year || 0) + (h.ph || 0)) % 2;
      const k = tp < 1 ? tp : 2 - tp;
      const cx = h.x0 + span * k;
      h.firing = true;
      h.cur = cx;
      h.rect = { x: cx - h.w / 2, y: h.y, w: h.w, h: h.hgt };
    } else if (h.t === 'rock') {
      // 状态机：idle → precursor（边缘碎屑先兆）→ shaking（颤动加剧+下沉）→ falling（重力加速）→ impact（撞击碎块+坑痕）→ idle
      h.tInPhase = (h.tInPhase || 0) + dt;
      const precT = Math.max(0.20, h.warnTotal * 0.45);  // 先兆时长
      const shakeT_ = Math.max(0.30, h.warnTotal - precT); // 颤动加剧时长
      // 分阶段判定（基于 tGlobal，保证多 rock 相位错开）
      const per = h.warnTotal + h.onTotal + h.offTotal + 0.05;
      const tp = (tGlobal + (h.ph || 0)) % per;
      h.warning = false;
      h.firing = false;

      if (tp < precT) {
        // precursor：土块位置不动，只出现边缘碎屑先兆
        h.phase = 'precursor';
        h.cx = h.yTop;
        h.phaseP = tp / precT;
        if (!h._warnPlayed) { sfxRockWarn(); h._warnPlayed = true; }
      } else if (tp < precT + shakeT_) {
        // shaking：颤动加剧 + 缓慢下沉 4px
        h.phase = 'shaking';
        h.phaseP = (tp - precT) / shakeT_;
        h.cx = h.yTop + 4 * Math.min(1, h.phaseP);
      } else if (tp < precT + shakeT_ + h.onTotal) {
        // falling：重力加速坠落
        h.phase = 'falling';
        h._warnPlayed = false;
        h.firing = true;
        const fallT = tp - precT - shakeT_;
        // 目标距离
        const dist = h.gy - h.yTop - h.size - 4;
        // 用二次方程反解 g，使 fallT 时刚好落地：dist = 0.5 * g * t^2
        const g = 2 * dist / (h.onTotal * h.onTotal);
        h.cx = h.yTop + 4 + 0.5 * g * fallT * fallT;
        h.vy = g * fallT;
        h.rot = h.vr * fallT;
        // 撞击判定
        if (h.cx >= h.gy - h.size) {
          h.cx = h.gy - h.size;
          h.phase = 'impact';
          h.phaseP = 0;
          h._impactPlayed = false;
          // 生成碎块：1 主残块（原 rock 主体，较小，落到地面）+ 2 小碎片飞散
          h.shards = [];
          // 主残块：size 缩到 0.55，作为"碎裂后剩下的核心"
          h.shards.push({
            x: h.x + (Math.random() - 0.5) * 6, y: h.gy - h.size * 0.28,
            vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 30,
            s: h.size * 0.55, rot: Math.random() * 0.6 - 0.3, vr: (Math.random() - 0.5) * 3,
            shape: h.shape, cracks: h.cracks, chips: h.chips,
            life: 2.0, t: 0, main: true
          });
          // 2 小碎片：从撞击点扇形飞出
          for (let k = 0; k < 2; k++) {
            const ang = -Math.PI / 2 + (k === 0 ? -1 : 1) * (0.55 + Math.random() * 0.3);
            const spd = 240 + Math.random() * 180;
            h.shards.push({
              x: h.x + (Math.random() - 0.5) * h.size * 0.4, y: h.gy - 6,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
              s: 4 + Math.random() * 5, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
              life: 0.7 + Math.random() * 0.3, t: 0, main: false
            });
          }
          // 扬尘
          h.dust = [];
          for (let k = 0; k < 10; k++) {
            const ang = -Math.PI + Math.random() * Math.PI;
            const spd = 40 + Math.random() * 90;
            h.dust.push({
              x: h.x + (Math.random() - 0.5) * h.size * 0.8, y: h.gy - 4,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd * 0.6 - 30,
              life: 0.6 + Math.random() * 0.4, t: 0, s: 2 + Math.random() * 3
            });
          }
          // 坑痕
          h.pit = { x: h.x, life: 4.5, t: 0 };
          shakeT = Math.max(shakeT, 0.28);
        }
      } else if (tp < precT + shakeT_ + h.onTotal + 0.30) {
        // impact：撞击后短暂表现（碎片飞出、扬尘扩散、坑痕形成）
        h.phase = 'impact';
        h.cx = h.gy - h.size;
        h.phaseP = (tp - precT - shakeT_ - h.onTotal) / 0.30;
        if (!h._impactPlayed) { sfxRockImpact(); h._impactPlayed = true; }
      } else {
        // idle：等待下一次
        h.phase = 'idle';
        h.cx = h.yTop;
        h.phaseP = 0;
        h._warnPlayed = false;
      }

      // 更新碎块 & 扬尘
      if (h.shards) {
        for (const sd of h.shards) {
          sd.t += dt;
          sd.vy += 900 * dt;
          sd.x += sd.vx * dt; sd.y += sd.vy * dt;
          sd.rot += sd.vr * dt;
          // 主残块落地约束（不能再穿透地面）
          if (sd.main && sd.y > h.gy - sd.s / 2) {
            sd.y = h.gy - sd.s / 2;
            if (sd.vy > 0) sd.vy *= -0.15; // 微反弹
            sd.vx *= 0.6;
            sd.vr *= 0.5;
          }
        }
        h.shards = h.shards.filter(sd => sd.t < sd.life);
        if (h.shards.length === 0) h.shards = null;
      }
      if (h.dust) {
        for (const d of h.dust) {
          d.t += dt;
          d.vy += 200 * dt;
          d.x += d.vx * dt; d.y += d.vy * dt;
        }
        h.dust = h.dust.filter(d => d.t < d.life);
        if (h.dust.length === 0) h.dust = null;
      }
      if (h.pit) {
        h.pit.t += dt;
        h.pit.life -= dt;
        if (h.pit.life <= 0) h.pit = null;
      }

      // 落点 rect 只在 falling / impact 早期有效
      if (h.phase === 'falling') {
        h.rect = { x: h.x - h.size / 2, y: h.cx, w: h.size, h: h.size };
      } else if (h.phase === 'impact' && h.phaseP < 0.5) {
        h.rect = { x: h.x - h.size / 2, y: h.gy - h.size, w: h.size, h: h.size };
      }
    } else {
      const per = h.warn + h.on + h.off;
      const tp = (tGlobal + (h.ph || 0)) % per;
      h.warning = tp < h.warn;
      h.firing = tp >= h.warn && tp < h.warn + h.on;
      h.cur = h.firing ? h.hgt * Math.min(1, (tp - h.warn) / 0.13) : 0;
      // 视觉高度 curVis：熄灭后再用 0.18s 收回。
      // 碰撞仍用 h.cur（判定不变），只是别让矿刺"啪"一下凭空消失。
      h.curVis = Math.max(h.cur, (h.curVis || 0) - dt * (h.hgt / 0.18));
      if (h.firing && h.cur > 8) {
        h.rect = { x: h.x - h.w / 2, y: h.gy - h.cur, w: h.w, h: h.cur };
      }
    }

    if (h.rect && player.inv <= 0 && deathTimer <= 0) {
      const r = h.rect;
      if (player.x + hw > r.x && player.x - hw < r.x + r.w &&
          player.y + player.r > r.y && player.y - player.r < r.y + r.h) {
        hurt(r.x + r.w / 2);
      }
    }
  }
}

/* ================= 逐段旁白 ================= */
function updateSubs(dt) {
  const L = level.lines || [];
  // storyHook 未播完时不切线内旁白，避免打断开场历史锚点
  if (sub && lineIdx === 0) {
    sub.life -= dt;
    if (sub.life <= 0) sub = null;
    return;
  }
  while (lineIdx < L.length && player.x > L[lineIdx].x) {
    sub = { text: L[lineIdx].text, life: 4.8, max: 4.8 };
    lineIdx++;
  }
  if (sub) { sub.life -= dt; if (sub.life <= 0) sub = null; }
}

/* ================= 物理步进 ================= */
function step(dt) {
  const wasGrounded = player.grounded, vyBefore = player.vy;
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir !== 0) {
    player.vx += dir * ACC * dt;
    player.vx = clamp(player.vx, -SPEED, SPEED);
    player.face = dir;
  } else {
    const d = FRIC * dt;
    if (Math.abs(player.vx) <= d) player.vx = 0;
    else player.vx -= Math.sign(player.vx) * d;
  }

  if (input.jumpEdge) player.buffer = BUFFER;
  else player.buffer = Math.max(0, player.buffer - dt);

  if (player.grounded) player.coyote = COYOTE;
  else player.coyote = Math.max(0, player.coyote - dt);

  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = -JUMP;
    player.buffer = 0;
    player.coyote = 0;
    player.grounded = false;
    sfxJump();
  }
  if (!input.jumpHeld && player.vy < 0) player.vy += GRAV * 2.2 * dt;

  player.vy += GRAV * dt;
  if (player.vy > MAXFALL) player.vy = MAXFALL;

  const hw = player.r * PLAT_HW_K;

  /* --- 水平位移 + 侧向碰撞 --- */
  const prevX = player.x;
  player.x += player.vx * dt;
  for (const pl of level.plats) {
    const px = pl[0], py = pl[1], pw = pl[2], ph = pl[3];
    if (player.y + player.r > py && player.y - player.r < py + ph) {
      if (player.x + hw > px && prevX + hw <= px) { player.x = px - hw; player.vx = 0; }
      else if (player.x - hw < px + pw && prevX - hw >= px + pw) { player.x = px + pw + hw; player.vx = 0; }
    }
  }
  if (player.x < player.r) { player.x = player.r; player.vx = 0; }
  if (player.x > level.width - player.r) { player.x = level.width - player.r; player.vx = 0; }

  /* --- 垂直位移 + 扫掠落地（prevBottom 必须在积分前记录） --- */
  const prevBottom = player.y + player.r;
  const prevTop = player.y - player.r;
  player.y += player.vy * dt;

  let onGround = false;
  for (const pl of level.plats) {
    const px = pl[0], py = pl[1], pw = pl[2], ph = pl[3];
    if (player.x + hw <= px || player.x - hw >= px + pw) continue;
    if (player.vy >= 0 && prevBottom <= py + 1 && player.y + player.r >= py) {
      player.y = py - player.r;
      player.vy = 0;
      onGround = true;
    } else if (player.vy < 0 && prevTop >= py + ph - 1 && player.y - player.r <= py + ph) {
      player.y = py + ph + player.r;
      player.vy = 0;
    }
  }
  player.grounded = onGround;
  if (!wasGrounded && onGround && vyBefore > 260) sfxLand();

  if (player.y > H + 240) respawn();

  player.inv = Math.max(0, player.inv - dt);

  /* --- 收集光尘 --- */
  for (const m of motes) {
    if (m.taken) continue;
    const dx = m.x - player.x, dy = m.y - player.y;
    if (dx * dx + dy * dy < 3400) {
      m.taken = true;
      collected++;
      sfxCoin();
      player.goldFlash = 1.8;
      // 收集微震：比受伤震屏更轻微、更短促的正向反馈
      shakeT = Math.max(shakeT, 0.10);
      for (let i = 0; i < 14; i++) {
        burst.push({
          x: m.x, y: m.y,
          vx: (Math.random() - 0.5) * 220,
          vy: (Math.random() - 0.5) * 220 - 60,
          life: 0.6, max: 0.6,
          si: (i * 3 + m.shardIdx) % 18
        });
      }
    }
  }

  /* --- 相机 --- */
  const target = clamp(player.x - W * 0.38, 0, Math.max(0, level.width - W));
  cam.x += (target - cam.x) * Math.min(1, dt * 9);

  /* --- 终点判定 --- */
  const atGoal = Math.abs(player.x - level.goal.x) < 50 &&
                 Math.abs((player.y + player.r) - level.goal.y) < 100;
  if (atGoal && collected >= level.motes.length) {
    // P2.1 终点穿越动画：先进入 'entering' 过渡镜头（凝固→推门→白闪，1.6s）
    // 时长由 ENTERING_DUR 控制；完成后在 frame() 中自动切 'clear' 显示成绩页
    state = 'entering';
    stateT = 0;
    lastLevelTime = tGlobal - levelStartT;   // 本关实际用时（秒）
    recordClear(levelIdx, lastLevelTime);      // 写入存档
  }

  /* --- 挤压拉伸 --- */
  const tsx = player.grounded ? (Math.abs(player.vx) > 40 ? 1.07 : 1.01) : 0.95;
  const tsy = player.grounded ? (Math.abs(player.vx) > 40 ? 0.95 : 1.00) : 1.05;
  player.sx += (tsx - player.sx) * Math.min(1, dt * 12);
  player.sy += (tsy - player.sy) * Math.min(1, dt * 12);

  /* --- 危险物 / 旁白 / 受击表现 --- */
  updateHazards(dt);
  updateSubs(dt);
  hurtFlash = Math.max(0, hurtFlash - dt * 1.6);
  shakeT = Math.max(0, shakeT - dt);

  if (deathTimer > 0) {
    deathTimer -= dt;
    if (deathTimer <= 0) respawn();   // 血量耗尽：回出生点+回满血，保留已收集光尘（P0.2）
  }
}

/* ================= 主题配色 ================= */
const THEME = {
  forge:   { sky: ['#0a0d10', '#181008', '#2a1408'], accent: '#ff8a3c', plat: ['#4a3a2c', '#241a12'] },
  ritual:  { sky: ['#060b18', '#0d1730', '#1a1a2a'], accent: '#ffb55a', plat: ['#3a3a48', '#15151d'] },
  burial:  { sky: ['#0d0b08', '#221a12', '#2f2317'], accent: '#8fbe7a', plat: ['#4a3a28', '#1d1710'] },
  dig:     { sky: ['#1b2018', '#3a3524', '#5a4a32'], accent: '#ffe6a6', plat: ['#7a6444', '#3c3020'] },
  museum:  { sky: ['#05080c', '#0a1018', '#121a24'], accent: '#ffe9b8', plat: ['#2c2e38', '#101218'] }
};

/* ================= 背景绘制 ================= */

/* 铜锈贴图的 pattern（惰性创建一次）。
   图片没就绪时返回 null，调用方一律用 `if (rustPat)` 兜底，保证首帧/离线也出画。 */
let _rustPattern = null, _rustPatternTried = false;
function getRustPattern() {
  if (_rustPattern) return _rustPattern;
  if (_rustPatternTried) return null;
  const im = SPR.rustTex;
  if (!im || !im.complete || !im.naturalWidth) return null;
  _rustPatternTried = true;
  _rustPattern = ctx.createPattern(im, 'repeat');
  return _rustPattern;
}

function radialGlow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawSky(theme) {
  const th = THEME[theme];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(0.55, th.sky[1]);
  g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawFarMountains(par, color, baseY, amp, stepW) {
  const off = cam.x * par;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-40, H);
  for (let i = 0; i <= Math.ceil(W / stepW) + 2; i++) {
    const x = i * stepW - (off % stepW) - stepW;
    const y = baseY - Math.sin(i * 1.1 + par * 10) * amp - Math.cos(i * 0.6) * amp * 0.6;
    ctx.lineTo(x, y);
    ctx.lineTo(x + stepW / 2, y + amp * 0.7);
  }
  ctx.lineTo(W + 40, H);
  ctx.closePath();
  ctx.fill();
}

// 铸造：炉体、陶范、铜液、火星
function bgForge() {
  drawSky('forge');
  drawFarMountains(0.16, 'rgba(24,14,8,0.92)', 470, 60, 210);
  drawFarMountains(0.30, 'rgba(14,9,6,0.96)', 545, 40, 170);

  // 远处陶范（合范土块）剪影
  for (let k = 0; k < 6; k++) {
    const mx = 1300 + k * 420 - cam.x * 0.45;
    if (mx < -260 || mx > W + 260) continue;
    const mh = 150 + (k % 3) * 50;
    ctx.fillStyle = 'rgba(22,16,11,0.92)';
    ctx.beginPath();
    ctx.moveTo(mx - 70, 620);
    ctx.lineTo(mx - 54, 620 - mh);
    ctx.lineTo(mx + 54, 620 - mh);
    ctx.lineTo(mx + 70, 620);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(120,70,35,0.15)';
    ctx.fillRect(mx - 54, 620 - mh, 108, 6);
  }

  // 炉体（远处背景，视差较慢）—— 熔铜竖炉：夯土砖身 + 拱形炉膛 + 出烟口
  const fx = 260 - cam.x * 0.34;
  const flick = 0.82 + 0.18 * Math.sin(tGlobal * 7.3) + 0.08 * Math.sin(tGlobal * 13.1);
  const bodyTop = 350, bodyBot = 620;
  const furnacePath = new Path2D();
  furnacePath.moveTo(fx - 124, bodyBot);
  furnacePath.lineTo(fx - 92, 388);
  furnacePath.quadraticCurveTo(fx - 90, bodyTop, fx - 66, bodyTop);
  furnacePath.lineTo(fx + 66, bodyTop);
  furnacePath.quadraticCurveTo(fx + 90, bodyTop, fx + 92, 388);
  furnacePath.lineTo(fx + 124, bodyBot);
  furnacePath.closePath();

  const bodyG = ctx.createLinearGradient(fx - 124, 0, fx + 124, 0);
  bodyG.addColorStop(0, 'rgba(10,7,5,0.96)');
  bodyG.addColorStop(0.38, 'rgba(21,14,9,0.96)');
  bodyG.addColorStop(0.72, 'rgba(14,9,6,0.96)');
  bodyG.addColorStop(1, 'rgba(8,5,3,0.97)');
  ctx.fillStyle = bodyG;
  ctx.fill(furnacePath);

  // 夯土砖缝（裁剪进炉身）
  ctx.save();
  ctx.clip(furnacePath);
  ctx.strokeStyle = 'rgba(128,84,46,0.13)';
  ctx.lineWidth = 1;
  for (let ry = bodyTop + 16; ry < bodyBot; ry += 26) {
    ctx.beginPath();
    ctx.moveTo(fx - 132, ry);
    ctx.lineTo(fx + 132, ry);
    ctx.stroke();
    const off = ((ry / 26) | 0) % 2 ? 0 : 17;
    for (let rx = fx - 132 + off; rx < fx + 132; rx += 34) {
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx, ry + 26);
      ctx.stroke();
    }
  }
  // 炉膛透出的内壁暖光
  const innerG = ctx.createRadialGradient(fx, 432, 8, fx, 432, 148);
  innerG.addColorStop(0, `rgba(255,124,42,${0.22 * flick})`);
  innerG.addColorStop(1, 'rgba(255,110,35,0)');
  ctx.fillStyle = innerG;
  ctx.fillRect(fx - 132, bodyTop, 264, bodyBot - bodyTop);
  ctx.restore();

  // 炉身左侧受火光的轮廓亮边
  ctx.strokeStyle = `rgba(255,150,70,${0.16 * flick})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(fx - 124, bodyBot);
  ctx.lineTo(fx - 92, 388);
  ctx.quadraticCurveTo(fx - 90, bodyTop, fx - 66, bodyTop);
  ctx.stroke();

  // 出烟口 + 烟囱
  ctx.fillStyle = 'rgba(11,7,4,0.97)';
  ctx.fillRect(fx + 26, 292, 36, 60);
  ctx.fillStyle = 'rgba(128,84,46,0.18)';
  ctx.fillRect(fx + 24, 290, 40, 6);
  ctx.save();
  for (let i = 0; i < 5; i++) {
    const p = ((tGlobal * 0.20 + i * 0.21) % 1);
    const sy = 288 - p * 190;
    const sx = fx + 44 + Math.sin(tGlobal * 0.6 + i * 1.3) * 12 + p * 26;
    ctx.fillStyle = `rgba(118,104,96,${(1 - p) * 0.12})`;
    ctx.beginPath();
    ctx.ellipse(sx, sy, 9 + p * 26, 7 + p * 17, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 拱形炉膛（砖砌拱券 + 膛内火焰）
  const mW = 60, mTop = 394, mBot = 486;
  const mouthPath = new Path2D();
  mouthPath.moveTo(fx - mW, mBot);
  mouthPath.lineTo(fx - mW, mTop + 30);
  mouthPath.quadraticCurveTo(fx - mW, mTop, fx, mTop);
  mouthPath.quadraticCurveTo(fx + mW, mTop, fx + mW, mTop + 30);
  mouthPath.lineTo(fx + mW, mBot);
  mouthPath.closePath();
  // 拱券砖边
  ctx.save();
  ctx.strokeStyle = 'rgba(150,98,54,0.30)';
  ctx.lineWidth = 7;
  ctx.stroke(mouthPath);
  ctx.restore();
  // 膛内暗底 + 火焰
  ctx.save();
  ctx.clip(mouthPath);
  ctx.fillStyle = 'rgba(6,3,2,0.98)';
  ctx.fillRect(fx - mW, mTop - 4, mW * 2, mBot - mTop + 8);
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(fx, mBot - 26, 96 * flick, 'rgba(255,120,40,0.34)');
  radialGlow(fx, mBot - 34, 58 * flick, 'rgba(255,186,86,0.42)');
  for (let i = 0; i < 3; i++) {
    const fh = (34 + i * 16) * (0.78 + 0.22 * Math.sin(tGlobal * 6.4 + i * 1.9));
    const fw = 26 - i * 6;
    const bx = fx + Math.sin(tGlobal * 2.3 + i * 2.1) * 7;
    const fg = ctx.createLinearGradient(0, mBot - 4, 0, mBot - 4 - fh);
    fg.addColorStop(0, i === 0 ? 'rgba(255,226,150,0.92)' : 'rgba(255,150,56,0.85)');
    fg.addColorStop(0.55, 'rgba(255,120,36,0.55)');
    fg.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(bx - fw, mBot - 2);
    ctx.quadraticCurveTo(bx - fw * 0.6, mBot - 4 - fh * 0.6, bx, mBot - 4 - fh);
    ctx.quadraticCurveTo(bx + fw * 0.6, mBot - 4 - fh * 0.6, bx + fw, mBot - 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 炉膛里的金面：每隔一阵从火里跃出来一次（叙事：金面诞生于这口炉）
  {
    const CYC = 6.5;
    const lp = (tGlobal % CYC) / CYC;
    if (lp < 0.46) {
      const u = lp / 0.46;
      const eu = 1 - Math.pow(1 - u, 3);
      const hx = fx + 30 * eu;
      const hy = (mBot - 26) + (mTop - 138 - (mBot - 26)) * Math.sin(u * Math.PI * 0.5);
      const hr = 11 + 9 * eu;
      const ha = Math.min(1, u * 7) * (1 - clamp((u - 0.70) / 0.30, 0, 1));

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      radialGlow(hx, hy + hr * 0.3, hr * 3.6, 'rgba(255,206,110,' + (0.13 * ha).toFixed(3) + ')');
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = ha;
      drawHead(hx, hy, hr, { angle: -0.5 * (1 - eu), sx: 1, sy: 1, blink: 0, flat: false, era: 'forge', progressK: 0 });
      ctx.restore();
    }
  }

  // 上升火星
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 60; i++) {
    const seed = i * 137.5;
    const rise = (tGlobal * (48 + (i % 6) * 22) + seed * 3.7) % 820;
    const px = fx + Math.sin(tGlobal * 1.4 + seed) * (40 + (i % 5) * 18);
    const py = 452 - rise;
    if (py < -20 || py > H + 20) continue;
    const a = Math.max(0, 0.62 * (1 - rise / 800)) * (0.5 + 0.5 * Math.abs(Math.sin(tGlobal * 4 + i)));
    ctx.fillStyle = `rgba(255,${140 + (i % 70)},60,${a})`;
    ctx.fillRect(px, py, 2.4, 2.4);
  }
  ctx.restore();

  // 地面铜液流
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const y = 636 + i * 15;
    const ph = Math.sin(tGlobal * 1.4 + i) * 0.5 + 0.5;
    ctx.strokeStyle = `rgba(255,${90 + i * 22},30,${0.10 + ph * 0.14})`;
    ctx.lineWidth = 2 + ph * 2.4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, y + Math.sin((x + cam.x) * 0.01 + tGlobal * 2 + i) * 7);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ================= 第 2 关 · 祭祀现场 =================
   叙事：这一夜，整片原野就是祭坛。关卡沿 x 轴铺开一场完整仪式的动线——
     起点：夯土台地、玉璋插地、象牙与陶尊（献祭之物被搬上台）
     中段：青铜神树与主祭大立人，跪拜者成列，火盆一路点到天边
     终点：燎祭大火（烟柱冲天，铜头被火镀成琥珀）
   全部按世界坐标 + 分层视差绘制，玩家从左走到右 = 走完一场仪式。 */
function bgRitual() {
  drawSky('ritual');
  drawFarMountains(0.14, 'rgba(10,16,30,0.90)', 450, 70, 230);
  drawFarMountains(0.28, 'rgba(6,10,20,0.95)', 540, 45, 180);

  // ---------- ⓪ 地平线火辉：整片原野被火映成暗橙，剪影才有"逆光"可读性 ----------
  (function horizonFire() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createLinearGradient(0, 300, 0, 640);
    hg.addColorStop(0, 'rgba(255,120,40,0)');
    hg.addColorStop(0.55, 'rgba(255,118,44,0.10)');
    hg.addColorStop(0.86, 'rgba(255,146,62,0.22)');
    hg.addColorStop(1, 'rgba(255,176,92,0.10)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 300, W, 340);
    // 三处远处的火头（不定位置，随视差缓慢漂移），撑起整条地平线的暖度
    for (let i = 0; i < 3; i++) {
      const fx2 = ((i * 520 + 240) - cam.x * 0.18) % (W + 400) - 200;
      const fl2 = 0.7 + 0.3 * Math.sin(tGlobal * 3.1 + i * 2.3);
      radialGlow(fx2, 600, 190 * fl2, 'rgba(255,132,48,0.13)');
    }
    ctx.restore();
  })();

  // ---------- 星 ----------
  for (let i = 0; i < 46; i++) {
    const sx = ((i * 733 + cam.x * 0.04) % W + W) % W;
    const sy = (i * 137) % 322;
    const a = 0.16 + 0.44 * Math.abs(Math.sin(tGlobal * 1.2 + i));
    ctx.fillStyle = `rgba(200,220,255,${a})`;
    ctx.fillRect(sx, sy, 1.6, 1.6);
  }

  // ---------- ⓪b 神面与火映的云：祭祀不是对着空天拜——天上有一张脸 ----------
  // 巨面浮在云里，云被地上的祭火从下方映亮。这一层负责两件事：
  // ① 补满上半屏的空黑；② 给"祭天通神"一个具体的对象。
  (function skyDeity() {
    const br = 0.5 + 0.5 * Math.sin(tGlobal * 0.28);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 低云被祭火映亮（横向铺满）
    const cg = ctx.createLinearGradient(0, 110, 0, 480);
    cg.addColorStop(0, 'rgba(255,120,40,0)');
    cg.addColorStop(0.58, `rgba(255,128,50,${(0.030 + 0.018 * br).toFixed(3)})`);
    cg.addColorStop(1, `rgba(255,156,70,${(0.075 + 0.030 * br).toFixed(3)})`);
    ctx.fillStyle = cg;
    ctx.fillRect(0, 110, W, 370);
    for (let i = 0; i < 3; i++) {
      const cx2 = ((i * 470 + 180) - cam.x * 0.10) % (W + 460) - 230;
      radialGlow(cx2, 292 + i * 46, 200 + i * 46, `rgba(255,136,54,${(0.040 + 0.018 * br).toFixed(3)})`);
    }
    // 神面：宽扁如盾、纵目、翼状大耳。
    // 画法＝整张脸先合成一条路径填成"比天更暗的剪影"，再把它当作遮罩，
    // 从下方压一层暖光——读起来是"被地上祭火从下往上照亮的巨影"，
    // 而不是一张勾了描边的卡通脸。这是它不显廉价的关键。
    const dx = 660 - cam.x * 0.08;
    const dy = 246 + Math.sin(tGlobal * 0.34) * 7;
    const fs = 5.6;
    const rimA = 0.16 + 0.10 * br;
    radialGlow(dx, dy, 340, `rgba(255,150,66,${(0.050 + 0.030 * br).toFixed(3)})`);

    // 脸 + 双耳合成一条路径（避免各部件描边互相打架）
    const facePath = () => {
      ctx.beginPath();
      ctx.moveTo(dx - 30 * fs, dy - 8 * fs);
      ctx.quadraticCurveTo(dx - 31 * fs, dy - 18.5 * fs, dx - 15 * fs, dy - 19.5 * fs);
      ctx.quadraticCurveTo(dx, dy - 21 * fs, dx + 15 * fs, dy - 19.5 * fs);
      ctx.quadraticCurveTo(dx + 31 * fs, dy - 18.5 * fs, dx + 30 * fs, dy - 8 * fs);
      ctx.quadraticCurveTo(dx + 28 * fs, dy + 5 * fs, dx + 17 * fs, dy + 11 * fs);
      ctx.quadraticCurveTo(dx, dy + 15.5 * fs, dx - 17 * fs, dy + 11 * fs);
      ctx.quadraticCurveTo(dx - 28 * fs, dy + 5 * fs, dx - 30 * fs, dy - 8 * fs);
      ctx.closePath();
      // 翼状大耳：横长、末端尖、向外上方张（三星堆面具的灵魂）
      eachSide(d => {
        ctx.moveTo(dx + d * 26 * fs, dy - 13 * fs);
        ctx.quadraticCurveTo(dx + d * 44 * fs, dy - 20 * fs, dx + d * 64 * fs, dy - 13 * fs);
        ctx.quadraticCurveTo(dx + d * 66 * fs, dy - 10 * fs, dx + d * 60 * fs, dy - 6 * fs);
        ctx.quadraticCurveTo(dx + d * 46 * fs, dy - 3 * fs, dx + d * 30 * fs, dy - 1 * fs);
        ctx.quadraticCurveTo(dx + d * 26 * fs, dy - 6 * fs, dx + d * 26 * fs, dy - 13 * fs);
        ctx.closePath();
      });
    };

    // P2.2 神面：真素材优先（SenseNova 生成的纵目青铜面具，带真实锈斑与铸造质感），
    // 未就绪时回退到下面这套手绘剪影，保证离线/首次加载也出画。
    const _dm = SPR.deity;
    if (_dm && _dm.complete && _dm.naturalWidth) {
      const DH = 430, DW = DH * _dm.naturalWidth / _dm.naturalHeight;
      // 素材已在离线阶段烘焙成"夜色铜"，这里给 0.92 让边缘和夜空略微咬合，
      // 剩下的亮度交给下面的火光叠加。
      ctx.globalAlpha = 0.92;
      ctx.drawImage(_dm, dx - DW / 2, dy - DH * 0.52, DW, DH);
      ctx.globalAlpha = 1;
      // 自下而上的祭火光：只照亮下颌一段，脸的上半仍沉在夜色里
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      radialGlow(dx, dy + DH * 0.30, DW * 0.52, `rgba(255,150,64,${(0.10 + 0.05 * br).toFixed(3)})`);
      ctx.restore();
      // 锈蚀进度：走得越远，铜绿盖得越重（天空里的"计时器"）
      const rustS = levelProgress();
      if (rustS > 0.02) {
        ctx.save();
        ctx.globalAlpha = 0.26 * rustS;
        ctx.fillStyle = '#2f7a5c';
        ctx.beginPath();
        ctx.ellipse(dx, dy + DH * 0.08, DW * 0.46, DH * 0.40, 0, 0, 6.2832);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      facePath();
    ctx.fillStyle = 'rgba(6,8,16,0.86)';
    ctx.fill();

    // 在剪影内部压一层"自下而上的火光"
    ctx.save();
    facePath();
    ctx.clip();
    const lit = ctx.createLinearGradient(0, dy + 16 * fs, 0, dy - 20 * fs);
    lit.addColorStop(0, `rgba(255,152,64,${(0.40 + 0.14 * br).toFixed(3)})`);
    lit.addColorStop(0.42, `rgba(238,126,56,${(0.16 + 0.07 * br).toFixed(3)})`);
    lit.addColorStop(1, 'rgba(120,60,30,0.02)');
    ctx.fillStyle = lit;
    ctx.fillRect(dx - 70 * fs, dy - 24 * fs, 140 * fs, 46 * fs);

    // 铜锈从下颌往上爬：这一关走多远，神面就锈多深。
    // 它是"金→锈"这条叙事主线在天上的那个计时器。
    const rust = levelProgress();
    if (rust > 0.02) {
      const rg = ctx.createLinearGradient(0, dy + 18 * fs, 0, dy - 22 * fs);
      const a0 = 0.30 * rust, a1 = 0.06 * rust;
      rg.addColorStop(0, `rgba(52,124,96,${a0.toFixed(3)})`);
      rg.addColorStop(0.55, `rgba(64,140,110,${a1.toFixed(3)})`);
      rg.addColorStop(1, 'rgba(52,124,96,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(dx - 70 * fs, dy - 24 * fs, 140 * fs, 46 * fs);
    }
    ctx.restore();

    // 只勾下缘一线暖边（被地面火光照亮的边缘），上缘留黑——避免"描边卡通感"
    ctx.save();
    facePath();
    ctx.clip();
    ctx.strokeStyle = `rgba(255,206,140,${(rimA * 1.15).toFixed(3)})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(dx - 40 * fs, dy - 8 * fs);
    ctx.quadraticCurveTo(dx, dy + 15.5 * fs, dx + 40 * fs, dy - 8 * fs);
    ctx.stroke();
    ctx.restore();

    // 纵目：窄长梭形眼缝，缝里透出火光（不是圆环）。眼上一道眉脊压出面具的硬朗感。
    eachSide(d => {
      const ex = dx + d * 14 * fs, ey = dy - 3.5 * fs;
      const ew = 12 * fs, eh = 2.2 * fs;
      ctx.fillStyle = 'rgba(2,3,8,0.94)';
      ctx.beginPath();
      ctx.moveTo(ex - d * ew, ey);
      ctx.quadraticCurveTo(ex, ey - eh, ex + d * ew, ey);
      ctx.quadraticCurveTo(ex, ey + eh, ex - d * ew, ey);
      ctx.closePath();
      ctx.fill();
      // 缝中透出的火色
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const eg = ctx.createLinearGradient(ex - d * ew, 0, ex + d * ew, 0);
      eg.addColorStop(0, 'rgba(255,150,60,0)');
      eg.addColorStop(0.5, `rgba(255,190,110,${(0.42 + 0.16 * br).toFixed(3)})`);
      eg.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = eg;
      ctx.beginPath();
      ctx.moveTo(ex - d * ew, ey);
      ctx.quadraticCurveTo(ex, ey - eh * 0.72, ex + d * ew, ey);
      ctx.quadraticCurveTo(ex, ey + eh * 0.72, ex - d * ew, ey);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      // 圆柱瞳：缝中央一枚凸起的深色瞳柱，前端一点冷高光
      ctx.fillStyle = 'rgba(4,5,12,0.96)';
      ctx.beginPath();
      ctx.arc(ex + d * 1.5 * fs, ey, 3.2 * fs, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,236,196,0.30)';
      ctx.beginPath();
      ctx.arc(ex + d * 2.6 * fs, ey - 0.9 * fs, 1.1 * fs, 0, Math.PI * 2);
      ctx.fill();
      // 眉脊
      ctx.strokeStyle = `rgba(255,188,116,${(rimA * 0.60).toFixed(3)})`;
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(ex - d * ew * 0.85, ey - 4.6 * fs);
      ctx.quadraticCurveTo(ex + d * 2 * fs, ey - 6.4 * fs, ex + d * ew * 0.85, ey - 4.2 * fs);
      ctx.stroke();
      ctx.fillStyle = 'rgba(6,8,16,0.86)';
    });

    // 额带：面具顶部那条横向箍
    ctx.strokeStyle = `rgba(255,196,124,${(rimA * 0.55).toFixed(3)})`;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(dx - 23 * fs, dy - 15 * fs);
    ctx.quadraticCurveTo(dx, dy - 18 * fs, dx + 23 * fs, dy - 15 * fs);
    ctx.stroke();

    // 鼻脊与阔口：阔口是横贯的直口，两端微翘——不是微笑弧
    ctx.strokeStyle = `rgba(255,196,124,${(rimA * 0.52).toFixed(3)})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(dx, dy - 10 * fs);
    ctx.lineTo(dx - 2.0 * fs, dy + 2.5 * fs);
    ctx.lineTo(dx + 2.0 * fs, dy + 2.5 * fs);
    ctx.stroke();
    ctx.fillStyle = 'rgba(3,4,10,0.90)';

// 掩埋：土层、落尘、锈色藤蔓
/* ================= P1.7 · 第 3 关「深埋千年」地层剖面重制 =================
   原实现的三个问题（玩家反馈"没有深埋感、画面粗糙"的根因）：
     ① 没有任何"头顶压着的东西"——只有一片渐变天空，读起来是"野外黄昏"，不是地下；
     ② 7 条等距正弦波带 alpha 只有 0.06~0.20，看起来像糊了一层墙纸，不是土；
     ③ drawCultureLayer 里本该"埋在土里"的神树/立人剪影 baseY=700/720，
        而地面顶端在 620 —— 全被地面填色盖住，等于压根没画。
   重制按视觉权重分五步：
     ① 封土层（含垂下的草根）—— "埋"的核心：头上必须有东西
     ② 不规则分层剖面（三条不同波长正弦叠加）+ 烘焙颗粒纹理 —— 土必须糙
     ③ 土里嵌着的东西（陶片/兽骨/朽木/青铜残片）—— 埋在土里才叫埋
     ④ 地下水渗痕 + 滴水 —— 地下才有的湿度线索
     ⑤ 底部沉降压暗 —— 制造"深"的纵深
   性能：颗粒纹理烘焙一次（256²）后平铺，全屏 ~18 次 drawImage，无逐帧随机。 */

let _soilGrainCv = null, _soilPat = null;
function getSoilGrainCanvas() {
  if (_soilGrainCv) return _soilGrainCv;
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  // 确定性 LCG：保证每次进入关卡纹理完全一致，不会闪烁
  let seed = 20261026 >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  // ① 细颗粒：暗点占绝对多数、亮点极弱。
  //    第一版亮点给到 0.12 alpha 时整片土看起来像星空/砂纸，必须压到 0.05 以下。
  for (let i = 0; i < 1700; i++) {
    const x = rnd() * S, y = rnd() * S, r = 0.5 + rnd() * 1.6;
    if (rnd() < 0.70) g.fillStyle = `rgba(0,0,0,${(0.12 + rnd() * 0.24).toFixed(3)})`;
    else              g.fillStyle = `rgba(198,168,120,${(0.015 + rnd() * 0.045).toFixed(3)})`;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  // ② 砂砾：比颗粒大、带一点高光，把"土"和"电视雪花噪点"区分开
  for (let i = 0; i < 90; i++) {
    const x = rnd() * S, y = rnd() * S, r = 1.5 + rnd() * 2.6;
    g.fillStyle = `rgba(158,132,94,${(0.09 + rnd() * 0.11).toFixed(3)})`;
    g.beginPath();
    g.ellipse(x, y, r, r * (0.55 + rnd() * 0.5), rnd() * 3.14, 0, 6.2832);
    g.fill();
    g.fillStyle = 'rgba(232,206,160,0.045)';
    g.beginPath(); g.arc(x - r * 0.3, y - r * 0.25, r * 0.45, 0, 6.2832); g.fill();
  }
  _soilGrainCv = c;
  return c;
}

// 不规则地层分界线：三条不同波长的正弦叠加。
// 单条正弦看起来就是壁纸花纹，必须叠低频起伏 + 中频褶皱才能像沉积面。
function _strataEdge(wx, baseY, seed, amp) {
  return baseY
    + Math.sin(wx * 0.0026 + seed) * amp
    + Math.sin(wx * 0.0073 + seed * 2.13) * (amp * 0.46)
    + Math.sin(wx * 0.0181 + seed * 4.77) * (amp * 0.19);
}

// 一层土：从自己的分界线一直填到画面底部（后画的层自然覆盖前一层下半部）
function _soilBand(baseY, seed, par, topCol, botCol, amp) {
  const off = cam.x * par;
  const g = ctx.createLinearGradient(0, baseY - 40, 0, H);
  g.addColorStop(0, topCol);
  g.addColorStop(1, botCol);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-12, H + 12);
  const N = 30;
  for (let i = 0; i <= N; i++) {
    const sx = -12 + (W + 24) * (i / N);
    ctx.lineTo(sx, _strataEdge(sx + off, baseY, seed, amp));
  }
  ctx.lineTo(W + 12, H + 12);
  ctx.closePath();
  ctx.fill();
}

// 沉积面：一条浅色细线（上一层底面被压出的亮边）+ 紧贴下方一条暗线 = 有厚度的地层。
// 只画单条亮线时，两层土会糊成一片，看不出"层"。
// 确定性哈希：同一个世界坐标每帧都必须得到同一个值。
// （这里绝不能用 Math.random —— 否则颗粒与断口会逐帧跳动，像雪花屏）
function _hash1(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function _siltLine(baseY, seed, par, amp, alpha) {
  const off = cam.x * par;
  const segLen = 46;                       // 段长（世界坐标，随视差一起平移）
  const k0 = Math.floor((off - 90) / segLen);
  const k1 = Math.ceil((off + W + 90) / segLen);
  ctx.lineCap = 'round';
  for (let k = k0; k <= k1; k++) {
    // 46% 的段落"尖灭"、段长只取 35%~95%：真实沉积面不成一条通到边的直线。
    // 连续光滑的长曲线正是"像丝绸、像壁纸"的根源。
    if (_hash1(k * 1.37 + seed * 11.3) < 0.46) continue;
    const xw0 = k * segLen;
    const xw1 = xw0 + segLen * (0.35 + _hash1(k * 2.71 + seed) * 0.6);
    const a = alpha * (0.30 + _hash1(k * 5.13 + seed * 3.3) * 1.45);
    const steps = 6;
    const trace = (dy) => {
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const xw = xw0 + (xw1 - xw0) * (i / steps);
        const y = _strataEdge(xw, baseY, seed, amp) + dy;
        if (i === 0) ctx.moveTo(xw - off, y); else ctx.lineTo(xw - off, y);
      }
    };
    // 暗线先画（更粗，位于亮线下方 2px）——这条暗线才是"层有厚度"的来源
    trace(2.2);
    ctx.strokeStyle = `rgba(10,6,3,${(a * 1.05).toFixed(3)})`;
    ctx.lineWidth = 2.0;
    ctx.stroke();
    // 亮线：被上层压出来的湿土反光，亮度逐段起伏
    trace(0);
    ctx.strokeStyle = `rgba(232,204,158,${a.toFixed(3)})`;
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

/* 透镜状砂层 + 钙结核：真实剖面上最常见、也最能治"大面积平色块"的两样东西。
   砂透镜是压扁的薄椭圆（上下淡入淡出，没有硬边），结核是成串的亮小硬块。 */
function _strataLens(baseY, seed, par, amp, count) {
  const off = cam.x * par;
  for (let k = 0; k < count; k++) {
    const xw = seed * 811 + k * 157 + _hash1(k * 3.7 + seed) * 140;
    const sx = xw - off;
    if (sx < -160 || sx > W + 160) continue;
    const y = _strataEdge(xw, baseY, seed, amp) + 7 + _hash1(k * 1.9 + seed) * 22;
    const w = 24 + _hash1(k * 2.3 + seed) * 54;
    const h = 2.6 + _hash1(k * 4.1 + seed) * 5.2;
    const g = ctx.createLinearGradient(0, y - h, 0, y + h);
    g.addColorStop(0, 'rgba(208,178,130,0.19)');
    g.addColorStop(0.55, 'rgba(172,142,98,0.09)');
    g.addColorStop(1, 'rgba(118,92,60,0.02)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(sx, y, w, h, (_hash1(k + seed) - 0.5) * 0.14, 0, 6.2832);
    ctx.fill();
  }
  for (let k = 0; k < count * 2; k++) {
    const xw = seed * 811 + k * 97 + _hash1(k * 7.1 + seed) * 74;
    const sx = xw - off;
    if (sx < -40 || sx > W + 40) continue;
    const y = _strataEdge(xw, baseY, seed, amp) + 3 + _hash1(k * 9.3 + seed) * 28;
    const r = 1.3 + _hash1(k * 3.3 + seed) * 2.5;
    ctx.fillStyle = 'rgba(214,188,146,0.15)';
    ctx.beginPath();
    ctx.ellipse(sx, y, r * 1.5, r, _hash1(k) * 3, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = 'rgba(246,226,186,0.09)';
    ctx.beginPath(); ctx.arc(sx - r * 0.3, y - r * 0.35, r * 0.55, 0, 6.2832); ctx.fill();
  }
}

/* 独立颜色的薄层（炭黑层 / 红烧土层）。
   真实剖面里最先被抓到的不是"线"，而是这些明显不同的色带——
   四条同色系土层 + 一堆细线，只会被读成"丝绸花纹"。 */
function _strataBelt(baseY, h, seed, par, amp, col, x0w, x1w) {
  const off = cam.x * par;
  const s0 = x0w === undefined ? -400 : x0w;
  const s1 = x1w === undefined ? 20000 : x1w;
  const N = 44;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const t = i / N, xw = s0 + (s1 - s0) * t;
    const y = _strataEdge(xw, baseY, seed, amp);
    if (i === 0) ctx.moveTo(xw - off, y); else ctx.lineTo(xw - off, y);
  }
  for (let i = N; i >= 0; i--) {
    const t = i / N, xw = s0 + (s1 - s0) * t;
    const y = _strataEdge(xw, baseY + h, seed + 3.1, amp) + Math.sin(xw * 0.009 + seed) * 2.2;
    ctx.lineTo(xw - off, y);
  }
  ctx.closePath();
  // 两端必须淡出：一条两端齐口的高对比色带会被读成"一块黑色横条"，
  // 而不是"一层沉积"。透镜状两头尖灭才是沉积层的样子。
  ctx.save();
  ctx.clip();
  const gb = ctx.createLinearGradient(s0 - off, 0, s1 - off, 0);
  gb.addColorStop(0, 'rgba(0,0,0,0)');
  gb.addColorStop(0.16, col);
  gb.addColorStop(0.84, col);
  gb.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gb;
  ctx.fillRect(s0 - off, baseY - amp - 26, s1 - s0, h + amp * 2 + 60);
  ctx.restore();
}

/* ---- 埋藏物：都画成"嵌在土里"的低对比剪影，不抢前景 ---- */
function _findShard(s) {                    // 陶片
  ctx.beginPath();
  ctx.moveTo(-14 * s, 9 * s); ctx.lineTo(-6 * s, -11 * s); ctx.lineTo(7 * s, -13 * s);
  ctx.lineTo(15 * s, -2 * s); ctx.lineTo(9 * s, 10 * s);
  ctx.closePath();
  ctx.fillStyle = 'rgba(126,96,62,0.40)'; ctx.fill();
  ctx.strokeStyle = 'rgba(196,166,118,0.26)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(196,166,118,0.13)';   // 绳纹
  ctx.beginPath();
  ctx.moveTo(-6 * s, -5 * s); ctx.lineTo(8 * s, -7 * s);
  ctx.moveTo(-4 * s, 1 * s);  ctx.lineTo(9 * s, -1 * s);
  ctx.stroke();
}
function _findBone(s) {                     // 兽骨
  ctx.fillStyle = 'rgba(202,190,166,0.17)';
  ctx.beginPath();
  ctx.moveTo(-20 * s, -2 * s);
  ctx.quadraticCurveTo(-6 * s, -6 * s, 16 * s, -3 * s);
  ctx.quadraticCurveTo(20 * s, -1 * s, 16 * s, 3 * s);
  ctx.quadraticCurveTo(-6 * s, 6 * s, -20 * s, 2 * s);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(-20 * s, 0, 4.4 * s, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(18 * s, 0, 4.0 * s, 0, 6.2832); ctx.fill();
}
function _findWood(s) {                     // 朽木
  ctx.fillStyle = 'rgba(30,21,13,0.58)';
  for (let k = 0; k < 3; k++) {
    ctx.save();
    ctx.rotate((k - 1) * 0.05);
    ctx.fillRect(-22 * s, (k - 1) * 7 * s - 2 * s, 44 * s, 3.4 * s);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(178,148,104,0.10)'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-20 * s, -1 * s); ctx.lineTo(20 * s, -1 * s);
  ctx.moveTo(-20 * s, 6 * s);  ctx.lineTo(18 * s, 6 * s);
  ctx.stroke();
}
function _findBronze(s) {                   // 青铜残片（土里唯一带冷绿的东西）
  ctx.beginPath();
  ctx.moveTo(-16 * s, 6 * s); ctx.lineTo(-11 * s, -8 * s); ctx.lineTo(5 * s, -11 * s);
  ctx.lineTo(17 * s, 1 * s);  ctx.lineTo(10 * s, 8 * s);
  ctx.closePath();
  ctx.fillStyle = 'rgba(52,84,64,0.42)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,186,136,0.30)'; ctx.lineWidth = 1.1; ctx.stroke();
}
function _findJar(s) {                      // 陶罐（半埋在土里，最容易一眼认出"这里埋着东西"）
  // 罐身：宽腹收口的椭圆体
  ctx.beginPath();
  ctx.moveTo(-11 * s, -14 * s);
  ctx.quadraticCurveTo(-26 * s, -2 * s, -16 * s, 15 * s);
  ctx.quadraticCurveTo(0, 23 * s, 16 * s, 15 * s);
  ctx.quadraticCurveTo(26 * s, -2 * s, 11 * s, -14 * s);
  ctx.closePath();
  ctx.fillStyle = 'rgba(120,92,58,0.46)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(196,166,118,0.24)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // 口沿
  ctx.beginPath();
  ctx.ellipse(0, -14 * s, 11.5 * s, 3.6 * s, 0, 0, 6.2832);
  ctx.fillStyle = 'rgba(150,118,78,0.42)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(206,178,132,0.26)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // 腹部的绳纹带（横两道）
  ctx.strokeStyle = 'rgba(196,166,118,0.14)';
  ctx.beginPath();
  ctx.moveTo(-16 * s, -2 * s); ctx.quadraticCurveTo(0, 3 * s, 16 * s, -2 * s);
  ctx.moveTo(-15 * s, 6 * s);  ctx.quadraticCurveTo(0, 11 * s, 15 * s, 6 * s);
  ctx.stroke();
}
function _findPebbles(s) {                  // 碎石
  ctx.fillStyle = 'rgba(150,126,92,0.26)';
  const P = [[-12, 3, 4.2], [3, -4, 3.1], [11, 5, 2.4], [-3, 8, 2.0]];
  for (const [px, py, pr] of P) {
    ctx.beginPath();
    ctx.ellipse(px * s, py * s, pr * s, pr * s * 0.78, px * 0.3, 0, 6.2832);
    ctx.fill();
  }
}

function _drawBurialFinds() {
  const SP = 372, par = 0.42;
  const i0 = Math.floor((cam.x * par - 220) / SP);
  const i1 = Math.ceil((cam.x * par + W + 220) / SP);
  for (let i = i0; i <= i1; i++) {
    const x = i * SP + 96 - cam.x * par;
    if (x < -130 || x > W + 130) continue;
    // 确定性散列：每件东西的位置/朝向/大小固定，不随帧跳动
    let hs = ((i * 2654435761) ^ 0x9e3779b9) >>> 0;
    const hn = () => { hs = (hs * 1664525 + 1013904223) >>> 0; return hs / 4294967296; };
    const y = 178 + hn() * 388;       // 178~566：封土层以下、地面以上
    const s = 1.0 + hn() * 0.95;
    const rot = (hn() - 0.5) * 0.9;
    const kind = ((i % 6) + 6) % 6;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    if (kind === 0) _findShard(s);
    else if (kind === 1) _findBone(s);
    else if (kind === 2) _findWood(s);
    else if (kind === 3) _findBronze(s);
    else if (kind === 4) _findJar(s);
    else _findPebbles(s);
    ctx.restore();
  }

  // 第二层：更密、更小的碎屑。
  // 试过直接复用小件绘制，结果等于没画——_findShard 的填充色 rgba(126,96,62)
  // 和中层土的 (约 90,72,52) 明度几乎一样，"单看是陶片，铺到土上就隐身"。
  // 碎屑必须自带对比：只有"明显更亮"（陶土/骨）和"明显更暗"（炭屑）两档，
  // 而且成簇出现——真实剖面里的碎屑是成堆的，不是均匀撒的。
  const SP2 = 104, par2 = 0.42;
  const j0 = Math.floor((cam.x * par2 - 180) / SP2);
  const j1 = Math.ceil((cam.x * par2 + W + 180) / SP2);
  for (let j = j0; j <= j1; j++) {
    const bx = j * SP2 + 52 - cam.x * par2;
    if (bx < -80 || bx > W + 80) continue;
    let hs2 = ((j * 1103515245) ^ 0x5bf03635) >>> 0;
    const hn2 = () => { hs2 = (hs2 * 1664525 + 1013904223) >>> 0; return hs2 / 4294967296; };
    const cy = 188 + hn2() * 366;
    const cnt = 5 + Math.floor(hn2() * 4);      // 一簇 5~8 颗（3~5 颗在 1280 宽里覆盖率不到 0.2%，等于没画）
    for (let q = 0; q < cnt; q++) {
      const px = bx + (hn2() - 0.5) * 74;
      const py = cy + (hn2() - 0.5) * 34;
      const r = 2.1 + hn2() * 4.0;
      const lightOne = hn2() > 0.44;
      const a = 0.30 + hn2() * 0.38;
      // 不规则小多边形（5 点，半径抖动）：椭圆会读成"气泡"，多边形才像碎屑
      const n5 = 5, ang0 = hn2() * 6.28;
      ctx.beginPath();
      for (let v = 0; v < n5; v++) {
        const ang = ang0 + v * 6.2832 / n5;
        const rr = r * (0.62 + hn2() * 0.62);
        const vx = px + Math.cos(ang) * rr, vy = py + Math.sin(ang) * rr * 0.74;
        if (v === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.fillStyle = lightOne
        ? `rgba(206,180,132,${a.toFixed(3)})`
        : `rgba(20,14,9,${(a * 1.10).toFixed(3)})`;
      ctx.fill();
      // 亮屑补一道上缘高光：有厚度，不至于像一片纸
      if (lightOne && r > 2.2) {
        ctx.strokeStyle = `rgba(226,206,168,${(a * 0.55).toFixed(3)})`;
        ctx.lineWidth = 0.9;
        ctx.stroke();
      }
    }
  }
}

/* ---- 封土层：头顶压着的那一层土 ----
   ⚠️ 下缘必须落在 y≈152 以下：顶部 0~150 被 HUD 面板（关卡名/操作提示/旁白）占满，
      封土层原来放在 84 会被 HUD 完全挡住，玩家一点都看不到，"地下"的读感直接归零。 */
function _burialCeiling() {
  const off = cam.x * 0.30, N = 30;
  const edgeY = (sx) => 152
    + Math.sin((sx + off) * 0.0041 + 1.7) * 16
    + Math.sin((sx + off) * 0.0129 + 4.2) * 6
    + Math.sin((sx + off) * 0.031 + 0.8) * 2.6;

  ctx.beginPath();
  ctx.moveTo(-12, -12);
  ctx.lineTo(W + 12, -12);
  for (let i = N; i >= 0; i--) {
    const sx = -12 + (W + 24) * (i / N);
    ctx.lineTo(sx, edgeY(sx));
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, 168);
  g.addColorStop(0, '#0b0704');
  g.addColorStop(0.5, '#1e1509');
  g.addColorStop(1, '#3a2a18');
  ctx.fillStyle = g;
  ctx.fill();

  // 封土下缘的湿土高光：让天花板和后面的暗土分开，轮廓才立得住
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const sx = -12 + (W + 24) * (i / N);
    if (i === 0) ctx.moveTo(sx, edgeY(sx)); else ctx.lineTo(sx, edgeY(sx));
  }
  ctx.strokeStyle = 'rgba(214,186,140,0.26)';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // 封土层正下方的暗影带：土压下来一定会甩下一道阴影，这条暗带是"沉"的来源
  const sg = ctx.createLinearGradient(0, 150, 0, 232);
  sg.addColorStop(0, 'rgba(6,4,2,0.62)');
  sg.addColorStop(1, 'rgba(6,4,2,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 150, W, 82);

  // 垂下来的草根/树根 —— "地下"最直观的线索，比任何纹理都有效
  const span = 300;
  for (let k = -1; k < 6; k++) {
    const rx = k * span + 70 - cam.x * 0.30;
    if (rx < -80 || rx > W + 80) continue;
    let hs = ((k * 2246822519) ^ 0x85ebca6b) >>> 0;
    const hn = () => { hs = (hs * 1664525 + 1013904223) >>> 0; return hs / 4294967296; };
    const len = 40 + hn() * 116;
    const sway = Math.sin(tGlobal * 0.5 + k) * 3.5;
    const topY = 148 + hn() * 12;
    const lw = 1.5 + hn() * 1.6;
    const rootPath = (dx) => {
      ctx.beginPath();
      ctx.moveTo(rx + dx, topY);
      ctx.bezierCurveTo(rx + 6 + sway + dx, topY + len * 0.35,
                        rx - 5 + sway + dx, topY + len * 0.70,
                        rx + 3 + sway + dx, topY + len);
    };
    // 先描一圈浅色"土被根挤开"的痕迹，再压一条深色根体。
    // 只画深色根时，它会完全溶进同样深色的封土层里，等于白画。
    rootPath(1.2);
    ctx.strokeStyle = 'rgba(150,122,86,0.22)';
    ctx.lineWidth = lw + 2.0;
    ctx.stroke();
    rootPath(0);
    ctx.strokeStyle = `rgba(14,9,4,${(0.72 + hn() * 0.22).toFixed(2)})`;
    ctx.lineWidth = lw;
    ctx.stroke();
    if (hn() > 0.45) {                        // 分叉
      ctx.lineWidth *= 0.6;
      ctx.beginPath();
      ctx.moveTo(rx + 2 + sway * 0.6, topY + len * 0.55);
      ctx.quadraticCurveTo(rx + 11, topY + len * 0.72, rx + 9 + sway, topY + len * 0.9);
      ctx.stroke();
    }
  }
}

/* ---- 光缝：封土层裂了两道缝，光漏下来。
   不只是装饰——它给这片纯土色画面提供了唯一的方向性光源，画面才有纵深。 ---- */
function _burialSeams() {
  const seams = [{ wx: 520, w: 34, tilt: 0.30 }, { wx: 1760, w: 24, tilt: -0.22 }];
  for (const sm of seams) {
    const sx = sm.wx - cam.x * 0.30;
    if (sx < -220 || sx > W + 220) continue;
    const len = 470;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 光锥：梯形 + 纵向渐变会留下两条笔直的硬边，读成一块斜放的玻璃板。
    // 改用"沿光轴拉长的径向光"——边缘天然衰减，没有任何硬边。
    const ang = Math.atan2(1, sm.tilt * 1.0);
    ctx.save();
    ctx.translate(sx, 150);
    ctx.rotate(ang - Math.PI / 2);   // 让局部 +y 沿着光轴
    ctx.scale(0.30, 1);
    // 三段由粗到细的径向光叠出"光锥收束"：
    // 只用一团椭圆，光柱是等宽的圆管；三段叠加才有越往下越散、越弱的锥形。
    radialGlow(0, len * 0.18, len * 0.28, 'rgba(255,236,186,0.115)');
    radialGlow(0, len * 0.44, len * 0.42, 'rgba(255,224,164,0.098)');
    radialGlow(0, len * 0.72, len * 0.34, 'rgba(255,208,148,0.052)');
    ctx.restore();

    // 缝口本身更亮一点（光就是从这条缝进来的）
    const g2 = ctx.createLinearGradient(0, 128, 0, 172);
    g2.addColorStop(0, 'rgba(255,236,190,0)');
    g2.addColorStop(0.55, 'rgba(255,238,196,0.22)');
    g2.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.ellipse(sx, 150, sm.w * 0.80, 13, 0, 0, 6.2832);
    ctx.fill();

    // 光柱里的浮尘：有尘，光才"实体"
    for (let k = 0; k < 20; k++) {
      const p = ((tGlobal * 0.055 + k * 0.0499) % 1);
      const yy = 152 + p * len * 0.92;
      const xx = sx + (yy - 152) * sm.tilt + Math.sin(k * 2.7 + tGlobal * 0.5) * (sm.w * 0.9 + p * 26);
      const a = (1 - p) * 0.42 * (0.5 + 0.5 * Math.sin(k * 1.9 + tGlobal * 1.3));
      ctx.fillStyle = `rgba(255,238,198,${a.toFixed(3)})`;
      ctx.fillRect(xx, yy, 1.6, 1.6);
    }
    ctx.restore();
  }
}

/* ---- 地下水：渗痕 + 偶尔坠落的一滴水 ---- */
function _burialSeep() {
  const span = 420;
  for (let k = -1; k < 5; k++) {
    const sx = k * span + 200 - (cam.x * 0.22 % span);
    if (sx < -60 || sx > W + 60) continue;
    let hs = ((k * 3266489917) ^ 0x27d4eb2f) >>> 0;
    const hn = () => { hs = (hs * 1664525 + 1013904223) >>> 0; return hs / 4294967296; };
    const bottom = 300 + hn() * 240;
    const g = ctx.createLinearGradient(0, 148, 0, bottom);
    g.addColorStop(0, 'rgba(150,172,150,0.10)');
    g.addColorStop(0.5, 'rgba(150,172,150,0.055)');
    g.addColorStop(1, 'rgba(150,172,150,0)');
    ctx.fillStyle = g;
    const w = 5 + hn() * 5;
    ctx.beginPath();
    ctx.moveTo(sx - w / 2, 148);      ctx.lineTo(sx + w / 2, 148);
    ctx.lineTo(sx + w / 2 + 1.5, bottom); ctx.lineTo(sx - w / 2 - 1.5, bottom);
    ctx.closePath();
    ctx.fill();
    const cyc = (tGlobal * 0.55 + k * 0.37) % 1;
    if (cyc > 0.25) {
      const dropY = bottom + cyc * (H - bottom - 20);
      ctx.fillStyle = `rgba(178,204,178,${(0.30 * (1 - cyc)).toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(sx, dropY, 1.8, 2.8, 0, 0, 6.2832);
      ctx.fill();
    }
  }
}

function bgBurial() {
  drawSky('burial');

  // ---------- ① 四层土层剖面（远→近，视差与暗度递增）----------
  // 相邻层的明度差要够（≈10 级），否则四层会糊成一整块。
  // 首层从 150 起：0~150 是封土层的范围，画在下面会被封土层盖掉。
  _soilBand(150, 0.9, 0.10, '#6b4d2c', '#4a3420', 17);   // 黄土层（最亮）
  _soilBand(268, 2.7, 0.17, '#453121', '#31241a', 15);   // 灰褐土层
  _soilBand(396, 5.3, 0.25, '#33241a', '#231a12', 13);   // 深褐土层
  _soilBand(520, 8.1, 0.34, '#1e1710', '#100c07', 11);   // 青灰生土

  // 标志性薄层：炭黑层（烧过的柴灰）+ 红烧土层（被火烧透的土）
  // —— 这两条是考古剖面里最容易辨认的东西，也是"这是真实土层"的凭证。
  _strataBelt(322, 13, 4.2, 0.21, 9, 'rgba(24,20,15,0.50)', 240, 1240);
  _strataBelt(360, 7, 6.8, 0.21, 7, 'rgba(196,176,134,0.10)', 300, 1080);
  _strataBelt(452, 16, 11.5, 0.29, 8, 'rgba(122,54,26,0.30)', 1450, 2350);
  _strataBelt(486, 8, 14.1, 0.29, 6, 'rgba(72,34,16,0.30)', 1500, 2280);

  // 沉积面亮边（主层界）
  _siltLine(150, 0.9, 0.10, 17, 0.22);
  _siltLine(268, 2.7, 0.17, 15, 0.18);
  _siltLine(396, 5.3, 0.25, 13, 0.15);
  _siltLine(520, 8.1, 0.34, 11, 0.11);

  // 层内薄夹层：一层土 118px，只靠一条渐变就是一个大平色块，
  // 再切 2 条弱得多的细层，才有"一层一层压上去"的沉积感。
  _siltLine(196, 3.3, 0.10, 9, 0.075);
  _siltLine(236, 6.1, 0.10, 12, 0.055);
  _siltLine(314, 9.7, 0.17, 8, 0.070);
  _siltLine(352, 12.3, 0.17, 11, 0.050);
  _siltLine(442, 15.9, 0.25, 9, 0.062);
  _siltLine(478, 18.7, 0.25, 12, 0.045);

  // 砂透镜 / 钙结核：贴着各层界面成串出现
  _strataLens(150, 0.9, 0.10, 17, 6);
  _strataLens(268, 2.7, 0.17, 15, 6);
  _strataLens(396, 5.3, 0.25, 13, 6);
  _strataLens(520, 8.1, 0.34, 11, 4);

  // ---------- ② 颗粒纹理（烘焙图 → Pattern，全屏只 1 次 fillRect）----------
  // 第一版用 3×6=18 次 drawImage 平铺，逐帧 18 次位图拷贝在软件渲染下开销明显；
  // 改成 Pattern 后是 1 次填充，性能差一个量级。
  const grain = getSoilGrainCanvas();
  if (!_soilPat) _soilPat = ctx.createPattern(grain, 'repeat');
  ctx.save();
  ctx.globalAlpha = 0.62;
  ctx.translate(-((cam.x * 0.22) % 256), 0);
  ctx.fillStyle = _soilPat;
  ctx.fillRect(0, 0, W + 256, H);
  ctx.restore();

  // ---------- ③ 土里埋着的东西 ----------
  _drawBurialFinds();

  // ---------- ④ 地下水渗痕 ----------
  _burialSeep();

  // ---------- ⑤ 头顶封土层 + 垂根 ----------
  _burialCeiling();

  // ---------- ⑤-b 封土裂缝漏下的两道光（画面唯一的方向性光源）----------
  _burialSeams();

  // ---------- ⑥ 沉降压暗：越往下越黑，制造"深"的纵深 ----------
  const dg = ctx.createLinearGradient(0, 520, 0, H);
  dg.addColorStop(0, 'rgba(8,5,3,0)');
  dg.addColorStop(1, 'rgba(8,5,3,0.52)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, 520, W, H - 520);

  // ---------- ⑦ 缓落的土尘（比原来更稀、更慢）----------
  for (let i = 0; i < 34; i++) {
    const seed = i * 91.7;
    const px = ((seed * 5 + tGlobal * 6) % (W + 100)) - 50;
    const py = (tGlobal * (12 + (i % 4) * 6) + seed * 11) % H;
    ctx.fillStyle = `rgba(210,180,130,${0.07 + (i % 3) * 0.04})`;
    ctx.fillRect(px, py, 2, 2);
  }
}

// 发掘：探方剖面——地表层 + 考古人员 + 坑壁（夯土/生土/石铺）+ 探方口光
function bgDig() {
  // 天空/地表层（顶部 0~95px 是地表，能看到考古人员在坑外）
  const surfG = ctx.createLinearGradient(0, 0, 0, 100);
  surfG.addColorStop(0, '#c4a878');   // 阳光下的黄土
  surfG.addColorStop(1, '#7a5c36');   // 地表向下过渡
  ctx.fillStyle = surfG;
  ctx.fillRect(0, 0, W, 100);

  // 地表细节：草斑、土疙瘩、探方边缘绳线
  ctx.fillStyle = 'rgba(90,120,60,0.35)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 71 - cam.x * 0.4) % (W + 40);
    ctx.fillRect(((x % (W + 40)) + W + 40) % (W + 40) - 20, 40 + (i % 3) * 8, 8, 3);
  }

  // 探方框（考古现场用红绳/木桩围起来的方坑）
  ctx.strokeStyle = 'rgba(160,60,50,0.55)';   // 红绳警戒线
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 6]);
  ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(W, 96); ctx.stroke();
  ctx.setLineDash([]);
  // 木桩
  for (let i = -1; i < 14; i++) {
    const x = i * 130 - (cam.x * 0.9 % 130);
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(x, 88, 6, 16);
    ctx.fillStyle = 'rgba(255,220,180,0.5)';
    ctx.fillRect(x, 88, 6, 3);
  }

  // ---- 背景层不做考古员，实际考古员由 drawDigGroundMarkers 画在平台层 ----

  // ---- 坑内壁（95 ~ 175 的过渡：从地表进入坑内，土色渐变到深色）----
  const wallG = ctx.createLinearGradient(0, 95, 0, 200);
  wallG.addColorStop(0, '#7a5c36');
  wallG.addColorStop(0.4, '#4a3420');
  wallG.addColorStop(1, '#2a1e12');
  ctx.fillStyle = wallG;
  ctx.fillRect(0, 95, W, 105);

  // ---- 主坑体（200~720）：分层黄土，从上到下逐渐更深 ----
  // 第 1 层：耕土（松散、有草根）
  const l1 = ctx.createLinearGradient(0, 175, 0, 380);
  l1.addColorStop(0, '#3a2818'); l1.addColorStop(1, '#2a1e12');
  ctx.fillStyle = l1; ctx.fillRect(0, 175, W, 205);

  // 第 2 层：夯土（更紧、颜色偏红褐）
  const l2 = ctx.createLinearGradient(0, 380, 0, 560);
  l2.addColorStop(0, '#3a2416'); l2.addColorStop(1, '#241812');
  ctx.fillStyle = l2; ctx.fillRect(0, 380, W, 180);

  // 第 3 层：生土（最深、暗褐）
  const l3 = ctx.createLinearGradient(0, 560, 0, H);
  l3.addColorStop(0, '#2a1a10'); l3.addColorStop(1, '#160e08');
  ctx.fillStyle = l3; ctx.fillRect(0, 560, W, H - 560);

  // ---- 探方坑壁的层位编号牌（第1层/第2层/第3层，沿坑壁左侧贴）----
  const stratLabels = [
    { y: 175, txt: '第①层 耕土' },
    { y: 380, txt: '第②层 夯土' },
    { y: 560, txt: '第③层 生土' }
  ];
  for (const sl of stratLabels) {
    // 沿坑壁每隔 700px 出现一次（跟随摄像机轻微视差）
    const spacing = 700;
    const startOff = -((cam.x * 0.85) % spacing);
    for (let ox = startOff; ox < W + spacing; ox += spacing) {
      const bx = ox + 30;
      const by = sl.y + 8;
      // 木牌（浅木色 + 黑框）
      ctx.fillStyle = '#d8c088';
      ctx.fillRect(bx, by, 72, 18);
      ctx.strokeStyle = '#3a2818';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, 71, 17);
      // 编号文字
      ctx.fillStyle = '#1a0a00';
      ctx.font = 'bold 10px Consolas, monospace';
      ctx.textBaseline = 'middle';
      ctx.fillText(sl.txt, bx + 4, by + 10);
      // 挂绳（从坑壁顶端一根细绳垂下来）
      ctx.strokeStyle = 'rgba(30,20,10,0.6)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(bx + 36, sl.y);
      ctx.lineTo(bx + 36, by);
      ctx.stroke();
    }
  }

  // ---- 坑壁的完整测绘绳网：白绳横贯整个坑壁 + 竹桩阵列 ----
  // 竹桩沿坑壁左侧（画面边缘）立一排，形成"探方四角桩"的延伸感
  const poleSpacing = 180;
  const poleStart = -((cam.x * 0.85) % poleSpacing);
  // 坑壁顶部沿（y=175 位置）立竹桩
  for (let px = poleStart - 20; px < W + 20; px += poleSpacing) {
    // 竹桩本体（黄色 + 竹节）
    const gPole = ctx.createLinearGradient(px, 0, px + 5, 0);
    gPole.addColorStop(0, '#a88850');
    gPole.addColorStop(0.5, '#c8a868');
    gPole.addColorStop(1, '#7a5c30');
    ctx.fillStyle = gPole;
    ctx.fillRect(px, 172, 5, 40);
    // 竹节
    ctx.fillStyle = '#5c4020';
    for (let ny = 178; ny < 208; ny += 8) {
      ctx.fillRect(px, ny, 5, 1);
    }
  }
  // 右侧同间距也立一排（形成探方两端桩阵）
  const poleSpacingR = 220;
  const poleStartR = -((cam.x * 0.85) % poleSpacingR);
  for (let px = poleStartR; px < W + 20; px += poleSpacingR) {
    const gPole = ctx.createLinearGradient(px, 0, px + 5, 0);
    gPole.addColorStop(0, '#8a6a38');
    gPole.addColorStop(0.5, '#b0905a');
    gPole.addColorStop(1, '#6a4c20');
    ctx.fillStyle = gPole;
    ctx.fillRect(px, 174, 4, 36);
    ctx.fillStyle = '#5c4020';
    for (let ny = 180; ny < 206; ny += 8) {
      ctx.fillRect(px, ny, 4, 1);
    }
  }

  // 横向白绳：从坑壁左侧一路延伸到右侧（探方测绘横线）
  ctx.strokeStyle = 'rgba(255,248,220,0.32)';
  ctx.lineWidth = 1.2;
  // 主横线：坑壁顶沿（探方边界）
  ctx.beginPath();
  ctx.moveTo(0, 172);
  ctx.lineTo(W, 172);
  ctx.stroke();
  // 副横线：往坑内每 60px 一根（探方分层横线）
  ctx.strokeStyle = 'rgba(255,240,200,0.14)';
  ctx.lineWidth = 0.8;
  for (let yy = 232; yy < 560; yy += 60) {
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(W, yy);
    ctx.stroke();
  }
  // 竖直白绳：从坑壁顶到底（探方纵线，间距 200px）
  ctx.strokeStyle = 'rgba(255,240,200,0.16)';
  ctx.lineWidth = 1;
  const vSpacing = 200;
  const vStart = -((cam.x * 0.85) % vSpacing);
  for (let vx = vStart; vx < W + vSpacing; vx += vSpacing) {
    ctx.beginPath();
    ctx.moveTo(vx, 172);
    ctx.lineTo(vx, 560);
    ctx.stroke();
  }

  // ---- 土层交界线（考古学上明显的"层位"分界）----
  for (const y of [175, 380, 560]) {
    ctx.strokeStyle = 'rgba(90,70,40,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    // 微起伏让分界更自然
    ctx.strokeStyle = 'rgba(120,90,50,0.25)';
    ctx.beginPath();
    for (let x = 0; x < W; x += 20) {
      const yy = y + Math.sin(x * 0.02 + y) * 2;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  // ---- 坑壁上的洛阳铲手铲：几把工具散在坑壁上 ----
  for (let i = 0; i < 3; i++) {
    const sx = ((i * 640 - cam.x * 0.85) % (W + 400) + W + 400) % (W + 400) - 200;
    if (sx < -40 || sx > W + 40) continue;
    const sy = 500 + i * 30;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-0.5);
    // 木柄
    const hG = ctx.createLinearGradient(0, 0, 0, 22);
    hG.addColorStop(0, '#7a5830');
    hG.addColorStop(1, '#4a3018');
    ctx.fillStyle = hG;
    ctx.fillRect(-2, 0, 4, 22);
    // 铲头
    const bG = ctx.createLinearGradient(-9, 0, 9, 0);
    bG.addColorStop(0, '#4a4a52');
    bG.addColorStop(0.5, '#7a7a82');
    bG.addColorStop(1, '#2a2a32');
    ctx.fillStyle = bG;
    ctx.beginPath();
    ctx.moveTo(-9, 22);
    ctx.lineTo(9, 22);
    ctx.lineTo(6, 32);
    ctx.lineTo(-6, 32);
    ctx.closePath();
    ctx.fill();
    // 锈痕
    ctx.fillStyle = 'rgba(120,60,20,0.5)';
    ctx.fillRect(-7, 24, 14, 2);
    ctx.restore();
  }

  // ---- 土层里的碎片点缀（陶片、骨头、石子）----
  for (let i = 0; i < 55; i++) {
    const seed = i * 41.7;
    const yBand = seed % 3;
    const yMin = yBand === 0 ? 200 : yBand === 1 ? 400 : 580;
    const yMax = yBand === 0 ? 370 : yBand === 1 ? 550 : 700;
    const px = ((seed * 37 + Math.sin(i) * 20 - cam.x * (0.85 - yBand * 0.05)) % (W + 60) + W + 60) % (W + 60) - 30;
    const py = yMin + ((seed * 13) % (yMax - yMin));
    if (yBand === 0) {
      // 陶片（浅褐小三角形）
      ctx.fillStyle = 'rgba(140,100,60,0.55)';
      ctx.beginPath();
      ctx.moveTo(px, py - 2); ctx.lineTo(px + 4, py + 2); ctx.lineTo(px - 4, py + 2);
      ctx.closePath(); ctx.fill();
    } else if (yBand === 1) {
      // 骨头碎片（长条米色）
      ctx.fillStyle = 'rgba(200,180,140,0.5)';
      ctx.fillRect(px, py, 6, 2);
    } else {
      // 小石子（暗色圆点）
      ctx.fillStyle = 'rgba(80,60,40,0.6)';
      ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- 探方口顶部光：从地表透下来的天光 ----
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const topLight = ctx.createLinearGradient(0, 0, 0, 220);
  topLight.addColorStop(0, 'rgba(255,240,190,0.35)');
  topLight.addColorStop(0.4, 'rgba(255,230,170,0.14)');
  topLight.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = topLight;
  ctx.fillRect(0, 0, W, 220);

  // 探方口光柱（几束从地表透下来的阳光）
  for (let i = 0; i < 4; i++) {
    const x = 200 + i * 340 - (cam.x * 0.5 % 340);
    const g = ctx.createLinearGradient(x, 90, x + 60, 500);
    g.addColorStop(0, 'rgba(255,240,190,0.22)');
    g.addColorStop(0.5, 'rgba(255,220,150,0.08)');
    g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - 20, 90); ctx.lineTo(x + 60, 90);
    ctx.lineTo(x + 180, 500); ctx.lineTo(x + 60, 500);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // ---- 坑内的浮尘 ----
  for (let i = 0; i < 60; i++) {
    const seed = i * 61.3;
    const px = ((seed * 9 + Math.sin(tGlobal * 0.5 + i) * 40 + tGlobal * 5) % (W + 40) + W + 40) % (W + 40) - 20;
    const py = 175 + ((seed * 13 + tGlobal * (10 + (i % 5) * 4)) % 500);
    ctx.fillStyle = `rgba(255,245,210,${0.14 + (i % 4) * 0.06})`;
    ctx.fillRect(px, py, 2, 2);
  }
}

// 展柜：暗展厅、吊顶灯带、墙面装饰、射灯光锥、玻璃反光、远处观众剪影
// ---- 展品剪影（在博物馆玻璃展柜中，使用全局 ctx）----
// P1.5：优先用 SenseNova 生成的半写实青铜展品 sprite（保留孔雀绿锈与金箔残光），
//        未就绪时回退到下面的几何简笔，保证任何情况下都能出画。
function drawStandingFig(cx, baseY) {
  {
    const im = SPR.exhibitFig;
    if (im.complete && im.naturalWidth) {
      const H = 128;
      const W = H * im.naturalWidth / im.naturalHeight;
      ctx.drawImage(im, cx - W / 2, baseY - H, W, H);
      return;
    }
  }
  // 大立人像：高约 100，细长身体 + 高冠 + 环臂 + 长袍
  const top = baseY - 100;
  // 长袍（下宽上窄）
  ctx.fillStyle = '#5a7048';
  ctx.beginPath();
  ctx.moveTo(cx - 14, baseY);
  ctx.lineTo(cx - 10, top + 40);
  ctx.lineTo(cx + 10, top + 40);
  ctx.lineTo(cx + 14, baseY);
  ctx.closePath();
  ctx.fill();
  // 长袍纹路（横向几道）
  ctx.strokeStyle = 'rgba(30,50,25,0.7)';
  ctx.lineWidth = 1;
  for (let k = 1; k < 4; k++) {
    const ly = top + 45 + k * 13;
    ctx.beginPath(); ctx.moveTo(cx - 12, ly); ctx.lineTo(cx + 12, ly); ctx.stroke();
  }
  // 环臂（两肘向外弯曲）
  ctx.strokeStyle = '#5a7048';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx - 10, top + 46);
  ctx.quadraticCurveTo(cx - 22, top + 55, cx - 18, top + 68);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 10, top + 46);
  ctx.quadraticCurveTo(cx + 22, top + 55, cx + 18, top + 68);
  ctx.stroke();
  // 空握的手（大立人特有的环握空）
  ctx.strokeStyle = '#3a4a28';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx - 18, top + 70, 4, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 18, top + 70, 4, 0, Math.PI * 2); ctx.stroke();
  // 头
  ctx.fillStyle = '#5a7048';
  ctx.beginPath();
  ctx.ellipse(cx, top + 30, 8, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // 高冠（立人像的筒形高冠）
  ctx.fillStyle = '#6a8058';
  ctx.fillRect(cx - 5, top + 14, 10, 18);
  ctx.fillStyle = '#3a4a28';
  ctx.fillRect(cx - 5, top + 14, 10, 2);
}

function drawBronzeMask(cx, baseY) {
  {
    const im = SPR.exhibitMask;
    if (im.complete && im.naturalWidth) {
      const H = 60;
      const W = H * im.naturalWidth / im.naturalHeight;
      ctx.drawImage(im, cx - W / 2, baseY - H, W, H);
      return;
    }
  }
  // 青铜纵目面具：宽脸 + 突出的双眼柱 + 大耳
  const top = baseY - 60;
  // 面部底色
  ctx.fillStyle = '#4a6848';
  ctx.beginPath();
  ctx.ellipse(cx, baseY - 20, 28, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  // 大耳（向两侧平伸）
  ctx.beginPath();
  ctx.moveTo(cx - 28, baseY - 22);
  ctx.lineTo(cx - 40, baseY - 28);
  ctx.lineTo(cx - 38, baseY - 14);
  ctx.lineTo(cx - 28, baseY - 12);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 28, baseY - 22);
  ctx.lineTo(cx + 40, baseY - 28);
  ctx.lineTo(cx + 38, baseY - 14);
  ctx.lineTo(cx + 28, baseY - 12);
  ctx.closePath();
  ctx.fill();
  // 突出的眼睛柱（纵目特征）
  ctx.fillStyle = '#6a8858';
  ctx.fillRect(cx - 18, baseY - 26, 10, 6);
  ctx.beginPath();
  ctx.ellipse(cx - 22, baseY - 23, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(cx + 8, baseY - 26, 10, 6);
  ctx.beginPath();
  ctx.ellipse(cx + 22, baseY - 23, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // 瞳孔（金色高亮）
  ctx.fillStyle = '#d8b050';
  ctx.beginPath(); ctx.arc(cx - 22, baseY - 23, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 22, baseY - 23, 2, 0, Math.PI * 2); ctx.fill();
  // 大嘴
  ctx.strokeStyle = '#2a3a18';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 14, baseY - 10);
  ctx.quadraticCurveTo(cx, baseY - 4, cx + 14, baseY - 10);
  ctx.stroke();
  // 底座
  ctx.fillStyle = '#3a2416';
  ctx.fillRect(cx - 15, baseY - 4, 30, 4);
}

function drawSacredTree(cx, baseY) {
  {
    const im = SPR.exhibitTree;
    if (im.complete && im.naturalWidth) {
      const H = 148;
      const W = H * im.naturalWidth / im.naturalHeight;
      ctx.drawImage(im, cx - W / 2, baseY - H, W, H);
      return;
    }
  }
  // 青铜神树：树干 + 三层枝叶 + 神鸟
  // 底座
  ctx.fillStyle = '#3a2416';
  ctx.fillRect(cx - 12, baseY - 4, 24, 4);
  // 树干
  ctx.fillStyle = '#4a6848';
  ctx.fillRect(cx - 2, baseY - 78, 4, 74);
  // 三层枝叶（每层三支向外翘）
  for (let lvl = 0; lvl < 3; lvl++) {
    const ly = baseY - 30 - lvl * 16;
    for (let d = -1; d <= 1; d += 2) {
      ctx.strokeStyle = '#4a6848';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, ly);
      ctx.quadraticCurveTo(cx + d * 12, ly - 6, cx + d * 20, ly - 10);
      ctx.stroke();
      // 花蕾（小球）
      ctx.fillStyle = '#5a7858';
      ctx.beginPath();
      ctx.arc(cx + d * 20, ly - 10, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // 树顶神鸟
  ctx.fillStyle = '#d8b050';
  ctx.beginPath();
  ctx.ellipse(cx, baseY - 82, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  // 鸟喙
  ctx.beginPath();
  ctx.moveTo(cx + 4, baseY - 82);
  ctx.lineTo(cx + 8, baseY - 81);
  ctx.lineTo(cx + 4, baseY - 80);
  ctx.closePath();
  ctx.fill();
  // 神鸟尾羽
  ctx.beginPath();
  ctx.moveTo(cx - 4, baseY - 82);
  ctx.lineTo(cx - 9, baseY - 84);
  ctx.lineTo(cx - 4, baseY - 80);
  ctx.closePath();
  ctx.fill();
}

function bgMuseum() {

  bandG.addColorStop(0.5, 'rgba(255,220,150,0.55)');

  // ---------- ⑧ 墙面馆名（超大字体，暗示"三星堆博物馆"字样）----------

  // ---------- ⑨ 地面警戒线（黄黑相间，博物馆常见隔离）----------

  // ---------- ⑦ 展厅地面（620 以下）：抛光大理石 + 反射光斑 ----------
  const floorG = ctx.createLinearGradient(0, 620, 0, H);

  // 地面光泽高光（一条横向的高光带，暗示抛光地面反光）

  ctx.fillRect(0, 620, W, 40);

}

/* ---- 商代青铜礼器 · 鼎（三足双耳大鼎剪影） ---- */

/* ---- 商代青铜礼器 · 爵（三足、流口、杯身） ---- */

    ctx.lineTo(cx + 12 * s, baseY);
    ctx.lineTo(cx + 16 * s, baseY - 22 * s);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 3 * s, baseY - 22 * s);
    ctx.lineTo(cx, baseY - 2 * s);
    ctx.lineTo(cx + 3 * s, baseY - 22 * s);
    ctx.closePath();
    ctx.fill();
    // 杯身
    ctx.fillRect(cx - 14 * s, baseY - 34 * s, 28 * s, 14 * s);

/* ---- 商代青铜礼器 · 觚（喇叭口、束腰） ---- */
function drawGuSilhouette(cx, baseY, s, alpha) {

/* 神树剪影底图：把 SPR.exhibitTree 烘焙成"暗铜剪影"。
   做法与立人 sprite 一致——几何版的 `fillRect` 主干 + 两撇翘枝，
   在远处看就是一根竖条上挂几个圈，和已经换成真素材的立人、神面放在一起非常割裂。
   这里用 source-atop 在已有像素上叠暗色：只暗化不改变轮廓，边缘仍是抠好的原样。
   结果缓存在离屏 canvas，任意缩放尺寸都直接 drawImage（不重复做合成）。 */
let _treeSilCanvas = null;
function getTreeSilhouette() {
  const im = SPR.exhibitTree;
  if (!im || !im.complete || !im.naturalWidth) return null;
  if (_treeSilCanvas && _treeSilCanvas._srcW === im.naturalWidth) return _treeSilCanvas;
  const H = 406, Wd = Math.max(1, Math.round(H * im.naturalWidth / im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Wd; c.height = H;
  const g = c.getContext('2d');
  g.drawImage(im, 0, 0, Wd, H);
  // 竖向渐变：树冠略亮、树根沉进暗部——纯单色会让整棵树变成一片死黑剪纸
  g.globalCompositeOperation = 'source-atop';
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, 'rgba(21,24,27,0.96)');
  grd.addColorStop(0.55, 'rgba(12,14,17,0.975)');
  grd.addColorStop(1, 'rgba(6,7,10,0.985)');
  g.fillStyle = grd;
  g.fillRect(0, 0, Wd, H);
  // 留一点点铜绿色偏：剪影也该让人看出这是"青铜"，不是铁艺
  g.fillStyle = 'rgba(26,56,46,0.09)';
  g.fillRect(0, 0, Wd, H);
  c._srcW = im.naturalWidth;
  _treeSilCanvas = c;
  return c;
}

/* ---- 三星堆青铜神树（远景高杆 + 三层枝叶 + 神鸟，比展柜中更大、更暗） ---- */
function drawSacredTreeSilhouette(cx, baseY, s, alpha, rim) {
  // 真素材优先（与 drawStandingFigSilhouette 同策略，未就绪时回退下面这套几何画法）
  const sil = getTreeSilhouette();
  if (sil) {
    // 高度 140*s：与原几何版总高一致，保证所有调用点的构图比例不变
    const H = 140 * s;
    const Wd = H * sil.width / sil.height;
    ctx.save();
    if (rim) {
      // 祭火逆光：先在地面铺一层暖背光（阴影模糊给不出体量），再靠 shadowBlur 镀边
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      radialGlow(cx, baseY - H * 0.50, Math.max(Wd, H) * 0.70, rim.replace(/[\d.]+\)$/, '0.30)'));
      ctx.restore();
      ctx.shadowColor = rim;
      ctx.shadowBlur = 30 * Math.max(1, s * 0.85);
    }
    ctx.globalAlpha = alpha;
    ctx.drawImage(sil, cx - Wd / 2, baseY - H, Wd, H);
    ctx.restore();
    return;
  }
  withAlpha(alpha, () => {
    // rim：祭火逆光——在剪影外缘镀一层暖边，否则纯黑剪影在夜空里不可见
    if (rim) { ctx.shadowColor = rim; ctx.shadowBlur = 26 * Math.max(1, s * 0.6); }
    ctx.fillStyle = SILHUE_DARK;
    // 底座
    ctx.fillRect(cx - 12 * s, baseY - 4 * s, 24 * s, 4 * s);
    // 主树干
    ctx.fillRect(cx - 2 * s, baseY - 130 * s, 4 * s, 126 * s);
    // 三层九枝（每层三支向外翘，三星堆神树特征）
    for (let lvl = 0; lvl < 3; lvl++) {
      const ly = baseY - 30 * s - lvl * 30 * s;
      // 侧枝（左右对称）
      eachSide(d => {
        ctx.strokeStyle = SILHUE_DARK;
        ctx.lineWidth = 2.5 * s;
        ctx.beginPath();
        ctx.moveTo(cx, ly);
        ctx.quadraticCurveTo(cx + d * 22 * s, ly - 10 * s, cx + d * 40 * s, ly - 20 * s);
        ctx.stroke();
        // 花蕾
        ctx.beginPath();
        ctx.arc(cx + d * 40 * s, ly - 20 * s, 4 * s, 0, Math.PI * 2);
        ctx.fill();
      });
      // 中枝
      ctx.beginPath();
      ctx.moveTo(cx, ly);
      ctx.lineTo(cx, ly - 14 * s);
      ctx.strokeStyle = SILHUE_DARK;
      ctx.lineWidth = 2 * s;
      ctx.stroke();
    }
    // 树顶神鸟
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 134 * s, 8 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 鸟喙
    ctx.beginPath();
    ctx.moveTo(cx + 8 * s, baseY - 134 * s);
    ctx.lineTo(cx + 14 * s, baseY - 132 * s);
    ctx.lineTo(cx + 8 * s, baseY - 130 * s);
    ctx.closePath();
    ctx.fill();
  });
}

/* ---- 三星堆青铜大立人（远景高大剪影，长袍高冠环握） ----
   pose：0 = 胸前环握（立人像本相），1 = 双臂高举向天（主祭正在主持祭仪）。
   P1.5：优先用 SenseNova 生成的高精度剪影 sprite（举手/俯身两张按 pose 交叉淡化），
         sprite 未就绪时自动回退到下面的几何绘制——断网、图片失败、首帧未加载都能正常出画。 */
function drawStandingFigSilhouette(cx, baseY, s, alpha, rim, pose) {
  const pz = clamp(pose || 0, 0, 1);
  const up = SPR.priestUp, bw = SPR.priestBow;
  if (up.complete && up.naturalWidth && bw.complete && bw.naturalWidth) {
    // 高度基准对齐原几何：举手态总高 147*s（手臂举到冠上），俯身态 134*s（冠顶到脚）
    const Hup = 147 * s, Hbow = 134 * s;
    const Wup = Hup * up.naturalWidth / up.naturalHeight;
    const Wbow = Hbow * bw.naturalWidth / bw.naturalHeight;
    ctx.save();
    if (rim) {
      // 先铺一层同色背光：祭坛上的主祭是被火盆从背后照亮的，
      // 只靠 shadowBlur 会给不出这个体量，剪影会整片糊进夜色里。
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      radialGlow(cx, baseY - Hup * 0.52, Math.max(Wup, Hup) * 0.78, rim.replace(/[\d.]+\)$/, '0.30)'));
      ctx.restore();
      ctx.shadowColor = rim;
      ctx.shadowBlur = 26 * Math.max(1, s * 0.7);
    }
    if (pz > 0.005) {                    // 举手
      ctx.globalAlpha = alpha * pz;
      ctx.drawImage(up, cx - Wup / 2, baseY - Hup, Wup, Hup);
    }
    if (pz < 0.995) {                    // 俯身
      ctx.globalAlpha = alpha * (1 - pz);
      ctx.drawImage(bw, cx - Wbow / 2, baseY - Hbow, Wbow, Hbow);
    }
    ctx.restore();
    return;
  }
  withAlpha(alpha, () => {
    if (rim) { ctx.shadowColor = rim; ctx.shadowBlur = 24 * Math.max(1, s * 0.6); }
    ctx.fillStyle = SILHUE_DARK;
    // 长袍：下摆外张、腰身收紧、肩部再展开（立人像的"三段式"体量）
    ctx.beginPath();
    ctx.moveTo(cx - 21 * s, baseY);
    ctx.quadraticCurveTo(cx - 16 * s, baseY - 30 * s, cx - 12 * s, baseY - 56 * s);
    ctx.quadraticCurveTo(cx - 11 * s, baseY - 68 * s, cx - 14 * s, baseY - 74 * s);
    ctx.lineTo(cx + 14 * s, baseY - 74 * s);
    ctx.quadraticCurveTo(cx + 11 * s, baseY - 68 * s, cx + 12 * s, baseY - 56 * s);
    ctx.quadraticCurveTo(cx + 16 * s, baseY - 30 * s, cx + 21 * s, baseY);
    ctx.closePath();
    ctx.fill();
    // 衣襟中线（长袍对襟的一道浅缝，靠"挖空"读出来）
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(cx - 0.7 * s, baseY - 62 * s, 1.4 * s, 62 * s);
    ctx.restore();
    // 双臂：pz=0 时前抬内收、双手在胸前合成空心环；pz=1 时高举过冠，向天托举
    ctx.strokeStyle = SILHUE_DARK;
    ctx.lineCap = 'round';
    ctx.lineWidth = 7 * s;
    const lp = (a, b) => a + (b - a) * pz;
    eachSide(d => {
      const ex = d * lp(30, 34) * s, ey = baseY + lp(-74, -104) * s;
      const hx = d * lp(24, 14) * s, hy = baseY + lp(-88, -140) * s;
      const fx = d * lp(10, 11) * s, fy = baseY + lp(-86, -144) * s;
      ctx.beginPath();
      ctx.moveTo(cx + d * 13 * s, baseY - 70 * s);
      ctx.quadraticCurveTo(cx + ex, ey, cx + hx, hy);
      ctx.stroke();
      // 前臂折向胸前 / 折向头顶
      ctx.beginPath();
      ctx.moveTo(cx + hx, hy);
      ctx.lineTo(cx + fx, fy);
      ctx.stroke();
      // 空心环握的手（三星堆立人最标志性的一处）
      ctx.beginPath();
      ctx.arc(cx + d * lp(8.5, 11) * s, baseY + lp(-86, -144) * s, 4.6 * s, 0, Math.PI * 2);
      ctx.stroke();
    });
    // 颈
    ctx.fillRect(cx - 4 * s, baseY - 80 * s, 8 * s, 7 * s);
    // 头（长脸、窄）
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 90 * s, 8.5 * s, 11 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 筒形高冠（下窄上宽，冠口外翻）
    ctx.beginPath();
    ctx.moveTo(cx - 6.5 * s, baseY - 100 * s);
    ctx.lineTo(cx + 6.5 * s, baseY - 100 * s);
    ctx.lineTo(cx + 8.5 * s, baseY - 128 * s);
    ctx.lineTo(cx - 8.5 * s, baseY - 128 * s);
    ctx.closePath();
    ctx.fill();
    // 冠口外翻的宽沿
    ctx.fillRect(cx - 10.5 * s, baseY - 131 * s, 21 * s, 3.4 * s);
    // 冠身横带（冠上的三道箍，让高冠不是一根柱子）
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for (const yy of [-108, -116, -124]) ctx.fillRect(cx - 8 * s, baseY + yy * s, 16 * s, 1.2 * s);
    ctx.restore();
  });
}

/* ---- 祭祀祭坛：三级夯土台 + 台顶神树 + 台顶主祭 ----
   把散落的"贴纸"收成一个真正的场所：人站在台下，树与祭者立在台上，火从台上压下来。
   p 为关卡进度，驱动台体从"被火镀成琥珀"到"被时间爬满铜绿"。 */
function drawRitualAltar(cx, baseY, s, p) {
  const k = clamp((p - 0.30) / 0.70, 0, 1);
  const goldA = 0.62 * (1 - 0.50 * k);
  const rustA = 0.52 * k;
  const tiers = [{ w: 268, h: 24 }, { w: 214, h: 24 }, { w: 158, h: 28 }];
  let y = baseY;
  for (let i = 0; i < tiers.length; i++) {
    const t = tiers[i];
    y -= t.h * s;
    const tw = t.w * s, th = t.h * s;
    // 每级之间拉开明度差，三级收分才看得出来
    const topL = 62 - i * 14;
    const g = ctx.createLinearGradient(0, y, 0, y + th);
    g.addColorStop(0, `rgba(${topL + 14},${Math.round(topL * 0.72)},${Math.round(topL * 0.46)},0.99)`);
    g.addColorStop(0.45, `rgba(${Math.round(topL * 0.58)},${Math.round(topL * 0.42)},${Math.round(topL * 0.27)},1)`);
    g.addColorStop(1, 'rgba(12,9,7,1)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - tw * 0.5, y, tw, th);
    // 台沿下缘被祭火照亮（金），上缘被时间爬满（锈）
    ctx.fillStyle = 'rgba(255,188,104,' + goldA.toFixed(3) + ')';
    ctx.fillRect(cx - tw * 0.5, y + th - 3 * s, tw, 3 * s);
    ctx.fillStyle = 'rgba(255,214,150,' + (goldA * 0.5).toFixed(3) + ')';
    ctx.fillRect(cx - tw * 0.5, y + th - 3 * s, tw, 1.1 * s);
    if (rustA > 0.012) {
      ctx.fillStyle = 'rgba(74,156,120,' + rustA.toFixed(3) + ')';
      ctx.fillRect(cx - tw * 0.5, y, tw, 3.6 * s);
      ctx.fillStyle = 'rgba(150,214,180,' + (rustA * 0.45).toFixed(3) + ')';
      ctx.fillRect(cx - tw * 0.5, y, tw, 1.2 * s);
    }
    // 夯窝层理
    ctx.strokeStyle = 'rgba(152,112,64,0.16)';
    ctx.lineWidth = 1;
    for (let yy = y + 7 * s; yy < y + th - 4 * s; yy += 7 * s) {
      ctx.beginPath(); ctx.moveTo(cx - tw * 0.5, yy); ctx.lineTo(cx + tw * 0.5, yy); ctx.stroke();
    }
  }
  const topY = y;
  // 侧面五级台阶：暗示"人是一级一级走上祭坛的"
  for (let i = 0; i < 5; i++) {
    const sw = 18 * s;
    const sx = cx + 132 * s - i * sw;
    const sy = baseY - (i + 1) * 15 * s;
    const sg = ctx.createLinearGradient(0, sy, 0, baseY);
    sg.addColorStop(0, 'rgba(58,42,28,1)');
    sg.addColorStop(1, 'rgba(16,12,9,1)');
    ctx.fillStyle = sg;
    ctx.fillRect(sx, sy, sw, (i + 1) * 15 * s);
    ctx.fillStyle = 'rgba(255,182,100,' + (goldA * 0.85).toFixed(3) + ')';
    ctx.fillRect(sx, sy, sw, 2.2 * s);
  }
  // 台顶：神树居中，主祭立于树侧，主祭在"举手—俯身"之间呼吸式往复（祭祀正在进行）
  const bow = 0.5 + 0.5 * Math.sin(tGlobal * 0.62);   // 0 俯身 → 1 举手
  drawStandingFigSilhouette(cx + 62 * s, topY, s * 0.86, 0.96, 'rgba(255,182,102,0.78)', bow);

  // 台顶火盆：让祭坛自身成为光源，光从台上往下压
  const brazX = cx + 108 * s, brazY = topY - 4 * s;
  ctx.fillStyle = 'rgba(18,13,9,1)';
  ctx.beginPath();
  ctx.moveTo(brazX - 17 * s, brazY - 14 * s);
  ctx.quadraticCurveTo(brazX, brazY - 2 * s, brazX + 17 * s, brazY - 14 * s);
  ctx.lineTo(brazX + 13 * s, brazY - 17 * s);
  ctx.lineTo(brazX - 13 * s, brazY - 17 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(176,120,58,0.42)';
  ctx.fillRect(brazX - 17 * s, brazY - 18 * s, 34 * s, 2 * s);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(brazX, brazY - 30 * s, 108 * s, 'rgba(255,142,52,0.26)');
  radialGlow(brazX, brazY - 26 * s, 46 * s, 'rgba(255,206,124,0.30)');
