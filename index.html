<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一眼三千年 · 三星堆祭司青铜头像</title>
<style>
  html,body{margin:0;height:100%;background:#04080a;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#06100f;box-shadow:0 0 100px rgba(0,0,0,.9)}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<script>
"use strict";

/* ============================================================
   一眼三千年 —— 三星堆祭司青铜头像 · 闯关小游戏
   支持：键盘 / 手柄   离线可运行
   ============================================================ */

const W = 1280, H = 720;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function fit() {
  const ratio = W / H, w = innerWidth, h = innerHeight;
  let cw = w, ch = w / ratio;
  if (ch > h) { ch = h; cw = h * ratio; }
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
}
addEventListener('resize', fit);
fit();

/* ================= 运行环境自检 ================= */
// Chrome 的 Gamepad API 受权限策略限制，在跨源 iframe（IDE 预览窗等）里会被直接屏蔽
const IN_IFRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const HAS_GAMEPAD_API = typeof navigator.getGamepads === 'function';
// Chrome 还要求页面先获得"用户激活"（点一下 / 按一下键盘）才会暴露手柄数据，否则 getGamepads() 一直为空
let pageActivated = false;
const markActivated = () => { pageActivated = true; };
addEventListener('pointerdown', markActivated, true);
addEventListener('keydown', markActivated, true);

/* ================= 文物配图（馆方资料，本地文件） ================= */
const poster = new Image();
let posterReady = false;
poster.onload = () => { posterReady = true; };
poster.src = 'poster.jpg';

// 从展览海报中裁出文物本体（1080×1920 原图）
const CROP = { sx: 340, sy: 650, sw: 480, sh: 950 };

function drawArtifact(cx, cy, dh, alpha) {
  if (!posterReady) return false;
  const dw = dh * (CROP.sw / CROP.sh);
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.drawImage(poster, CROP.sx, CROP.sy, CROP.sw, CROP.sh, cx - dw / 2, cy - dh / 2, dw, dh);
  ctx.restore();
  return true;
}

/* ================= 输入 ================= */
const keys = Object.create(null);
const pressed = new Set();
let clickEdge = false;

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  keys[e.code] = true;
  resumeAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---- 鼠标 / 触控：坐标换算与退出按钮 ---- */
const BTN_EXIT = { x: W - 146, y: 26, w: 110, h: 38 };
const BTN_SOUND = { x: W - 276, y: 26, w: 118, h: 38 };
const mouse = { x: -999, y: -999 };
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function inExit(p) {
  return p.x > BTN_EXIT.x && p.x < BTN_EXIT.x + BTN_EXIT.w &&
         p.y > BTN_EXIT.y && p.y < BTN_EXIT.y + BTN_EXIT.h;
}
function inSound(p) {
  return p.x > BTN_SOUND.x && p.x < BTN_SOUND.x + BTN_SOUND.w &&
         p.y > BTN_SOUND.y && p.y < BTN_SOUND.y + BTN_SOUND.h;
}
function toTitle() { state = 'title'; stateT = 0; sfxBack(); }
cv.addEventListener('pointermove', e => { const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y; });
const BTN_OPEN = { x: W / 2 - 110, y: 470, w: 220, h: 44 };
function inOpen(p) { return p.x > BTN_OPEN.x && p.x < BTN_OPEN.x + BTN_OPEN.w &&
                            p.y > BTN_OPEN.y && p.y < BTN_OPEN.y + BTN_OPEN.h; }
cv.addEventListener('pointerdown', e => {
  const p = toCanvas(e);
  mouse.x = p.x; mouse.y = p.y;
  resumeAudio();
  if (inSound(p)) { toggleMute(); return; }
  if (inExit(p)) { toTitle(); return; }
  if (IN_IFRAME && state === 'title' && inOpen(p)) { window.open(location.href, '_blank'); return; }
  clickEdge = true;
});

const pad = { left: false, right: false, jump: false, jumpEdge: false, startEdge: false,
              backEdge: false, connected: false, name: '', count: 0, dbg: '', axes: '' };
let padBackPrev = false, padAxisPrev = false;
let padIdxPrev = new Set();   // 上一帧按下的按键编号，用于逐键判定"新按下"

function pollPad() {
  let list = [];
  try {
    if (navigator.getGamepads) list = navigator.getGamepads();
    else if (navigator.webkitGetGamepads) list = navigator.webkitGetGamepads();
  } catch (e) { list = []; }
  let gp = null, n = 0;
  for (let i = 0; i < list.length; i++) {
    const g = list[i];
    if (g && g.connected) { n++; if (!gp) gp = g; }
  }
  pad.count = n;
  pad.jumpEdge = false;
  pad.startEdge = false;
  pad.backEdge = false;
  pad.anyInput = false;
  if (!gp) {
    pad.left = pad.right = pad.jump = false;
    pad.connected = false;
    pad.dbg = '';
    pad.axes = '';
    padIdxPrev.clear();
    return;
  }
  pad.connected = true;
  pad.name = gp.id || '';
  const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const pressedIdx = [];
  for (let i = 0; i < gp.buttons.length; i++) if (b(i)) pressedIdx.push(i);
  pad.dbg = pressedIdx.join(',');
  pad.axes = Array.prototype.map.call(gp.axes, v => v.toFixed(2)).join(' ');

  // 左摇杆：标准布局 axes[0] 横轴；十字键走按钮 14/15，非标准 POV 帽在 axes[9]
  const a0 = gp.axes[0] || 0;
  const hat = gp.axes.length > 9 ? gp.axes[9] : 0;
  pad.left  = a0 < -0.28 || b(14) || hat < -0.5;
  pad.right = a0 >  0.28 || b(15) || hat >  0.5;
  pad.hx = a0;

  // 任意键 = 跳跃 / 确认：用逐键"新按下"边沿判定。
  // 不同手柄把 A/B/X/Y 报到不同编号，这样无论哪个键都能起跳、都能在标题页开始，
  // 且长按不会每帧重复触发。
  let newIdx = -1;
  for (const i of pressedIdx) if (!padIdxPrev.has(i)) { newIdx = i; break; }
  padIdxPrev = new Set(pressedIdx);
  if (newIdx >= 0) { pad.jumpEdge = true; pad.startEdge = true; }
  pad.jumpIdx = newIdx;
  pad.jump = pressedIdx.length > 0;
  if (pressedIdx.length) { pad.lastIdx = pressedIdx[0]; pad.lastT = tGlobal; pad.anyInput = true; }
  if (Math.abs(a0) > 0.55) pad.anyInput = true;

  // 退出：只认 Back / Select(8)。刻意不占用 B(1)——部分手柄把确认键映射到 1，占用会导致确认键失效
  const k = b(8);
  if (k && !padBackPrev) pad.backEdge = true;
  padBackPrev = k;
  if (pad.name === undefined) pad.name = '';
}

addEventListener('gamepadconnected', e => {
  pad.connected = true;
  pad.name = e.gamepad && e.gamepad.id ? e.gamepad.id : '';
});
addEventListener('gamepaddisconnected', () => { pad.connected = false; });

const input = { left: false, right: false, jumpHeld: false, jumpEdge: false, startEdge: false };

function gatherInput() {
  pollPad();
  input.left = !!(keys['ArrowLeft'] || keys['KeyA']) || pad.left;
  input.right = !!(keys['ArrowRight'] || keys['KeyD']) || pad.right;
  input.jumpHeld = !!(keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || keys['KeyJ']) || pad.jump;
  input.jumpEdge = pressed.has('Space') || pressed.has('ArrowUp') || pressed.has('KeyW') ||
                   pressed.has('KeyJ') || pad.jumpEdge;
  input.startEdge = pressed.has('Enter') || pressed.has('Space') || pad.startEdge ||
                    pad.jumpEdge || clickEdge;
  clickEdge = false;
}

/* ================= 音效（WebAudio 合成） ================= */
let audioCtx = null, masterGain = null, ambientOn = false, audioStarted = false;
let audioMuted = false;
let ambState = 'title';          // 'title' | 'game'：两种紧张度
let ambGraph = null;             // 常驻节点（drone / heartbeat / shimmer）

// 用户首次交互时立即启动音频上下文与双层氛围音
function resumeAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    if (audioCtx) {
      // 主总线加一个软限幅压缩器：多声音同时触发时不会削顶爆音
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.knee.value = 18;
      comp.ratio.value = 6;
      comp.attack.value = 0.004;
      comp.release.value = 0.20;
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 1.05;
      masterGain.connect(comp);
      comp.connect(audioCtx.destination);
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (audioCtx && !ambientOn) startAmbient();
  if (audioCtx) audioStarted = true;
  // 首次交互后直接进入"游戏中"紧张度——用户既然点了说明准备开玩
  if (audioCtx && ambState === 'title') setAmbState('game');
}

// 静音开关：主声道直接切到 0，节点保留，恢复时无缝
function toggleMute() {
  if (!audioCtx || !masterGain) return;
  audioMuted = !audioMuted;
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(audioMuted ? 0 : 1.05, audioCtx.currentTime + 0.15);
}

// 基础音：可选 sweepTo 做频率滑音
function tone(freq, dur, type, vol, sweepTo) {
  if (!audioCtx || !masterGain) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  const now = audioCtx.currentTime;
  if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), now + dur);
  g.gain.value = 0;
  g.gain.linearRampToValueAtTime(vol || 0.12, now + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(masterGain);
  o.start(now); o.stop(now + dur + 0.05);
}

// 带通噪声：落地闷响 / 受击 / 冲击，比纯正弦更有"实体感"
function noise(dur, vol, freq, q) {
  if (!audioCtx || !masterGain) return;
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq || 420;
  bp.Q.value = q || 1.2;
  const g = audioCtx.createGain();
  g.gain.value = vol || 0.18;
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start();
}

/* ---- 具体音效（音量整体拉高，配合主总线压缩器防爆音） ---- */
function sfxJump()  { if (!audioMuted) tone(300, 0.16, 'square', 0.28, 640); }
function sfxLand()  { if (!audioMuted) { noise(0.14, 0.38, 230, 0.9); tone(95, 0.12, 'sine', 0.24); } }
function sfxCoin()  { if (audioMuted) return; tone(880, 0.10, 'sine', 0.32); setTimeout(() => tone(1320, 0.20, 'sine', 0.28), 60); }
function sfxHit()   { if (!audioMuted) { noise(0.22, 0.52, 300, 1.0); tone(150, 0.28, 'sawtooth', 0.28, 70); } }
function sfxDeath() { if (audioMuted) return; tone(420, 0.60, 'triangle', 0.36, 90); setTimeout(() => noise(0.55, 0.40, 180, 0.8), 80); }
function sfxClear() { if (audioMuted) return; [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.46, 'sine', 0.30), i * 105)); }
function sfxStart() { if (audioMuted) return; tone(392, 0.32, 'triangle', 0.28); setTimeout(() => tone(587, 0.46, 'sine', 0.26), 110); }
function sfxBack()  { if (!audioMuted) tone(320, 0.24, 'triangle', 0.22, 170); }

// 心跳"咚—嘭"：两声低频短促轰鸣，危险度越高越响
function sfxHeartbeat(vol) {
  if (!audioCtx || !masterGain) return;
  const v = vol || 0.42;
  const now = audioCtx.currentTime;
  // 咚：80Hz 短促
  const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(95, now);
  o1.frequency.exponentialRampToValueAtTime(52, now + 0.10);
  g1.gain.value = 0;
  g1.gain.linearRampToValueAtTime(v, now + 0.008);
  g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
  const lp1 = audioCtx.createBiquadFilter();
  lp1.type = 'lowpass'; lp1.frequency.value = 320;
  o1.connect(lp1); lp1.connect(g1); g1.connect(masterGain);
  o1.start(now); o1.stop(now + 0.18);
  // 嘭：稍晚稍低的补音
  setTimeout(() => {
    if (!audioCtx || !masterGain) return;
    const t2 = audioCtx.currentTime;
    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(78, t2);
    o2.frequency.exponentialRampToValueAtTime(40, t2 + 0.11);
    g2.gain.value = 0;
    g2.gain.linearRampToValueAtTime(v * 0.68, t2 + 0.008);
    g2.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.16);
    const lp2 = audioCtx.createBiquadFilter();
    lp2.type = 'lowpass'; lp2.frequency.value = 280;
    o2.connect(lp2); lp2.connect(g2); g2.connect(masterGain);
    o2.start(t2); o2.stop(t2 + 0.20);
  }, 160);
}

// 危险预警"嘶——"：带通噪声扫频，玩家靠近危险物时短促提示
function sfxWarn() {
  if (!audioCtx || !masterGain || audioMuted) return;
  const now = audioCtx.currentTime;
  const dur = 0.28;
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(700, now);
  bp.frequency.exponentialRampToValueAtTime(1400, now + dur);
  bp.Q.value = 3.5;
  const g = audioCtx.createGain();
  g.gain.value = 0;
  g.gain.linearRampToValueAtTime(0.28, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(now); src.stop(now + dur + 0.02);
}

// 收集光尘时的"铃"声（比 sfxCoin 更冷更克制，符合青铜氛围）
function sfxMote() {
  if (!audioCtx || !masterGain || audioMuted) return;
  tone(1174, 0.10, 'sine', 0.22);
  setTimeout(() => tone(1568, 0.16, 'sine', 0.18), 55);
}

// 夯土块撞地闷响：低频冲击 + 短促噪声散射
function sfxRockImpact() {
  if (!audioCtx || !masterGain || audioMuted) return;
  const now = audioCtx.currentTime;
  // 主冲击：80Hz 正弦波快速衰减
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, now);
  o.frequency.exponentialRampToValueAtTime(38, now + 0.28);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.55, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
  o.connect(g).connect(masterGain);
  o.start(now); o.stop(now + 0.5);
  // 散射噪声：模拟碎土落地
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * 0.24));
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) * (1 - i / n);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(700, now);
  lp.frequency.exponentialRampToValueAtTime(180, now + 0.24);
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.35, now);
  ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
  src.connect(lp).connect(ng).connect(masterGain);
  src.start(now); src.stop(now + 0.3);
}

// 土块颤动加剧时的闷闷"嘎"（先兆音，短促）
function sfxRockWarn() {
  if (!audioCtx || !masterGain || audioMuted) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(140, now);
  o.frequency.linearRampToValueAtTime(90, now + 0.16);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
  o.connect(g).connect(masterGain);
  o.start(now); o.stop(now + 0.22);
}

/* ================= 紧张氛围音（双层：drone + 心跳 + 危险脉冲） ================= */
// 标题页：低频持续、心跳缓慢（60bpm）、无危险脉冲
// 游戏中：心跳稍快（80bpm）、drone 更响、危险脉冲按 danger 强度调制
function setAmbState(s) {
  ambState = s;
  if (!ambGraph || !audioCtx) return;
  const t = audioCtx.currentTime;
  const isGame = (s === 'game');
  // 音量分配：让主旋律和打击乐真的听得见——之前 musicG 只开到 0.22，被 drone 完全压住
  ambGraph.droneG.gain.cancelScheduledValues(t);
  ambGraph.droneG.gain.linearRampToValueAtTime(isGame ? 0.18 : 0.10, t + 1.6);
  ambGraph.shimmerG.gain.cancelScheduledValues(t);
  ambGraph.shimmerG.gain.linearRampToValueAtTime(isGame ? 0.10 : 0.05, t + 1.6);
  // 紧张背景音乐：标题页降到极低音量（不静音，保持连续感），游戏中全开
  if (ambGraph.musicG) {
    ambGraph.musicG.gain.cancelScheduledValues(t);
    ambGraph.musicG.gain.linearRampToValueAtTime(isGame ? 0.62 : 0.14, t + 1.2);
  }
  if (ambGraph.percG) {
    ambGraph.percG.gain.cancelScheduledValues(t);
    ambGraph.percG.gain.linearRampToValueAtTime(isGame ? 0.80 : 0.12, t + 1.2);
  }
  ambGraph.beatOn = isGame;
  ambGraph.beatBPM = isGame ? 84 : 58;
}

// 危险度：0..1，由外部按"最近危险物距离 + 玩家血量"实时推送
function setAmbDanger(v) {
  if (!ambGraph) return;
  ambGraph.dangerTarget = Math.max(0, Math.min(1, v));
}

function startAmbient() {
  if (!audioCtx || !masterGain) return;
  ambientOn = true;

  // ---- 主 drone：低音埙 / 洞箫持续声底，缓慢起伏，营造"历史深处"的呼吸 ----
  const droneG = audioCtx.createGain();
  droneG.gain.value = 0.0001;
  droneG.gain.linearRampToValueAtTime(0.14, audioCtx.currentTime + 3.5);
  const droneLP = audioCtx.createBiquadFilter();
  droneLP.type = 'lowpass';
  droneLP.frequency.value = 320;
  droneLP.Q.value = 0.6;
  droneLP.connect(droneG); droneG.connect(masterGain);
  // 低音宫调：C2(65.41) + 微低五度 G1(49) + E2(82.41) + A2(110) —— 中国传统宫调骨架
  [[49.0, 'sine', 0.55], [65.41, 'sine', 0.60], [82.41, 'sine', 0.28],
   [98.0, 'triangle', 0.14], [110.0, 'sine', 0.10]].forEach(([f, type, w]) => {
    const o = audioCtx.createOscillator();
    o.type = type;
    o.frequency.value = f * (1 + (Math.random() - 0.5) * 0.004);
    const og = audioCtx.createGain();
    og.gain.value = w;
    // 缓慢 LFO 调音——让 drone 每 20~30 秒轻微漂移，避免机械感
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.04 + Math.random() * 0.05;
    const lfoG = audioCtx.createGain();
    lfoG.gain.value = f * 0.006;
    lfo.connect(lfoG); lfoG.connect(o.frequency);
    lfo.start();
    o.connect(og); og.connect(droneLP); o.start();
  });

  // ---- shimmer：远处飘散的钟磬余音（编钟/铜磬泛音，长余音自然衰减） ----
  const shimmerG = audioCtx.createGain();
  shimmerG.gain.value = 0.0001;
  shimmerG.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 4.0);
  const shH = audioCtx.createBiquadFilter();
  shH.type = 'bandpass';
  shH.frequency.value = 1400;
  shH.Q.value = 0.8;
  shH.connect(shimmerG); shimmerG.connect(masterGain);
  // 编钟泛音组（C-E-G-A + 高八度），五声宫调，慢速随机触发
  const GONG_NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
  setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running' || audioMuted) return;
    const f = GONG_NOTES[Math.floor(Math.random() * GONG_NOTES.length)] * (1 + (Math.random() - 0.5) * 0.005);
    const t0 = audioCtx.currentTime;
    // 主音：sine，长余音（4 秒）
    const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
    o1.type = 'sine'; o1.frequency.value = f;
    g1.gain.value = 0;
    g1.gain.linearRampToValueAtTime(0.10, t0 + 0.04);
    g1.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.5);
    o1.connect(g1); g1.connect(shH);
    o1.start(t0); o1.stop(t0 + 4.7);
    // 泛音 2f：金属感，衰减更快
    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = 'sine'; o2.frequency.value = f * 2.76; // 铜磬典型 2.76 倍泛音
    g2.gain.value = 0;
    g2.gain.linearRampToValueAtTime(0.04, t0 + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
    o2.connect(g2); g2.connect(shH);
    o2.start(t0); o2.stop(t0 + 2.0);
  }, 6500);

  // ---- 历史背景音乐：五声宫调（C-D-E-G-A），洞箫 lead + 深沉大鼓 + 编钟泛音 ----
  // 中国传统宫调：无 F、B，天然庄严古朴
  const SCALE = [130.81, 146.83, 164.81, 196.00, 220.00];      // C4 D4 E4 G4 A4
  const SCALE_HI = [261.63, 293.66, 329.63, 392.00, 440.00];   // C5 D5 E5 G5 A5
  const SCALE_LO = [65.41, 73.42, 82.41, 98.00, 110.00];       // C3 D3 E3 G3 A3（低音）
  // 16 步低音线：宫-宫-宫-宫 - 徵-徵-徵-徵 - 商-商-商-商 - 宫-宫-宫-宫（四段各 4 步）
  const BASS_SEQ = [0, 0, 0, 0,  3, 3, 3, 3,  1, 1, 1, 1,  0, 0, 4, 0];
  // Lead 动机（五声宫调上行/下行）：宫-徵-宫-徵-羽-徵-宫-徵（"宫徵"骨干 + 羽做装饰）
  const LEAD_SEQ = [0, 3, 0, 3,  4, 3, 0, 3];

  // 音乐（旋律/贝斯）+ 打击乐（鼓/钟）双总线
  const musicG = audioCtx.createGain();
  musicG.gain.value = 0.0001;
  musicG.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 2.5);
  // 音乐总线加一个暖色低通，避免高频刺耳
  const musicLP = audioCtx.createBiquadFilter();
  musicLP.type = 'lowpass'; musicLP.frequency.value = 3800; musicLP.Q.value = 0.4;
  musicG.connect(musicLP); musicLP.connect(masterGain);

  const percG = audioCtx.createGain();
  percG.gain.value = 0.0001;
  percG.gain.linearRampToValueAtTime(0.60, audioCtx.currentTime + 2.5);
  const percLP = audioCtx.createBiquadFilter();
  percLP.type = 'lowpass'; percLP.frequency.value = 2200;
  percG.connect(percLP); percLP.connect(masterGain);

  ambGraph = {
    droneG, shimmerG, musicG, percG,
    beatOn: false, beatBPM: 58,
    dangerTarget: 0, dangerCur: 0,
    musicOn: false,
    musicBPM: 66,            // 缓慢推进，历史苍凉感
    step: 0,
    nextStepAt: audioCtx.currentTime + 1.0,
    SCALE, SCALE_HI, SCALE_LO, BASS_SEQ, LEAD_SEQ
  };

  // 打击乐 helper：白噪声爆发（snare/hi-hat/cymbal 共用）
  function noiseBurst(t, dur, type, freq, q, vol) {
    const n = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
    const g = audioCtx.createGain();
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(ambGraph.percG);
    src.start(t); src.stop(t + dur);
  }
  // 大鼓 taiko：深沉轰鸣 + 木皮膜震动（用于历史节奏感）
  function kickDrum(t, vol, decay = 0.55) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 0.18);
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o.connect(g); g.connect(ambGraph.percG);
    o.start(t); o.stop(t + decay + 0.05);
    // 木皮膜 click 头（很轻）
    noiseBurst(t, 0.04, 'lowpass', 900, 2.0, vol * 0.25);
  }
  // 木鱼（用于节奏点缀，替代 snare）
  function woodFish(t, vol) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(820, t);
    o.frequency.exponentialRampToValueAtTime(520, t + 0.05);
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(vol, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(ambGraph.percG);
    o.start(t); o.stop(t + 0.16);
  }
  // 编钟 gong：sine 主音 + 2.76 泛音 + 长余音（金属撞击感）
  function gong(t, freq, vol, decay = 3.2) {
    // 主音
    const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
    o1.type = 'sine'; o1.frequency.value = freq;
    g1.gain.value = 0;
    g1.gain.linearRampToValueAtTime(vol, t + 0.012);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o1.connect(g1); g1.connect(ambGraph.musicG);
    o1.start(t); o1.stop(t + decay + 0.1);
    // 2.76 泛音（铜磬典型）
    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = 'sine'; o2.frequency.value = freq * 2.76;
    g2.gain.value = 0;
    g2.gain.linearRampToValueAtTime(vol * 0.35, t + 0.008);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + decay * 0.55);
    o2.connect(g2); g2.connect(ambGraph.musicG);
    o2.start(t); o2.stop(t + decay * 0.6);
    // 高频金属敲击
    noiseBurst(t, 0.03, 'highpass', 6500, null, vol * 0.22);
  }
  // 钹 cymbal：金属噪声（保留，用于危险度高时的加强）
  function cymbal(t, vol, dur = 0.85) {
    noiseBurst(t, dur, 'highpass', 6800, null, vol);
    noiseBurst(t, dur * 0.4, 'bandpass', 9500, 2.0, vol * 0.55);
  }

  // 调度器：25ms 步，提前 0.12s 排下一个音符
  function scheduleMusic() {
    if (!ambGraph) return;
    const LOOKAHEAD = 0.12;
    while (ambGraph.nextStepAt < audioCtx.currentTime + LOOKAHEAD) {
      // 游戏中基础紧张度 0.30，标题页降到 0.10
      const inGame = (ambGraph.beatOn === true);
      const baseDanger = inGame ? 0.22 : 0.08;
      const danger = Math.max(baseDanger, ambGraph.dangerCur);
      // BPM：66 → 88（缓慢推进，历史苍凉感）
      const bpm = 66 + danger * 22;
      const stepDur = 60 / bpm / 4;
      const t = ambGraph.nextStepAt;
      const step = ambGraph.step;
      const beat = step % 4;
      const bar = step >> 2;

      // 音量：音乐总线 + 打击学总线
      const mVol = 0.10 + danger * 0.14;   // 0.10 → 0.24
      const pVol = 0.14 + danger * 0.22;   // 0.14 → 0.36

      // ---- 打击乐：大鼓 + 木鱼，缓慢庄严节奏 ----
      if (step % 16 === 0) {
        // 每小节起手：重低音大鼓
        kickDrum(t, pVol * 1.6, 0.75);
        // 编钟：每 12 小节一次（低危险度 0.22 时约 15 秒一次），做"钟点式"仪式
        // 危险度上升时缩到 8 小节，但仍是稀疏重击
        const gongEvery = danger > 0.5 ? 8 : 12;
        if (bar % gongEvery === 0) {
          // 编钟音用宫调主音（C），危险高时改用低音区（C 下移八度），更沉重
          const gongFreq = danger > 0.7 ? 130.81 : 261.63;
          gong(t, gongFreq, mVol * 0.75, 5.0);
        }
        if (bar % 4 === 0) {
          // 每 4 小节一次钹，营造节奏起伏
          cymbal(t, pVol * 0.35, 1.0);
        }
      }
      if (step % 16 === 8) {
        // 第 9 步：反拍低音鼓（更轻，做"呼吸"）
        kickDrum(t, pVol * 0.75, 0.55);
      }
      // 木鱼节奏错落：只在小节内 4、14 步打（不对称），打破"4/12 整齐节拍"
      if (step % 16 === 4 || step % 16 === 14) {
        woodFish(t, pVol * 0.55);
      }
      // 危险度过半：木鱼加密到 10 步（做紧迫），保持单一音点
      if (danger > 0.6 && step % 16 === 10) {
        woodFish(t, pVol * 0.45);
      }
      if (danger > 0.8 && step % 16 === 14) {
        // 危险度极高：末拍砸钹 + 大鼓
        cymbal(t, pVol * 0.6, 0.7);
        kickDrum(t, pVol * 1.1, 0.45);
      }

      // ---- 低音线：缓慢深沉低音（宫调低音区）----
      {
        const idx = ambGraph.BASS_SEQ[step % ambGraph.BASS_SEQ.length];
        // 只在小节起始和反拍打低音，避免密集
        if (step % 4 === 0 || (danger > 0.4 && step % 4 === 2)) {
          const f = ambGraph.SCALE_LO[idx];
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(f, t);
          // 低音低通滤波，得到沉闷而硬的贝斯
          const lp = audioCtx.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 480; lp.Q.value = 0.6;
          g.gain.value = 0;
          g.gain.linearRampToValueAtTime(mVol * 1.4, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + stepDur * 3.6);
          o.connect(lp); lp.connect(g); g.connect(ambGraph.musicG);
          o.start(t); o.stop(t + stepDur * 3.8);
        }
      }

      // ---- Lead 主音：洞箫 / 埙质感（缓慢的长音）----
      if (step % 2 === 0) {
        const idx = ambGraph.LEAD_SEQ[(step >> 1) % ambGraph.LEAD_SEQ.length];
        const f = ambGraph.SCALE_HI[idx];
        // 洞箫音色：sine + 少量 vibrato + 高带宽滤波器
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f, t);
        // 轻微 vibrato（气声抖动）
        const lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
        lfo.frequency.value = 4.5;
        lg.gain.value = f * 0.006;
        lfo.connect(lg); lg.connect(o.frequency);
        lfo.start(t); lfo.stop(t + stepDur * 2);
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.6;
        const leadVol = mVol * (0.55 + danger * 0.25);
        g.gain.value = 0;
        g.gain.linearRampToValueAtTime(leadVol, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + stepDur * 2.2);
        o.connect(bp); bp.connect(g); g.connect(ambGraph.musicG);
        o.start(t); o.stop(t + stepDur * 2.3);
      }

      // ---- 危险度 > 0.55：加入"半音悬置"音（不安感）----
      if (danger > 0.55 && step % 4 === 2) {
        // 用 F# 或 B 半音（宫调外音），制造不安
        const f = ambGraph.SCALE_HI[1] * 1.189; // D 半音上移
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f, t);
        const gVol = mVol * 0.30 * (danger - 0.55);
        g.gain.value = 0;
        g.gain.linearRampToValueAtTime(gVol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + stepDur * 1.8);
        o.connect(g); g.connect(ambGraph.musicG);
        o.start(t); o.stop(t + stepDur * 1.9);
      }

      // ---- 危险度 > 0.7：加入编钟琶音（三连音，铜磬泛音）----
      if (danger > 0.7 && step % 8 === 0) {
        for (let k = 0; k < 3; k++) {
          const tk = t + k * stepDur * 1.5;
          const f = ambGraph.SCALE_HI[(step >> 2) % ambGraph.SCALE_HI.length] * 1.5;
          gong(tk, f, mVol * 0.35, 1.6);
        }
      }

      ambGraph.step = (ambGraph.step + 1) % 64;
      ambGraph.nextStepAt += stepDur;
    }
  }
  ambGraph.musicTimer = setInterval(scheduleMusic, 25);
}

// 每帧调用：把当前状态/危险度翻译成氛围音参数；心跳音在定时器回调里播
let lastBeatAt = 0, lastWarnAt = 0, lastWarnHazard = -1;
function updateAmbience(dt) {
  if (!ambGraph || !audioCtx) return;
  // 计算目标紧张度
  let target = 'title';
  if (state === 'play') target = 'game';
  else if (state === 'intro' || state === 'clear' || state === 'ending') target = 'game';
  if (target !== ambState) setAmbState(target);

  // 危险度：0..1，依据"最近危险物距离 + 玩家血量 + 死亡倒计时"综合
  let danger = 0;
  if (state === 'play') {
    // 血量系数：越剩越少越紧张
    const hpFactor = Math.max(0, (MAXHP - player.hp) / MAXHP);
    danger += hpFactor * 0.35;
    // 死亡倒计时：扣血到 0 后短暂高紧张
    if (deathTimer > 0) danger += 0.6;
    else if (player.inv > 0) danger += player.inv * 0.3;
    // 危险物近距离
    if (haz.length) {
      let minD = 99999;
      let closest = -1;
      for (let i = 0; i < haz.length; i++) {
        const h = haz[i];
        // 用 hazard 中心（laser 用 cur，rock 用 cx，其他用 x/gy）
        let hx, hy;
        if (h.t === 'laser') { hx = h.cur; hy = h.y + (h.hgt || 100) * 0.5; }
        else if (h.t === 'rock') { hx = h.x; hy = h.cx !== undefined ? h.cx : h.gy; }
        else { hx = h.x; hy = h.gy - (h.hgt || 0) * 0.5; }
        const dx = hx - player.x, dy = hy - player.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < minD) { minD = d; closest = i; }
      }
      // 距离 < 380 像素开始紧张，越近越强
      if (minD < 380) {
        danger += (1 - minD / 380) * 0.45;
        // 危险物首次进入近距范围时，播一声"嘶——"
        if (closest !== lastWarnHazard && tGlobal - lastWarnAt > 1.2) {
          sfxWarn();
          lastWarnAt = tGlobal;
          lastWarnHazard = closest;
        }
      } else if (closest === -1) {
        lastWarnHazard = -1;
      }
    }
  }
  setAmbDanger(danger);
  ambGraph.dangerCur += (danger - ambGraph.dangerCur) * Math.min(1, dt * 6);

  // 心跳：只在游戏状态且非死亡时；BPM 受危险度调制
  const isPlaying = (state === 'play');
  const wantBeat = isPlaying && ambGraph.beatOn && deathTimer <= 0;
  const bpm = ambGraph.beatBPM + ambGraph.dangerCur * 56;   // 84 → 最多 140
  const interval = 60 / bpm;
  if (wantBeat && (tGlobal - lastBeatAt) >= interval) {
    const vol = 0.28 + ambGraph.dangerCur * 0.42;   // 0.28 → 0.70
    sfxHeartbeat(vol);
    lastBeatAt = tGlobal;
    lastWarnHazard = -1;   // 心跳后重置，允许下一次靠近再次提示
  }
}

/* ================= 物理常量（已验证） ================= */
const GRAV = 2600, MAXFALL = 1300;
const SPEED = 340, ACC = 2600, FRIC = 2400;
const JUMP = 1040, COYOTE = 0.10, BUFFER = 0.10;
const STEP = 1 / 120;

const player = {
  x: 0, y: 0, r: 27, vx: 0, vy: 0,
  grounded: false, coyote: 0, buffer: 0, face: 1,
  sx: 1, sy: 1, inv: 0,
  goldFlash: 0
};

const cam = { x: 0 };
let levelIdx = 0, level = LEVELS[0];
let state = 'title';
let tGlobal = 0, stateT = 0;
let collected = 0;
const motes = [];
let burst = [];

/* ---- 生命 / 死亡 ---- */
const MAXHP = 3;
let haz = [];
let hurtFlash = 0, deathTimer = 0, shakeT = 0;

/* ---- 逐段旁白 ---- */
let sub = null, lineIdx = 0;

function loadLevel(i) {
  levelIdx = i;
  level = LEVELS[i];
  player.x = level.spawn.x;
  player.y = level.spawn.y;
  player.vx = player.vy = 0;
  player.grounded = false;
  player.coyote = 0;
  player.buffer = 0;
  player.face = 1;
  player.sx = player.sy = 1;
  player.inv = 0;
  player.hp = MAXHP;
  cam.x = 0;
  collected = 0;
  motes.length = 0;
  for (const m of level.motes) motes.push({ x: m.x, y: m.y, taken: false });
  burst = [];
  haz = (level.hazards || []).map((h, hi) => {
    const c = Object.assign({}, h, { rect: null, cur: 0, firing: false });
    // rock 专属：每块土块形态都不同（真夯土块从坑壁脱落，形状不规则）
    if (h.t === 'rock') {
      // 6 个环状不规则顶点（归一化 [-1,1]，绘制时按 size 缩放）
      const n = 6;
      const pts = [];
      const jitSeed = (h.x + hi * 7) * 13;
      const rnd = () => {
        const s = Math.sin(jitSeed + pts.length * 13.37) * 43758.5453;
        return s - Math.floor(s);
      };
      for (let k = 0; k < n; k++) {
        const ang = (k / n) * Math.PI * 2 + rnd() * 0.45;
        const r = 0.68 + rnd() * 0.42;  // 半径 0.68–1.10 的随机扰动
        pts.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r * (0.85 + rnd() * 0.25) });
      }
      c.shape = pts;
      // 2 条主裂纹（从内部一点出发，两个方向）
      c.cracks = [];
      for (let k = 0; k < 2; k++) {
        c.cracks.push({
          x0: (rnd() - 0.5) * 0.5, y0: (rnd() - 0.5) * 0.5,
          x1: (rnd() - 0.5) * 1.4, y1: (rnd() - 0.5) * 1.2
        });
      }
      c.crackLen = 2;
      // 表面碎屑点（3 个）
      c.chips = [];
      for (let k = 0; k < 3; k++) {
        c.chips.push({
          x: (rnd() - 0.5) * 0.9, y: (rnd() - 0.5) * 0.7,
          s: 0.6 + rnd() * 0.6
        });
      }
      // 状态机（覆盖旧字段）
      c.phase = 'idle';
      c.tInPhase = 0;
      c.warnTotal = h.warn;
      c.onTotal = h.on;
      c.offTotal = h.off;
      c.cx = h.yTop;
      c.vy = 0;
      c.vr = (rnd() - 0.5) * 6;
      c.rot = 0;
      c.phaseP = 0;
      c.impactT = 0;
      c.shakePhase = rnd() * Math.PI * 2;
      c.dropped = 0;
      c.shards = null;
      c.dust = null;
      c.pit = null;
      c._warnPlayed = false;
      c._impactPlayed = false;
      c.rect = null;
    }
    return c;
  });
  lineIdx = 0;
  sub = null;
  hurtFlash = 0;
  deathTimer = 0;
  shakeT = 0;
}

function respawn() {
  player.x = level.spawn.x;
  player.y = level.spawn.y;
  player.vx = player.vy = 0;
  player.inv = 1.0;
  player.hp = MAXHP;
  deathTimer = 0;
}

/* 受伤：扣血 + 无敌 + 击退；血量归零后整关重来 */
function hurt(fromX) {
  if (player.inv > 0 || deathTimer > 0) return;
  player.hp--;
  player.inv = 1.25;
  hurtFlash = 0.4;
  shakeT = 0.28;
  player.vx = (player.x < fromX ? -1 : 1) * 320;
  player.vy = -440;
  player.grounded = false;
  sfxHit();
  if (player.hp <= 0) { deathTimer = 0.95; deathFlashOn(); sfxDeath(); }
}
function deathFlashOn() { hurtFlash = 1.0; }

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ================= 危险物 ================= */
function updateHazards(dt) {
  const hw = player.r * 0.74;
  for (const h of haz) {
    h.rect = null;
    h.firing = false;

    if (h.t === 'laser') {
      const span = h.x1 - h.x0;
      const tp = (tGlobal * h.spd / span + (h.year || 0) + (h.ph || 0)) % 2;
      const k = tp < 1 ? tp : 2 - tp;
      const cx = h.x0 + span * k;
      h.firing = true;
      h.cur = cx;
      h.rect = { x: cx - h.w / 2, y: h.y, w: h.w, h: h.hgt };
    } else if (h.t === 'rock') {
      // 状态机：idle → precursor（边缘碎屑先兆）→ shaking（颤动加剧+下沉）→ falling（重力加速）→ impact（撞击碎块+坑痕）→ idle
      h.tInPhase = (h.tInPhase || 0) + dt;
      const precT = Math.max(0.20, h.warnTotal * 0.45);  // 先兆时长
      const shakeT_ = Math.max(0.30, h.warnTotal - precT); // 颤动加剧时长
      // 分阶段判定（基于 tGlobal，保证多 rock 相位错开）
      const per = h.warnTotal + h.onTotal + h.offTotal + 0.05;
      const tp = (tGlobal + (h.ph || 0)) % per;
      h.warning = false;
      h.firing = false;

      if (tp < precT) {
        // precursor：土块位置不动，只出现边缘碎屑先兆
        h.phase = 'precursor';
        h.cx = h.yTop;
        h.phaseP = tp / precT;
        if (!h._warnPlayed) { sfxRockWarn(); h._warnPlayed = true; }
      } else if (tp < precT + shakeT_) {
        // shaking：颤动加剧 + 缓慢下沉 4px
        h.phase = 'shaking';
        h.phaseP = (tp - precT) / shakeT_;
        h.cx = h.yTop + 4 * Math.min(1, h.phaseP);
      } else if (tp < precT + shakeT_ + h.onTotal) {
        // falling：重力加速坠落
        h.phase = 'falling';
        h._warnPlayed = false;
        h.firing = true;
        const fallT = tp - precT - shakeT_;
        // 目标距离
        const dist = h.gy - h.yTop - h.size - 4;
        // 用二次方程反解 g，使 fallT 时刚好落地：dist = 0.5 * g * t^2
        const g = 2 * dist / (h.onTotal * h.onTotal);
        h.cx = h.yTop + 4 + 0.5 * g * fallT * fallT;
        h.vy = g * fallT;
        h.rot = h.vr * fallT;
        // 撞击判定
        if (h.cx >= h.gy - h.size) {
          h.cx = h.gy - h.size;
          h.phase = 'impact';
          h.phaseP = 0;
          h._impactPlayed = false;
          // 生成碎块：1 主残块（原 rock 主体，较小，落到地面）+ 2 小碎片飞散
          h.shards = [];
          // 主残块：size 缩到 0.55，作为"碎裂后剩下的核心"
          h.shards.push({
            x: h.x + (Math.random() - 0.5) * 6, y: h.gy - h.size * 0.28,
            vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 30,
            s: h.size * 0.55, rot: Math.random() * 0.6 - 0.3, vr: (Math.random() - 0.5) * 3,
            shape: h.shape, cracks: h.cracks, chips: h.chips,
            life: 2.0, t: 0, main: true
          });
          // 2 小碎片：从撞击点扇形飞出
          for (let k = 0; k < 2; k++) {
            const ang = -Math.PI / 2 + (k === 0 ? -1 : 1) * (0.55 + Math.random() * 0.3);
            const spd = 240 + Math.random() * 180;
            h.shards.push({
              x: h.x + (Math.random() - 0.5) * h.size * 0.4, y: h.gy - 6,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
              s: 4 + Math.random() * 5, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
              life: 0.7 + Math.random() * 0.3, t: 0, main: false
            });
          }
          // 扬尘
          h.dust = [];
          for (let k = 0; k < 10; k++) {
            const ang = -Math.PI + Math.random() * Math.PI;
            const spd = 40 + Math.random() * 90;
            h.dust.push({
              x: h.x + (Math.random() - 0.5) * h.size * 0.8, y: h.gy - 4,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd * 0.6 - 30,
              life: 0.6 + Math.random() * 0.4, t: 0, s: 2 + Math.random() * 3
            });
          }
          // 坑痕
          h.pit = { x: h.x, life: 4.5, t: 0 };
          shakeT = Math.max(shakeT, 0.28);
        }
      } else if (tp < precT + shakeT_ + h.onTotal + 0.30) {
        // impact：撞击后短暂表现（碎片飞出、扬尘扩散、坑痕形成）
        h.phase = 'impact';
        h.cx = h.gy - h.size;
        h.phaseP = (tp - precT - shakeT_ - h.onTotal) / 0.30;
        if (!h._impactPlayed) { sfxRockImpact(); h._impactPlayed = true; }
      } else {
        // idle：等待下一次
        h.phase = 'idle';
        h.cx = h.yTop;
        h.phaseP = 0;
        h._warnPlayed = false;
      }

      // 更新碎块 & 扬尘
      if (h.shards) {
        for (const sd of h.shards) {
          sd.t += dt;
          sd.vy += 900 * dt;
          sd.x += sd.vx * dt; sd.y += sd.vy * dt;
          sd.rot += sd.vr * dt;
          // 主残块落地约束（不能再穿透地面）
          if (sd.main && sd.y > h.gy - sd.s / 2) {
            sd.y = h.gy - sd.s / 2;
            if (sd.vy > 0) sd.vy *= -0.15; // 微反弹
            sd.vx *= 0.6;
            sd.vr *= 0.5;
          }
        }
        h.shards = h.shards.filter(sd => sd.t < sd.life);
        if (h.shards.length === 0) h.shards = null;
      }
      if (h.dust) {
        for (const d of h.dust) {
          d.t += dt;
          d.vy += 200 * dt;
          d.x += d.vx * dt; d.y += d.vy * dt;
        }
        h.dust = h.dust.filter(d => d.t < d.life);
        if (h.dust.length === 0) h.dust = null;
      }
      if (h.pit) {
        h.pit.t += dt;
        h.pit.life -= dt;
        if (h.pit.life <= 0) h.pit = null;
      }

      // 落点 rect 只在 falling / impact 早期有效
      if (h.phase === 'falling') {
        h.rect = { x: h.x - h.size / 2, y: h.cx, w: h.size, h: h.size };
      } else if (h.phase === 'impact' && h.phaseP < 0.5) {
        h.rect = { x: h.x - h.size / 2, y: h.gy - h.size, w: h.size, h: h.size };
      }
    } else {
      const per = h.warn + h.on + h.off;
      const tp = (tGlobal + (h.ph || 0)) % per;
      h.warning = tp < h.warn;
      h.firing = tp >= h.warn && tp < h.warn + h.on;
      h.cur = h.firing ? h.hgt * Math.min(1, (tp - h.warn) / 0.13) : 0;
      if (h.firing && h.cur > 8) {
        h.rect = { x: h.x - h.w / 2, y: h.gy - h.cur, w: h.w, h: h.cur };
      }
    }

    if (h.rect && player.inv <= 0 && deathTimer <= 0) {
      const r = h.rect;
      if (player.x + hw > r.x && player.x - hw < r.x + r.w &&
          player.y + player.r > r.y && player.y - player.r < r.y + r.h) {
        hurt(r.x + r.w / 2);
      }
    }
  }
}

/* ================= 逐段旁白 ================= */
function updateSubs(dt) {
  const L = level.lines || [];
  while (lineIdx < L.length && player.x > L[lineIdx].x) {
    sub = { text: L[lineIdx].text, life: 4.8, max: 4.8 };
    lineIdx++;
  }
  if (sub) { sub.life -= dt; if (sub.life <= 0) sub = null; }
}

/* ================= 物理步进 ================= */
function step(dt) {
  const wasGrounded = player.grounded, vyBefore = player.vy;
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir !== 0) {
    player.vx += dir * ACC * dt;
    player.vx = clamp(player.vx, -SPEED, SPEED);
    player.face = dir;
  } else {
    const d = FRIC * dt;
    if (Math.abs(player.vx) <= d) player.vx = 0;
    else player.vx -= Math.sign(player.vx) * d;
  }

  if (input.jumpEdge) player.buffer = BUFFER;
  else player.buffer = Math.max(0, player.buffer - dt);

  if (player.grounded) player.coyote = COYOTE;
  else player.coyote = Math.max(0, player.coyote - dt);

  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = -JUMP;
    player.buffer = 0;
    player.coyote = 0;
    player.grounded = false;
    sfxJump();
  }
  if (!input.jumpHeld && player.vy < 0) player.vy += GRAV * 2.2 * dt;

  player.vy += GRAV * dt;
  if (player.vy > MAXFALL) player.vy = MAXFALL;

  const hw = player.r * 0.72;

  /* --- 水平位移 + 侧向碰撞 --- */
  const prevX = player.x;
  player.x += player.vx * dt;
  for (const pl of level.plats) {
    const px = pl[0], py = pl[1], pw = pl[2], ph = pl[3];
    if (player.y + player.r > py && player.y - player.r < py + ph) {
      if (player.x + hw > px && prevX + hw <= px) { player.x = px - hw; player.vx = 0; }
      else if (player.x - hw < px + pw && prevX - hw >= px + pw) { player.x = px + pw + hw; player.vx = 0; }
    }
  }
  if (player.x < player.r) { player.x = player.r; player.vx = 0; }
  if (player.x > level.width - player.r) { player.x = level.width - player.r; player.vx = 0; }

  /* --- 垂直位移 + 扫掠落地（prevBottom 必须在积分前记录） --- */
  const prevBottom = player.y + player.r;
  const prevTop = player.y - player.r;
  player.y += player.vy * dt;

  let onGround = false;
  for (const pl of level.plats) {
    const px = pl[0], py = pl[1], pw = pl[2], ph = pl[3];
    if (player.x + hw <= px || player.x - hw >= px + pw) continue;
    if (player.vy >= 0 && prevBottom <= py + 1 && player.y + player.r >= py) {
      player.y = py - player.r;
      player.vy = 0;
      onGround = true;
    } else if (player.vy < 0 && prevTop >= py + ph - 1 && player.y - player.r <= py + ph) {
      player.y = py + ph + player.r;
      player.vy = 0;
    }
  }
  player.grounded = onGround;
  if (!wasGrounded && onGround && vyBefore > 260) sfxLand();

  if (player.y > H + 240) respawn();

  player.inv = Math.max(0, player.inv - dt);

  /* --- 收集光尘 --- */
  for (const m of motes) {
    if (m.taken) continue;
    const dx = m.x - player.x, dy = m.y - player.y;
    if (dx * dx + dy * dy < 3400) {
      m.taken = true;
      collected++;
      sfxCoin();
      player.goldFlash = 1.8;
      for (let i = 0; i < 14; i++) {
        burst.push({
          x: m.x, y: m.y,
          vx: (Math.random() - 0.5) * 220,
          vy: (Math.random() - 0.5) * 220 - 60,
          life: 0.6, max: 0.6
        });
      }
    }
  }

  /* --- 相机 --- */
  const target = clamp(player.x - W * 0.38, 0, Math.max(0, level.width - W));
  cam.x += (target - cam.x) * Math.min(1, dt * 9);

  /* --- 终点判定 --- */
  const atGoal = Math.abs(player.x - level.goal.x) < 50 &&
                 Math.abs((player.y + player.r) - level.goal.y) < 100;
  if (atGoal && collected >= level.motes.length) {
    state = 'clear';
    stateT = 0;
    sfxClear();
  }

  /* --- 挤压拉伸 --- */
  const tsx = player.grounded ? (Math.abs(player.vx) > 40 ? 1.07 : 1.01) : 0.95;
  const tsy = player.grounded ? (Math.abs(player.vx) > 40 ? 0.95 : 1.00) : 1.05;
  player.sx += (tsx - player.sx) * Math.min(1, dt * 12);
  player.sy += (tsy - player.sy) * Math.min(1, dt * 12);

  /* --- 危险物 / 旁白 / 受击表现 --- */
  updateHazards(dt);
  updateSubs(dt);
  hurtFlash = Math.max(0, hurtFlash - dt * 1.6);
  shakeT = Math.max(0, shakeT - dt);

  if (deathTimer > 0) {
    deathTimer -= dt;
    if (deathTimer <= 0) loadLevel(levelIdx);   // 血量耗尽：本关重来
  }
}
