    if (h.t === 'rock') {
      const phase = h.phase || 'idle';
      const phaseP = h.phaseP || 0;
      const cyWorld = h.cx === undefined ? h.yTop : h.cx;
      const cx = h.x - cam.x, cy = cyWorld;

      // ---------- 撞击后坑痕（持续几秒才渐隐） ----------
      if (h.pit) {
        const pitA = h.pit.life > 3.0 ? 0.42 : (h.pit.life / 3.0) * 0.42;
        const pxA = h.pit.x - cam.x;
        // 外圈浅凹（暗色）
        ctx.fillStyle = `rgba(20,14,8,${pitA})`;
        ctx.beginPath();
        ctx.ellipse(pxA, h.gy - 2, h.size * 0.55, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        // 内圈更暗
        ctx.fillStyle = `rgba(10,6,4,${pitA * 1.1})`;
        ctx.beginPath();
        ctx.ellipse(pxA, h.gy - 3, h.size * 0.32, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---------- 扬尘（撞击瞬间散开） ----------
      if (h.dust) {
        for (const d of h.dust) {
          const a = Math.max(0, 1 - d.t / d.life) * 0.6;
          ctx.fillStyle = `rgba(200,170,120,${a})`;
          ctx.beginPath();
          ctx.arc(d.x - cam.x, d.y, d.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ---------- 碎片（撞击后飞出的小土块 & 主残块） ----------
      if (h.shards) {
        for (const sd of h.shards) {
          const a = Math.max(0, 1 - sd.t / sd.life);
          ctx.save();
          ctx.translate(sd.x - cam.x, sd.y);
          ctx.rotate(sd.rot);
          ctx.globalAlpha = a;
          if (sd.main && sd.shape) {
            // 主残块：用原始 rock 的随机形状（等比缩小）
            const ss = sd.s / 2;
            ctx.fillStyle = '#6b5638';
            ctx.beginPath();
            for (let i = 0; i < sd.shape.length; i++) {
              const p = sd.shape[i];
              if (i === 0) ctx.moveTo(p.x * ss, p.y * ss); else ctx.lineTo(p.x * ss, p.y * ss);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(20,14,8,0.7)';
            ctx.lineWidth = 1.6;
            ctx.stroke();
            // 裂纹
            ctx.strokeStyle = 'rgba(20,14,8,0.6)';
            ctx.lineWidth = 0.9;
            for (const cr of (sd.cracks || [])) {
              ctx.beginPath();
              ctx.moveTo(cr.x0 * ss, cr.y0 * ss);
              ctx.lineTo(cr.x1 * ss, cr.y1 * ss);
              ctx.stroke();
            }
          } else {
            // 小碎片：不规则方形
            const sz = sd.s;
            ctx.fillStyle = '#6b5638';
            ctx.beginPath();
            ctx.moveTo(-sz * 0.5, -sz * 0.4);
            ctx.lineTo( sz * 0.45, -sz * 0.5);
            ctx.lineTo( sz * 0.55,  sz * 0.35);
            ctx.lineTo(-sz * 0.35,  sz * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(20,14,8,0.7)';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      // ---------- precursor：暖土色地面暗影（去游戏 UI 橙红圈） + 边缘碎屑先兆 ----------
      if (phase === 'precursor') {
        const f = phaseP; // 0→1
        // 地面暗影（暖土色，随 phaseP 加深）
        const grdA = 0.18 + f * 0.32;
        const grd = ctx.createRadialGradient(cx, h.gy - 3, 2, cx, h.gy - 3, h.size * 0.7);
        grd.addColorStop(0, `rgba(140,100,58,${grdA})`);
        grd.addColorStop(1, 'rgba(140,100,58,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, h.gy - 3, h.size * 0.7, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // 边缘小碎屑先兆（从土块边缘偶尔掉落一粒）
        const n = 3;
        for (let i = 0; i < n; i++) {
          const seed = (i + 1) * 13 + (h.x | 0);
          const side = (i % 2 === 0) ? -1 : 1;
          const tLocal = ((tGlobal * 1.2 + i * 0.37 + seed * 0.01) % 1);
          if (tLocal > 0.15 && tLocal < 0.9) {
            const px = cx + side * h.size * 0.42 + Math.sin(i * 2.1) * 4;
            const py = cy + h.size * 0.35 + tLocal * 14;
            ctx.fillStyle = `rgba(160,120,80,${(1 - tLocal) * 0.7})`;
            ctx.fillRect(px, py, 2, 2);
          }
        }
      }

      // ---------- shaking：颤动加剧+下沉 + 地面阴影加强 ----------
      if (phase === 'shaking') {
        const f = phaseP;
        const grdA = 0.32 + f * 0.32;
        const grd = ctx.createRadialGradient(cx, h.gy - 3, 2, cx, h.gy - 3, h.size * 0.7);
        grd.addColorStop(0, `rgba(140,100,58,${grdA})`);
        grd.addColorStop(1, 'rgba(140,100,58,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, h.gy - 3, h.size * 0.7, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---------- 土块本体（撞击阶段已经碎成 shards，不画主体） ----------
      if (phase !== 'impact') {
        ctx.save();
        let shakeX = 0, shakeY = 0;
        if (phase === 'shaking') {
          const amp = 1.5 + phaseP * 3.5;
          shakeX = Math.sin(tGlobal * 38 + h.shakePhase) * amp;
          shakeY = Math.sin(tGlobal * 46 + h.shakePhase + 0.7) * (amp * 0.7);
        } else if (phase === 'falling') {
          // 下落时轻微前后抖动（旋转感）
          shakeX = Math.sin(tGlobal * 20) * 1.2;
        }
        ctx.translate(cx + shakeX, cy + shakeY);
        if (h.rot) ctx.rotate(h.rot);

        // 土色脉冲光晕（预警时呼吸）
        if (phase === 'precursor' || phase === 'shaking') {
          const pulse = 0.5 + 0.5 * Math.sin(tGlobal * 6);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const glowR = h.size * 1.2 + pulse * 8;
          const glowG = ctx.createRadialGradient(0, 0, h.size * 0.4, 0, 0, glowR);
          glowG.addColorStop(0, `rgba(180,140,80,${0.16 + pulse * 0.12})`);
          glowG.addColorStop(1, 'rgba(180,140,80,0)');
          ctx.fillStyle = glowG;
          ctx.beginPath();
          ctx.arc(0, 0, glowR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 下落中的运动模糊（在土块本体之前，位于上方）
        if (phase === 'falling' && h.vy > 200) {
          ctx.globalAlpha = 0.32;
          ctx.fillStyle = '#8a6a44';
          const blurLen = Math.min(60, h.vy * 0.06);
          ctx.beginPath();
          ctx.ellipse(0, -blurLen * 0.4, h.size * 0.36, blurLen * 0.45, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        // 构建主体多边形路径
        const s = h.size / 2;
        const bodyPath = () => {
          ctx.beginPath();
          for (let i = 0; i < h.shape.length; i++) {
            const p = h.shape[i];
            const px = p.x * s, py = p.y * s;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
        };

        // ---------- 主体填充 ----------
        bodyPath();
        ctx.fillStyle = (phase === 'falling') ? '#6b5638' : 'rgba(70,56,38,0.95)';
        ctx.fill();

        // ---------- 内部装饰：clip 到主体多边形内，避免溢出随机轮廓 ----------
        ctx.save();
        bodyPath();
        ctx.clip();

        // 内部层理（3 条深色横向线）
        ctx.strokeStyle = 'rgba(30,20,10,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-s * 1.2, -s * 0.35);
        ctx.lineTo( s * 1.2, -s * 0.30);
        ctx.moveTo(-s * 1.2, -s * 0.05);
        ctx.lineTo( s * 1.2,  s * 0.04);
        ctx.moveTo(-s * 1.2,  s * 0.35);
        ctx.lineTo( s * 1.2,  s * 0.44);
        ctx.stroke();

        // 主裂纹（来自 h.cracks）
        ctx.strokeStyle = 'rgba(20,14,8,0.6)';
        ctx.lineWidth = 1.1;
        for (const cr of h.cracks) {
          ctx.beginPath();
          ctx.moveTo(cr.x0 * s, cr.y0 * s);
          ctx.lineTo(cr.x1 * s, cr.y1 * s);
          ctx.stroke();
        }

        // 表面碎屑点
        ctx.fillStyle = 'rgba(30,20,10,0.55)';
        for (const ch of h.chips) {
          ctx.beginPath();
          ctx.arc(ch.x * s, ch.y * s, ch.s, 0, Math.PI * 2);
          ctx.fill();
        }

        // 顶面高光（浅色顶部渐变）
        const topG = ctx.createLinearGradient(0, -s * 1.1, 0, -s * 0.4);
        topG.addColorStop(0, 'rgba(180,140,88,0.35)');
        topG.addColorStop(1, 'rgba(180,140,88,0)');
        ctx.fillStyle = topG;
        ctx.fillRect(-s * 1.2, -s * 1.1, s * 2.4, s * 0.7);

        // 底面阴影（深色底部渐变）
        const botG = ctx.createLinearGradient(0, s * 0.2, 0, s * 1.1);
        botG.addColorStop(0, 'rgba(20,14,8,0)');
        botG.addColorStop(1, 'rgba(20,14,8,0.55)');
        ctx.fillStyle = botG;
        ctx.fillRect(-s * 1.2, s * 0.2, s * 2.4, s * 0.9);

        ctx.restore();

        // 主体描边
        bodyPath();
        ctx.strokeStyle = 'rgba(20,14,8,0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 从底面飘出的碎土粒（预警时更密）
        if (phase === 'precursor' || phase === 'shaking' || phase === 'falling') {
          const nParticles = phase === 'falling' ? 5 : (phase === 'shaking' ? 7 : 4);
          for (let i = 0; i < nParticles; i++) {
            const px0 = Math.sin(i * 2.7 + h.shakePhase) * h.size * 0.32;
            const py0 = s * 0.9;
            const tPhase = ((tGlobal * (0.6 + (i % 3) * 0.25) + i * 0.13) % 1);
            const px = px0 + Math.sin(i * 3.1 + tGlobal * 3) * 4;
            const py = py0 + tPhase * 22;
            const alpha = (1 - tPhase) * 0.7;
            const sz = 1.5 + (i % 3) * 0.6;
            ctx.fillStyle = `rgba(180,140,88,${alpha})`;
            ctx.fillRect(px, py, sz, sz);
          }
        }

        ctx.restore();
      }
      continue;
    }

    // fire / rust：地面喷口/锈刺
    const cx = h.x - cam.x;
    if (cx < -160 || cx > W + 160) continue;
    const gy = h.gy;
    const isFire = h.t === 'fire';

    // 底座：火口是铜喷口，锈池是地面被顶开的一道裂缝
    if (isFire) {
      ctx.fillStyle = '#241610';
      ctx.beginPath();
      ctx.moveTo(cx - h.w * 0.7, gy);
      ctx.lineTo(cx - h.w * 0.42, gy - 16);
      ctx.lineTo(cx + h.w * 0.42, gy - 16);
      ctx.lineTo(cx + h.w * 0.7, gy);
      ctx.closePath();
      ctx.fill();
    } else {
      // 地缝：地面被从下面顶开，缝口渗出铜绿，边缘干土翻起
      // 铜绿洇进夯土的地面污渍
      ctx.save();
      ctx.translate(cx, gy + 1);
      ctx.scale(1, 0.30);
      const stain = ctx.createRadialGradient(0, 0, 0, 0, 0, h.w * 2.0);
      stain.addColorStop(0, 'rgba(44,92,70,0.55)');
      stain.addColorStop(0.5, 'rgba(34,72,55,0.26)');
      stain.addColorStop(1, 'rgba(30,62,48,0)');
      ctx.fillStyle = stain;
      ctx.beginPath();
      ctx.arc(0, 0, h.w * 2.0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 缝口：不规则暗口，不是规整的椭圆
      ctx.fillStyle = '#100d0a';
      ctx.beginPath();
      ctx.moveTo(cx - h.w * 0.92, gy + 3);
      ctx.quadraticCurveTo(cx - h.w * 0.46, gy - 10, cx, gy - 8);
      ctx.quadraticCurveTo(cx + h.w * 0.50, gy - 10, cx + h.w * 0.94, gy + 3);
      ctx.quadraticCurveTo(cx + h.w * 0.42, gy + 9, cx, gy + 8);
      ctx.quadraticCurveTo(cx - h.w * 0.44, gy + 9, cx - h.w * 0.92, gy + 3);
      ctx.closePath();
      ctx.fill();

      // 被顶起的干土沿
      eachSide(d => {
        ctx.fillStyle = 'rgba(86,68,47,0.92)';
        ctx.beginPath();
        ctx.moveTo(cx + d * h.w * 0.24, gy - 2);
        ctx.quadraticCurveTo(cx + d * h.w * 0.78, gy - 14, cx + d * h.w * 1.30, gy - 2);
        ctx.quadraticCurveTo(cx + d * h.w * 0.86, gy + 4, cx + d * h.w * 0.24, gy + 5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(134,110,78,0.40)';
        ctx.beginPath();
        ctx.moveTo(cx + d * h.w * 0.32, gy - 2);
        ctx.quadraticCurveTo(cx + d * h.w * 0.78, gy - 11, cx + d * h.w * 1.22, gy - 2);
        ctx.quadraticCurveTo(cx + d * h.w * 0.84, gy + 1, cx + d * h.w * 0.32, gy + 2);
        ctx.closePath();
        ctx.fill();
      });

      // 向外放射的细裂纹（告诉玩家这底下是空的）
      ctx.strokeStyle = 'rgba(26,20,13,0.68)';
      ctx.lineWidth = 1.5;
      eachSide(d => {
        for (let k = 0; k < 2; k++) {
          const x0 = cx + d * h.w * (1.02 + k * 0.06);
          const y0 = gy + k * 3 - 1;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(cx + d * h.w * (1.32 + k * 0.12), y0 + (k ? 3 : -2));
          ctx.lineTo(cx + d * h.w * (1.55 + k * 0.16), y0 + (k ? 5 : -4));
          ctx.stroke();
        }
      });
    }

    if (h.cur > 8) {
      const top = gy - h.cur;
      ctx.save();
      if (isFire) {
        const pool = 0.55 + 0.45 * Math.sin(tGlobal * 7.1 + (h.ph || 0));
        // 地面光池：随焰高脉动
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(cx, gy);
        ctx.scale(1, 0.30);
        const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, h.w * 5.2);
        pg.addColorStop(0, `rgba(255,138,48,${0.30 * pool})`);
        pg.addColorStop(0.45, `rgba(255,108,28,${0.13 * pool})`);
        pg.addColorStop(1, 'rgba(255,100,30,0)');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(0, 0, h.w * 5.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 多层焰体
        drawFlame(cx, gy, h.cur, h.w * 1.08);
        // 亮核 + 余烬
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        radialGlow(cx, gy - 6, h.w * 1.4, `rgba(255,226,160,${0.26 * pool})`);
        for (let i = 0; i < 24; i++) {
          const sp = 0.45 + (i % 5) * 0.19;
          const p = ((tGlobal * sp + i * 0.137) % 1);
          const ex = cx + Math.sin(i * 2.7 + tGlobal * 2.2) * h.w * (0.45 + p * 1.25);
          const ey = gy - h.cur * p * 1.12 - 6;
          ctx.fillStyle = `rgba(255,${165 + (i % 5) * 16},92,${(1 - p) * 0.8})`;
          const s = 2.8 - p * 1.5;
          ctx.fillRect(ex, ey, s, s);
        }
        ctx.restore();
      } else {
        // 锈池：铜锈积液从地缝里涌上来 —— 是液体，不是晶体
        const lvl = h.cur;
        const halfW = h.w * 0.90;
        const topY = gy - lvl;
        const ph0 = h.ph || 0;

        // 液体自身透出的冷绿光（不是警报灯）
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        radialGlow(cx, gy - lvl * 0.40, lvl * 0.85, 'rgba(64,178,132,0.085)');
        ctx.restore();

        // 贴地积液：从缝口漫出来的一滩，把"池"字交代清楚
        const poolR = halfW * 1.42;
        const poolH = Math.min(15, lvl * 0.11);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx - poolR, gy + 4);
        for (let k = 0; k <= 10; k++) {
          const u = k / 10;
          const x = cx - poolR + poolR * 2 * u;
          const yy = gy + 4 - poolH * Math.sin(u * Math.PI) * (0.72 + 0.28 * Math.sin(u * 7 + tGlobal * 2.6 + ph0));
          ctx.lineTo(x, yy);
        }
        ctx.lineTo(cx + poolR, gy + 4);
        ctx.closePath();
        const pg = ctx.createLinearGradient(0, gy - poolH, 0, gy + 6);
        pg.addColorStop(0, 'rgba(96,186,150,0.86)');
        pg.addColorStop(1, 'rgba(14,46,36,0.94)');
        ctx.fillStyle = pg;
        ctx.fill();
        ctx.strokeStyle = 'rgba(196,250,222,0.34)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();

        // 液柱轮廓：整体微微上收，但侧面像被从下面顶着一样鼓动
        const N = 16;
        const leftPts = [], rightPts = [];
        for (let i = 0; i <= N; i++) {
          const p = i / N;
          const y = gy - lvl * p;
          const taper = 0.68 + 0.20 * Math.pow(1 - p, 0.65);
          // 大尺度的鼓动 + 细密抖动，让侧影是"涌"出来的而不是一根柱子
          const billow = Math.sin(p * Math.PI * 2.1 + tGlobal * 2.0 + ph0) * 0.060
                       + Math.sin(p * Math.PI * 3.4 - tGlobal * 1.4) * 0.028;
          const wobL = Math.sin(p * 5.0 + tGlobal * 3.2 + ph0) * 2.6
                     + Math.sin(p * 9.3 - tGlobal * 2.4) * 1.2;
          const wobR = Math.sin(p * 4.6 - tGlobal * 3.0 + ph0) * 2.6
                     + Math.sin(p * 8.7 + tGlobal * 2.2) * 1.2;
          const hw = halfW * (taper + billow);
          leftPts.push({ x: cx - hw + wobL, y });
          rightPts.push({ x: cx + hw + wobR, y });
        }
        const lt = leftPts[N], rt = rightPts[N];

        // 自由液面：不封成圆顶，而是几个高低不一的小峰，还在左右游走
        const SN = 12;
        const surfPts = [];
        for (let k = 0; k <= SN; k++) {
          const u = k / SN;
          const x = lt.x + (rt.x - lt.x) * u;
          const rip =
            Math.sin(u * 6.6 + tGlobal * 4.2 + ph0) * 5.2 +
            Math.sin(u * 3.0 - tGlobal * 2.7 + 1.3) * 4.0 +
            Math.sin(u * 11.5 + tGlobal * 5.6) * 2.0 +
            (u - 0.5) * 4.0;
          surfPts.push({ x, y: lt.y - rip });
        }

        // 液面顶上鼓起的一包：宽而圆，像液体被从底下顶着
        const spurt = Math.max(0, Math.sin(tGlobal * 1.9 + ph0));
        const spurH = spurt * Math.min(18, lvl * 0.12);
        const spurX = cx + Math.sin(tGlobal * 1.3 + ph0) * halfW * 0.26;
        const spurW = 13 + spurt * 5;

        const bodyPath = () => {
          ctx.beginPath();
          ctx.moveTo(leftPts[0].x, gy + 6);
          for (let i = 0; i <= N; i++) ctx.lineTo(leftPts[i].x, leftPts[i].y);
          for (let k = 1; k <= SN; k++) ctx.lineTo(surfPts[k].x, surfPts[k].y);
          for (let i = N; i >= 0; i--) ctx.lineTo(rightPts[i].x, rightPts[i].y);
          ctx.lineTo(rightPts[0].x, gy + 6);
          ctx.closePath();
        };

        // 鼓包：宽圆的液丘，让顶部不是一整块平的
        if (spurH > 2) {
          ctx.beginPath();
          ctx.moveTo(spurX - spurW, lt.y + 10);
          ctx.bezierCurveTo(
            spurX - spurW * 0.92, lt.y - spurH * 0.80,
            spurX - spurW * 0.34, lt.y - spurH * 1.06,
            spurX, lt.y - spurH
          );
          ctx.bezierCurveTo(
            spurX + spurW * 0.34, lt.y - spurH * 1.06,
            spurX + spurW * 0.92, lt.y - spurH * 0.80,
            spurX + spurW, lt.y + 10
          );
          ctx.closePath();
          const sg = ctx.createLinearGradient(0, lt.y - spurH, 0, lt.y + 10);
          sg.addColorStop(0, 'rgba(178,232,204,0.90)');
          sg.addColorStop(1, 'rgba(52,130,104,0.90)');
          ctx.fillStyle = sg;
          ctx.fill();
        }

        bodyPath();
        const lg = ctx.createLinearGradient(0, topY - 20, 0, gy + 6);
        lg.addColorStop(0, 'rgba(150,214,184,0.88)');
        lg.addColorStop(0.16, 'rgba(86,172,140,0.90)');
        lg.addColorStop(0.48, 'rgba(46,120,96,0.92)');
        lg.addColorStop(0.80, 'rgba(26,78,62,0.94)');
        lg.addColorStop(1, 'rgba(12,40,32,0.96)');
        ctx.fillStyle = lg;
        ctx.fill();

        // 液体内的一切都裁在轮廓里
        ctx.save();
        ctx.clip();

        // 背光侧（右）压暗，让液柱有体积
        const shade = ctx.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
        shade.addColorStop(0, 'rgba(210,255,235,0.10)');
        shade.addColorStop(0.42, 'rgba(255,255,255,0)');
        shade.addColorStop(1, 'rgba(4,30,24,0.42)');
        ctx.fillStyle = shade;
        ctx.fillRect(cx - halfW * 1.3, topY - 40, halfW * 2.6, lvl + 50);

        // 内部亮芯：靠近中轴的一条透光带
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const core = ctx.createLinearGradient(cx - halfW * 0.3, 0, cx + halfW * 0.3, 0);
        core.addColorStop(0, 'rgba(150,240,205,0)');
        core.addColorStop(0.5, 'rgba(150,240,205,0.16)');
        core.addColorStop(1, 'rgba(150,240,205,0)');
        ctx.fillStyle = core;
        ctx.fillRect(cx - halfW * 0.4, topY - 30, halfW * 0.8, lvl + 40);
        ctx.restore();

        // 上升的气泡：铜锈在冒泡
        for (let i = 0; i < 11; i++) {
          const sp = 0.30 + (i % 4) * 0.10;
          const p = ((tGlobal * sp + i * 0.091) % 1);
          const by = gy - p * lvl * 0.94;
          const bx = cx + Math.sin(i * 2.7 + tGlobal * 1.6) * halfW * 0.52;
          const br = 1.4 + (i % 3) * 1.1 + p * 1.2;
          ctx.beginPath();
          ctx.arc(bx, by, br, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(196,252,226,${0.16 + (1 - p) * 0.22})`;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(bx - br * 0.3, by - br * 0.35, br * 0.35, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(240,255,248,0.55)';
          ctx.fill();
        }

        // 悬在液体里的锈絮：让内部不是干净的果冻
        for (let i = 0; i < 7; i++) {
          const p = ((tGlobal * 0.22 + i * 0.143) % 1);
          const fy = gy - p * lvl * 0.86;
          const fx = cx + Math.sin(i * 3.1 + tGlobal * 0.9 + ph0) * halfW * 0.62;
          const fr = 2.6 + (i % 3) * 1.9;
          ctx.fillStyle = i % 2 ? 'rgba(18,58,46,0.30)' : 'rgba(120,190,158,0.16)';
          ctx.beginPath();
          ctx.ellipse(fx, fy, fr * 1.7, fr * 0.75, Math.sin(i + tGlobal * 0.5) * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }

        // 竖向流动的液纹
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 4; i++) {
          const ox = cx + (i - 1.5) * halfW * 0.34;
          const ph = tGlobal * 1.6 + i * 1.7;
          ctx.strokeStyle = `rgba(178,246,214,${0.10 + (i % 2) * 0.06})`;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          for (let k = 0; k <= 8; k++) {
            const p = k / 8;
            const yy = gy - p * lvl * 0.9;
            const xx = ox + Math.sin(p * 6 + ph) * 3.2 * p;
            if (k) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
          }
          ctx.stroke();
        }
        ctx.restore();

        // 底部沉积：越靠下越浑浊
        const sed = ctx.createLinearGradient(0, gy - lvl * 0.28, 0, gy + 6);
        sed.addColorStop(0, 'rgba(10,34,27,0)');
        sed.addColorStop(1, 'rgba(8,26,21,0.72)');
        ctx.fillStyle = sed;
        ctx.fillRect(cx - halfW * 1.3, gy - lvl * 0.28, halfW * 2.6, lvl * 0.28 + 8);

        ctx.restore();  // 结束裁剪

        // 液面亮边：沿着自由液面的起伏描一条高光，把"顶"读成液面
        ctx.beginPath();
        for (let k = 0; k <= SN; k++) {
          if (k) ctx.lineTo(surfPts[k].x, surfPts[k].y + 0.8);
          else ctx.moveTo(surfPts[k].x, surfPts[k].y + 0.8);
        }
        ctx.strokeStyle = 'rgba(216,255,236,0.42)';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // 鼓包的高光弧
        if (spurH > 2) {
          ctx.beginPath();
          ctx.moveTo(spurX - spurW * 0.72, lt.y - spurH * 0.42);
          ctx.bezierCurveTo(
            spurX - spurW * 0.55, lt.y - spurH * 0.92,
            spurX - spurW * 0.10, lt.y - spurH * 1.02,
            spurX + spurW * 0.30, lt.y - spurH * 0.82
          );
          ctx.strokeStyle = 'rgba(226,255,244,0.46)';
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }

        // 两侧轮廓暗边（不封顶，顶是自由液面）
        ctx.strokeStyle = 'rgba(8,32,25,0.55)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (let i = 0; i <= N; i++) {
          if (i) ctx.lineTo(leftPts[i].x, leftPts[i].y);
          else ctx.moveTo(leftPts[i].x, leftPts[i].y);
        }
        ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i <= N; i++) {
          if (i) ctx.lineTo(rightPts[i].x, rightPts[i].y);
          else ctx.moveTo(rightPts[i].x, rightPts[i].y);
        }
        ctx.stroke();

        // 溅出的液滴：向上抛再落下，带拖尾
        for (let i = 0; i < 9; i++) {
          const p = ((tGlobal * 0.85 + i * 0.113) % 1);
          const dx = cx + Math.sin(i * 2.9 + (h.ph || 0)) * halfW * (0.55 + p * 0.75);
          const dy = topY - Math.sin(p * Math.PI) * (34 + (i % 3) * 18) + p * 26;
          const dr = 2.0 - p * 0.9;
          const a = (1 - p) * 0.85;
          ctx.strokeStyle = `rgba(168,240,210,${a * 0.5})`;
          ctx.lineWidth = dr * 0.8;
          ctx.beginPath();
          ctx.moveTo(dx, dy - dr * 2.4);
          ctx.lineTo(dx, dy);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(dx, dy, dr, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(190,250,220,${a})`;
          ctx.fill();
        }

        // 池沿的湿痕
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(cx, gy + 2);
        ctx.scale(1, 0.26);
        const wet = ctx.createRadialGradient(0, 0, 0, 0, 0, halfW * 2.1);
        wet.addColorStop(0, 'rgba(80,196,150,0.24)');
        wet.addColorStop(1, 'rgba(60,160,124,0)');
        ctx.fillStyle = wet;
        ctx.beginPath();
        ctx.arc(0, 0, halfW * 2.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 池边浮着的锈渣
        for (let i = 0; i < 6; i++) {
          const rx = cx + Math.sin(i * 2.4) * halfW * 1.0;
          const ry = gy + 1 + (i % 2) * 2;
          const rr = 2.4 + (i % 3) * 1.6;
          ctx.fillStyle = i % 2 ? 'rgba(58,116,90,0.75)' : 'rgba(38,82,64,0.8)';
          ctx.beginPath();
          ctx.ellipse(rx, ry, rr * 1.5, rr * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    } else if (h.warning) {
      // 预警：火口闪橙红，锈池的地缝里透出冷绿（不同威胁用不同色，玩家一眼能分清）
      const f = 0.3 + 0.7 * Math.abs(Math.sin(tGlobal * 11));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      if (isFire) {
        radialGlow(cx, gy - 30, 90, `rgba(255,110,50,${0.12 + f * 0.14})`);
      } else {
        radialGlow(cx, gy - 12, 100, `rgba(70,190,140,${0.10 + f * 0.13})`);
      }
      ctx.restore();
      ctx.strokeStyle = isFire ? `rgba(255,105,45,${f})` : `rgba(110,220,170,${f * 0.85})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (isFire) {
        ctx.moveTo(cx - h.w * 0.6, gy - 18);
        ctx.lineTo(cx + h.w * 0.6, gy - 18);
      } else {
        // 锈池预警画成地缝上的一道微光，而不是横线
        ctx.moveTo(cx - h.w * 0.95, gy);
        ctx.quadraticCurveTo(cx, gy - 9, cx + h.w * 0.95, gy);
      }
      ctx.stroke();
    }
  }
}

/* ================= 逐段旁白字幕 ================= */
// 位置：右上角、音效按钮下方（避免遮挡底部地面与玩家走位区域）
function drawSubtitle() {
  if (!sub) return;
  const k = Math.min(1, sub.life / 0.5) * Math.min(1, (sub.max - sub.life) / 0.35);
  if (k <= 0.01) return;

  const FS = 16, LH = 25, MAXW = 372;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.font = `600 ${FS}px "Microsoft YaHei", "PingFang SC", serif`;
  ctx.textAlign = 'left';

  // 逐字换行：长句拆成多行，宽度不超过 MAXW
  const lines = [];
  let line = '';
  for (const ch of sub.text) {
    const test = line + ch;
    if (ctx.measureText(test).width > MAXW && line) { lines.push(line); line = ch; }
    else line = test;
  }
  if (line) lines.push(line);

  const padX = 18, padY = 12;
  const blockW = MAXW + padX * 2;
  const blockH = lines.length * LH + padY * 2;
  const x2 = W - 30;                          // 与画框右缘留 15px 空隙
  const y1 = BTN_EXIT.y + BTN_EXIT.h + 14;    // 按钮下方 14px
  const x1 = x2 - blockW;

  // 底板：左缘渐隐、右缘实底，避免硬边切割画面
  const bgG = ctx.createLinearGradient(x1, 0, x2, 0);
  bgG.addColorStop(0,    'rgba(4,10,9,0.00)');
  bgG.addColorStop(0.18, 'rgba(4,10,9,0.52)');
  bgG.addColorStop(1,    'rgba(4,10,9,0.74)');
  ctx.fillStyle = bgG;
  ctx.fillRect(x1, y1, blockW, blockH);

  // 左侧金色竖线 + 顶部细线（呼应文物气质，比满框更轻）
  ctx.strokeStyle = `rgba(212,178,110,${0.5 * k})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x1 + 10, y1 + 4);
  ctx.lineTo(x2, y1 + 4);
  ctx.stroke();

  // 文字：金-白渐变
  const txtG = ctx.createLinearGradient(x1, y1, x2, y1 + blockH);
  txtG.addColorStop(0, '#f6e6b6');
  txtG.addColorStop(0.5, '#fff4cf');
  txtG.addColorStop(1, '#e0c48a');
  ctx.fillStyle = txtG;
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 1;
  ctx.textAlign = 'right';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x2 - padX, y1 + padY + LH * i + FS);
  }
  ctx.restore();
  ctx.textAlign = 'left';
}

/* ================= P0.4 教学提示（仅第 1 关） ================= */
// 顶部横条：淡入 0.35s + 稳态 3.0s + 淡出 0.25s（总 3.6s）
// 位置：y=110，避开顶部 HUD（血条 y=26-64）与字幕（y=620）
function drawTutHint() {
  if (levelIdx !== 0 || state !== 'play') return;
  for (const h of TUT_HINTS) {
    if (h.t <= 0) continue;
    const remain = h.t;
    const fadeIn = Math.min(1, (3.6 - remain) / 0.35);
    const fadeOut = Math.min(1, remain / 0.25);
    const k = fadeIn * fadeOut;
    if (k <= 0.01) continue;

    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = '600 18px "Microsoft YaHei", "PingFang SC", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = h.text;
    const tw = ctx.measureText(text).width;
    const cx = W / 2, cy = 110;
    const padX = 30, padY = 12;
    const bx = cx - tw / 2 - padX, by = cy - 18 - padY, bw = tw + padX * 2, bh = 36 + padY * 2;

    // 底板：柔和暗底 + 双向渐变（呼应字幕风格但更轻）
    const bgG = ctx.createLinearGradient(0, by, 0, by + bh);
    bgG.addColorStop(0,   'rgba(4,10,9,0.00)');
    bgG.addColorStop(0.2, 'rgba(4,10,9,0.50)');
    bgG.addColorStop(0.5, 'rgba(4,10,9,0.70)');
    bgG.addColorStop(0.8, 'rgba(4,10,9,0.50)');
    bgG.addColorStop(1,   'rgba(4,10,9,0.00)');
    ctx.fillStyle = bgG;
    ctx.fillRect(bx, by, bw, bh);

    // 金色细线：顶部一条（提示比字幕更简）
    ctx.strokeStyle = `rgba(212,178,110,${0.50 * k})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + padX * 0.5, by + 4);
    ctx.lineTo(bx + bw - padX * 0.5, by + 4);
    ctx.stroke();

    // 文字：金-白渐变
    const txtG = ctx.createLinearGradient(cx - tw / 2, cy - 12, cx + tw / 2, cy + 12);
    txtG.addColorStop(0, '#f6e6b6');
    txtG.addColorStop(0.5, '#fff4cf');
    txtG.addColorStop(1, '#e0c48a');
    ctx.fillStyle = txtG;
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 1;
    ctx.fillText(text, cx, cy);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
}

/* ================= 暗角 + 主题色蒙层 ================= */
/* 主题色蒙层：让每关的色温更明显（熔铸暖橙、掩埋森绿、出土黄褐、展柜冷青） */
const ERA_TINT = {
  forge:  'rgba(255,150,60,0.06)',
  ritual: 'rgba(230,140,50,0.07)',
  burial: 'rgba(90,160,90,0.08)',
  dig:    'rgba(200,160,90,0.06)',
  museum: 'rgba(120,180,170,0.06)'
};
function drawVignette() {
  // 主题色蒙层：极淡，只做色温统一
  const tint = ERA_TINT[level.theme] || 'rgba(0,0,0,0)';
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);
  // 主暗角：径向四角加重
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.30, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.18)');
  g.addColorStop(1, 'rgba(0,0,0,0.58)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 顶底柔和暗带：加强画面"聚焦中心"感
  const topG = ctx.createLinearGradient(0, 0, 0, H * 0.22);
  topG.addColorStop(0, 'rgba(0,0,0,0.30)');
  topG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = topG;
  ctx.fillRect(0, 0, W, H * 0.22);
  const botG = ctx.createLinearGradient(0, H * 0.78, 0, H);
  botG.addColorStop(0, 'rgba(0,0,0,0)');
  botG.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = botG;
  ctx.fillRect(0, H * 0.78, W, H * 0.22);
}

/* ================= 光尘（主角金面的金箔碎屑） =================
   叙事：这些是主角"金"的记忆——从它脸上剥落的金箔碎屑。玩家捡回一片，
   就是把那张金面具的记忆捡回一片。
   做法：不另画一个抽象的小面具，而是直接把主角精灵（熔金时代）按不规则
   多边形随机裁成小片，再补一圈内侧断面亮边。所以每一片都真的是"它自己
   身上掉下来的"。 */
const SHARD_POOL = [];
let shardPoolReady = false;

function buildShardPool() {
  if (shardPoolReady || !heroReady) return;
  const src = getHeroCanvas('forge');
  const sctx = src.getContext('2d');
  let alpha = null;
  try { alpha = sctx.getImageData(0, 0, 184, 320).data; } catch (e) { alpha = null; }

  // 固定种子：碎片形状每次刷新一致，不会闪
  let seed = 20240817;
  const rnd = function () {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  };

  // 先采样精灵的不透明区域，碎片中心只从这些点里取
  const opaque = [];
  if (alpha) {
    for (let i = 0; i < 1600; i++) {
      const px = 4 + ((rnd() * 176) | 0);
      const py = 4 + ((rnd() * 312) | 0);
      if (alpha[(py * 184 + px) * 4 + 3] > 160) opaque.push([px, py]);
    }
  }
  if (!opaque.length) opaque.push([92, 150], [72, 120], [110, 196]);

  for (let i = 0; i < 18; i++) {
    const w = 22 + ((rnd() * 16) | 0);
    const h = 26 + ((rnd() * 20) | 0);
    const pt = opaque[(rnd() * opaque.length) | 0];
    const sx = clamp(pt[0], w * 0.5, 184 - w * 0.5);
    const sy = clamp(pt[1], h * 0.5, 320 - h * 0.5);

    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');

    // 不规则金箔轮廓（撕口的锯齿感）
    const n = 7 + ((rnd() * 3) | 0);
    const path = new Path2D();
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 - Math.PI / 2;
      const rr = 0.58 + rnd() * 0.42;
      const x = w / 2 + Math.cos(a) * (w / 2 - 1) * rr;
      const y = h / 2 + Math.sin(a) * (h / 2 - 1) * rr;
      if (k === 0) path.moveTo(x, y); else path.lineTo(x, y);
    }
    path.closePath();

    c.save();
    c.clip(path);
    c.drawImage(src, sx - w / 2, sy - h / 2, w, h, 0, 0, w, h);
    // 内侧断面亮边：被 clip 裁掉外侧一半，正好落在碎片边缘内侧
    c.strokeStyle = 'rgba(255,206,110,0.55)';
    c.lineWidth = 6;
    c.stroke(path);
    c.strokeStyle = 'rgba(255,248,214,0.90)';
    c.lineWidth = 2.4;
    c.stroke(path);
    c.restore();

    // 只在碎片本体上叠一层暖金，让它在暗场里也发亮
    c.globalCompositeOperation = 'source-atop';
    const lg = c.createLinearGradient(0, 0, w, h);
    lg.addColorStop(0, 'rgba(255,240,182,0.34)');
    lg.addColorStop(0.5, 'rgba(255,198,92,0.10)');
    lg.addColorStop(1, 'rgba(178,112,26,0.28)');
    c.fillStyle = lg;
    c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'source-over';

    SHARD_POOL.push({ cv: cv, w: w, h: h });
  }
  shardPoolReady = true;
}

function drawMotes() {
  buildShardPool();

  for (const m of motes) {
    if (m.taken) continue;
    // 缓慢浮动 + 轻微侧移（模拟金色记忆碎片在空中飘）
    const sway = Math.sin(tGlobal * 1.3 + m.x * 0.011) * 5;
    const drift = Math.sin(tGlobal * 0.6 + m.y * 0.017) * 2.5;
    const x = m.x + drift - cam.x;
    const y = m.y + sway;
    if (x < -80 || x > W + 80) continue;

    // --- 外围暖金光晕（呼吸式拾取提示）：别压过祭坛，光晕收一圈 ---
    const pulse = 0.5 + 0.5 * Math.sin(tGlobal * 2.4 + m.x * 0.013);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    radialGlow(x, y, 56, `rgba(255,208,110,${0.10 + pulse * 0.07})`);
    radialGlow(x, y, 28, `rgba(255,232,168,${0.22 + pulse * 0.11})`);
    radialGlow(x, y, 14, 'rgba(255,250,220,0.38)');
    ctx.restore();

    // --- 主体：从主角精灵上裁下来的金箔碎屑（每片都真的"来自它自己"） ---
    const sh = SHARD_POOL.length ? SHARD_POOL[m.shardIdx % SHARD_POOL.length] : null;
    if (!sh) {
      // 精灵尚未就绪时的兜底：一小片金色多边形
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(tGlobal * 0.8 + m.x * 0.013) * 0.12);
      ctx.fillStyle = 'rgba(255,214,120,0.92)';
      ctx.beginPath();
      ctx.moveTo(0, -9);
      ctx.lineTo(8, 3);
      ctx.lineTo(-2, 9);
      ctx.lineTo(-8, -2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      continue;
    }

    const k = 0.92;
    const rot = Math.sin(tGlobal * 0.8 + m.x * 0.013) * 0.12;
    const bob = 1 + Math.sin(tGlobal * 2.1 + m.y * 0.02) * 0.045;   // 轻微呼吸缩放
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(k * bob, k * bob);
    ctx.drawImage(sh.cv, -sh.w / 2, -sh.h / 2);
    ctx.restore();

    // 碎屑断面高光（跟着旋转的一小段亮弧，强化"金箔"材质）
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,246,206,${0.28 + pulse * 0.24})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, 0, sh.w * 0.34, -2.5, -1.2);
    ctx.stroke();
    ctx.restore();
  }

  // 收集爆散：碎屑四散（模拟金箔被吸收进主体的爆裂感）
  for (const b of burst) {
    if (b.life <= 0) continue;
    const alpha = b.life / b.max;
    const bx = b.x - cam.x;
    const sh = SHARD_POOL.length ? SHARD_POOL[b.si % SHARD_POOL.length] : null;
    ctx.save();
    ctx.translate(bx, b.y);
    ctx.rotate(b.x * 0.05 + tGlobal * 6);
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'lighter';
    if (sh) {
      const s = 0.34 * (0.6 + alpha * 0.6);
      ctx.drawImage(sh.cv, -sh.w * s / 2, -sh.h * s / 2, sh.w * s, sh.h * s);
    } else {
      ctx.fillStyle = `rgba(255,225,140,${alpha})`;
      ctx.beginPath();
      ctx.moveTo(0, -3);
      ctx.lineTo(2.6, 2.6);
      ctx.lineTo(-2.6, 2.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ================= 终点 ================= */
function drawGoal() {
  const gx = level.goal.x - cam.x, gy = level.goal.y;
  if (gx < -160 || gx > W + 160) return;
  const open = collected >= level.motes.length;
  const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 3);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radialGlow(gx, gy - 110, open ? 190 : 110, open
    ? `rgba(255,225,150,${0.22 + pulse * 0.12})`
    : 'rgba(120,150,140,0.10)');
  ctx.restore();

  // 祭坛台基
  ctx.fillStyle = '#1a1a1c';
  ctx.fillRect(gx - 48, gy - 22, 96, 22);
  ctx.fillStyle = 'rgba(220,190,130,0.55)';
  ctx.fillRect(gx - 48, gy - 22, 96, 2);

  // 门框（石/铜）
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(gx - 34, gy - 150, 8, 128);
  ctx.fillRect(gx + 26, gy - 150, 8, 128);
  ctx.fillRect(gx - 34, gy - 158, 68, 9);

  // 门内光
  const gg = ctx.createLinearGradient(0, gy - 150, 0, gy - 24);
  gg.addColorStop(0, open ? `rgba(255,235,170,${0.20 + pulse * 0.14})` : 'rgba(40,50,45,0.35)');
  gg.addColorStop(1, open ? 'rgba(255,190,90,0.03)' : 'rgba(20,26,24,0.15)');
  ctx.fillStyle = gg;
  ctx.fillRect(gx - 26, gy - 150, 52, 126);

  if (!open) {
      ctx.fillStyle = 'rgba(230,220,190,0.55)';
      ctx.font = '13px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('还差 ' + (level.motes.length - collected) + ' 缕光尘', gx, gy - 176);
    } else {
      // 门内头像剪影
      ctx.save();
      ctx.globalAlpha = 0.35 + pulse * 0.2;
      drawHead(gx, gy - 86, 15, { flat: true });
      ctx.restore();
    }
}

/* ================= P2.1 终点穿越动画（覆盖层）=================
   时序（1.6s，ENTERING_DUR）：
     t 0.00~0.35  凝固：暗幕 0 → 0.55 快速淡入，让玩家"停"住的瞬间
     t 0.00~1.30  径向光晕：从门心扩散（60 → 320），呼吸感更强
     t 0.20~1.30  镜头推门：在 render() 主路径里对整个场景做 scale 1→2.4
                  （不在此函数里重复缩放；本函数只画叠加特效）
     t 0.90~1.60  白闪：alpha 0 → 1（t=1.35）→ 0，最后一帧接近黑，
                  正好衔接 clear 页的暗底 + 金粒上升 */
const ENTERING_DUR = 1.6;

function drawEnterCrossing() {
  const easeInOut = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const gx = level.goal.x - cam.x, gy = level.goal.y - 86;

  // 1) 凝固暗幕（0.30s 内淡入到 0.55 黑）
  const darkA = Math.min(0.55, stateT / 0.30 * 0.55);
  if (darkA > 0.01) {
    ctx.fillStyle = `rgba(0,0,0,${darkA})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 2) 径向光晕：从门内射出，随时间放大；lighter 让金色"活"
  const rayR = 60 + easeInOut(Math.min(1, stateT / 1.30)) * 260;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const rg = ctx.createRadialGradient(gx, gy, 6, gx, gy, rayR);
  rg.addColorStop(0,   `rgba(255,235,170,${0.45 + 0.25 * Math.sin(stateT * 4)})`);
  rg.addColorStop(0.5, `rgba(255,190,90,${0.18 + 0.10 * Math.sin(stateT * 3)})`);
  rg.addColorStop(1,   'rgba(255,150,60,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(gx, gy, rayR, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 3) 白闪（0.90s 起，0.45s 升到 1，再 0.25s 降到 0）
  let flashA = 0;
  if (stateT > 0.90) {
    if (stateT < 1.35) flashA = (stateT - 0.90) / 0.45;
    else               flashA = Math.max(0, 1 - (stateT - 1.35) / 0.25);
  }
  if (flashA > 0.01) {
    ctx.fillStyle = `rgba(255,250,230,${flashA})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ================= 面具视觉演化：金 → 三千年 → 青铜锈迹 =================
   每关代表面具在时间轴上的一个状态；色彩 + 表面特效共同讲述这段历史。 */
function hex2rgb(h) {
  const s = h.replace('#', '');
  return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
}
function rgbStr(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function mixCol(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgbStr([A[0] + (B[0] - A[0]) * t | 0, A[1] + (B[1] - A[1]) * t | 0, A[2] + (B[2] - A[2]) * t | 0]);
}

const HERO_ASPECT = 184 / 320;          // 精灵原始宽高比
const heroImg = new Image();
let heroReady = false;
const heroEraCache = {};

heroImg.onload = function () { heroReady = true; };
heroImg.src = 'data:image/png;base64,' + HERO_B64;

const HERO_TINT = {
  forge:  { f: 'sepia(1) saturate(3.4) hue-rotate(-14deg) brightness(1.28) contrast(1.06)', o: 'rgba(255,196,70,0.30)' },
  ritual: { f: 'sepia(0.72) saturate(2.1) hue-rotate(-10deg) brightness(1.10) contrast(1.02)', o: 'rgba(240,170,70,0.16)' },
  burial: { f: 'saturate(1.18) brightness(0.94) contrast(1.05)', o: 'rgba(30,90,60,0.14)' },
  dig:    { f: 'sepia(0.40) saturate(0.72) brightness(0.95) contrast(1.02)', o: 'rgba(120,100,60,0.20)' },
  museum: { f: 'saturate(1.06) brightness(1.06) contrast(1.03)', o: 'rgba(90,180,150,0.10)' }
};

/* 金 → 锈的关卡内渐变：第二关随着走向祭坛深处，主角自身从琥珀金剥落成青铜绿。
   按 0.05 一档缓存，避免每帧重建 canvas。 */
const heroProgressCache = {};
function getHeroProgressCanvas(eraName, k) {
  const key = eraName + '@' + k.toFixed(2);
  if (heroProgressCache[key]) return heroProgressCache[key];
  const base = getHeroCanvas(eraName);
  const cv = document.createElement('canvas');
  cv.width = 184; cv.height = 320;
  const c2 = cv.getContext('2d');
  // 先去金：降饱和 + 压亮度，让金属光泽退成哑铜
  c2.filter = 'saturate(' + (1 - 0.58 * k).toFixed(3) + ') brightness(' + (1 - 0.13 * k).toFixed(3) + ') contrast(1.03)';
  c2.drawImage(base, 0, 0);
  c2.filter = 'none';
  c2.globalCompositeOperation = 'source-atop';
  // 主锈色（铜绿）+ 孔雀石高光，只覆盖精灵本体
  c2.fillStyle = 'rgba(56,126,98,' + (0.46 * k).toFixed(3) + ')';
  c2.fillRect(0, 0, 184, 320);
  c2.fillStyle = 'rgba(126,196,166,' + (0.16 * k * k).toFixed(3) + ')';
  c2.fillRect(0, 0, 184, 320);
  c2.globalCompositeOperation = 'source-over';
  heroProgressCache[key] = cv;
  return cv;
}

function getHeroCanvas(eraName) {
  if (heroEraCache[eraName]) return heroEraCache[eraName];
  const cv = document.createElement('canvas');
  cv.width = 184; cv.height = 320;
  const c2 = cv.getContext('2d');
  const cfg = HERO_TINT[eraName] || HERO_TINT.museum;
  c2.filter = cfg.f;
  c2.drawImage(heroImg, 0, 0, 184, 320);
  c2.filter = 'none';
  // 时代叠色：只覆盖精灵不透明区域
  c2.globalCompositeOperation = 'source-atop';
  c2.fillStyle = cfg.o;
  c2.fillRect(0, 0, 184, 320);
  c2.globalCompositeOperation = 'source-over';
  heroEraCache[eraName] = cv;
  return cv;
}

/* ================= 青铜祭司头像（主角） ================= */
function drawHead(x, y, r, opt) {
  opt = opt || {};
  const ang = opt.angle || 0;
  const sxx = opt.sx === undefined ? 1 : opt.sx;
  const syy = opt.sy === undefined ? 1 : opt.sy;
  const blink = opt.blink || 0;
  const flat = !!opt.flat;
  const eraName = opt.era || (typeof levelIdx !== 'undefined' && typeof ERA_ORDER !== 'undefined'
    ? ERA_ORDER[levelIdx] : 'museum');
  const E = ERA[eraName] || ERA.museum;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(sxx, syy);

  const patina = [E.goldD, E.goldB, E.goldC];
  const bronze = E.bronze;

  /* --- 优先使用按实物照片重绘的精灵图；未加载完成时回退到手绘 --- */
  if (heroReady && !opt.forceDrawn) {
    let sprite = getHeroCanvas(eraName);
    // 叙事渐变：玩家本体在"祭祀"关内随进度由琥珀金剥落成青铜绿
    if (eraName === 'ritual' && !flat) {
      const src = opt.progressK !== undefined ? opt.progressK : levelProgress();
      const k = Math.round(clamp(src, 0, 1) * 20) / 20;
      if (k > 0) sprite = getHeroProgressCanvas('ritual', k);
    }
    // 精灵总高（冠顶→颈矛尖）对应手绘版 -1.62r ~ 2.30r
    const totalH = r * 3.92;
    const totalW = totalH * HERO_ASPECT;
    ctx.drawImage(sprite, -totalW * 0.5, -r * 1.62, totalW, totalH);
    ctx.restore();
    return;
  }

  /* --- 面庞轮廓（细长窄椭圆，脸长:脸宽 ≈ 2.2:1，对齐文物比例） --- */
  // 参照东莞博物馆《青铜人头像》照片：顶宽 0.86r，颧骨最宽 1.00r，下颌收成细尖
  const facePath = new Path2D();
  facePath.moveTo(-r * 0.43, -r * 1.00);
  facePath.lineTo(r * 0.43, -r * 1.00);
  facePath.quadraticCurveTo(r * 0.52, -r * 0.70, r * 0.50, -r * 0.30);   // 太阳穴微鼓
  facePath.quadraticCurveTo(r * 0.44, -r * 0.05, r * 0.36, r * 0.30);      // 颧骨下收
  facePath.quadraticCurveTo(r * 0.22, r * 0.75, r * 0.00, r * 1.05);        // 下颌收尖
  facePath.quadraticCurveTo(-r * 0.22, r * 0.75, -r * 0.36, r * 0.30);
  facePath.quadraticCurveTo(-r * 0.44, -r * 0.05, -r * 0.50, -r * 0.30);
  facePath.quadraticCurveTo(-r * 0.52, -r * 0.70, -r * 0.43, -r * 1.00);
  facePath.closePath();

  /* --- 尖锥颈（细长菱形柱：文物颈比脸还长） --- */
  const ng = ctx.createLinearGradient(-r * 0.30, 0, r * 0.30, 0);
  ng.addColorStop(0, patina[2]);
  ng.addColorStop(0.45, patina[1]);
  ng.addColorStop(1, patina[0]);
  ctx.fillStyle = ng;
  // 上宽 ±0.20r 贴下巴根部，下宽 ±0.03r，延伸到 2.30r
  ctx.beginPath();
  ctx.moveTo(-r * 0.20, r * 0.85);
  ctx.lineTo(r * 0.20, r * 0.85);
  ctx.lineTo(r * 0.03, r * 2.30);
  ctx.lineTo(-r * 0.03, r * 2.30);
  ctx.closePath();
  ctx.fill();
  // 颈的中央刻纹（文物颈有竖向暗纹）
  ctx.strokeStyle = 'rgba(6,14,10,0.35)';
  ctx.lineWidth = Math.max(0.8, r * 0.025);
  ctx.beginPath();
  ctx.moveTo(-r * 0.02, r * 1.05);
  ctx.lineTo(-r * 0.005, r * 2.10);
  ctx.moveTo(r * 0.02, r * 1.05);
  ctx.lineTo(r * 0.005, r * 2.10);
  ctx.stroke();

  /* --- 外张双耳（竖直翼形：文物耳朵向上竖起、超出冠顶） --- */
  for (const side of [-1, 1]) {
    ctx.save();
    // 耳根起点贴颧骨上方（对齐眉骨水平线）
    ctx.translate(side * r * 0.42, -r * 0.42);
    // 关键修正：外尖要朝上翘，方向为 side * +0.45（约 26°）
    // 左边耳 rotate(+) 让外尖逆时针向上；右边耳 rotate(-) 顺时针向上
    ctx.rotate(side * 0.45);
    const eg = ctx.createLinearGradient(0, -r * 0.7, side * r * 0.6, r * 0.3);
    eg.addColorStop(0, patina[1]);
    eg.addColorStop(0.55, patina[0]);
    eg.addColorStop(1, patina[2]);
    ctx.fillStyle = eg;
    // 翼形耳朵：内根贴脸，外尖朝上翘至 r * 1.60
    ctx.beginPath();
    ctx.moveTo(side * r * 0.02, -r * 0.20);
    ctx.lineTo(side * r * 0.70, -r * 0.30);
    ctx.lineTo(side * r * 1.10, -r * 1.55);
    ctx.lineTo(side * r * 0.35, -r * 0.30);
    ctx.lineTo(side * r * 0.06, r * 0.10);
    ctx.closePath();
    ctx.fill();
    // 耳廓边缘暗线
    ctx.strokeStyle = 'rgba(6,14,10,0.55)';
    ctx.lineWidth = Math.max(1, r * 0.03);
    ctx.stroke();
    // 耳廓内三叉刻线（三星堆耳廓内的三叉结构）
    ctx.strokeStyle = 'rgba(8,20,14,0.65)';
    ctx.lineWidth = Math.max(0.9, r * 0.035);
    ctx.beginPath();
    ctx.moveTo(side * r * 0.14, -r * 0.15);
    ctx.lineTo(side * r * 0.72, -r * 0.20);
    ctx.moveTo(side * r * 0.14, -r * 0.05);
    ctx.lineTo(side * r * 0.85, -r * 0.55);
    ctx.moveTo(side * r * 0.14, -r * 0.02);
    ctx.lineTo(side * r * 0.55, -r * 0.90);
    ctx.stroke();
    // 耳廓中央隆起（暗色椭圆）
    ctx.fillStyle = 'rgba(8,20,14,0.30)';
    ctx.beginPath();
    ctx.ellipse(side * r * 0.36, -r * 0.55, r * 0.18, r * 0.22, -side * 0.20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* --- 面庞（先填色底 + 径向渐变） --- */
  ctx.fillStyle = E.faceLo;
  ctx.fill(facePath);
  const fg = ctx.createRadialGradient(-r * 0.20, -r * 0.30, r * 0.10, 0, 0, r * 1.20);
  fg.addColorStop(0, E.faceHi);
  fg.addColorStop(0.45, E.goldB);
  fg.addColorStop(0.8, E.goldC);
  fg.addColorStop(1, E.goldD);
  ctx.fillStyle = fg;
  ctx.fill(facePath);
  // 面部边缘描边（文物质感：轮廓线略深）
  ctx.strokeStyle = 'rgba(6,14,10,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.03);
  ctx.stroke(facePath);

  /* --- 圆筒头冠（矮而宽：像文物上的"平顶帽"） --- */
  const cw = r * 1.08;
  const cTop = -r * 1.62, cBot = -r * 0.78;
  const cg = ctx.createLinearGradient(-cw, 0, cw, 0);
  cg.addColorStop(0, E.crownC);
  cg.addColorStop(0.30, E.crownA);
  cg.addColorStop(0.62, E.crownB);
  cg.addColorStop(1, E.crownD);
  ctx.fillStyle = cg;
  ctx.fillRect(-cw, cTop, cw * 2, cBot - cTop);
  // 顶面（微微凸起）
  ctx.beginPath();
  ctx.ellipse(0, cTop, cw, r * 0.14, 0, 0, Math.PI * 2);
  ctx.fillStyle = E.crownTop;
  ctx.fill();
  // 顶面中央的凹孔（文物特征：冠顶有圆形凹坑）
  ctx.beginPath();
  ctx.ellipse(0, cTop, cw * 0.36, r * 0.07, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#080a06';
  ctx.fill();
  // 冠下沿阴影
  ctx.fillStyle = 'rgba(8,20,16,0.5)';
  ctx.fillRect(-cw, cBot - r * 0.06, cw * 2, r * 0.06);
  // 冠顶高光（顶部左上一条亮线）
  ctx.strokeStyle = 'rgba(255,235,180,0.22)';
  ctx.lineWidth = Math.max(1, r * 0.02);
  ctx.beginPath();
  ctx.moveTo(-cw * 0.85, cTop + r * 0.02);
  ctx.lineTo(cw * 0.10, cTop + r * 0.02);
  ctx.stroke();

  if (!flat) {
    /* --- 表面层：按 era 变化（金剥落 / 氧化 / 尘灰 / 展柜） --- */
    // 使用 facePath 作为裁剪，保证纹理不会溢出到脸部之外
    ctx.save();
    ctx.clip(facePath);

    if (eraName === 'forge') {
      // 熔金：炽热光斑 + 流动的熔纹（多尺度层次：核心炽白 → 中层熔橙 → 边缘暗红）
      ctx.globalCompositeOperation = 'lighter';
      // 核心炽白
      const moltenCore = ctx.createRadialGradient(-r * 0.15, -r * 0.18, r * 0.02, -r * 0.1, -r * 0.15, r * 0.55);
      moltenCore.addColorStop(0, 'rgba(255,255,235,0.85)');
      moltenCore.addColorStop(0.35, 'rgba(255,240,180,0.55)');
      moltenCore.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = moltenCore;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      // 中层熔橙外圈
      const moltenOuter = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.1);
      moltenOuter.addColorStop(0, 'rgba(255,180,60,0.35)');
      moltenOuter.addColorStop(0.6, 'rgba(255,140,30,0.18)');
      moltenOuter.addColorStop(1, 'rgba(200,60,10,0)');
      ctx.fillStyle = moltenOuter;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      // 熔流条纹
      ctx.globalCompositeOperation = 'source-over';
      // 暗红熔流（底色纹路）
      ctx.strokeStyle = 'rgba(180,60,20,0.45)';
      ctx.lineWidth = r * 0.09;
      for (let i = 0; i < 5; i++) {
        const y = -r * 0.6 + i * r * 0.22 + Math.sin(tGlobal * 3 + i) * r * 0.05;
        ctx.beginPath();
        ctx.moveTo(-r * 0.6, y);
        ctx.quadraticCurveTo(0, y + Math.sin(tGlobal * 2 + i * 0.7) * r * 0.08, r * 0.6, y);
        ctx.stroke();
      }
      // 亮橙熔流（高光纹路）
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,210,100,0.55)';
      ctx.lineWidth = r * 0.03;
      for (let i = 0; i < 5; i++) {
        const y = -r * 0.6 + i * r * 0.22 + Math.sin(tGlobal * 3 + i) * r * 0.05 - r * 0.02;
        ctx.beginPath();
        ctx.moveTo(-r * 0.6, y);
        ctx.quadraticCurveTo(0, y + Math.sin(tGlobal * 2 + i * 0.7) * r * 0.08, r * 0.6, y);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    } else if (eraName === 'ritual') {
      // 金光余温：光斑脉动 + 铜身开始露出（多尺度层次：金斑亮核 + 铜色底斑 + 边缘锈色）
      ctx.globalCompositeOperation = 'lighter';
      const glowA = ctx.createRadialGradient(r * 0.1, -r * 0.2, r * 0.05, 0, 0, r * 1.0);
      glowA.addColorStop(0, 'rgba(255,230,160,0.65)');
      glowA.addColorStop(0.4, 'rgba(255,200,100,0.30)');
      glowA.addColorStop(0.75, 'rgba(255,150,40,0.10)');
      glowA.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.fillStyle = glowA;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      // 第二处金光呼吸（错相）
      const glowB = ctx.createRadialGradient(-r * 0.3, r * 0.25, r * 0.03, -r * 0.3, r * 0.25, r * 0.6);
      const pulseB = 0.5 + 0.5 * Math.sin(tGlobal * 1.7);
      glowB.addColorStop(0, 'rgba(255,210,120,' + (0.35 * pulseB) + ')');
      glowB.addColorStop(1, 'rgba(255,150,40,0)');
      ctx.fillStyle = glowB;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.globalCompositeOperation = 'source-over';
      // 铜色底层斑（大斑，模拟金剥落）
      ctx.fillStyle = E.bronze;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.ellipse(r * 0.3, -r * 0.15, r * 0.32, r * 0.36, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-r * 0.35, r * 0.3, r * 0.24, r * 0.22, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // 铜色斑内的深色纹理（金属氧化斑点）
      ctx.fillStyle = 'rgba(30,50,35,0.35)';
      ctx.beginPath();
      ctx.ellipse(r * 0.32, -r * 0.14, r * 0.10, r * 0.08, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-r * 0.32, r * 0.28, r * 0.08, r * 0.06, -0.4, 0, Math.PI * 2);
      ctx.fill();
      // 铜色斑的边缘高光（金光透过剥落处）
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,220,140,0.35)';
      ctx.lineWidth = r * 0.02;
      ctx.beginPath();
      ctx.ellipse(r * 0.3, -r * 0.15, r * 0.32, r * 0.36, 0.4, -0.6, 0.9);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (eraName === 'burial') {
      // 孔雀绿锈全面吞噬：底层绿锈 + 深洞暗斑 + 高晶体亮斑 + 零星金箔残片
      ctx.save();
      ctx.clip(facePath);
      // 底层绿锈：通体一层厚孔雀绿锈（文物照片的核心色）
      ctx.fillStyle = 'rgba(58,110,80,0.48)';
      ctx.fillRect(-r, -r * 1.2, r * 2, r * 2.4);
      // 大尺度绿锈斑驳：多个尺度覆盖新 facePath 全区域
      const rustSpots = [
        { x: -r * 0.40, y: -r * 0.35, rx: r * 0.28, ry: r * 0.24, a: 0.55 },
        { x:  r * 0.40, y: -r * 0.30, rx: r * 0.26, ry: r * 0.28, a: 0.55 },
        { x: -r * 0.30, y:  r * 0.35, rx: r * 0.24, ry: r * 0.20, a: 0.50 },
        { x:  r * 0.26, y:  r * 0.38, rx: r * 0.22, ry: r * 0.20, a: 0.50 },
        { x:  r * 0.02, y: -r * 0.58, rx: r * 0.24, ry: r * 0.12, a: 0.42 },
        { x: -r * 0.08, y:  r * 0.70, rx: r * 0.28, ry: r * 0.14, a: 0.48 }
      ];
      for (const s of rustSpots) {
        const rg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, Math.max(s.rx, s.ry));
        rg.addColorStop(0, 'rgba(60,150,100,' + s.a + ')');
        rg.addColorStop(0.55, 'rgba(30,90,60,' + (s.a * 0.85) + ')');
        rg.addColorStop(1, 'rgba(15,50,30,0)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.rx * 1.3, s.ry * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // 深洞暗斑（锈下的凹陷暗影）
      ctx.globalAlpha = 0.38;
      ctx.fillStyle = '#0e2418';
      const darkPits = [
        { x: -r * 0.14, y: -r * 0.06, s: r * 0.08 },
        { x:  r * 0.14, y: -r * 0.04, s: r * 0.08 },
        { x:  r * 0.00, y:  r * 0.40, s: r * 0.11 },
        { x: -r * 0.36, y:  r * 0.10, s: r * 0.06 }
      ];
      for (const p of darkPits) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // 晶体亮斑：孔雀绿锈在光下的高光晶体
      ctx.globalCompositeOperation = 'lighter';
      for (const s of rustSpots) {
        const rg2 = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.rx * 0.5);
        rg2.addColorStop(0, 'rgba(200,240,215,' + (s.a * 0.36) + ')');
        rg2.addColorStop(1, 'rgba(120,200,160,0)');
        ctx.fillStyle = rg2;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.rx * 0.55, s.ry * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // 残存金箔：极稀少的金残片（3 处）
      const flakes = [
        { x: -r * 0.05, y: -r * 0.55, w: r * 0.10, h: r * 0.06, a: 0.72 },
        { x:  r * 0.18, y: -r * 0.08, w: r * 0.09, h: r * 0.06, a: 0.58 },
        { x: -r * 0.12, y:  r * 0.16, w: r * 0.08, h: r * 0.05, a: 0.52 }
      ];
      for (const f of flakes) {
        const grd = ctx.createLinearGradient(f.x - f.w, f.y, f.x + f.w, f.y);
        grd.addColorStop(0, 'rgba(255,220,120,0)');
        grd.addColorStop(0.5, 'rgba(255,230,150,' + f.a + ')');
        grd.addColorStop(1, 'rgba(255,200,90,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y, f.w, f.h, 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      // 铜锈边缘颗粒
      ctx.fillStyle = 'rgba(30,70,50,0.42)';
      for (let i = 0; i < 14; i++) {
        const px = Math.sin(i * 2.4) * r * 0.68;
        const py = Math.cos(i * 1.7) * r * 0.62;
        ctx.beginPath();
        ctx.arc(px, py, r * 0.018, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    } else if (eraName === 'dig') {
      // 出土：黄泥覆尘 + 露出绿锈斑 + 极少量金屑微光
      ctx.save();
      ctx.clip(facePath);
      // 底泥覆盖（不均匀）
      ctx.fillStyle = 'rgba(58,48,30,0.58)';
      ctx.fillRect(-r, -r * 1.2, r * 2, r * 2.4);
      // 泥块颗粒（较大，深色）
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = '#2a2418';
      const pebbles = [
        { x: -r * 0.30, y: -r * 0.36, s: r * 0.18 },
        { x:  r * 0.35, y: -r * 0.10, s: r * 0.22 },
        { x: -r * 0.18, y:  r * 0.28, s: r * 0.20 },
        { x:  r * 0.12, y:  r * 0.55, s: r * 0.16 },
        { x:  r * 0.02, y: -r * 0.55, s: r * 0.14 }
      ];
      for (const p of pebbles) {
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.s, p.s * 0.7, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      // 露出的绿锈斑（泥土剥落后显露的孔雀绿）
      ctx.globalCompositeOperation = 'lighter';
      const greenLeaks = [
        { x: -r * 0.32, y: -r * 0.12, s: r * 0.14, a: 0.35 },
        { x:  r * 0.28, y:  r * 0.30, s: r * 0.13, a: 0.32 },
        { x: -r * 0.08, y:  r * 0.50, s: r * 0.11, a: 0.28 }
      ];
      for (const g of greenLeaks) {
        const gg = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.s);
        gg.addColorStop(0, 'rgba(90,180,120,' + g.a + ')');
        gg.addColorStop(0.6, 'rgba(40,110,70,' + (g.a * 0.5) + ')');
        gg.addColorStop(1, 'rgba(20,60,40,0)');
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      // 湿泥暗斑（更深色的湿泥土痕）
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = '#1a1608';
      for (let i = 0; i < 7; i++) {
        const wx = Math.sin(i * 1.3 + 0.5) * r * 0.55;
        const wy = Math.cos(i * 2.1 + 1.0) * r * 0.50;
        ctx.beginPath();
        ctx.ellipse(wx, wy, r * 0.11, r * 0.07, i * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      // 极微金光（记忆里仅剩的一丝）
      ctx.globalCompositeOperation = 'lighter';
      const faintGold = ctx.createRadialGradient(r * 0.18, -r * 0.30, 0, r * 0.18, -r * 0.30, r * 0.42);
      faintGold.addColorStop(0, 'rgba(255,220,140,0.22)');
      faintGold.addColorStop(0.6, 'rgba(255,180,80,0.08)');
      faintGold.addColorStop(1, 'rgba(255,180,80,0)');
      ctx.fillStyle = faintGold;
      ctx.fillRect(-r, -r * 1.2, r * 2, r * 2.4);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.restore();
    } else {
      // museum：展柜绿锈稳定，偶有金光记忆闪过
      ctx.save();
      ctx.clip(facePath);
      // 稳定绿锈基底
      ctx.fillStyle = 'rgba(60,120,85,0.45)';
      ctx.fillRect(-r, -r * 1.2, r * 2, r * 2.4);
      // 铜色底斑（局部）
      ctx.fillStyle = E.bronze;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.ellipse(r * 0.32, -r * 0.12, r * 0.24, r * 0.30, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-r * 0.34, r * 0.28, r * 0.20, r * 0.18, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // 稳定绿锈斑（大）
      ctx.globalAlpha = 0.46;
      ctx.fillStyle = '#5a8c68';
      ctx.beginPath();
      ctx.ellipse(-r * 0.22, -r * 0.42, r * 0.28, r * 0.16, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(r * 0.14, r * 0.42, r * 0.24, r * 0.12, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // 绿锈晶体亮斑（展柜灯下的反射高光，更多更明显）
      ctx.globalCompositeOperation = 'lighter';
      const crystalSpots = [
        { x: -r * 0.22, y: -r * 0.44, s: r * 0.09, a: 0.36 },
        { x:  r * 0.20, y:  r * 0.42, s: r * 0.08, a: 0.30 },
        { x: -r * 0.10, y: -r * 0.30, s: r * 0.06, a: 0.28 },
        { x:  r * 0.36, y: -r * 0.16, s: r * 0.05, a: 0.24 },
        { x: -r * 0.36, y:  r * 0.20, s: r * 0.05, a: 0.22 }
      ];
      for (const cs of crystalSpots) {
        const cg2 = ctx.createRadialGradient(cs.x, cs.y, 0, cs.x, cs.y, cs.s);
        cg2.addColorStop(0, 'rgba(210,245,225,' + cs.a + ')');
        cg2.addColorStop(0.4, 'rgba(160,220,180,' + (cs.a * 0.5) + ')');
        cg2.addColorStop(1, 'rgba(150,220,180,0)');
        ctx.fillStyle = cg2;
        ctx.beginPath();
        ctx.arc(cs.x, cs.y, cs.s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      // 记忆金光：极缓慢的呼吸式微光（每 ~6 秒闪一次）
      const memPhase = (Math.sin(tGlobal * 0.6) + 1) * 0.5;
      const memGlow = Math.pow(memPhase, 4) * 0.42;
      if (memGlow > 0.02) {
        ctx.globalCompositeOperation = 'lighter';
        const mem = ctx.createRadialGradient(-r * 0.15, -r * 0.25, 0, -r * 0.15, -r * 0.25, r * 0.55);
        mem.addColorStop(0, 'rgba(255,235,170,' + memGlow + ')');
        mem.addColorStop(0.5, 'rgba(255,200,100,' + (memGlow * 0.5) + ')');
        mem.addColorStop(1, 'rgba(255,180,80,0)');
        ctx.fillStyle = mem;
        ctx.fillRect(-r, -r * 1.2, r * 2, r * 2.4);
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.restore();
    }

    ctx.restore();

    /* --- 粗重眉骨（三星堆面具标志：厚重下压的一字眉） --- */
    ctx.fillStyle = E.patinaColor;
    ctx.beginPath();
    ctx.moveTo(-r * 0.64, -r * 0.28);
    ctx.quadraticCurveTo(-r * 0.34, -r * 0.42, -r * 0.06, -r * 0.24);
    ctx.lineTo(-r * 0.06, -r * 0.08);
    ctx.quadraticCurveTo(-r * 0.34, -r * 0.22, -r * 0.64, -r * 0.10);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.64, -r * 0.28);
    ctx.quadraticCurveTo(r * 0.34, -r * 0.42, r * 0.06, -r * 0.24);
    ctx.lineTo(r * 0.06, -r * 0.08);
    ctx.quadraticCurveTo(r * 0.34, -r * 0.22, r * 0.64, -r * 0.10);
    ctx.closePath();
    ctx.fill();
    // 眉骨上沿高光
    ctx.strokeStyle = 'rgba(255,230,170,0.38)';
    ctx.lineWidth = Math.max(1, r * 0.028);
    ctx.beginPath();
    ctx.moveTo(-r * 0.62, -r * 0.29);
    ctx.quadraticCurveTo(-r * 0.34, -r * 0.42, -r * 0.08, -r * 0.25);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 0.62, -r * 0.29);
    ctx.quadraticCurveTo(r * 0.34, -r * 0.42, r * 0.08, -r * 0.25);
    ctx.stroke();
    // 眉骨下沿阴影刻线
    ctx.strokeStyle = 'rgba(6,14,10,0.6)';
    ctx.lineWidth = Math.max(1, r * 0.04);
    ctx.beginPath();
    ctx.moveTo(-r * 0.62, -r * 0.10);
    ctx.quadraticCurveTo(-r * 0.34, -r * 0.20, -r * 0.08, -r * 0.09);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 0.62, -r * 0.10);
    ctx.quadraticCurveTo(r * 0.34, -r * 0.20, r * 0.08, -r * 0.09);
    ctx.stroke();

    /* --- 纵目（圆柱凸出眼球——三星堆面具的标志性特征） --- */
    const eyeOpen = 1 - blink;
    // 眼睑刻线颜色：金时代是暖金光，绿锈时代是翠光，出土时代灰调
    const eyeLineColors = {
      forge:  'rgba(255,220,140,0.75)',
      ritual: 'rgba(230,180,100,0.65)',
      burial: 'rgba(160,225,190,0.65)',
      dig:    'rgba(180,175,140,0.55)',
      museum: 'rgba(160,225,190,0.65)'
    };
    for (const side of [-1, 1]) {
      // 眼窝深凹（画眼柱之前，在脸部刻一个椭圆暗窝）
      ctx.fillStyle = 'rgba(6,14,10,0.85)';
      ctx.beginPath();
      ctx.ellipse(side * r * 0.34, r * 0.04, r * 0.26, r * 0.15 * eyeOpen + 0.001, 0, 0, Math.PI * 2);
      ctx.fill();

      if (eyeOpen > 0.28) {
        // 纵目：从眼窝向外伸出的圆柱（三星堆面具最独特的造型）
        const eyeY = r * 0.04;
        const eyeRad = r * 0.155 * (0.55 + 0.45 * eyeOpen);
        const eyeBaseX = side * r * 0.18;   // 内端贴鼻梁
        const eyeTipX = side * r * 0.62;    // 外端延伸到接近脸边缘
        // 外端抬高 0.14r——三星堆"内低外高"更明显
        const tipLift = r * 0.14;
        const eyeTipY = eyeY - tipLift;
        // 眼球颜色按 era 变化（绿锈时代眼球也偏绿）
        const eyeBodyColors = {
          forge:  ['#fff2c8', '#d8b870', '#a08446', '#5a4220'],
          ritual: ['#f0d8a0', '#b89c60', '#7a6836', '#3a2e18'],
          burial: ['#c8e0b4', '#7aa070', '#3a5a34', '#1a2818'],
          dig:    ['#d8d4b4', '#8a8668', '#4a4632', '#1a180f'],
          museum: ['#c8e0b8', '#7aa080', '#3a5a40', '#142018']
        };
        const ec = eyeBodyColors[eraName] || eyeBodyColors.museum;
        const eg = ctx.createLinearGradient(0, eyeY - eyeRad, 0, eyeY + eyeRad);
        eg.addColorStop(0, ec[0]);
        eg.addColorStop(0.45, ec[1]);
        eg.addColorStop(0.72, ec[2]);
        eg.addColorStop(1, ec[3]);
        ctx.fillStyle = eg;
        // 圆柱身体：内端保持 eyeY，外端上抬至 eyeTipY（轻微斜线）
        ctx.beginPath();
        ctx.moveTo(eyeBaseX, eyeY - eyeRad);
        ctx.lineTo(eyeTipX, eyeTipY - eyeRad);
        ctx.lineTo(eyeTipX, eyeTipY + eyeRad);
        ctx.lineTo(eyeBaseX, eyeY + eyeRad);
        ctx.closePath();
        ctx.fill();
        // 内端盖（连接面部侧）
        ctx.beginPath();
        ctx.ellipse(eyeBaseX, eyeY, eyeRad * 0.55, eyeRad, 0, 0, Math.PI * 2);
        ctx.fill();
        // 外端盖（凸出的眼球面，画瞳孔）
        ctx.beginPath();
        ctx.ellipse(eyeTipX, eyeTipY, eyeRad * 0.78, eyeRad, 0, 0, Math.PI * 2);
        ctx.fill();
        // 瞳孔（凸眼末端的高光瞳孔）
        ctx.fillStyle = '#040a06';
        ctx.beginPath();
        ctx.ellipse(eyeTipX, eyeTipY, eyeRad * 0.38, eyeRad * 0.44, 0, 0, Math.PI * 2);
        ctx.fill();
        // 瞳孔高光
        ctx.fillStyle = 'rgba(255,245,220,0.80)';
        ctx.beginPath();
        ctx.ellipse(eyeTipX + side * r * 0.02, eyeTipY - eyeRad * 0.18, eyeRad * 0.14, eyeRad * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
        // 眼柱上缘刻线（内低外高）
        ctx.strokeStyle = eyeLineColors[eraName] || 'rgba(160,225,190,0.65)';
        ctx.lineWidth = Math.max(1, r * 0.032);
        ctx.beginPath();
        ctx.moveTo(eyeBaseX, eyeY - eyeRad);
        ctx.lineTo(eyeTipX, eyeTipY - eyeRad);
        ctx.stroke();
        // 眼柱上缘金属高光（金属反光带，强化圆柱体积感）
        ctx.strokeStyle = 'rgba(255,240,200,0.42)';
        ctx.lineWidth = Math.max(1, r * 0.018);
        ctx.beginPath();
        ctx.moveTo(eyeBaseX + side * r * 0.02, eyeY - eyeRad * 0.7);
        ctx.lineTo(eyeTipX + side * r * 0.01, eyeTipY - eyeRad * 0.7);
        ctx.stroke();
        // 眼球面外圈描边（强化轮廓与神秘感）
        ctx.strokeStyle = 'rgba(6,14,10,0.65)';
        ctx.lineWidth = Math.max(1, r * 0.024);
        ctx.beginPath();
        ctx.ellipse(eyeTipX, eyeTipY, eyeRad * 0.78, eyeRad, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        // 闭眼：一条斜向上的刻线（外端抬高 0.14r，与睁眼斜度一致）
        ctx.strokeStyle = eyeLineColors[eraName] || 'rgba(160,225,190,0.65)';
        ctx.lineWidth = Math.max(1, r * 0.04);
        ctx.beginPath();
        ctx.moveTo(side * r * 0.18, r * 0.04);
        ctx.lineTo(side * r * 0.62, -r * 0.10);
        ctx.stroke();
      }
    }

    /* --- 宽鼻（鼻梁高挺，鼻翼宽方；宽度适配新面庞） --- */
    ctx.fillStyle = E.bronze;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(0, r * 0.04);
    ctx.lineTo(-r * 0.19, r * 0.52);
    ctx.lineTo(r * 0.19, r * 0.52);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    // 鼻梁高光
    ctx.fillStyle = 'rgba(220,205,160,0.30)';
    ctx.fillRect(-r * 0.028, r * 0.06, r * 0.056, r * 0.36);
    // 鼻翼两侧暗色
    ctx.fillStyle = 'rgba(6,14,10,0.4)';
    ctx.beginPath();
    ctx.moveTo(-r * 0.19, r * 0.52);
    ctx.quadraticCurveTo(-r * 0.08, r * 0.58, 0, r * 0.56);
    ctx.quadraticCurveTo(r * 0.08, r * 0.58, r * 0.19, r * 0.52);
    ctx.lineTo(r * 0.19, r * 0.46);
    ctx.quadraticCurveTo(0, r * 0.50, -r * 0.19, r * 0.46);
    ctx.closePath();
    ctx.fill();

    /* --- 方唇（宽直外扩，位置对齐新面庞，更靠下靠尖下巴） --- */
    ctx.fillStyle = 'rgba(6,14,10,0.55)';
    ctx.beginPath();
    ctx.moveTo(-r * 0.30, r * 0.72);
    ctx.quadraticCurveTo(0, r * 0.82, r * 0.30, r * 0.72);
    ctx.quadraticCurveTo(0, r * 0.90, -r * 0.30, r * 0.72);
    ctx.closePath();
    ctx.fill();
    // 唇线刻槽
    ctx.strokeStyle = 'rgba(4,10,8,0.75)';
    ctx.lineWidth = Math.max(1, r * 0.04);
    ctx.beginPath();
    ctx.moveTo(-r * 0.30, r * 0.72);
    ctx.quadraticCurveTo(0, r * 0.80, r * 0.30, r * 0.72);
    ctx.stroke();
  }

  ctx.restore();
}

/* ================= 主角绘制 ================= */
function drawPlayer() {
  const px = player.x - cam.x;
  const py = player.y;

  // 拖尾轨迹：维护一个短历史缓冲，用于金色/加速残影
  if (!player._trail) player._trail = [];
  player._trail.push({ x: px, y: py });
  if (player._trail.length > 10) player._trail.shift();

  // 落地阴影
  let floorY = py + 240;
  for (const pl of level.plats) {
    if (player.x > pl[0] - 10 && player.x < pl[0] + pl[2] + 10 && pl[1] >= py + player.r - 6) {
      if (pl[1] < floorY) floorY = pl[1];
    }
  }
  const dist = floorY - (py + player.r);
  const k = clamp(1 - dist / 300, 0.16, 0.5);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(px, floorY + 2, player.r * 1.05 * k, player.r * 0.26 * k, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 青铜头像本体
  // 头部摆动惯性：基于水平速度做低通滤波，避免转向时生硬跳跃
  if (player._tiltS === undefined) player._tiltS = 0;
  const tiltTarget = clamp(player.vx / SPEED, -1, 1) * 0.11;
  player._tiltS += (tiltTarget - player._tiltS) * 0.18;
  const tilt = player._tiltS;
  // 行走节奏：脚步频率随速度线性增加；空中静止（无 bob）
  const speedK = Math.min(1, Math.abs(player.vx) / SPEED);
  const bob = player.grounded && Math.abs(player.vx) > 40
    ? Math.sin(tGlobal * (8 + speedK * 6)) * (0.015 + speedK * 0.025)
    : 0;
  // 跳跃头部姿态：上升略仰头、下落略低头（增加跳跃的立体感）
  const airPose = player.grounded ? 0 : clamp(-player.vy / 500, -0.06, 0.06);
  // 眨眼非均匀：主眨眼慢（1.1Hz），偶发快眨（叠加 0.55Hz 微频）
  const blinkMain = Math.sin(tGlobal * 1.1) > 0.972 ? 1 : 0;
  const blinkQuick = Math.sin(tGlobal * 0.55 + 1.3) > 0.985 ? 1 : 0;
  const blink = Math.max(blinkMain, blinkQuick);

  // 金色拖尾（加速时更明显）：沿轨迹方向画一层淡金色残影
  // 触发条件：goldFlash > 0（收集后）或 水平速度 > 70% SPEED（高速移动）
  const trailStrength = Math.max(player.goldFlash || 0, Math.max(0, speedK - 0.55) * 1.4);
  if (trailStrength > 0.02 && player._trail.length > 2) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const trLen = player._trail.length;
    for (let i = 0; i < trLen - 1; i++) {
      const p = player._trail[i];
      const t = i / trLen; // 0=最旧，1=最新
      const a = trailStrength * (1 - t) * 0.28;
      if (a < 0.01) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = player.goldFlash > 0 ? '#ffe8a8' : '#b8e6cc';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, player.r * 0.55 * (0.5 + 0.5 * t), player.r * 0.42 * (0.5 + 0.5 * t), 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = player.inv > 0 ? 0.55 : 1;
  drawHead(px, py, player.r, {
    angle: tilt + airPose,
    sx: player.sx,
    sy: player.sy + bob,
    blink: blink,
    gaze: player.face,
    flat: false
  });
  ctx.restore();

  // 微弱轮廓光：按关卡演化（熔金强、出土弱、展柜冷）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const glowColors = {
    forge: 'rgba(255,210,120,0.20)',
    ritual: 'rgba(255,190,100,0.14)',
    burial: 'rgba(160,220,140,0.08)',
    dig: 'rgba(180,170,130,0.06)',
    museum: 'rgba(140,210,180,0.10)'
  };
  radialGlow(px, py - player.r * 0.2, player.r * 2.4,
    glowColors[ERA_ORDER[levelIdx]] || 'rgba(120,220,180,0.05)');
  ctx.restore();

  // 收集迷你金面具后：面具闪金光（3 层同心脉冲光晕）
  if (player.goldFlash > 0) {
    const gf = player.goldFlash;
    const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 18);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const layers = [
      { r: 2.6, a: 0.32, c: 'rgba(255,235,140,' },
      { r: 1.8, a: 0.42, c: 'rgba(255,215,90,' },
      { r: 1.15, a: 0.55, c: 'rgba(255,245,190,' }
    ];
    for (const L of layers) {
      radialGlow(px, py - player.r * 0.15, player.r * L.r * pulse,
        L.c + (L.a * Math.min(1, gf * 1.4)) + ')');
    }
    ctx.restore();
  }
}

/* ================= HUD ================= */
function drawHUD() {
  ctx.textAlign = 'left';
  // 关卡名（带阴影 + 微弱金色发光）
  ctx.font = '600 22px "Microsoft YaHei", sans-serif';
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 1;
  ctx.fillStyle = 'rgba(235,225,195,0.95)';
  ctx.fillText(level.name, 40, 52);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  // 时代徽章：显示面具当前在"金→三千年→青铜锈迹"时间轴上的位置
  const eraName = ERA_ORDER[levelIdx];
  const era = ERA[eraName];
  const eraColors = {
    forge:  { fill: 'rgba(255,200,90,0.22)',  border: 'rgba(255,220,140,0.75)', text: '#ffe0a0' },
    ritual: { fill: 'rgba(230,160,70,0.20)',  border: 'rgba(230,180,100,0.7)',  text: '#f0c684' },
    burial: { fill: 'rgba(120,180,90,0.18)',  border: 'rgba(160,215,150,0.65)', text: '#c8d8a0' },
    dig:    { fill: 'rgba(150,130,90,0.20)',  border: 'rgba(180,170,130,0.6)',  text: '#b0a088' },
    museum: { fill: 'rgba(90,150,120,0.22)',  border: 'rgba(140,200,170,0.7)',  text: '#a0c8b0' }
  };
  const eraShort = { forge: '熔金', ritual: '祭祀', burial: '埋藏', dig: '出土', museum: '展陈' };
  const eraYears = { forge: '前1600', ritual: '前1300', burial: '—', dig: '1986', museum: '今日' };
  const ec = eraColors[eraName] || eraColors.museum;
  const bx = 55, by = 66, bw = 445, bh = 40;
  ctx.save();
  // 背景：深色 + 顶下边缘的金色微渐变（顶部亮、底部暗）
  const badgeG = ctx.createLinearGradient(0, by, 0, by + bh);
  badgeG.addColorStop(0, 'rgba(20,30,26,0.72)');
  badgeG.addColorStop(0.5, 'rgba(6,12,10,0.55)');
  badgeG.addColorStop(1, 'rgba(0,0,0,0.40)');
  ctx.fillStyle = badgeG;
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = ec.border;
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  // 顶部高光线（金属感）
  ctx.strokeStyle = 'rgba(255,235,180,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bx + 1, by + 1);
  ctx.lineTo(bx + bw - 1, by + 1);
  ctx.stroke();
  // 顶部标题
  ctx.fillStyle = 'rgba(210,190,140,0.72)';
  ctx.font = '600 10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('三千年演化', bx + 10, by + 12);
  // 当前 era 名称 + 年份（右侧醒目）
  ctx.textAlign = 'right';
  ctx.fillStyle = ec.text;
  ctx.font = '700 12px "Microsoft YaHei", sans-serif';
  ctx.fillText(era.label + ' · ' + eraYears[eraName], bx + bw - 10, by + 12);
  // 时间轴线
  const axY = by + 24;
  const axX = bx + 30, axW = bw - 60;
  ctx.strokeStyle = 'rgba(200,180,130,0.32)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(axX, axY);
  ctx.lineTo(axX + axW, axY);
  ctx.stroke();
  // 5 段时代刻度
  for (let i = 0; i < 5; i++) {
    const dotX = axX + i * (axW / 4);
    const cur = i === levelIdx;
    const past = i < levelIdx;
    // 连线（到下一段）
    if (i < 4) {
      ctx.strokeStyle = i < levelIdx ? ec.text : 'rgba(200,180,130,0.22)';
      ctx.lineWidth = i < levelIdx ? 1.8 : 1;
      ctx.beginPath();
      ctx.moveTo(dotX + 5, axY);
      ctx.lineTo(dotX + axW / 4 - 5, axY);
      ctx.stroke();
    }
    // 圆点
    ctx.beginPath();
    ctx.arc(dotX, axY, cur ? 6 : (past ? 4.2 : 3), 0, Math.PI * 2);
    ctx.fillStyle = cur ? ec.text : (past ? 'rgba(200,180,130,0.7)' : 'rgba(200,200,200,0.22)');
    ctx.fill();
    // 当前时代外圈（带呼吸脉冲：外圈呼吸缩放 + 内圈静态）
    if (cur) {
      // 呼吸光环（半径 10-14 之间呼吸）
      const pulseR = 10 + Math.sin(tGlobal * 2.2) * 2.0;
      const pulseA = 0.35 + 0.25 * (0.5 + 0.5 * Math.sin(tGlobal * 2.2));
      ctx.globalAlpha = pulseA;
      ctx.strokeStyle = ec.text;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(dotX, axY, pulseR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // 内圈固定环
      ctx.beginPath();
      ctx.arc(dotX, axY, 9, 0, Math.PI * 2);
      ctx.strokeStyle = ec.text;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // era 短名（下方）
    ctx.textAlign = 'center';
    ctx.fillStyle = cur ? ec.text : (past ? 'rgba(220,210,180,0.55)' : 'rgba(200,200,180,0.35)');
    ctx.font = cur ? '700 10px "Microsoft YaHei", sans-serif'
                   : '10px "Microsoft YaHei", sans-serif';
    ctx.fillText(eraShort[ERA_ORDER[i]], dotX, by + bh - 1);
  }
  ctx.restore();
  ctx.textAlign = 'left';

  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(180,215,200,0.55)';
  ctx.fillText('键盘：← → / A D 移动 · 空格 跳跃 · R 重来 · Esc 退出 · M 静音', 40, 124);
  ctx.fillStyle = pad.connected ? 'rgba(150,235,190,0.75)' : 'rgba(255,190,120,0.80)';
  ctx.fillText(pad.connected
    ? '手柄：已连接 · 左摇杆/十字键 移动 · 任意键 跳跃 · Back/Select 退出'
    : (!pageActivated && HAS_GAMEPAD_API && !IN_IFRAME
        ? '手柄：待激活 — 先点一下画面或按一下键盘，再按手柄任意键'
        : '手柄：未检测到（按一下手柄任意键唤醒；USB 需先在系统里识别）'), 40, 142);
  // 手柄实时诊断（便于确认按键编号）
  if (pad.connected) {
    ctx.font = '11px Consolas, monospace';
    ctx.fillStyle = 'rgba(140,225,185,0.45)';
    ctx.fillText('pad: ' + String(pad.name).slice(0, 44), 40, 158);
    ctx.fillText('axes[' + pad.axes + ']  按下键[' + (pad.dbg || '无') + ']  ' +
                 '左' + (pad.left ? 1 : 0) + ' 右' + (pad.right ? 1 : 0) + ' 跳' + (pad.jump ? 1 : 0),
                 40, 174);
  }
  // 手柄不可用警告：移到右上音效按钮下方，避免遮挡底部游戏画面
  if (IN_IFRAME || !HAS_GAMEPAD_API) {
    ctx.font = '11px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,170,90,0.75)';
    ctx.textAlign = 'right';
    const wmsg = IN_IFRAME
      ? '⚠ 预览窗内运行：浏览器屏蔽手柄，' + '请双击 HTML 独立打开'
      : '⚠ 浏览器不支持 Gamepad API，手柄不可用';
    ctx.fillText(wmsg, W - 24, 84);
    ctx.textAlign = 'left';
  }
  ctx.font = '13px "Microsoft YaHei", sans-serif';

  // 光尘计数
  ctx.fillStyle = 'rgba(255,230,160,0.9)';
  ctx.font = '600 15px "Microsoft YaHei", sans-serif';
  ctx.fillText('光尘 ' + collected + ' / ' + level.motes.length, 40, 162);
  for (let i = 0; i < level.motes.length; i++) {
    const got = i < collected;
    const cx = 146 + i * 18, cy = 157;
    if (got) {
      // 已收集：呼吸金色外发光（每颗错相，形成节奏感）
      const pulse = 0.5 + 0.5 * Math.sin(tGlobal * 3 + i * 0.6);
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5 + pulse * 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,220,130,' + (0.10 + 0.10 * pulse) + ')';
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      // 核心
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffe9a8';
      ctx.fill();
      // 高光点
      ctx.beginPath();
      ctx.arc(cx - 1.2, cy - 1.4, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,230,0.9)';
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fill();
    }
  }

  // 生命
  ctx.font = '600 15px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(235,205,150,0.9)';
  ctx.fillText('生命', 268, 162);
  for (let i = 0; i < MAXHP; i++) {
    const hx = 318 + i * 24, hy = 157;
    ctx.beginPath();
    ctx.arc(hx, hy, 8, 0, Math.PI * 2);
    if (i < player.hp) {
      ctx.fillStyle = '#4f9a7c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,215,0.85)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(230,255,240,0.9)';
      ctx.beginPath();
      ctx.arc(hx - 2.4, hy - 2.4, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // 进度
  const pct = clamp(player.x / level.goal.x, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(40, 150, 380, 3);
  ctx.fillStyle = 'rgba(255,225,150,0.75)';
  ctx.fillRect(40, 150, 380 * pct, 3);
}
