  radialGlow(cx - 10 * s, topY - 60 * s, 130 * s, 'rgba(255,130,48,0.10)');
  // 盆中三束火
  for (let k = 0; k < 3; k++) {
    const fh = (26 + k * 11) * s * (0.78 + 0.22 * Math.sin(tGlobal * 5.2 + k * 2.1));
    const fx2 = brazX + (k - 1) * 8 * s + Math.sin(tGlobal * 3.6 + k) * 3 * s;
    const fg = ctx.createLinearGradient(0, brazY - 18 * s - fh, 0, brazY - 16 * s);
    fg.addColorStop(0, 'rgba(255,246,206,0)');
    fg.addColorStop(0.42, 'rgba(255,204,104,0.55)');
    fg.addColorStop(1, 'rgba(255,124,42,0.68)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx2, brazY - 18 * s - fh);
    ctx.quadraticCurveTo(fx2 + 8 * s, brazY - 24 * s, fx2 + 6 * s, brazY - 16 * s);
    ctx.lineTo(fx2 - 6 * s, brazY - 16 * s);
    ctx.quadraticCurveTo(fx2 - 8 * s, brazY - 24 * s, fx2, brazY - 18 * s - fh);
    ctx.fill();
  }
  ctx.restore();

  // 神树必须画在炉火光之后。
  // 之前它画在光之前，那团 `lighter` 暖光（radialGlow 0.10）直接刷在剪影上，
  // 把烘焙好的 (16,22,23) 抬成 (41,40,31)——剪影被"洗"成一片橄榄色的实心板，
  // 边缘的暖色逆光也跟着没了。光在树后，树才立得住。
  drawSacredTreeSilhouette(cx - 10 * s, topY, s * 1.28, 0.95, 'rgba(255,158,78,0.66)');

  // 祭烟：从台顶袅袅升起，把"通神"这条线拉向天上那张脸
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const ph = ((tGlobal * 0.20 + i * 0.11) % 1);
    const sy = brazY - 26 * s - ph * 250 * s;
    const sx = brazX + Math.sin(tGlobal * 0.9 + i * 1.7) * (10 + ph * 46) * s;
    const sa = (1 - ph) * 0.16 * (0.55 + 0.45 * Math.sin(tGlobal * 1.4 + i));
    if (sa <= 0.004) continue;
    ctx.fillStyle = `rgba(196,182,170,${sa.toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(sx, sy, (16 + ph * 52) * s, (9 + ph * 26) * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ---- 商代青铜礼器 · 编钟（悬吊的编钟组） ---- */
function drawBellSilhouette(cx, topY, s, alpha) {
  withAlpha(alpha, () => {
    ctx.fillStyle = SILHUE_DARK;
    // 横梁（悬钟架）
    ctx.fillRect(cx - 40 * s, topY, 80 * s, 4 * s);
    // 三个钟（大小不一）
    const bells = [
      { dx: -22, size: 14 },
      { dx: 0,   size: 18 },
      { dx: 22,  size: 14 }
    ];
    for (const b of bells) {
      const bx = cx + b.dx * s;
      const bs = b.size * s;
      // 悬绳
      ctx.strokeStyle = SILHUE_DARK;
      ctx.lineWidth = 1.2 * s;
      ctx.beginPath();
      ctx.moveTo(bx, topY + 4 * s);
      ctx.lineTo(bx, topY + 8 * s);
      ctx.stroke();
      // 钟体（上宽下窄梯形，钟顶有钮）
      ctx.beginPath();
      ctx.moveTo(bx - 2 * s, topY + 4 * s);
      ctx.lineTo(bx + 2 * s, topY + 4 * s);
      ctx.lineTo(bx + 3 * s, topY + 6 * s);
      ctx.lineTo(bx - 3 * s, topY + 6 * s);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx - 6 * s, topY + 8 * s);
      ctx.lineTo(bx + 6 * s, topY + 8 * s);
      ctx.lineTo(bx + bs * 0.5, topY + 8 * s + bs);
      ctx.lineTo(bx - bs * 0.5, topY + 8 * s + bs);
      ctx.closePath();
      ctx.fill();
    }
  });
}

/* ---- 商代祭祀 · 陶鬲（三袋足大釜） ---- */
function drawLiSilhouette(cx, baseY, s, alpha) {
  withAlpha(alpha, () => {
    ctx.fillStyle = SILHUE_DARK;
    // 口沿
    ctx.fillRect(cx - 18 * s, baseY - 30 * s, 36 * s, 4 * s);
    // 束颈
    ctx.fillRect(cx - 12 * s, baseY - 26 * s, 24 * s, 8 * s);
    // 三袋足（三个圆鼓）
    for (const dx of [-12, 0, 12]) {
      ctx.beginPath();
      ctx.arc(cx + dx * s, baseY - 8 * s, 10 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

/* ---- 三星堆 · 玉琮（方外圆内，祭祀神器） ---- */
function drawJadeCongSilhouette(cx, baseY, s, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  // 方形外壁（分层）
  ctx.fillStyle = SILHUE_DARK;
  ctx.fillRect(cx - 14 * s, baseY - 40 * s, 28 * s, 40 * s);
  // 顶端和底端圆环（俯视时呈方框，正视看有分隔线）
  ctx.strokeStyle = 'rgba(60,80,60,0.4)';
  ctx.lineWidth = 1 * s;
  ctx.strokeRect(cx - 14 * s, baseY - 40 * s, 28 * s, 40 * s);
  // 中间圆孔（用暗色表现）
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.ellipse(cx, baseY - 20 * s, 8 * s, 20 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  // 面部纹饰（简化）
  ctx.strokeStyle = 'rgba(60,80,60,0.5)';
  ctx.lineWidth = 0.8 * s;
  ctx.beginPath();
  ctx.moveTo(cx - 14 * s, baseY - 30 * s);
  ctx.lineTo(cx + 14 * s, baseY - 30 * s);
  ctx.moveTo(cx - 14 * s, baseY - 10 * s);
  ctx.lineTo(cx + 14 * s, baseY - 10 * s);
  ctx.stroke();
  ctx.restore();
}

/* ---- 三星堆 · 金面具背景符号（远景中的金面具剪影，只在 ritual/burial/museum 出现） ---- */
function drawGoldMaskSilhouette(cx, cy, s, alpha) {
  withAlpha(alpha, () => {
    // 面具主体（椭圆脸）
    ctx.fillStyle = SILHUE_MASK;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 22 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 大耳（左右对称）
    eachSide(d => {
      ctx.beginPath();
      ctx.moveTo(cx + d * 22 * s, cy - 2 * s);
      ctx.lineTo(cx + d * 34 * s, cy - 10 * s);
      ctx.lineTo(cx + d * 34 * s, cy + 6 * s);
      ctx.lineTo(cx + d * 22 * s, cy + 4 * s);
      ctx.closePath();
      ctx.fill();
    });
  });
}

/* ---- 各 era 符号层调度 ---- */
function drawCultureLayer(theme) {
  const par = 0.5; // 中景视差
  const stepX = 480; // 循环间距
  const start = -((cam.x * par) % stepX);

  if (theme === 'forge') {
    // 熔铸：商代礼器（鼎、爵、觚）作为远景装饰，暗示"这是铸造作坊"
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -80 || x > W + 80) continue;
      const kind = ((i % 3) + 3) % 3;
      if (kind === 0) drawDingSilhouette(x, 605, 0.9, 0.32);
      else if (kind === 1) drawJueSilhouette(x, 605, 0.9, 0.32);
      else drawGuSilhouette(x, 605, 0.9, 0.32);
    }
  } else if (theme === 'ritual') {
    // 祭祀：远景只留"悬在夜空里的金面具"与编钟——神树与主祭已由 bgRitual 承担，
    // 此处再画会与主景叠成三层，画面过密。
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -100 || x > W + 100) continue;
      const kind = ((i % 2) + 2) % 2;
      if (kind === 0) {
        drawGoldMaskSilhouette(x, 300, 0.62, 0.20);
        drawBellSilhouette(x, 178, 0.6, 0.18);
      } else {
        drawBellSilhouette(x, 232, 0.72, 0.20);
      }
    }
  } else if (theme === 'burial') {
    // 深埋：符号必须画在"剖面里"（地面顶端 620 以上）才看得见。
    // 原来写 baseY=700/720 全被地面填色盖住，等于没画 —— 这是第 3 关画面空的直接原因。
    // 现在 baseY=556 让器物下缘埋进土中、上缘露在剖面里，读作"半埋的器物"。
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -100 || x > W + 100) continue;
      const kind = ((i % 3) + 3) % 3;
      if (kind === 0) drawSacredTreeSilhouette(x, 552, 0.62, 0.17);
      else if (kind === 1) drawStandingFigSilhouette(x, 552, 0.56, 0.17);
      else drawJadeCongSilhouette(x, 552, 0.56, 0.15);
    }
  } else if (theme === 'dig') {
    // 考古：远处坑边立着的陶鬲、玉琮、洛阳铲架，暗示"待发掘"
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -80 || x > W + 80) continue;
      const kind = ((i % 3) + 3) % 3;
      if (kind === 0) drawLiSilhouette(x, 605, 0.7, 0.28);
      else if (kind === 1) drawJadeCongSilhouette(x, 605, 0.7, 0.28);
      else drawDingSilhouette(x, 605, 0.7, 0.28);
    }
  } else {
    // 展柜：背景墙上的编钟 + 玉琮展陈（暗色装饰）
    for (let i = -1; i < 4; i++) {
      const x = start + i * stepX + 220;
      if (x < -80 || x > W + 80) continue;
      drawBellSilhouette(x, 220, 0.6, 0.20);
      drawJadeCongSilhouette(x - 60, 340, 0.5, 0.14);
    }
  }
}

/* ================= 环境飘尘层（各 era 主题色粒子，营造祭祀氛围） ================= */
/* 用确定性种子生成 N 个粒子，每帧根据 tGlobal 计算位置；无状态，无需 update */
function drawAmbientDust() {
  const theme = level.theme;
  const cfg = {
    forge:  { count: 42, hue: '255,180,90', speed: 0.9, drift: 26, size: [1.2, 2.6], alpha: [0.12, 0.35] },
    ritual: { count: 48, hue: '255,220,150', speed: 0.5, drift: 34, size: [1.0, 2.4], alpha: [0.10, 0.32] },
    burial: { count: 40, hue: '160,200,140', speed: 0.35, drift: 40, size: [1.2, 2.8], alpha: [0.14, 0.38] },
    dig:    { count: 54, hue: '220,190,130', speed: 0.55, drift: 22, size: [1.0, 2.2], alpha: [0.12, 0.36] },
    museum: { count: 36, hue: '180,220,200', speed: 0.28, drift: 48, size: [1.4, 3.0], alpha: [0.10, 0.30] }
  }[theme] || { count: 36, hue: '200,200,200', speed: 0.4, drift: 30, size: [1.2, 2.4], alpha: [0.12, 0.30] };

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < cfg.count; i++) {
    // 确定性种子：每颗粒子有独立相位/大小/速度系数
    const seed = i * 73.31 + 12.7;
    const phaseX = tGlobal * cfg.speed * (0.6 + (i % 5) * 0.15);
    const driftX = Math.sin(tGlobal * 0.35 + seed * 0.4) * cfg.drift;
    const driftY = Math.cos(tGlobal * 0.28 + seed * 0.7) * cfg.drift * 0.6;
    // 粒子在画面上的循环位置（水平视差 + 缓慢下落）
    const baseX = ((i * 97) + (phaseX * 40) - cam.x * 0.15);
    const wrapX = ((baseX % W) + W) % W;
    const fall = ((tGlobal * 8 + seed * 3.7) % (H + 40));
    const px = wrapX + driftX;
    const py = (fall % H) + driftY;
    if (py < -20 || py > H + 20) continue;
    const sz = cfg.size[0] + ((i * 17) % 100) / 100 * (cfg.size[1] - cfg.size[0]);
    // 呼吸亮度
    const twinkle = 0.5 + 0.5 * Math.sin(tGlobal * 1.6 + seed);
    const alpha = cfg.alpha[0] + (cfg.alpha[1] - cfg.alpha[0]) * twinkle;
    ctx.fillStyle = `rgba(${cfg.hue},${alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ================= 平台 ================= */
/* ---- 主地面剖面（画面最底约 100px × 全屏的那个大色块）----
   五关之前共用同一套"土沁分层 + 云雷纹"纹理，于是五关的地面长得一模一样，
   这是"换关只是换个背景板"的主要来源。这里按主题各画各的：
     铸铜  → 被炉火烤硬的夯土台基（夯层 + 夯窝 + 铜渣炭屑 + 云雷纹）
     祭祀  → 祭坛石台（条石缝 + 云雷纹 + 朱砂沁色）
     埋藏  → 压实土层剖面（层理 + 陶片炭屑嵌土 + 干裂结壳）
     展厅  → 抛光深色石材（长石板缝 + 灯带反光）
   探方关（dig）不画这套，它有自己的考古标记。 */
function drawGroundSection(px, py, pw, ph, worldX) {
  const th = level.theme;
  let hs = (worldX * 2654435761 + 1234567) >>> 0;
  const rn = () => { hs = (hs * 1664525 + 1013904223) >>> 0; return hs / 4294967296; };

  if (th === 'burial') {
    const g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, 'rgba(98,78,50,0.97)');
    g.addColorStop(0.34, 'rgba(64,50,31,0.99)');
    g.addColorStop(1, 'rgba(22,16,10,1)');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, pw, ph);

    // 层理：跟着地面起伏的弱亮线（不是笔直线，否则像瓷砖缝）
    for (let k = 0; k < 3; k++) {
      const y0 = py + 24 + k * 25;
      ctx.beginPath();
      for (let x = 0; x <= pw; x += 24) {
        const y = y0 + Math.sin((px + x) * 0.011 + k * 2.3) * 4
                     + Math.sin((px + x) * 0.029 + k * 1.7) * 1.7;
        if (x === 0) ctx.moveTo(px + x, y); else ctx.lineTo(px + x, y);
      }
      ctx.strokeStyle = `rgba(214,184,136,${(0.10 - k * 0.024).toFixed(3)})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    // 嵌在剖面里的陶片 / 炭屑
    const n = Math.max(7, Math.round(pw / 85));
    for (let i = 0; i < n; i++) {
      const x = px + rn() * pw, y = py + 16 + rn() * (ph - 24);
      const w = 5 + rn() * 11, h = 3 + rn() * 5;
      ctx.fillStyle = `rgba(140,108,70,${(0.16 + rn() * 0.18).toFixed(3)})`;
      ctx.beginPath(); ctx.ellipse(x, y, w, h, (rn() - 0.5) * 1.2, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(232,206,164,0.11)';
      ctx.beginPath(); ctx.ellipse(x - w * 0.2, y - h * 0.55, w * 0.6, h * 0.4, 0, 0, 6.2832); ctx.fill();
    }
    // 地表结壳：压实土面 + 干裂纹
    ctx.fillStyle = 'rgba(122,98,64,0.5)';
    ctx.fillRect(px, py, pw, 5);
    ctx.fillStyle = 'rgba(236,212,168,0.20)';
    ctx.fillRect(px, py, pw, 1.5);
    ctx.strokeStyle = 'rgba(20,13,7,0.48)';
    ctx.lineWidth = 1.1;
    for (let x = px + 14; x < px + pw; x += 30 + rn() * 26) {
      ctx.beginPath();
      ctx.moveTo(x, py + 1);
      ctx.lineTo(x + 3 + rn() * 7, py + 3.5 + rn() * 3);
      ctx.stroke();
    }
    return;
  }

  if (th === 'forge') {
    const g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, 'rgba(94,70,48,0.97)');
    g.addColorStop(0.4, 'rgba(58,42,28,0.99)');
    g.addColorStop(1, 'rgba(16,11,6,1)');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, pw, ph);

    // 夯层：每 22px 一道压痕，略带弧度
    for (let y = py + 22; y < py + ph; y += 22) {
      ctx.beginPath();
      for (let x = 0; x <= pw; x += 30) {
        const yy = y + Math.sin((px + x) * 0.02 + y * 0.7) * 1.7;
        if (x === 0) ctx.moveTo(px + x, yy); else ctx.lineTo(px + x, yy);
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.34)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.beginPath();
      for (let x = 0; x <= pw; x += 30) {
        const yy = y + 1.6 + Math.sin((px + x) * 0.02 + y * 0.7) * 1.7;
        if (x === 0) ctx.moveTo(px + x, yy); else ctx.lineTo(px + x, yy);
      }
      ctx.strokeStyle = 'rgba(232,202,154,0.10)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // 夯窝：一排半圆小坑（夯具砸出来的，是夯土最标志性的细节）
    for (let y = py + 33; y < py + ph - 6; y += 22) {
      for (let x = px + 16 + rn() * 10; x < px + pw; x += 44) {
        ctx.beginPath();
        ctx.arc(x, y, 4.6, 0.16, Math.PI - 0.16);
        ctx.strokeStyle = 'rgba(0,0,0,0.24)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y + 1.1, 4.6, 0.2, Math.PI - 0.2);
        ctx.strokeStyle = 'rgba(232,202,154,0.15)';
        ctx.stroke();
      }
    }
    // 铜渣 + 炭屑
    const n = Math.max(8, Math.round(pw / 38));
    for (let i = 0; i < n; i++) {
      const x = px + rn() * pw, y = py + 10 + rn() * (ph - 16), r = 1 + rn() * 2.1;
      ctx.fillStyle = rn() < 0.5 ? 'rgba(126,66,30,0.34)' : 'rgba(24,19,15,0.42)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
    // 云雷纹饰带（夯土台基边缘的青铜纹样）
    ctx.strokeStyle = 'rgba(208,178,114,0.20)';
    ctx.lineWidth = 1.4;
    for (let x = 10; x < pw - 26; x += 30) {
      ctx.beginPath();
      ctx.moveTo(px + x, py + 24);
      ctx.lineTo(px + x, py + 12);
      ctx.lineTo(px + x + 13, py + 12);
      ctx.lineTo(px + x + 13, py + 19);
      ctx.stroke();
    }
    // 顶面：被炉火烤过的一层暗红结面
    const cg = ctx.createLinearGradient(0, py, 0, py + 9);
    cg.addColorStop(0, 'rgba(168,72,30,0.30)');
    cg.addColorStop(1, 'rgba(90,36,14,0)');
    ctx.fillStyle = cg;
    ctx.fillRect(px, py, pw, 9);
    return;
  }

  if (th === 'ritual') {
    const g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, 'rgba(70,70,84,0.97)');
    g.addColorStop(0.45, 'rgba(40,40,50,0.99)');
    g.addColorStop(1, 'rgba(12,12,17,1)');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, pw, ph);

    // 条石缝：竖缝交错，横缝在 py+34 / py+72
    ctx.strokeStyle = 'rgba(0,0,0,0.42)';
    ctx.lineWidth = 1.5;
    for (let x = px + 40; x < px + pw; x += 96) {
      ctx.beginPath();
      ctx.moveTo(x, py + 6);
      ctx.lineTo(x, py + 34);
      ctx.stroke();
    }
    for (let x = px + 12; x < px + pw; x += 96) {
      ctx.beginPath();
      ctx.moveTo(x, py + 34);
      ctx.lineTo(x, py + 74);
      ctx.stroke();
    }
    for (const yy of [py + 34, py + 74]) {
      ctx.beginPath();
      ctx.moveTo(px, yy);
      ctx.lineTo(px + pw, yy);
      ctx.stroke();
    }
    // 石面高光（贴缝的亮边，石材厚度感）
    ctx.strokeStyle = 'rgba(196,200,220,0.10)';
    ctx.lineWidth = 1;
    for (const yy of [py + 35.5, py + 75.5]) {
      ctx.beginPath();
      ctx.moveTo(px, yy);
      ctx.lineTo(px + pw, yy);
      ctx.stroke();
    }
    // 云雷纹
    ctx.strokeStyle = 'rgba(208,178,114,0.22)';
    ctx.lineWidth = 1.4;
    for (let x = 10; x < pw - 26; x += 30) {
      ctx.beginPath();
      ctx.moveTo(px + x, py + 26);
      ctx.lineTo(px + x, py + 14);
      ctx.lineTo(px + x + 13, py + 14);
      ctx.lineTo(px + x + 13, py + 21);
      ctx.stroke();
    }
    // 朱砂沁色：祭坛石面被血与朱砂浸过的暗红斑块
    for (let i = 0; i < Math.max(3, Math.round(pw / 150)); i++) {
      const x = px + rn() * pw, y = py + 10 + rn() * 30;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, 26 + rn() * 26);
      rg.addColorStop(0, 'rgba(150,42,32,0.16)');
      rg.addColorStop(1, 'rgba(150,42,32,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(x - 54, y - 54, 108, 108);
    }
    return;
  }

  if (th === 'museum') {
    // 抛光深色石材：越往下越黑，像展厅地面延伸到暗处
    const g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, 'rgba(56,62,76,0.98)');
    g.addColorStop(0.3, 'rgba(32,36,45,1)');
    g.addColorStop(1, 'rgba(10,11,16,1)');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, pw, ph);

    // 长石板缝：竖向错缝（展厅地面用的是大块磨光板）
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.4;
    for (let x = px + 60; x < px + pw; x += 248) {
      ctx.beginPath();
      ctx.moveTo(x, py + 4);
      ctx.lineTo(x, py + ph);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    for (const yy of [py + 26, py + 68]) {
      ctx.beginPath();
      ctx.moveTo(px, yy);
      ctx.lineTo(px + pw, yy);
      ctx.stroke();
    }
    // 石面反光：顶部一条冷白灯带反射 + 一条更亮的贴边
    const rg = ctx.createLinearGradient(0, py, 0, py + 26);
    rg.addColorStop(0, 'rgba(190,214,240,0.16)');
    rg.addColorStop(1, 'rgba(190,214,240,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(px, py, pw, 26);
    ctx.fillStyle = 'rgba(226,236,252,0.34)';
    ctx.fillRect(px, py, pw, 1.4);
    return;
  }
}

function drawPlatforms() {
  const th = THEME[level.theme];
  for (let idx = 0; idx < level.plats.length; idx++) {
    const pl = level.plats[idx];
    const px = pl[0] - cam.x, py = pl[1], pw = pl[2], ph = pl[3];
    if (px + pw < -40 || px > W + 40) continue;

    const g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, th.plat[0]);
    g.addColorStop(0.18, th.plat[1]);
    g.addColorStop(1, '#08090b');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, pw, ph);

    // 顶面高光
    ctx.fillStyle = 'rgba(255,235,190,0.30)';
    ctx.fillRect(px, py, pw, 2);
    ctx.fillStyle = `rgba(${level.theme === 'dig' ? '255,240,200' : '150,220,190'},0.14)`;
    ctx.fillRect(px, py + 2, pw, 7);

    // 侧面纹理
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    for (let x = 14; x < pw; x += 46) {
      ctx.beginPath();
      ctx.moveTo(px + x, py + 10);
      ctx.lineTo(px + x + 6, py + Math.min(ph, 60));
      ctx.stroke();
    }

    // 主地面（厚平台）走主题专属剖面；小踏板沿用通用纹理
    if (ph > 60) {
      drawGroundSection(px, py, pw, ph, pl[0]);
    } else {
      // 土沁分层
      ctx.strokeStyle = 'rgba(0,0,0,0.20)';
      for (let y = py + 34; y < py + ph; y += 24) {
        ctx.beginPath();
        ctx.moveTo(px, y);
        ctx.lineTo(px + pw, y);
        ctx.stroke();
      }
      // 云雷纹饰带（其他主题主平台装饰）
      if (level.theme !== 'dig') {
        ctx.strokeStyle = 'rgba(208,178,114,0.20)';
        ctx.lineWidth = 1.4;
        for (let x = 10; x < pw - 26; x += 30) {
          ctx.beginPath();
          ctx.moveTo(px + x, py + 24);
          ctx.lineTo(px + x, py + 12);
          ctx.lineTo(px + x + 13, py + 12);
          ctx.lineTo(px + x + 13, py + 19);
          ctx.stroke();
        }
      }
    }

    // 第 4 关：给"踏面"小石板（非地面主平台）加上考古踏面标记
    if (level.theme === 'dig' && ph <= 40) {
      drawDigStepMarkers(px, py, pw, ph, pl[0], idx);
    }
    // 第 4 关：主平台（探方坑底/地表）加上现场考古符号
    if (level.theme === 'dig' && ph > 60) {
      drawDigGroundMarkers(px, py, pw, ph, pl[0], idx);
    }
  }
}

/* ================= 第 4 关 · 考古探方踏面标记 =================
   叙事：第 4 关的高空小石板 = 探方坑壁上被考古队削出来的"发掘踏面"。
   真实现场的核心符号：
     - 探方编号：T02 / T03 之类（考古探方编号 = T + 两位数字）
     - 白色测绘绳网：探方四角立竹桩，四角拉白绳，形成网格
     - 竹桩：不是粗木柱，而是细竹竿（黄色）
     - 洛阳铲 / 手铲：斜插在土面上的发掘工具
     - 地层分色：黄土层→褐土层→红土层→黑土层（每层颜色不同）
     - 陶片 / 青铜碎片：从土里露出小一角
   玩家站在踏面上跳，就是在探方前沿踏面上按层跳跃。 */
function drawDigStepMarkers(px, py, pw, ph, worldX, plIdx) {
  // ---------- ① 分层土剖面：黄土→褐土→红土→黑土（考古地层标准色） ----------
  const soilTop = py - 30;
  const layers = [
    { c: '#8a6a3a', h: 6 },   // 黄土层
    { c: '#5a3f24', h: 7 },   // 褐土层
    { c: '#7a4a28', h: 7 },   // 红土层
    { c: '#3a2818', h: 10 }   // 黑土层
  ];
  let ly = soilTop;
  for (const L of layers) {
    ctx.fillStyle = L.c;
    ctx.fillRect(px - 6, ly, pw + 12, L.h);
    // 层间暗缝
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px - 6, ly + L.h - 1, pw + 12, 1);
    ly += L.h;
  }
  // 土面锯齿边（最顶层的未铲平自然土面）
  ctx.fillStyle = '#8a6a3a';
  ctx.beginPath();
  ctx.moveTo(px - 6, soilTop);
  for (let x = px - 6; x <= px + pw + 6; x += 10) {
    const jag = ((x * 7919) % 5) - 2;
    ctx.lineTo(x, soilTop + jag);
  }
  ctx.lineTo(px + pw + 6, soilTop + 4);
  ctx.lineTo(px - 6, soilTop + 4);
  ctx.closePath();
  ctx.fill();
  // 土里的碎屑/石子
  for (let i = 0; i < 14; i++) {
    const sx = px + ((i * 37 + plIdx * 13) % (pw - 8));
    const sy = soilTop + 3 + ((i * 11) % (soilTop - py + 26));
    const col = (i + plIdx) % 3 === 0 ? 'rgba(220,180,120,0.6)'
              : (i + plIdx) % 3 === 1 ? 'rgba(60,40,20,0.7)'
              : 'rgba(140,100,60,0.5)';
    ctx.fillStyle = col;
    ctx.fillRect(sx, sy, 2, 2);
  }

  // ---------- ② 探方编号木牌 + 竹竿（挂在探方左端） ----------
  const poleX = px - 8;
  const poleTopY = soilTop - 26;
  const poleBotY = soilTop + 2;
  // 竹竿（黄色 + 竹节）
  const poleG = ctx.createLinearGradient(poleX, 0, poleX + 4, 0);
  poleG.addColorStop(0, '#a88850');
  poleG.addColorStop(0.5, '#d0ac70');
  poleG.addColorStop(1, '#8a6a38');
  ctx.fillStyle = poleG;
  ctx.fillRect(poleX, poleTopY, 4, poleBotY - poleTopY);
  // 竹节
  ctx.fillStyle = '#6b4e20';
  for (let ny = poleTopY + 6; ny < poleBotY - 2; ny += 6) {
    ctx.fillRect(poleX, ny, 4, 1);
  }
  // 探方编号木牌（黄色底 + 黑色编号 = 考古标准做法）
  const codes = ['T02', 'T03', 'T04', 'T05'];
  const code = codes[plIdx % codes.length];
  const lbW = 26, lbH = 16;
  const lbX = poleX - 3, lbY = poleTopY + 1;
  ctx.fillStyle = '#f0d896';
  ctx.fillRect(lbX, lbY, lbW, lbH);
  ctx.strokeStyle = '#3a2818';
  ctx.lineWidth = 1;
  ctx.strokeRect(lbX + 0.5, lbY + 0.5, lbW - 1, lbH - 1);
  ctx.fillStyle = '#1a0a00';
  ctx.font = 'bold 11px Consolas, monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText(code, lbX + 3, lbY + lbH / 2 + 1);

  // ---------- ③ 白色测绘绳网：探方四角拉白绳（横+竖） ----------
  // 横绳：沿踏面上沿延伸，形成"探方边界线"
  ctx.strokeStyle = 'rgba(255,250,220,0.85)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(px - 22, soilTop - 4);
  ctx.lineTo(px + pw + 22, soilTop - 4);
  ctx.stroke();
  // 竖绳：在踏面两端垂下一小段（暗示继续向下延伸进坑）
  ctx.strokeStyle = 'rgba(255,250,220,0.7)';
  ctx.beginPath();
  ctx.moveTo(px - 22, soilTop - 4);
  ctx.lineTo(px - 22, soilTop + 30);
  ctx.moveTo(px + pw + 22, soilTop - 4);
  ctx.lineTo(px + pw + 22, soilTop + 30);
  ctx.stroke();
  // 中间还有一根竖绳（把探方再分一格）
  ctx.beginPath();
  ctx.moveTo(px + pw / 2, soilTop - 4);
  ctx.lineTo(px + pw / 2, soilTop + 30);
  ctx.stroke();

  // ---------- ④ 右端竹桩（另一根，形成"探方四角立桩"的感觉） ----------
  const pole2X = px + pw + 4;
  ctx.fillStyle = '#d0ac70';
  ctx.fillRect(pole2X, poleTopY + 4, 4, poleBotY - poleTopY);
  ctx.fillStyle = '#6b4e20';
  for (let ny = poleTopY + 10; ny < poleBotY - 2; ny += 6) {
    ctx.fillRect(pole2X, ny, 4, 1);
  }

  // ---------- ⑤ 手铲（洛阳铲）：斜插在踏面右端土上 ----------
  const shX = px + pw - 12;
  const shY = soilTop + 2;
  ctx.save();
  ctx.translate(shX, shY);
  ctx.rotate(-0.35);
  // 木柄
  const hG = ctx.createLinearGradient(0, 0, 0, 18);
  hG.addColorStop(0, '#7a5830');
  hG.addColorStop(1, '#4a3018');
  ctx.fillStyle = hG;
  ctx.fillRect(-2, 0, 4, 18);
  // 铲头（梯形金属头）
  const bG = ctx.createLinearGradient(-8, 0, 8, 0);
  bG.addColorStop(0, '#4a4a52');
  bG.addColorStop(0.5, '#888890');
  bG.addColorStop(1, '#3a3a42');
  ctx.fillStyle = bG;
  ctx.beginPath();
  ctx.moveTo(-8, 18);
  ctx.lineTo(8, 18);
  ctx.lineTo(5, 26);
  ctx.lineTo(-5, 26);
  ctx.closePath();
  ctx.fill();
  // 铲头锈痕
  ctx.fillStyle = 'rgba(120,60,20,0.5)';
  ctx.fillRect(-6, 19, 12, 2);
  ctx.restore();

  // ---------- ⑥ 探方坑壁下的陶片 & 青铜碎片（露出小一角） ----------
  // 陶片（褐红色破片）
  ctx.fillStyle = '#a05a30';
  ctx.beginPath();
  ctx.moveTo(px + 12, py + 4);
  ctx.lineTo(px + 20, py + 2);
  ctx.lineTo(px + 22, py + 8);
  ctx.lineTo(px + 14, py + 9);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  // 青铜碎片（绿锈色）
  ctx.fillStyle = '#4a8a6a';
  ctx.beginPath();
    ctx.moveTo(px + pw - 24, py + 6);
    ctx.lineTo(px + pw - 16, py + 3);
    ctx.lineTo(px + pw - 14, py + 10);
    ctx.lineTo(px + pw - 22, py + 11);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.stroke();
}

/* ================= 第 4 关 · 探方坑底/地表现场符号 =================
   真实现场的关键细节：
   - 探方四角立竹桩 + 探方编号木牌（T01/T02/…）
   - 白色测绘绳网（1米/格的网格拉在白绳上）
   - 探方边缘堆积的翻出土（松散碎土）
   - 蹲着铲土的考古员剪影（拿手铲+草帽）
   - 竹编土筐（挖出土的临时容器）
   - 麻袋 + 记录本 + 皮尺
   - 探方坑底的网格线（1米×1米） */
function drawDigGroundMarkers(px, py, pw, ph, worldX, plIdx) {
  // 用世界坐标生成稳定的伪随机
  const seed = plIdx * 1013 + 7;
  const rr = (i, m) => ((Math.sin(seed * 17 + i * 31.7) * 10000) % m + m) % m;

  // ---------- ① 探方边缘：堆积的翻出土（松散碎土堆） ----------
  // 在探方上沿（py 位置）堆一堆翻出来的松土，模拟"探方边土堆"
  // 分两段，中间挖出缺口给考古员站位
  ctx.fillStyle = '#7a5836';
  ctx.beginPath();
  ctx.moveTo(px, py + 6);
  const bumps = 24;
  for (let i = 0; i <= bumps; i++) {
    const t = i / bumps;
    const bx = px + t * pw;
    // 土堆高度：中间略高，但在人物站位处压低
    let centerDip = Math.sin(t * Math.PI);
    // 为每个考古员站位位置压低土堆
    const workerCountPre = (pw > 400) ? 2 : 1;
    for (let wi = 0; wi < workerCountPre; wi++) {
      const wt = (160 + wi * (pw / (workerCountPre + 1))) / pw;
      const distToWorker = Math.abs(t - wt);
      if (distToWorker < 0.06) {
        centerDip *= (distToWorker / 0.06) * 0.4;
      }
    }
    const jag = Math.sin(t * 22 + plIdx) * 1.5 + Math.sin(t * 7 + plIdx * 2) * 2;
    const h = 6 + centerDip * 10 + jag;
    ctx.lineTo(bx, py - h);
  }
  ctx.lineTo(px + pw, py + 6);
  ctx.closePath();
  ctx.fill();
  // 土堆表面的颗粒
  for (let i = 0; i < 40; i++) {
    const t = i / 40;
    const bx = px + t * pw;
    let centerDip = Math.sin(t * Math.PI);
    const workerCountPre = (pw > 400) ? 2 : 1;
    for (let wi = 0; wi < workerCountPre; wi++) {
      const wt = (160 + wi * (pw / (workerCountPre + 1))) / pw;
      const distToWorker = Math.abs(t - wt);
      if (distToWorker < 0.06) centerDip *= (distToWorker / 0.06) * 0.4;
    }
    const h = 6 + centerDip * 10 + Math.sin(t * 22 + plIdx) * 1.5;
    ctx.fillStyle = (i % 3 === 0) ? 'rgba(200,150,90,0.55)'
                  : (i % 3 === 1) ? 'rgba(60,40,20,0.7)'
                  : 'rgba(140,100,60,0.6)';
    ctx.fillRect(bx, py - h + rr(i, 4), 2, 2);
  }

  // ---------- ② 探方坑底网格（1米×1米白绳网格） ----------
  // 横向白绳：3 根
  ctx.strokeStyle = 'rgba(255,250,220,0.42)';
  ctx.lineWidth = 1.2;
  for (let i = 1; i <= 3; i++) {
    const yy = py + 40 + i * 22;
    ctx.beginPath();
    ctx.moveTo(px + 8, yy);
    ctx.lineTo(px + pw - 8, yy);
    ctx.stroke();
  }
  // 纵向白绳：把探方分成 4 段
  ctx.strokeStyle = 'rgba(255,250,220,0.35)';
  ctx.lineWidth = 1.1;
  for (let i = 1; i < 4; i++) {
    const xx = px + i * (pw / 4);
    ctx.beginPath();
    ctx.moveTo(xx, py + 20);
    ctx.lineTo(xx, py + ph - 10);
    ctx.stroke();
  }
  // 网格交叉点：小小的绳结
  ctx.fillStyle = 'rgba(255,250,220,0.7)';
  for (let i = 1; i <= 3; i++) {
    for (let j = 1; j < 4; j++) {
      const gx = px + j * (pw / 4);
      const gy = py + 40 + i * 22;
      ctx.fillRect(gx - 1, gy - 1, 2, 2);
    }
  }

  // ---------- ③ 探方编号（沿探方边界挂的编号木牌） ----------
  // 每个主平台都编号，T01 T02 T03 T04
  const gridCode = ['T01', 'T02', 'T03', 'T04'][plIdx % 4];
  // 左端探方编号牌
  const lbX1 = px + 10, lbY1 = py + 30;
  ctx.fillStyle = '#f0d896';
  ctx.fillRect(lbX1, lbY1, 32, 16);
  ctx.strokeStyle = '#3a2818';
  ctx.lineWidth = 1;
  ctx.strokeRect(lbX1 + 0.5, lbY1 + 0.5, 31, 15);
  ctx.fillStyle = '#1a0a00';
  ctx.font = 'bold 11px Consolas, monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText(gridCode, lbX1 + 4, lbY1 + 9);
  // 挂绳
  ctx.strokeStyle = 'rgba(30,20,10,0.6)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(lbX1 + 16, py - 8);
  ctx.lineTo(lbX1 + 16, lbY1);
  ctx.stroke();

  // ---------- ④ 探方四角立竹桩 ----------
  const poleG = ctx.createLinearGradient(0, 0, 6, 0);
  poleG.addColorStop(0, '#a88850');
  poleG.addColorStop(0.5, '#d0ac70');
  poleG.addColorStop(1, '#7a5c30');
  // 左端 + 右端竹桩（探方边界标记）
  for (const poleOff of [4, pw - 10]) {
    const poleX = px + poleOff;
    const poleTopY = py - 32;
    ctx.fillStyle = poleG;
    ctx.fillRect(poleX, poleTopY, 6, 40);
    // 竹节
    ctx.fillStyle = '#5c4020';
    for (let ny = poleTopY + 6; ny < poleTopY + 40; ny += 8) {
      ctx.fillRect(poleX, ny, 6, 1);
    }
  }

  // ---------- ⑤ 蹲着的考古员剪影（放大 + 描边 + 高光，一眼能看清） ----------
  // 每段平台最多放 2 个
  const workerCount = (pw > 400) ? 2 : 1;
  for (let i = 0; i < workerCount; i++) {
    const wx = px + 160 + i * (pw / (workerCount + 1));
    const wy = py + 14;
    const hasTool = (plIdx + i) % 2 === 0; // 交替拿手铲/刷子
    const facingLeft = (plIdx + i) % 2 === 1; // 交替朝向

    ctx.save();
    // 人物光晕（暖色阳光打在背上，让人物从土色背景中跳出来）
    const halo = ctx.createRadialGradient(wx, wy - 22, 4, wx, wy - 22, 34);
    halo.addColorStop(0, 'rgba(255,230,170,0.35)');
    halo.addColorStop(1, 'rgba(255,230,170,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(wx, wy - 22, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 阴影（地面投影）
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(wx, wy + 8, 22, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    if (facingLeft) {
      ctx.translate(wx, 0);
      ctx.scale(-1, 1);
      ctx.translate(-wx, 0);
    }

    const bodyFill = '#1a1008';
    const bodyEdge = 'rgba(255,235,200,0.75)';
    const bodyEdgeW = 1.4;

    // 双腿（蹲姿，画在上身之前避免遮挡）
    ctx.fillStyle = '#0e0804';
    ctx.beginPath();
    // 左腿（大腿+膝盖+小腿，蹲姿）
    ctx.moveTo(wx - 10, wy - 8);
    ctx.lineTo(wx - 4, wy - 14);
    ctx.lineTo(wx + 4, wy - 12);
    ctx.lineTo(wx + 8, wy - 4);
    ctx.lineTo(wx + 12, wy);
    ctx.lineTo(wx - 14, wy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = bodyEdge;
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // 脚（靴子）
    ctx.fillStyle = '#0a0604';
    ctx.fillRect(wx - 14, wy - 2, 8, 4);
    ctx.fillRect(wx + 4, wy - 2, 8, 4);

    // 上身（蹲姿俯身，梯形）
    ctx.fillStyle = bodyFill;
    ctx.beginPath();
    ctx.moveTo(wx - 10, wy - 22);
    ctx.lineTo(wx + 12, wy - 24);   // 肩膀（前倾）
    ctx.lineTo(wx + 18, wy - 12);  // 手肘
    ctx.lineTo(wx + 14, wy - 6);   // 前伸的手
    ctx.lineTo(wx + 4, wy - 8);    // 腹前
    ctx.lineTo(wx - 4, wy - 8);
    ctx.lineTo(wx - 12, wy - 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = bodyEdge;
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // 后脑勺
    ctx.fillStyle = bodyFill;
    ctx.beginPath();
    ctx.arc(wx + 8, wy - 28, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = bodyEdge;
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // 草帽（大圆帽檐 + 高帽顶）
    ctx.fillStyle = '#d4b070';
    ctx.beginPath();
    ctx.ellipse(wx + 8, wy - 32, 16, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 帽顶（圆锥）
    ctx.fillStyle = '#e0c088';
    ctx.beginPath();
    ctx.moveTo(wx + 2, wy - 32);
    ctx.lineTo(wx + 14, wy - 32);
    ctx.lineTo(wx + 12, wy - 40);
    ctx.lineTo(wx + 4, wy - 40);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 帽顶高光
    ctx.fillStyle = 'rgba(255,240,200,0.6)';
    ctx.fillRect(wx + 6, wy - 40, 4, 1.5);
    // 帽带（红色醒目）
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(wx + 4, wy - 34, 8, 2);

    // 前伸的手臂 + 工具
    if (hasTool) {
      // 手铲：木柄 + 金属头（斜插在土里）
      ctx.save();
      ctx.translate(wx + 20, wy - 8);
      ctx.rotate(-0.55);
      // 手臂（从手肘伸出）
      ctx.fillStyle = bodyFill;
      ctx.fillRect(-1, -8, 3, 10);
      // 手铲柄
      ctx.fillStyle = '#6a4a24';
      ctx.fillRect(-1.5, 0, 3, 14);
      // 手铲头（梯形金属）
      ctx.fillStyle = '#8a8a92';
      ctx.beginPath();
      ctx.moveTo(-5, 14); ctx.lineTo(5, 14);
      ctx.lineTo(3.5, 20); ctx.lineTo(-3.5, 20);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#2a2a32';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      // 金属反光
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(-3, 15, 6, 1);
      ctx.restore();
    } else {
      // 毛刷：短柄 + 白色毛束
      ctx.save();
      ctx.translate(wx + 20, wy - 8);
      ctx.rotate(0.4);
      // 手臂
      ctx.fillStyle = bodyFill;
      ctx.fillRect(-1, -8, 3, 10);
      // 刷柄
      ctx.fillStyle = '#6a4a24';
      ctx.fillRect(-1.5, 0, 3, 10);
      // 毛束（浅色）
      ctx.fillStyle = '#f0e8d0';
      ctx.fillRect(-4, 10, 8, 4);
      // 毛束细丝
      ctx.fillStyle = '#c8b888';
      for (let b = -4; b <= 4; b += 2) {
        ctx.fillRect(b, 14, 0.8, 3);
      }
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- ⑥ 竹编土筐 ----------
  // 探方边土堆旁放竹筐（挖出土的临时容器）
  const basketX = px + pw - 90;
  const basketY = py + 24;
  // 筐体（梯形，竹条纹理）
  ctx.fillStyle = '#7a5830';
  ctx.beginPath();
  ctx.moveTo(basketX, basketY - 14);
  ctx.lineTo(basketX + 40, basketY - 14);
  ctx.lineTo(basketX + 34, basketY + 8);
  ctx.lineTo(basketX + 6, basketY + 8);
  ctx.closePath();
  ctx.fill();
  // 竹条竖纹
  ctx.strokeStyle = 'rgba(30,20,10,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const bx = basketX + 4 + i * 6.5;
    ctx.beginPath();
    ctx.moveTo(bx, basketY - 14);
    ctx.lineTo(bx + 1, basketY + 8);
    ctx.stroke();
  }
  // 竹条横纹
  for (let i = 0; i < 3; i++) {
    const by = basketY - 10 + i * 6;
    ctx.beginPath();
    ctx.moveTo(basketX + 2 + i, by);
    ctx.lineTo(basketX + 38 - i, by);
    ctx.stroke();
  }
  // 筐沿（竹条压边）
  ctx.fillStyle = '#5c3e1a';
  ctx.fillRect(basketX - 2, basketY - 16, 44, 3);
  // 筐里的土（松散黄土）
  ctx.fillStyle = '#9a7040';
  ctx.beginPath();
  ctx.moveTo(basketX + 2, basketY - 14);
  ctx.lineTo(basketX + 12, basketY - 18);
  ctx.lineTo(basketX + 20, basketY - 14);
  ctx.lineTo(basketX + 30, basketY - 20);
  ctx.lineTo(basketX + 38, basketY - 14);
  ctx.lineTo(basketX + 40, basketY - 14);
  ctx.lineTo(basketX, basketY - 14);
  ctx.closePath();
  ctx.fill();
  // 筐里的土颗粒
  ctx.fillStyle = 'rgba(60,40,20,0.6)';
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(basketX + 4 + i * 6, basketY - 15 - (i % 2) * 3, 1, 1);
  }

  // ---------- ⑦ 麻袋 ----------
  const sackX = px + 60;
  const sackY = py + 20;
  ctx.fillStyle = '#6a5030';
  ctx.beginPath();
  ctx.moveTo(sackX, sackY);
  ctx.lineTo(sackX + 26, sackY);
  ctx.lineTo(sackX + 22, sackY - 24);
  ctx.lineTo(sackX + 4, sackY - 24);
  ctx.closePath();
  ctx.fill();
  // 袋口
  ctx.fillStyle = '#4a3018';
  ctx.fillRect(sackX + 4, sackY - 26, 18, 4);
  // 麻袋纹理
  ctx.strokeStyle = 'rgba(30,20,10,0.4)';
  ctx.lineWidth = 0.8;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(sackX + 2, sackY - 4 - i * 5);
    ctx.lineTo(sackX + 24, sackY - 4 - i * 5);
    ctx.stroke();
  }

  // ---------- ⑧ 记录本 + 皮尺（散落在踏面/主平台边缘） ----------
  // 记录本（白色本 + 黑线）
  ctx.fillStyle = '#e8e0c8';
  ctx.fillRect(px + pw * 0.55, py + 12, 18, 12);
  ctx.strokeStyle = '#3a2818';
  ctx.lineWidth = 0.6;
  ctx.strokeRect(px + pw * 0.55, py + 12, 18, 12);
  ctx.strokeStyle = 'rgba(30,20,10,0.5)';
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(px + pw * 0.55 + 2, py + 14 + i * 2.5);
    ctx.lineTo(px + pw * 0.55 + 16, py + 14 + i * 2.5);
    ctx.stroke();
  }
  // 笔
  ctx.fillStyle = '#c8a030';
  ctx.fillRect(px + pw * 0.55 + 20, py + 15, 10, 2);
  ctx.fillStyle = '#2a1810';
  ctx.fillRect(px + pw * 0.55 + 28, py + 15, 2, 2);

  // ---------- ⑨ 探方边缘散落的小陶片 & 青铜碎片 ----------
  // 每段平台 2-3 个
  const fragCount = 3;
  for (let i = 0; i < fragCount; i++) {
    const fx = px + 40 + ((plIdx * 53 + i * 137) % (pw - 60));
    const fy = py + 40 + ((plIdx * 31 + i * 61) % (ph - 60));
    const type = (plIdx + i) % 3;
    if (type === 0) {
      // 陶片（褐红）
      ctx.fillStyle = '#a05a30';
      ctx.beginPath();
      ctx.moveTo(fx, fy); ctx.lineTo(fx + 8, fy - 2);
      ctx.lineTo(fx + 10, fy + 3); ctx.lineTo(fx + 3, fy + 5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    } else if (type === 1) {
      // 青铜碎片（绿锈）
      ctx.fillStyle = '#4a8a6a';
      ctx.beginPath();
      ctx.moveTo(fx, fy); ctx.lineTo(fx + 10, fy - 3);
      ctx.lineTo(fx + 12, fy + 2); ctx.lineTo(fx + 4, fy + 4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    } else {
      // 石子
      ctx.fillStyle = 'rgba(80,60,40,0.6)';
      ctx.beginPath();
      ctx.arc(fx, fy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- ⑩ 探方口边缘红绳警戒线 ----------
  // 探方边界沿坑壁顶沿拉一条红绳（警戒线）
  ctx.strokeStyle = 'rgba(180,60,50,0.55)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([8, 5]);
  ctx.beginPath();
  ctx.moveTo(px, py - 4);
  ctx.lineTo(px + pw, py - 4);
  ctx.stroke();
  ctx.setLineDash([]);
  // 木桩（沿探方边界，每 40px 一根）
  for (let i = 0; i < pw; i += 40) {
    const pX = px + i;
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(pX, py - 10, 4, 10);
    ctx.fillStyle = 'rgba(255,220,180,0.4)';
    ctx.fillRect(pX, py - 10, 4, 2);
  }
}

/* ================= 青铜锈 / 土沁 质感层 ================= */
const patinaCv = document.createElement('canvas');
patinaCv.width = 512; patinaCv.height = 288;
(function buildPatina() {
  const c = patinaCv.getContext('2d');
  let s = 20261024;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  // 斑驳锈块
  for (let i = 0; i < 2200; i++) {
    const x = rnd() * 512, y = rnd() * 288, r = 2 + rnd() * 12;
    const t = rnd();
    c.fillStyle = t < 0.42 ? `rgba(120,190,150,${0.03 + rnd() * 0.06})`
      : t < 0.72 ? `rgba(200,155,90,${0.02 + rnd() * 0.05})`
      : t < 0.9 ? `rgba(210,235,215,${0.015 + rnd() * 0.03})`
      : `rgba(12,22,18,${0.04 + rnd() * 0.07})`;
    c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
  }
  // 细坑蚀点
  for (let i = 0; i < 2600; i++) {
    c.fillStyle = `rgba(8,16,12,${0.05 + rnd() * 0.12})`;
    c.fillRect(rnd() * 512, rnd() * 288, 1.4, 1.4);
  }
})();

function drawPatina() {
  ctx.save();
  ctx.globalAlpha = 0.62;
  ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(patinaCv, 0, 0, W, H);
  ctx.restore();
}

/* 器物边框：把画面当作一件出土器物来装裱 */
function drawFrame() {
  ctx.save();
  ctx.strokeStyle = 'rgba(198,168,106,0.40)';
  ctx.lineWidth = 2;
  ctx.strokeRect(14, 14, W - 28, H - 28);
  ctx.strokeStyle = 'rgba(198,168,106,0.15)';
  ctx.lineWidth = 1;
  ctx.strokeRect(24, 24, W - 48, H - 48);
  // 四角云雷纹
  ctx.strokeStyle = 'rgba(214,184,118,0.52)';
  ctx.lineWidth = 2.5;
  const L = 30, o = 22;
  const corners = [[o, o, 1, 1], [W - o, o, -1, 1], [o, H - o, 1, -1], [W - o, H - o, -1, -1]];
  for (const c of corners) {
    const x = c[0], y = c[1], sx = c[2], sy = c[3];
    ctx.beginPath();
    ctx.moveTo(x + sx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * L);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + sx * L * 0.55, y + sy * 8);
    ctx.lineTo(x + sx * 8, y + sy * 8);
    ctx.lineTo(x + sx * 8, y + sy * L * 0.55);
    ctx.stroke();
  }
  ctx.restore();
}

/* 文物影像淡层：以叠加光的形式融入场景，而非贴图水印 */
function drawArtifactGhost(alpha, dh, wx) {
  if (!posterReady) return;
  const dw = dh * (CROP.sw / CROP.sh);
  const x = wx - cam.x * 0.22;
  if (x + dw < -80 || x - dw > W + 80) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.drawImage(poster, CROP.sx, CROP.sy, CROP.sw, CROP.sh, x - dw / 2, H * 0.54 - dh / 2, dw, dh);
  ctx.restore();
}

/* ================= 火焰 / 锈刺 造型 ================= */
// 把点列连成平滑闭合轮廓（避免锯齿）
function smoothClosed(pts) {
  const n = pts.length;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]);
  ctx.beginPath();
  ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) {
    const cur = pts[i], nxt = pts[(i + 1) % n];
    const m = mid(cur, nxt);
    ctx.quadraticCurveTo(cur[0], cur[1], m[0], m[1]);
  }
  ctx.closePath();
  ctx.fill();
}

// 生成火焰轮廓：左右两条带湍流的曲线 + 顶端参差火舌
function buildFlame(cx, gy, h, w, tips, ph, spd, turb) {
  const pts = [];
  const N = 6, CAP = 0.86;
  for (let i = 0; i <= N; i++) {           // 左缘自下而上
    const p = i / N * CAP;
    const halfW = w * 0.5 * Math.pow(1 - p, 0.72);
    const t = Math.sin(tGlobal * spd + ph + p * 5.0) * turb * w * 0.26 * (0.3 + p);
    pts.push([cx + t - halfW, gy - h * p]);
  }
  const topY = gy - h * CAP;
  for (let k = 0; k < tips; k++) {          // 顶端独立火舌
    const q = (k + 0.5) / tips;
    const x = cx + (q - 0.5) * w * 0.66;
    const tipH = h * (0.10 + 0.30 * (0.5 + 0.5 * Math.sin(tGlobal * spd * 1.45 + ph + k * 2.3)));
    const lean = Math.sin(tGlobal * spd * 1.15 + ph + k * 1.9) * w * 0.18;
    pts.push([x + lean, topY - tipH]);
    if (k < tips - 1) {
      const nx = cx + ((k + 1) / tips - 0.5) * w * 0.66;
      pts.push([(x + nx) / 2, topY + h * 0.09]);
    }
  }
  for (let i = N; i >= 0; i--) {            // 右缘自上而下
    const p = i / N * CAP;
    const halfW = w * 0.5 * Math.pow(1 - p, 0.72);
    const t = Math.sin(tGlobal * spd * 1.23 + ph + 2.1 + p * 4.6) * turb * w * 0.26 * (0.3 + p);
    pts.push([cx + t + halfW, gy - h * p]);
  }
  return pts;
}

// 四层叠加的焰体：暗红轮廓 → 橙 → 金黄 → 白核
function drawFlame(cx, gy, hgt, w) {
  const layers = [
    { sw: 1.00, ww: 1.00, ph: 0.0, spd: 5.2, tips: 3, turb: 1.0, f: 'rgba(148,30,10,0.42)' },
    { sw: 0.78, ww: 0.80, ph: 1.9, spd: 7.1, tips: 4, turb: 0.85, f: 'rgba(255,110,30,0.55)' },
    { sw: 0.53, ww: 0.56, ph: 3.6, spd: 9.4, tips: 4, turb: 0.65, f: 'rgba(255,182,72,0.60)' },
    { sw: 0.29, ww: 0.32, ph: 5.2, spd: 12.3, tips: 3, turb: 0.45, f: 'rgba(255,246,206,0.72)' }
  ];
  for (let i = 0; i < layers.length; i++) {
    const L = layers[i];
    ctx.globalCompositeOperation = i === 0 ? 'source-over' : 'lighter';
    ctx.fillStyle = L.f;
    smoothClosed(buildFlame(cx, gy, hgt * L.sw, w * L.ww, L.tips, L.ph, L.spd, L.turb));
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ================= 危险物绘制 ================= */
function drawHazards() {
  for (const h of haz) {
    if (h.t === 'laser') {
      const cx = (h.cur === undefined ? h.x0 : h.cur) - cam.x;
      const ceilY = h.y - 60;   // 灯头所在天花板面
      const lensY = ceilY + 18; // 灯头底部（光束从这里射出）
      const groundY = h.y + h.hgt;
      const beamH = groundY - lensY;
      const halfTop = 10, halfBot = 32; // 灯口窄 → 地面宽

      // ---------- 天花板轨道 ----------
      ctx.fillStyle = 'rgba(8,6,4,0.6)';
      ctx.fillRect(cx - 74, ceilY - 6, 148, 6);
      ctx.fillStyle = 'rgba(30,22,14,0.9)';
      ctx.fillRect(cx - 70, ceilY - 2, 140, 2);

      // ---------- 灯体：导轨卡扣 → 灯筒 → 灯头 ----------
      // 卡扣
      ctx.fillStyle = '#2a2418';
      ctx.fillRect(cx - 3, ceilY - 4, 6, 6);
      // 短颈
      ctx.fillStyle = '#3a3226';
      ctx.fillRect(cx - 2, ceilY + 2, 4, 6);
      // 灯筒（深色金属圆柱，从侧视角是矩形）
      const bodyG = ctx.createLinearGradient(cx - 16, 0, cx + 16, 0);
      bodyG.addColorStop(0, '#0f0b08');
      bodyG.addColorStop(0.35, '#4a3d2c');
      bodyG.addColorStop(0.55, '#6a5942');
      bodyG.addColorStop(1, '#140f0a');
      ctx.fillStyle = bodyG;
      ctx.fillRect(cx - 16, ceilY + 8, 32, 18);
      // 灯筒下缘
      ctx.fillStyle = '#1a140d';
      ctx.fillRect(cx - 18, ceilY + 25, 36, 3);
      // 灯头（发光的玻璃透镜）
      const lensG = ctx.createRadialGradient(cx, ceilY + 27, 1, cx, ceilY + 27, 14);
      lensG.addColorStop(0, 'rgba(255,252,220,1)');
      lensG.addColorStop(0.45, 'rgba(255,232,160,0.9)');
      lensG.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = lensG;
      ctx.beginPath();
      ctx.ellipse(cx, ceilY + 27, 13, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,240,0.95)';
      ctx.beginPath();
      ctx.ellipse(cx, ceilY + 26.5, 5, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ---------- 体积光锥（灯口 → 地面，上窄下宽） ----------
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // 外层柔光
      const coneG1 = ctx.createLinearGradient(0, lensY, 0, groundY);
      coneG1.addColorStop(0, 'rgba(255,240,180,0.65)');
      coneG1.addColorStop(0.5, 'rgba(255,220,140,0.28)');
      coneG1.addColorStop(1, 'rgba(255,200,100,0.08)');
      ctx.fillStyle = coneG1;
      ctx.beginPath();
      ctx.moveTo(cx - halfTop, lensY);
      ctx.lineTo(cx + halfTop, lensY);
      ctx.lineTo(cx + halfBot, groundY);
      ctx.lineTo(cx - halfBot, groundY);
      ctx.closePath();
      ctx.fill();
      // 中间层核心亮
      const coneG2 = ctx.createLinearGradient(0, lensY, 0, groundY);
      coneG2.addColorStop(0, 'rgba(255,252,220,0.9)');
      coneG2.addColorStop(0.5, 'rgba(255,236,170,0.5)');
      coneG2.addColorStop(1, 'rgba(255,220,140,0.18)');
      ctx.fillStyle = coneG2;
      ctx.beginPath();
      ctx.moveTo(cx - 4, lensY);
      ctx.lineTo(cx + 4, lensY);
      ctx.lineTo(cx + 10, groundY);
      ctx.lineTo(cx - 10, groundY);
      ctx.closePath();
      ctx.fill();
      // 光束内空气尘埃（3 层视差漂浮）
      for (let k = 0; k < 14; k++) {
        const tt = ((tGlobal * 0.35 + k * 0.19) % 1 + 1) % 1;
        const y = lensY + tt * beamH;
        const halfHere = halfTop + (halfBot - halfTop) * tt;
        const dx = Math.sin(k * 2.31 + tGlobal * 0.9) * halfHere * 0.75;
        const alpha = (1 - Math.abs(tt - 0.5) * 2) * 0.6;
        ctx.fillStyle = `rgba(255,240,190,${alpha})`;
        ctx.beginPath();
        ctx.arc(cx + dx, y, 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // ---------- 地面光池 ----------
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const poolG = ctx.createRadialGradient(cx, groundY, 4, cx, groundY, 68);
      poolG.addColorStop(0, 'rgba(255,244,200,0.6)');
      poolG.addColorStop(0.5, 'rgba(255,210,130,0.22)');
      poolG.addColorStop(1, 'rgba(255,180,80,0)');
      ctx.fillStyle = poolG;
      ctx.beginPath();
      ctx.ellipse(cx, groundY, 70, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      continue;
    }

    if (h.t === 'rock') {
      const phase = h.phase || 'idle';
      const phaseP = h.phaseP || 0;
      const cyWorld = h.cx === undefined ? h.yTop : h.cx;
      const cx = h.x - cam.x, cy = cyWorld;

      // ---------- 撞击后坑痕（持续几秒才渐隐） ----------
      if (h.pit) {
        const pitA = h.pit.life > 3.0 ? 0.42 : (h.pit.life / 3.0) * 0.42;
        const pxA = h.pit.x - cam.x;
        // 外圈浅凹（暗色）
        ctx.fillStyle = `rgba(20,14,8,${pitA})`;
        ctx.beginPath();
        ctx.ellipse(pxA, h.gy - 2, h.size * 0.55, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        // 内圈更暗
        ctx.fillStyle = `rgba(10,6,4,${pitA * 1.1})`;
        ctx.beginPath();
        ctx.ellipse(pxA, h.gy - 3, h.size * 0.32, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---------- 扬尘（撞击瞬间散开） ----------
      if (h.dust) {
        for (const d of h.dust) {
          const a = Math.max(0, 1 - d.t / d.life) * 0.6;
          ctx.fillStyle = `rgba(200,170,120,${a})`;
          ctx.beginPath();
          ctx.arc(d.x - cam.x, d.y, d.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ---------- 碎片（撞击后飞出的小土块 & 主残块） ----------
      if (h.shards) {
        for (const sd of h.shards) {
          const a = Math.max(0, 1 - sd.t / sd.life);
          ctx.save();
          ctx.translate(sd.x - cam.x, sd.y);
          ctx.rotate(sd.rot);
          ctx.globalAlpha = a;
          if (sd.main && sd.shape) {
            // 主残块：用原始 rock 的随机形状（等比缩小）
            const ss = sd.s / 2;
            ctx.fillStyle = '#6b5638';
            ctx.beginPath();
            for (let i = 0; i < sd.shape.length; i++) {
              const p = sd.shape[i];
              if (i === 0) ctx.moveTo(p.x * ss, p.y * ss); else ctx.lineTo(p.x * ss, p.y * ss);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(20,14,8,0.7)';
            ctx.lineWidth = 1.6;
            ctx.stroke();
            // 裂纹
            ctx.strokeStyle = 'rgba(20,14,8,0.6)';
            ctx.lineWidth = 0.9;
            for (const cr of (sd.cracks || [])) {
              ctx.beginPath();
              ctx.moveTo(cr.x0 * ss, cr.y0 * ss);
              ctx.lineTo(cr.x1 * ss, cr.y1 * ss);
              ctx.stroke();
            }
          } else {
            // 小碎片：不规则方形
            const sz = sd.s;
            ctx.fillStyle = '#6b5638';
            ctx.beginPath();
            ctx.moveTo(-sz * 0.5, -sz * 0.4);
            ctx.lineTo( sz * 0.45, -sz * 0.5);
            ctx.lineTo( sz * 0.55,  sz * 0.35);
            ctx.lineTo(-sz * 0.35,  sz * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(20,14,8,0.7)';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      // ---------- precursor：暖土色地面暗影（去游戏 UI 橙红圈） + 边缘碎屑先兆 ----------
      if (phase === 'precursor') {
        const f = phaseP; // 0→1
        // 地面暗影（暖土色，随 phaseP 加深）
        const grdA = 0.18 + f * 0.32;
        const grd = ctx.createRadialGradient(cx, h.gy - 3, 2, cx, h.gy - 3, h.size * 0.7);
        grd.addColorStop(0, `rgba(140,100,58,${grdA})`);
        grd.addColorStop(1, 'rgba(140,100,58,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, h.gy - 3, h.size * 0.7, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // 边缘小碎屑先兆（从土块边缘偶尔掉落一粒）
        const n = 3;
        for (let i = 0; i < n; i++) {
          const seed = (i + 1) * 13 + (h.x | 0);
          const side = (i % 2 === 0) ? -1 : 1;
          const tLocal = ((tGlobal * 1.2 + i * 0.37 + seed * 0.01) % 1);
          if (tLocal > 0.15 && tLocal < 0.9) {
            const px = cx + side * h.size * 0.42 + Math.sin(i * 2.1) * 4;
            const py = cy + h.size * 0.35 + tLocal * 14;
            ctx.fillStyle = `rgba(160,120,80,${(1 - tLocal) * 0.7})`;
            ctx.fillRect(px, py, 2, 2);
          }
        }
      }

      // ---------- shaking：颤动加剧+下沉 + 地面阴影加强 ----------
      if (phase === 'shaking') {
        const f = phaseP;
        const grdA = 0.32 + f * 0.32;
        const grd = ctx.createRadialGradient(cx, h.gy - 3, 2, cx, h.gy - 3, h.size * 0.7);
        grd.addColorStop(0, `rgba(140,100,58,${grdA})`);
        grd.addColorStop(1, 'rgba(140,100,58,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, h.gy - 3, h.size * 0.7, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---------- 土块本体（撞击阶段已经碎成 shards，不画主体） ----------
      if (phase !== 'impact') {
        ctx.save();
        let shakeX = 0, shakeY = 0;
        if (phase === 'shaking') {
          const amp = 1.5 + phaseP * 3.5;
          shakeX = Math.sin(tGlobal * 38 + h.shakePhase) * amp;
          shakeY = Math.sin(tGlobal * 46 + h.shakePhase + 0.7) * (amp * 0.7);
        } else if (phase === 'falling') {
          // 下落时轻微前后抖动（旋转感）
          shakeX = Math.sin(tGlobal * 20) * 1.2;
        }
        ctx.translate(cx + shakeX, cy + shakeY);
        if (h.rot) ctx.rotate(h.rot);

        // 土色脉冲光晕（预警时呼吸）
        if (phase === 'precursor' || phase === 'shaking') {
          const pulse = 0.5 + 0.5 * Math.sin(tGlobal * 6);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const glowR = h.size * 1.2 + pulse * 8;
          const glowG = ctx.createRadialGradient(0, 0, h.size * 0.4, 0, 0, glowR);
          glowG.addColorStop(0, `rgba(180,140,80,${0.16 + pulse * 0.12})`);
          glowG.addColorStop(1, 'rgba(180,140,80,0)');
          ctx.fillStyle = glowG;
          ctx.beginPath();
          ctx.arc(0, 0, glowR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 下落中的运动模糊（在土块本体之前，位于上方）
        if (phase === 'falling' && h.vy > 200) {
          ctx.globalAlpha = 0.32;
          ctx.fillStyle = '#8a6a44';
          const blurLen = Math.min(60, h.vy * 0.06);
          ctx.beginPath();
          ctx.ellipse(0, -blurLen * 0.4, h.size * 0.36, blurLen * 0.45, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        // 构建主体多边形路径
        const s = h.size / 2;
        const bodyPath = () => {
          ctx.beginPath();
          for (let i = 0; i < h.shape.length; i++) {
            const p = h.shape[i];
            const px = p.x * s, py = p.y * s;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
        };

        // ---------- 主体填充 ----------
        bodyPath();
        ctx.fillStyle = (phase === 'falling') ? '#6b5638' : 'rgba(70,56,38,0.95)';
        ctx.fill();

        // ---------- 内部装饰：clip 到主体多边形内，避免溢出随机轮廓 ----------
        ctx.save();
        bodyPath();
        ctx.clip();

        // 内部层理（3 条深色横向线）
        ctx.strokeStyle = 'rgba(30,20,10,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-s * 1.2, -s * 0.35);
        ctx.lineTo( s * 1.2, -s * 0.30);
        ctx.moveTo(-s * 1.2, -s * 0.05);
        ctx.lineTo( s * 1.2,  s * 0.04);
        ctx.moveTo(-s * 1.2,  s * 0.35);
        ctx.lineTo( s * 1.2,  s * 0.44);
        ctx.stroke();

        // 主裂纹（来自 h.cracks）
        ctx.strokeStyle = 'rgba(16,10,6,0.78)';
        ctx.lineWidth = 1.3;
        for (const cr of h.cracks) {
          ctx.beginPath();
          ctx.moveTo(cr.x0 * s, cr.y0 * s);
          ctx.lineTo(cr.x1 * s, cr.y1 * s);
          ctx.stroke();
        }

        // 表面碎屑点
        ctx.fillStyle = 'rgba(30,20,10,0.55)';
        for (const ch of h.chips) {
          ctx.beginPath();
          ctx.arc(ch.x * s, ch.y * s, ch.s, 0, Math.PI * 2);
          ctx.fill();
        }

        // 顶面高光（浅色顶部渐变）
        const topG = ctx.createLinearGradient(0, -s * 1.1, 0, -s * 0.4);
        topG.addColorStop(0, 'rgba(180,140,88,0.35)');
        topG.addColorStop(1, 'rgba(180,140,88,0)');
        ctx.fillStyle = topG;
        ctx.fillRect(-s * 1.2, -s * 1.1, s * 2.4, s * 0.7);

        // 底面阴影（深色底部渐变）
        const botG = ctx.createLinearGradient(0, s * 0.2, 0, s * 1.1);
        botG.addColorStop(0, 'rgba(20,14,8,0)');
        botG.addColorStop(1, 'rgba(20,14,8,0.55)');
        ctx.fillStyle = botG;
        ctx.fillRect(-s * 1.2, s * 0.2, s * 2.4, s * 0.9);

        ctx.restore();

        // 主体描边：竖向渐变——上缘被天光打亮、下缘沉进暗部。
        // 之前用单色黑边，土块会被读成"一张深色纸片"。
        bodyPath();
        const rimG = ctx.createLinearGradient(0, -s * 1.15, 0, s * 1.15);
        rimG.addColorStop(0, 'rgba(238,210,164,0.60)');
        rimG.addColorStop(0.42, 'rgba(126,96,60,0.52)');
        rimG.addColorStop(1, 'rgba(16,10,6,0.80)');
        ctx.strokeStyle = rimG;
        ctx.lineWidth = 2.1;
        ctx.stroke();

        // 从底面飘出的碎土粒（预警时更密）
        if (phase === 'precursor' || phase === 'shaking' || phase === 'falling') {
          const nParticles = phase === 'falling' ? 5 : (phase === 'shaking' ? 7 : 4);
          for (let i = 0; i < nParticles; i++) {
            const px0 = Math.sin(i * 2.7 + h.shakePhase) * h.size * 0.32;
            const py0 = s * 0.9;
            const tPhase = ((tGlobal * (0.6 + (i % 3) * 0.25) + i * 0.13) % 1);
            const px = px0 + Math.sin(i * 3.1 + tGlobal * 3) * 4;
            const py = py0 + tPhase * 22;
            const alpha = (1 - tPhase) * 0.7;
            const sz = 1.5 + (i % 3) * 0.6;
            ctx.fillStyle = `rgba(180,140,88,${alpha})`;
            ctx.fillRect(px, py, sz, sz);
          }
        }

        ctx.restore();
      }
      continue;
    }

    // fire / rust：地面喷口/锈刺
    const cx = h.x - cam.x;
    if (cx < -160 || cx > W + 160) continue;
    const gy = h.gy;
    const isFire = h.t === 'fire';

    // 底座：火口是铜喷口，锈池是地面被顶开的一道裂缝
    if (isFire) {
      ctx.fillStyle = '#241610';
      ctx.beginPath();
      ctx.moveTo(cx - h.w * 0.7, gy);
      ctx.lineTo(cx - h.w * 0.42, gy - 16);
      ctx.lineTo(cx + h.w * 0.42, gy - 16);
      ctx.lineTo(cx + h.w * 0.7, gy);
      ctx.closePath();
      ctx.fill();
    } else {
      // 锈池底座：地缝 + 浸透的土 + 一堆被顶翻的土块。
      // 这一段**每帧都画**（不随 cur 消失）——它是障碍物的"地标"，
      // 玩家要先看见地上有这么个口子，才会预期它会长出东西。
      const ph0 = h.ph || 0;

      // ① 地表析出的白霜圈：这口缝喷发过很多次了
      ctx.save();
      ctx.translate(cx, gy + 1);
      ctx.scale(1, 0.30);
      for (let i = 0; i < 2; i++) {
        const rr = h.w * (0.99 + i * 0.20);
        const a0 = _hash1(i * 3.7 + ph0 * 1.9) * 6.2832;
        ctx.beginPath();
        ctx.arc(0, 0, rr, a0, a0 + 2.0 + _hash1(i * 5.1 + ph0) * 1.9);
        ctx.strokeStyle = `rgba(154,192,162,${(0.15 - i * 0.05).toFixed(3)})`;
        ctx.lineWidth = 2.2 - i * 0.5;
        ctx.stroke();
      }
      ctx.restore();

      // ② 浸透的湿土：中心比周围**更暗**（不是发光的台子）
      ctx.save();
      ctx.translate(cx, gy + 1);
      ctx.scale(1, 0.30);
      const soak = ctx.createRadialGradient(0, 0, 0, 0, 0, h.w * 1.85);
      soak.addColorStop(0, 'rgba(10,24,19,0.60)');
      soak.addColorStop(0.55, 'rgba(18,32,25,0.28)');
      soak.addColorStop(1, 'rgba(20,30,23,0)');
      ctx.fillStyle = soak;
      ctx.beginPath();
      ctx.arc(0, 0, h.w * 1.85, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ③ 铜绿洇进夯土
      ctx.save();
      ctx.translate(cx, gy + 1);
      ctx.scale(1, 0.30);
      const stain = ctx.createRadialGradient(0, 0, 0, 0, 0, h.w * 1.5);
      stain.addColorStop(0, 'rgba(44,92,70,0.50)');
      stain.addColorStop(0.5, 'rgba(34,72,55,0.22)');
      stain.addColorStop(1, 'rgba(30,62,48,0)');
      ctx.fillStyle = stain;
      ctx.beginPath();
      ctx.arc(0, 0, h.w * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ④ 锈疤：地面上常驻的一坨铜锈结壳。
      //    为什么不做"地缝"：侧视图里看不见地面顶面，任何往下的开口都会被读成
      //    地面上一个浅碟/贴片；而一个**有体积的疙瘩**是明确的，还能当障碍物地标。
      const scarH = 13 + (h.ph ? 0 : 0);
      // 主体：三段圆弧叠出的不规则土丘（左右不对称）
      ctx.beginPath();
      ctx.moveTo(cx - h.w * 0.86, gy + 2);
      ctx.bezierCurveTo(cx - h.w * 0.72, gy - scarH * 1.10, cx - h.w * 0.30, gy - scarH * 1.28, cx - h.w * 0.04, gy - scarH * 1.02);
      ctx.bezierCurveTo(cx + h.w * 0.26, gy - scarH * 1.34, cx + h.w * 0.66, gy - scarH * 1.06, cx + h.w * 0.88, gy + 2);
      ctx.closePath();
      const scg = ctx.createLinearGradient(0, gy - scarH * 1.3, 0, gy + 2);
      scg.addColorStop(0, 'rgba(62,92,74,1)');
      scg.addColorStop(0.55, 'rgba(36,58,45,1)');
      scg.addColorStop(1, 'rgba(16,26,21,1)');
      ctx.fillStyle = scg;
      ctx.fill();

      // 结壳的圆瘤：一坨坨鼓起来的矿壳，这是"锈疤"区别于"土堆"的关键
      for (let i = 0; i < 15; i++) {
        const a = _hash1(i * 3.7 + ph0);
        const bx = cx + (a - 0.5) * h.w * 1.62;
        const rel = 1 - Math.abs(bx - cx) / (h.w * 0.9);
        const by = gy - scarH * (0.20 + rel * 0.72) - _hash1(i * 5.1) * 2.4;
        const nr = 1.9 + _hash1(i * 7.9 + ph0) * 2.6;
        ctx.beginPath();
        ctx.ellipse(bx, by, nr, nr * 0.78, a * 2 - 1, 0, Math.PI * 2);
        ctx.fillStyle = i % 3 === 0 ? 'rgba(36,58,46,0.95)' : 'rgba(46,72,57,0.95)';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx - nr * 0.24, by - nr * 0.30, nr * 0.55, nr * 0.34, a * 2 - 1, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(126,168,140,0.18)';
        ctx.fill();
      }

      // 顶上的析出白霜：粉状的浅绿，一小片一小片
      for (let i = 0; i < 6; i++) {
        const a = _hash1(i * 2.9 + ph0 * 4.1);
        const bx = cx + (a - 0.5) * h.w * 1.30;
        const by = gy - scarH * (0.62 + _hash1(i * 6.3) * 0.44);
        ctx.beginPath();
        ctx.ellipse(bx, by, 3.4 + _hash1(i * 8.1) * 4.2, 1.5 + _hash1(i * 4.3) * 1.4, a * 2 - 1, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(170,202,176,0.14)';
        ctx.fill();
      }

      // 中央的裂口：矿刺就是从这里顶出来的（细、暗、锯齿状）
      ctx.beginPath();
      ctx.moveTo(cx - h.w * 0.30, gy - scarH * 0.92);
      ctx.lineTo(cx - h.w * 0.14, gy - scarH * 1.06);
      ctx.lineTo(cx - h.w * 0.02, gy - scarH * 0.88);
      ctx.lineTo(cx + h.w * 0.12, gy - scarH * 1.12);
      ctx.lineTo(cx + h.w * 0.26, gy - scarH * 0.90);
      ctx.strokeStyle = 'rgba(6,10,8,0.9)';
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - h.w * 0.30, gy - scarH * 0.92);
      ctx.lineTo(cx - h.w * 0.14, gy - scarH * 1.04);
      ctx.lineTo(cx - h.w * 0.02, gy - scarH * 0.86);
      ctx.lineTo(cx + h.w * 0.12, gy - scarH * 1.10);
      ctx.lineTo(cx + h.w * 0.26, gy - scarH * 0.88);
      ctx.strokeStyle = 'rgba(112,170,142,0.14)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // ⑤ 锈疤外侧翻出来的碎土块与碎矿渣
      for (let i = 0; i < 9; i++) {
        const sgn = i % 2 ? 1 : -1;
        const bx = cx + sgn * h.w * (0.86 + _hash1(i * 7.9 + ph0) * 0.42);
        const by = gy + 1 - _hash1(i * 2.1) * 1.6;
        const r = 2.2 + _hash1(i * 5.3 + ph0) * 3.0;
        ctx.beginPath();
        ctx.moveTo(bx - r, by + r * 0.10);
        ctx.lineTo(bx - r * 0.46, by - r * 0.98);
        ctx.lineTo(bx + r * 0.32, by - r * 0.74);
        ctx.lineTo(bx + r, by + r * 0.16);
        ctx.lineTo(bx + r * 0.18, by + r * 0.58);
        ctx.closePath();
        ctx.fillStyle = i % 3 === 0 ? 'rgba(30,48,38,0.95)' : 'rgba(46,34,21,0.95)';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bx - r * 0.46, by - r * 0.98);
        ctx.lineTo(bx + r * 0.32, by - r * 0.74);
        ctx.strokeStyle = 'rgba(148,178,140,0.34)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // ⑥ 向外放射的细裂纹（告诉玩家这底下是空的）
      ctx.strokeStyle = 'rgba(26,20,13,0.68)';
      ctx.lineWidth = 1.5;
      eachSide(d => {
        for (let k = 0; k < 2; k++) {
          const x0 = cx + d * h.w * (1.02 + k * 0.06);
          const y0 = gy + k * 3 - 1;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(cx + d * h.w * (1.32 + k * 0.12), y0 + (k ? 3 : -2));
          ctx.lineTo(cx + d * h.w * (1.55 + k * 0.16), y0 + (k ? 5 : -4));
          ctx.stroke();
        }
      });
    }

    if (h.cur > 8) {
      const top = gy - h.cur;
      ctx.save();
      if (isFire) {
        const pool = 0.55 + 0.45 * Math.sin(tGlobal * 7.1 + (h.ph || 0));
        // 地面光池：随焰高脉动
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(cx, gy);
        ctx.scale(1, 0.30);
        const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, h.w * 5.2);
        pg.addColorStop(0, `rgba(255,138,48,${0.30 * pool})`);
        pg.addColorStop(0.45, `rgba(255,108,28,${0.13 * pool})`);
        pg.addColorStop(1, 'rgba(255,100,30,0)');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(0, 0, h.w * 5.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 多层焰体
        drawFlame(cx, gy, h.cur, h.w * 1.08);
        // 亮核 + 余烬
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        radialGlow(cx, gy - 6, h.w * 1.4, `rgba(255,226,160,${0.26 * pool})`);
        for (let i = 0; i < 24; i++) {
          const sp = 0.45 + (i % 5) * 0.19;
          const p = ((tGlobal * sp + i * 0.137) % 1);
          const ex = cx + Math.sin(i * 2.7 + tGlobal * 2.2) * h.w * (0.45 + p * 1.25);
          const ey = gy - h.cur * p * 1.12 - 6;
          ctx.fillStyle = `rgba(255,${165 + (i % 5) * 16},92,${(1 - p) * 0.8})`;
          const s = 2.8 - p * 1.5;
          ctx.fillRect(ex, ey, s, s);
        }
        ctx.restore();
      } else {
      // 锈池：地缝里被顶出来的铜锈，在地表凝成一丛矿刺。
      // 三轮试错的结论——"会涨落的液柱"在这个画风里怎么做都像果冻/玻璃管：
      // 半透明 → 果冻；不透明 → 塑料；加气泡 → 汽水。
      // 矿刺是实心的，有棱面、有碎边，天然不存在"像不像液体"这个问题。
      // 底座（地缝/湿土/翻土块）由上面的 else 分支每帧画，这里只管长出来的部分。
      const halfW = h.w * 0.90;
      const ph0 = h.ph || 0;
      // 高度用 curVis：亮灭结束时有 0.18s 收回，不是"啪"一下消失
      const lvl = Math.max(h.cur, h.curVis || 0);
      const grow = Math.min(1, lvl / h.hgt);
      const rustPat = getRustPattern();

        // 缝口渗出的铜绿：从缝里往外洇的一小片，交代"矿刺是从这里长出来的"
        ctx.save();
        ctx.translate(cx, gy + 2);
        ctx.scale(1, 0.34);
        const seep = ctx.createRadialGradient(0, 0, 0, 0, 0, halfW * 1.15);
        seep.addColorStop(0, `rgba(56,112,88,${(0.10 + grow * 0.14).toFixed(3)})`);
        seep.addColorStop(1, 'rgba(36,78,62,0)');
        ctx.fillStyle = seep;
        ctx.beginPath();
        ctx.arc(0, 0, halfW * 1.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (lvl > 6) {
          // ④ 矿刺布局：中间高、两侧矮，左右不对称（对称 = 一眼假）
          const spikes = [
            { x: -0.02, h: 0.98, w: 0.30, tx: -0.05, ph: 0.0 },
            { x: -0.30, h: 0.62, w: 0.22, tx: -0.12, ph: 1.7 },
            { x:  0.27, h: 0.71, w: 0.22, tx:  0.11, ph: 2.9 },
            { x: -0.52, h: 0.38, w: 0.17, tx: -0.20, ph: 4.3 },
            { x:  0.50, h: 0.34, w: 0.16, tx:  0.22, ph: 5.6 },
            { x:  0.10, h: 0.50, w: 0.15, tx:  0.16, ph: 3.4 },
          ];

          // 每根矿刺的路径（留一份顶点，用于裁剪和描边）
          const paths = [];
          for (const sp of spikes) {
            const bx = cx + halfW * sp.x;
            const bw = halfW * sp.w * (0.55 + 0.45 * grow);
            const th = lvl * sp.h;
            const tipX = cx + halfW * (sp.x + sp.tx) + Math.sin(tGlobal * 1.4 + sp.ph) * 1.4;
            const tipY = gy - th;
            const jl = (a) => (_hash1(sp.ph * 7.3 + a * 3.1) - 0.5);
            // 左腰两个折点、右腰两个折点：矿物的棱是折的，不是弧
            const lp = [
              { x: bx - bw, y: gy + 4 },
              { x: bx - bw * (1.02 + jl(1) * 0.16), y: gy - th * 0.34 },
              { x: bx - bw * (0.80 + jl(2) * 0.20), y: gy - th * 0.66 },
            ];
            const rp = [
              { x: bx + bw * 0.86, y: gy - th * 0.60 },
              { x: bx + bw * (0.96 + jl(3) * 0.14), y: gy - th * 0.28 },
              { x: bx + bw, y: gy + 4 },
            ];
            const body = () => {
              ctx.beginPath();
              ctx.moveTo(lp[0].x, lp[0].y);
              ctx.lineTo(lp[1].x, lp[1].y);
              ctx.lineTo(lp[2].x, lp[2].y);
              ctx.lineTo(tipX, tipY);
              ctx.lineTo(rp[0].x, rp[0].y);
              ctx.lineTo(rp[1].x, rp[1].y);
              ctx.lineTo(rp[2].x, rp[2].y);
              ctx.closePath();
            };
            paths.push({ body, bx, bw, th, tipX, tipY, lp, rp, sp });
          }

          // ⑤ 矿刺本体：一根根填竖向渐变（尖上亮、根下黑）
          for (const P of paths) {
            P.body();
            const g2 = ctx.createLinearGradient(0, P.tipY, 0, gy + 4);
            // 亮度必须低于光尘、接近周围土的明度，只是色相偏绿。
            // 调的太亮就成了"发光的翡翠"，整屏最抢眼的东西不该是个障碍物。
            g2.addColorStop(0, 'rgba(84,124,110,0.97)');
            g2.addColorStop(0.22, 'rgba(52,88,78,0.98)');
            g2.addColorStop(0.62, 'rgba(28,58,50,0.99)');
            g2.addColorStop(1, 'rgba(13,30,26,1)');
            ctx.fillStyle = g2;
            ctx.fill();
          }

          // ⑥ 棱面 + 铜锈纹理，全部裁在矿刺里
          ctx.save();
          ctx.beginPath();
          for (const P of paths) {
            ctx.moveTo(P.lp[0].x, P.lp[0].y);
            ctx.lineTo(P.lp[1].x, P.lp[1].y);
            ctx.lineTo(P.lp[2].x, P.lp[2].y);
            ctx.lineTo(P.tipX, P.tipY);
            ctx.lineTo(P.rp[0].x, P.rp[0].y);
            ctx.lineTo(P.rp[1].x, P.rp[1].y);
            ctx.lineTo(P.rp[2].x, P.rp[2].y);
            ctx.closePath();
          }
          ctx.clip();

          if (rustPat) {
            ctx.save();
            ctx.translate(cx - halfW * 1.5 - ph0 * 37, gy - lvl - 40 - ph0 * 21);
            ctx.scale(0.24, 0.24);
            ctx.globalCompositeOperation = 'soft-light';
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = rustPat;
            ctx.fillRect(0, 0, (halfW * 3 + 40) / 0.24, (lvl + 60) / 0.24);
            ctx.globalCompositeOperation = 'multiply';
            ctx.globalAlpha = 0.30;
            ctx.fillRect(0, 0, (halfW * 3 + 40) / 0.24, (lvl + 60) / 0.24);
            ctx.restore();
          }

          for (const P of paths) {
            // 左下受光面（天光从左上前方来）
            ctx.beginPath();
            ctx.moveTo(P.lp[0].x, P.lp[0].y);
            ctx.lineTo(P.lp[1].x, P.lp[1].y);
            ctx.lineTo(P.lp[2].x, P.lp[2].y);
            ctx.lineTo(P.tipX, P.tipY);
            ctx.lineTo(P.bx + P.bw * 0.10, gy + 4);
            ctx.closePath();
            ctx.fillStyle = 'rgba(186,222,204,0.075)';
            ctx.fill();
            // 右侧背光面
            ctx.beginPath();
            ctx.moveTo(P.tipX, P.tipY);
            ctx.lineTo(P.rp[0].x, P.rp[0].y);
            ctx.lineTo(P.rp[1].x, P.rp[1].y);
            ctx.lineTo(P.rp[2].x, P.rp[2].y);
            ctx.lineTo(P.bx + P.bw * 0.10, gy + 4);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0,16,12,0.50)';
            ctx.fill();
          }
          ctx.restore();  // 结束裁剪

          // ⑥-b 表面脏点：锈是蚀出来的，不是磨出来的。
          //      小暗斑 + 小亮霜点，让表面从"玉"变成"矿"。
          ctx.save();
          ctx.beginPath();
          for (const P of paths) {
            ctx.moveTo(P.lp[0].x, P.lp[0].y);
            ctx.lineTo(P.lp[1].x, P.lp[1].y);
            ctx.lineTo(P.lp[2].x, P.lp[2].y);
            ctx.lineTo(P.tipX, P.tipY);
            ctx.lineTo(P.rp[0].x, P.rp[0].y);
            ctx.lineTo(P.rp[1].x, P.rp[1].y);
            ctx.lineTo(P.rp[2].x, P.rp[2].y);
            ctx.closePath();
          }
          ctx.clip();
          for (const P of paths) {
            const nDots = 13;
            for (let i = 0; i < nDots; i++) {
              const hx = _hash1(P.sp.ph * 11.3 + i * 2.7);
              const hy = _hash1(P.sp.ph * 17.9 + i * 5.1);
              const dxp = P.bx + (hx - 0.5) * P.bw * 1.7;
              const dyp = gy - P.th * (0.05 + hy * 0.92);
              const dr2 = 0.9 + _hash1(i * 3.9) * 2.1;
              const pale = _hash1(P.sp.ph + i * 7.7) > 0.62;
              ctx.beginPath();
              ctx.ellipse(dxp, dyp, dr2, dr2 * 0.78, hx * 3, 0, Math.PI * 2);
              ctx.fillStyle = pale ? 'rgba(158,186,172,0.16)' : 'rgba(8,22,18,0.34)';
              ctx.fill();
            }
          }
          ctx.restore();

          // ⑦ 棱线：从尖端劈下来的一道亮脊 + 两侧轮廓
          for (const P of paths) {
            ctx.beginPath();
            ctx.moveTo(P.tipX, P.tipY + 2);
            ctx.lineTo(P.bx + P.bw * 0.06, gy + 3);
            ctx.strokeStyle = 'rgba(150,214,180,0.13)';
            ctx.lineWidth = 1.1;
            ctx.stroke();

            // 左轮廓受光：矿物的刃口会反一条细亮线
            ctx.beginPath();
            ctx.moveTo(P.lp[2].x, P.lp[2].y);
            ctx.lineTo(P.tipX, P.tipY);
            ctx.strokeStyle = 'rgba(178,214,196,0.28)';
            ctx.lineWidth = 1.3;
            ctx.stroke();

            // 整体暗描边（细，不要黑边框）
            P.body();
            ctx.strokeStyle = 'rgba(6,26,20,0.55)';
            ctx.lineWidth = 1.1;
            ctx.stroke();
          }

          // ⑧ 根部的矿壳：一圈圆瘤把矿刺和地面咬合住（否则矿刺像插进去的）
          for (let i = 0; i < 11; i++) {
            const a = _hash1(i * 3.1 + ph0);
            const nxp = cx + (a - 0.5) * halfW * 2.1;
            const nyp = gy - _hash1(i * 5.7) * 13 * grow + 1;
            const nr = 3.2 + _hash1(i * 7.3 + ph0) * 4.4;
            ctx.beginPath();
            ctx.ellipse(nxp, nyp, nr, nr * 0.72, a * 2 - 1, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(22,62,48,0.92)';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(nxp - nr * 0.22, nyp - nr * 0.28, nr * 0.62, nr * 0.40, a * 2 - 1, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(122,180,146,0.30)';
            ctx.fill();
          }

          // ⑨ 尖端的一点渗光：矿刺是"活的"，还在长
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (const P of paths) {
            if (P.sp.h < 0.6) continue;
            radialGlow(P.tipX, P.tipY + 3, 13, `rgba(96,180,144,${(0.045 + 0.025 * Math.sin(tGlobal * 3.1 + P.sp.ph)).toFixed(3)})`);
          }
          ctx.restore();

          // ⑩ 剥落的锈屑：从矿刺上掉下来的碎渣，慢慢往上飘（铜锈比土轻）
          for (let i = 0; i < 9; i++) {
            const p = ((tGlobal * 0.20 + i * 0.113) % 1);
            const fx = cx + Math.sin(i * 2.3 + ph0 + p * 3.1) * halfW * (0.35 + p * 0.55);
            const fy = gy - grow * lvl * (0.25 + (i % 4) * 0.18) - p * 22;
            const fs = 1.4 + (i % 3) * 0.7;
            ctx.fillStyle = `rgba(120,190,152,${((1 - p) * 0.42).toFixed(3)})`;
            ctx.fillRect(fx, fy, fs, fs * 0.8);
          }

          // ⑪ 脚边翻出来的碎矿块：静态，纯细节
          for (let i = 0; i < 5; i++) {
            const sgn = i % 2 ? 1 : -1;
            const rr = 3.0 + _hash1(i * 4.1) * 3.4;
            const px2 = cx + sgn * halfW * (1.12 + _hash1(i * 6.7) * 0.5);
            const py2 = gy + 1 - _hash1(i * 2.3) * 3;
            ctx.beginPath();
            ctx.moveTo(px2 - rr, py2);
            ctx.lineTo(px2 - rr * 0.3, py2 - rr * 1.1);
            ctx.lineTo(px2 + rr * 0.8, py2 - rr * 0.5);
            ctx.lineTo(px2 + rr, py2);
            ctx.closePath();
            ctx.fillStyle = 'rgba(30,74,56,0.9)';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(px2 - rr * 0.3, py2 - rr * 1.1);
            ctx.lineTo(px2 + rr * 0.8, py2 - rr * 0.5);
            ctx.strokeStyle = 'rgba(150,206,172,0.30)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    } else if (h.warning) {
      // 预警：火口闪橙红，锈池的地缝里透出冷绿（不同威胁用不同色，玩家一眼能分清）
      const f = 0.3 + 0.7 * Math.abs(Math.sin(tGlobal * 11));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      if (isFire) {
        radialGlow(cx, gy - 30, 90, `rgba(255,110,50,${0.12 + f * 0.14})`);
      } else {
        // 光是**从缝里冒出来**的：贴地一团窄光，越靠近缝口越亮
        radialGlow(cx, gy - 9, 40, `rgba(70,190,140,${0.16 + f * 0.18})`);
      }
      ctx.restore();
      if (!isFire) {
        // 缝内透出的冷绿：只描裂口内壁最上面一段，并跟着呼吸闪
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = 2.2;
        // 沿锈疤顶上的裂口亮起来
        ctx.beginPath();
        ctx.moveTo(cx - h.w * 0.30, gy - 12);
        ctx.lineTo(cx - h.w * 0.14, gy - 15);
        ctx.lineTo(cx - h.w * 0.02, gy - 10);
        ctx.lineTo(cx + h.w * 0.12, gy - 16);
        ctx.lineTo(cx + h.w * 0.26, gy - 11);
        ctx.strokeStyle = `rgba(104,206,160,${(f * 0.34).toFixed(3)})`;
        ctx.stroke();
        // 冒出来的铜绿尘：一点点往上飘
        for (let i = 0; i < 5; i++) {
          const pp = ((tGlobal * 0.55 + i * 0.21) % 1);
          const px2 = cx + Math.sin(i * 2.7 + tGlobal * 1.5) * h.w * 0.42;
          const py2 = gy - 10 - pp * 24;
          ctx.fillStyle = `rgba(120,220,172,${((1 - pp) * 0.45).toFixed(3)})`;
          ctx.fillRect(px2, py2, 1.8, 1.8);
        }
        ctx.restore();
      } else {
        ctx.strokeStyle = `rgba(255,105,45,${f})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - h.w * 0.6, gy - 18);
        ctx.lineTo(cx + h.w * 0.6, gy - 18);
        ctx.stroke();
      }
    }
  }
}

/* ================= 逐段旁白字幕 ================= */
// 位置：右上角、音效按钮下方（避免遮挡底部地面与玩家走位区域）
function drawSubtitle() {
  if (!sub) return;
  const k = Math.min(1, sub.life / 0.5) * Math.min(1, (sub.max - sub.life) / 0.35);
  if (k <= 0.01) return;

  const FS = 16, LH = 25, MAXW = 372;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.font = `600 ${FS}px "Microsoft YaHei", "PingFang SC", serif`;
  ctx.textAlign = 'left';

  // 逐字换行：长句拆成多行，宽度不超过 MAXW
  const lines = [];
  let line = '';
  for (const ch of sub.text) {
    const test = line + ch;
    if (ctx.measureText(test).width > MAXW && line) { lines.push(line); line = ch; }
    else line = test;
  }
  if (line) lines.push(line);

  const padX = 18, padY = 12;
  const blockW = MAXW + padX * 2;
  const blockH = lines.length * LH + padY * 2;
  const x2 = W - 30;                          // 与画框右缘留 15px 空隙
  const y1 = BTN_EXIT.y + BTN_EXIT.h + 14;    // 按钮下方 14px
  const x1 = x2 - blockW;

  // 底板：左缘渐隐、右缘实底，避免硬边切割画面
  const bgG = ctx.createLinearGradient(x1, 0, x2, 0);
  bgG.addColorStop(0,    'rgba(4,10,9,0.00)');
  bgG.addColorStop(0.18, 'rgba(4,10,9,0.52)');
  bgG.addColorStop(1,    'rgba(4,10,9,0.74)');
  ctx.fillStyle = bgG;
  ctx.fillRect(x1, y1, blockW, blockH);

  // 左侧金色竖线 + 顶部细线（呼应文物气质，比满框更轻）
  ctx.strokeStyle = `rgba(212,178,110,${0.5 * k})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x1 + 10, y1 + 4);
  ctx.lineTo(x2, y1 + 4);
  ctx.stroke();

  // 文字：金-白渐变
  const txtG = ctx.createLinearGradient(x1, y1, x2, y1 + blockH);
  txtG.addColorStop(0, '#f6e6b6');
  txtG.addColorStop(0.5, '#fff4cf');
  txtG.addColorStop(1, '#e0c48a');
  ctx.fillStyle = txtG;
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 1;
  ctx.textAlign = 'right';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x2 - padX, y1 + padY + LH * i + FS);
  }
  ctx.restore();
  ctx.textAlign = 'left';
}

/* ================= P0.4 / P1.4 教学提示（每关各一组） ================= */
// 顶部横条：淡入 0.35s + 稳态 3.0s + 淡出 0.25s（总 3.6s）
// 位置：y=110，避开顶部 HUD（血条 y=26-64）与字幕（y=620）
function drawTutHint() {
  if (state !== 'play') return;
  for (const h of TUT_HINTS) {
    if (h.t <= 0) continue;
    const remain = h.t;
    const fadeIn = Math.min(1, (3.6 - remain) / 0.35);
    const fadeOut = Math.min(1, remain / 0.25);
    const k = fadeIn * fadeOut;
    if (k <= 0.01) continue;

    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = '600 18px "Microsoft YaHei", "PingFang SC", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = h.text;
    const tw = ctx.measureText(text).width;
    // 旁白字幕占的是右上角（y 78-177），提示如果也待在 y=110 会和它贴在一起。
    // 字幕活着的时候把提示往下压 46px，两者拉出垂直间距，互不打架。
    const cx = W / 2, cy = (sub && sub.life > 0.7) ? 156 : 110;
    const padX = 30, padY = 12;
    const bx = cx - tw / 2 - padX, by = cy - 18 - padY, bw = tw + padX * 2, bh = 36 + padY * 2;

    // 底板：柔和暗底 + 双向渐变（呼应字幕风格但更轻）
    const bgG = ctx.createLinearGradient(0, by, 0, by + bh);
    bgG.addColorStop(0,   'rgba(4,10,9,0.00)');
    bgG.addColorStop(0.2, 'rgba(4,10,9,0.50)');
    bgG.addColorStop(0.5, 'rgba(4,10,9,0.70)');
    bgG.addColorStop(0.8, 'rgba(4,10,9,0.50)');
    bgG.addColorStop(1,   'rgba(4,10,9,0.00)');
    ctx.fillStyle = bgG;
    ctx.fillRect(bx, by, bw, bh);

    // 金色细线：顶部一条（提示比字幕更简）
    ctx.strokeStyle = `rgba(212,178,110,${0.50 * k})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + padX * 0.5, by + 4);
    ctx.lineTo(bx + bw - padX * 0.5, by + 4);
    ctx.stroke();

    // 文字：金-白渐变
